<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>M10 Production</title>
<link rel="stylesheet" href="rk-foundation.css?v=RKF-1.13.0">
<style>

body{--m06:var(--blue);--m06bg:var(--bluebg);--label:var(--ink2)}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Segoe UI',system-ui,sans-serif;background:var(--bg);color:var(--ink);font-size:var(--fs-body);height:100vh;overflow:hidden;display:flex;flex-direction:column}
/* shell chrome */
.topbar{height:46px;background:var(--navy);display:flex;align-items:center;padding:0 16px;gap:12px;flex-shrink:0}
.logo{width:28px;height:28px;border-radius:7px;background:var(--accent);display:flex;align-items:center;justify-content:center;font-size:var(--fs-caption);font-weight:700;color:var(--surface)}
.tb-name{color:var(--surface);font-weight:700;font-size:var(--fs-emphasis)}.tb-sp{flex:1}
.tb-chip{background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.12);border-radius:7px;padding:4px 10px;font-size:var(--fs-body);color:rgba(255,255,255,.85)}
.tb-avatar{width:28px;height:28px;border-radius:50%;background:var(--m06);display:flex;align-items:center;justify-content:center;font-size:var(--fs-caption);font-weight:700;color:var(--surface)}
.shell{flex:1;display:flex;overflow:hidden}
.rail{width:50px;background:var(--surface);border-right:1px solid var(--line);display:flex;flex-direction:column;align-items:center;padding:8px 0;gap:2px;flex-shrink:0}
.ri{width:44px;min-height:36px;border-radius:9px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;padding:4px 2px;font-size:var(--fs-body);font-weight:700;color:var(--label);position:relative;cursor:pointer}
.ri:hover{background:var(--bg);color:var(--navy)}.ri.act{background:var(--m06bg);color:var(--m06)}
.ri .tt{position:static;transform:none;background:none;color:inherit;font-size:var(--fs-caption);font-weight:700;line-height:1.15;letter-spacing:.2px;padding:0;border-radius:0;white-space:normal;text-align:center;pointer-events:none;opacity:1;z-index:auto}
.rsep{width:24px;height:1px;background:var(--line);margin:4px 0}.rail-sp{flex:1}
.main{flex:1;display:flex;flex-direction:column;overflow:hidden}
/* module header */
.mod-badge{font-size:var(--fs-caption);font-weight:700;color:var(--surface);background:var(--m06);padding:3px 8px;border-radius:5px}
.mod-title{font-size:var(--fs-title);font-weight:700;color:var(--navy)}.mod-crumb{font-size:var(--fs-caption);color:var(--label)}
.actor-chip{font-size:var(--fs-caption);background:var(--surface2);border:1px solid var(--line2);color:var(--ink2);padding:3px 9px;border-radius:6px;font-weight:700}
.hist-btn{border:1px solid var(--line2);background:var(--surface);color:var(--ink2);border-radius:7px;font-size:var(--fs-emphasis);line-height:1;cursor:pointer;padding:4px 8px;font-family:inherit}
.hist-btn:hover{border-color:var(--m06);color:var(--m06)}
.scope-chip{font-size:var(--fs-caption);background:var(--m06bg);color:var(--m06);padding:3px 9px;border-radius:6px;font-weight:700;margin-left:auto}

.kpistrip{display:flex;gap:6px;flex-wrap:wrap;padding:4px 10px;border-bottom:1px solid var(--line);background:var(--surface)}
.lff{display:flex;flex-direction:column;gap:3px}
.lff>label{padding-left:11.5px}
.listchrome .lff>label{padding-left:0}
.lff label{font-size:var(--fs-caption);font-weight:700;color:var(--label);text-transform:uppercase;letter-spacing:.3px}
.lfbar select,.lfbar input{font-size:var(--fs-caption);padding:5px 8px;border:1px solid var(--line2);border-radius:6px;background:var(--surface);color:var(--ink)}
.lfbar .clr{margin-left:auto;align-self:flex-end}
.tabs{background:var(--surface);border-bottom:1px solid var(--line);padding:0 12px;display:flex;gap:4px;flex-shrink:0}
.tab{padding:6px 14px;font-size:var(--fs-body);font-weight:600;color:var(--ink2);cursor:pointer;border-bottom:2.5px solid transparent;margin-bottom:-1px}
.tab:hover{color:var(--navy)}.tab.act{color:var(--m06);border-bottom-color:var(--m06)}
.subbar{background:var(--surface);border-bottom:1px solid var(--line);padding:5px 12px;display:flex;gap:10px;align-items:center;flex-shrink:0;flex-wrap:wrap}
.si{position:relative;min-width:280px;max-width:560px;flex:1}
.si input{width:100%;padding:5px 10px 5px 28px;border:1.5px solid var(--line2);border-radius:7px;font-size:var(--fs-body);font-family:inherit;outline:none;background:var(--surface);color:var(--ink)}
.si input:focus{border-color:var(--m06)}.si .mag{position:absolute;left:9px;top:50%;transform:translateY(-50%);color:var(--label);font-size:var(--fs-body)}
.in{border:1.5px solid var(--line2);border-radius:8px;padding:7px 10px;font-size:var(--fs-body);font-family:inherit;outline:none;background:var(--surface);color:var(--ink)}.in:focus{border-color:var(--m06)}
.in:disabled,.in[readonly]{background:var(--surface2);color:var(--ink2)}
.hint{font-size:var(--fs-caption);color:var(--label);margin-top:4px}.rq{color:var(--accent)}
.lfbar{display:flex;gap:6px;flex-wrap:wrap;align-items:center;padding:4px 10px;border-bottom:1px solid var(--line);background:var(--surface2)}
.fgrp{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.fgl{font-size:var(--fs-caption);font-weight:700;color:var(--label);text-transform:uppercase;letter-spacing:.4px;margin-right:2px}
.chip{font-size:var(--fs-caption);font-weight:700;padding:4px 10px;border-radius:20px;border:1px solid var(--line2);background:var(--surface);color:var(--ink2);cursor:pointer;white-space:nowrap}
.chip:hover{border-color:var(--m06);color:var(--m06)}
.chip.on{background:var(--m06bg);border-color:var(--m06);color:var(--m06)}
.chip .ct{font-family:'Consolas',monospace;font-size:var(--fs-caption);opacity:.75;margin-left:4px}
.tgl{font-size:var(--fs-caption);font-weight:700;padding:4px 10px;border-radius:7px;border:1px dashed var(--line2);background:var(--surface);color:var(--ink2);cursor:pointer;white-space:nowrap}
.tgl.on{background:var(--m06bg);border-style:solid;border-color:var(--m06);color:var(--m06)}
.listchrome{display:flex;flex-wrap:wrap;align-items:center;gap:5px 8px;padding:4px 10px;border-bottom:1px solid var(--line);background:var(--surface)}
.listchrome>.lcgrp{display:contents}
.listchrome .lff{flex-direction:row;align-items:center;gap:4px}
.pills{display:flex;gap:5px;flex-wrap:wrap;align-items:center;padding:3px 10px;border-bottom:1px solid var(--line);background:var(--surface)}
.pill{font-size:var(--fs-caption);font-weight:700;background:var(--m06bg);color:var(--m06);border-radius:20px;padding:3px 8px 3px 10px;display:inline-flex;align-items:center;gap:6px}
.pill button{border:none;background:none;color:inherit;font:inherit;cursor:pointer;font-size:var(--fs-body);line-height:1;padding:0}

.workzone{flex:1;display:flex;overflow:hidden}
.center{flex:1;display:flex;flex-direction:column;overflow:hidden;background:var(--bg);min-width:0}
.recwrap{flex:1;overflow:auto;background:var(--bg);padding:6px}
table.grid{border-collapse:separate;border-spacing:0;background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);overflow:hidden;font-size:var(--fs-body);width:100%}
table.grid th{background:var(--surface2);text-align:left;padding:5px 9px;font-size:var(--fs-caption);font-weight:700;color:var(--ink2);text-transform:uppercase;letter-spacing:.3px;border-bottom:1px solid var(--line);white-space:nowrap;cursor:pointer;position:sticky;top:0;z-index:var(--z-sticky)}
table.grid th:hover{color:var(--m06)}
table.grid td{padding:4px 9px;border-bottom:1px solid var(--line);white-space:nowrap}
table.grid.dense{font-size:var(--fs-caption)}
table.grid.dense th{padding:3px 6px;font-size:var(--fs-caption)}
table.grid.dense td{padding:2px 6px}
table.grid.dense td.wr{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:150px} 
table.grid tr:last-child td{border-bottom:none}table.grid tbody tr:hover{background:var(--surface2);cursor:pointer}
table.grid tr.sel td{background:var(--m06bg)}
td.num,th.num{text-align:right;font-family:'Consolas',monospace}
.d-code{font-family:'Consolas',monospace;color:var(--m06);font-weight:700}
.na{color:var(--label);font-style:italic;font-size:var(--fs-caption)}
.link-btn{font-size:var(--fs-caption);color:var(--m06);font-weight:700;cursor:pointer;background:none;border:none;font-family:inherit;padding:0;text-decoration:underline}
/* status chips */
.tg-s{display:inline-block;font-size:var(--fs-caption);font-weight:700;padding:2px 7px;border-radius:5px;text-transform:uppercase;letter-spacing:.3px;background:var(--greybg);color:var(--grey)}
.tg-Draft{background:var(--greybg);color:var(--grey)}
.tg-Released,.tg-Prepared{background:var(--bluebg);color:var(--blue)}
.tg-InProduction,.tg-Picked,.tg-Packed,.tg-Hold{background:var(--warnbg);color:var(--warn)}
.tg-ReadyforDispatch,.tg-Completed,.tg-Closed{background:var(--greenbg);color:var(--green)}
.tg-Cancelled,.tg-Superseded{background:var(--greybg);color:var(--grey)}
.tg-Confirmed{background:var(--greenbg);color:var(--green)}
.tg-ReleasedforProduction{background:var(--bluebg);color:var(--blue)}
.revchip{font-size:var(--fs-caption);font-weight:700;padding:2px 7px;border-radius:5px;background:var(--purplebg);color:var(--purple);font-family:'Consolas',monospace}
.viachip{font-size:var(--fs-caption);font-weight:700;padding:1px 6px;border-radius:4px;background:var(--bluebg);color:var(--blue)}
.colmenu{position:absolute;top:100%;right:0;min-width:260px;white-space:nowrap;background:var(--surface);border:1px solid var(--line2);border-radius:8px;box-shadow:var(--shadow-md);z-index:var(--z-dropdown);padding:6px 8px;max-height:60vh;overflow:auto}
.ckrow{display:flex;align-items:center;gap:8px;padding:3px 4px;cursor:pointer}
.ckrow input{margin:0}
.tawrap{position:relative}

tr.grphd>td{background:var(--surface2);font-weight:700;font-size:var(--fs-body);color:var(--ink2);border-top:1px solid var(--line2);cursor:pointer;padding:6px 10px}
tr.grphd.on>td{color:var(--m06);background:var(--m06bg)}
tr.grphd .gct{float:right;font-weight:700;color:var(--label);margin-left:10px}

.ddwrap{position:relative;display:inline-block}
.foldsum{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:60vw}

details.nhfold>summary.band-hd{cursor:pointer;list-style:none;border-bottom:0}
details.nhfold[open]>summary.band-hd{border-bottom:1px solid var(--line)}
details.nhfold>summary.band-hd::-webkit-details-marker{display:none}
details.nhfold>summary.band-hd::before{content:'\25B8';margin-right:6px;color:var(--m06);font-size:var(--fs-caption)}
details.nhfold[open]>summary.band-hd::before{content:'\25BE'}
.ddmenu{position:fixed;left:0;top:0;background:var(--surface);border:1px solid var(--line2);border-radius:8px;box-shadow:var(--shadow-md);z-index:var(--z-modal);min-width:210px;max-height:70vh;overflow:auto;display:none}
.ddmenu.show{display:block}
.ddmenu button{display:block;width:100%;text-align:left;padding:8px 12px;font-size:var(--fs-body);background:none;border:none;font-family:inherit;color:var(--ink);cursor:pointer}
.ddmenu button:hover{background:var(--surface2);color:var(--m06)}

.wszone{flex:1;display:flex;flex-direction:column;overflow:hidden;min-width:0}
.wsscroll{flex:1;overflow:auto;padding:8px 12px;background:var(--bg)}
.wsscroll{max-width:1800px;width:100%;margin-inline:auto;padding-inline:clamp(16px,2vw,40px)}
.band{background:var(--surface);border:1px solid var(--line);border-radius:10px;box-shadow:var(--shadow-sm);margin-bottom:8px;overflow:visible}
.band-hd{padding:5px 12px;border-bottom:1px solid var(--line);font-size:var(--fs-caption);font-weight:700;color:var(--navy);text-transform:uppercase;letter-spacing:.4px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.band-hd .sp{flex:1}
.band-bd{padding:8px 12px}
.qno{font-size:var(--fs-display);font-weight:700;color:var(--navy);font-family:'Consolas',monospace}
.frow{display:flex;gap:11px;flex-wrap:wrap}
.ff label{font-size:var(--fs-caption);font-weight:700;color:var(--label);text-transform:uppercase;letter-spacing:.3px}
.ff .in,.ff select,.ff input{width:100%}
.ro{font-size:var(--fs-body);padding:7px 0;color:var(--ink2)}
.ro b,.ro strong{color:var(--ink);font-weight:700}
.m01v,.ro .m01v{color:var(--ink);font-weight:700}
.hdr2col{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:8px 24px;align-items:start;--hc:1;--hr:auto}
.hdr2col>.frow{grid-column:var(--hc,1);grid-row:var(--hr,auto);margin-top:0}
.hdr2col>.frow>.ff{align-self:start}
.ff.sm .dpf{max-width:150px}
.ff>label,.fg>label{min-height:2.5em;display:flex;align-items:flex-end;line-height:1.25;padding-left:11.5px}
.ff>.ro,.fg>.ro{padding-left:11.5px}
.frow,.band-bd,.hdr2col,.panel3{align-items:start}
.ff>.in,.fg>.in,.ff>select.in,.fg>select.in{height:34px;box-sizing:border-box}
.ff>.ro{min-height:34px}
@media (max-width:1100px){.hdr2col{grid-template-columns:minmax(0,1fr)}.hdr2col>.frow{grid-column:1;grid-row:auto}}
.idbar{position:sticky;top:0;z-index:var(--z-sticky);background:var(--surface);border:1px solid var(--line);border-radius:10px;box-shadow:var(--shadow-sm);padding:5px 12px;margin-bottom:8px;display:flex;align-items:center;gap:10px;flex-wrap:nowrap;overflow:hidden;text-overflow:ellipsis}
.idbar .mini{font-size:var(--fs-caption);color:var(--ink2);white-space:nowrap}.idbar .mini b{font-family:'Consolas',monospace;color:var(--navy)}
.idbar::before{content:'';position:absolute;left:0;right:0;top:-9px;height:9px;background:var(--surface);border-radius:10px 10px 0 0}
.hdrband{margin-bottom:8px}
.hdrband .band-bd{padding:7px 15px}
.hdrrow{display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-size:var(--fs-body);color:var(--ink2)}
.hdrrow .ro{padding:0;font-size:var(--fs-body)}
.hdrrow>.ro:not(.oneline){white-space:normal;max-width:120ch;line-height:1.5}
.oneline{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:block;max-width:100%}
.life{display:flex;gap:3px;flex-wrap:wrap;margin-bottom:8px}
.life span{font-size:var(--fs-tag);padding:1px 8px;border-radius:999px;border:1px solid var(--line);color:var(--muted);background:var(--surface)}
.life span.done{background:var(--greenbg);color:var(--green);border-color:var(--greenbg)}
.life span.now{background:var(--m06bg);color:var(--m06);border-color:var(--m06);font-weight:700}
.lockro{cursor:not-allowed}
.lk{font-size:var(--fs-caption);opacity:.65;margin-right:3px}
.wbanner{font-size:var(--fs-body);border-radius:8px;padding:8px 11px;margin:0 0 11px}
.wbanner.hard{background:var(--accentbg);color:var(--accent);border:1px solid var(--accent)}
.wbanner.soft{background:var(--warnbg);color:var(--warn);border:1px solid var(--warn)}
.wbanner.info{background:var(--bluebg);color:var(--blue);border:1px solid var(--blue)}
.surf{color:var(--label);text-align:center;padding:40px 20px;font-size:var(--fs-body)}
.surf.err{color:var(--accent)}
.skel{height:12px;border-radius:5px;background:var(--line);opacity:.5;margin:6px 0}
.actionbar{background:var(--surface);border-top:1px solid var(--line);padding:10px 18px;display:flex;gap:9px;flex-shrink:0;align-items:center;flex-wrap:nowrap}
.actionbar>.btn{flex:0 0 auto}
.ctx{font-size:var(--fs-body);color:var(--ink2);display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0;flex:0 1 auto}
.ctx>*{vertical-align:middle}
.btn{display:inline-flex;align-items:center;gap:5px;padding:8px 13px;border-radius:8px;font-size:var(--fs-body);font-weight:600;cursor:pointer;border:none;font-family:inherit;transition:background .15s;white-space:nowrap}
.btn-p{background:var(--accent);color:var(--surface)}.btn-p:hover{background:var(--navy)}
.btn-g{background:var(--surface);color:var(--ink2);border:1px solid var(--line2)}.btn-g:hover{background:var(--surface2)}
.btn-d{background:var(--accentbg);color:var(--accent);border:1px solid var(--accent)}.btn-d:hover{background:var(--redbg)}
.btn-sm{padding:6px 11px;font-size:var(--fs-body)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.iconbtn{border:1px solid var(--line2);background:var(--surface);color:var(--ink2);border-radius:6px;font-size:var(--fs-caption);cursor:pointer;padding:3px 7px;font-family:inherit}
.iconbtn:hover{border-color:var(--m06);color:var(--m06)}
.iconbtn:disabled{opacity:.45;cursor:not-allowed}
.iconbtn.d:hover{border-color:var(--accent);color:var(--accent)}
.flag{font-size:var(--fs-caption);font-weight:700;padding:1px 5px;border-radius:4px;background:var(--warnbg);color:var(--warn)}
.flag.bad{background:var(--accentbg);color:var(--accent)}
.flag.ok{background:var(--greenbg);color:var(--green)}
.panel3{display:flex;gap:12px;flex-wrap:wrap}
.panel3>div{flex:1;min-width:270px}
.ins-hd{font-size:var(--fs-caption);font-weight:700;color:var(--navy);text-transform:uppercase;letter-spacing:.4px}
.trail{max-height:210px;overflow:auto}
.trail-i{font-size:var(--fs-caption);color:var(--ink2);padding:5px 0;border-left:2px solid var(--line2);padding-left:9px;margin-bottom:3px}
.trail-i .tm{color:var(--label);font-size:var(--fs-caption);display:block}
.note-i{border-bottom:1px solid var(--line);padding:6px 0;font-size:var(--fs-body)}.note-i:last-child{border-bottom:none}
.fg{display:flex;flex-direction:column;gap:5px;margin-bottom:11px}
.fg label{font-size:var(--fs-caption);font-weight:700;color:var(--label);text-transform:uppercase;letter-spacing:.4px}
.fg .in,.fg select,.fg input,.fg textarea{width:100%}

.lgwrap{overflow:auto;max-height:70vh}
#lgXbar{display:none;position:sticky;bottom:0;overflow-x:auto;overflow-y:hidden;height:14px;background:var(--surface);border-top:1px solid var(--line);z-index:calc(var(--z-sticky) - 1)}
#lgXbar>div{height:1px}
table.lg{border-collapse:separate;border-spacing:0;width:100%;font-size:var(--fs-body);table-layout:fixed}
table.lg th{background:var(--surface2);text-align:left;padding:3px 4px;font-size:var(--fs-caption);font-weight:700;color:var(--ink2);text-transform:uppercase;letter-spacing:.3px;border-bottom:1px solid var(--line);white-space:normal;position:sticky;top:0;z-index:var(--z-sticky)}
table.lg td{padding:2px 4px;border-bottom:1px solid var(--line);white-space:nowrap;line-height:1.25}
table.lg td,table.lg th{vertical-align:top}
table.lg tbody td{padding-top:6px;padding-bottom:6px}
table.lg td.itm,table.lg th.itm{white-space:normal}
table.lg td:nth-child(1),table.lg td:nth-child(2){position:sticky;z-index:calc(var(--z-sticky) - 1);background:var(--surface)}
table.lg td:nth-child(1){left:0}
table.lg td:nth-child(2){left:var(--c1,0px)}
table.lg thead tr:nth-child(2) th:nth-child(1),table.lg thead tr:nth-child(2) th:nth-child(2){position:sticky;z-index:calc(var(--z-sticky) + 1);background:var(--surface2)}
table.lg thead tr:nth-child(2) th:nth-child(1){left:0}
table.lg thead tr:nth-child(2) th:nth-child(2){left:var(--c1,0px)}
table.lg thead tr:nth-child(1) th:nth-child(1){position:sticky;left:0;z-index:calc(var(--z-sticky) + 1);background:var(--surface)}
table.lg td:nth-child(2),table.lg thead tr:nth-child(2) th:nth-child(2),
table.lg thead tr:nth-child(1) th:nth-child(1){box-shadow:1px 0 0 0 var(--line2)}

.swt{font-size:var(--fs-caption);font-weight:700;padding:3px 8px;border-radius:6px;border:1px solid var(--m06);background:var(--m06bg);color:var(--m06);cursor:pointer;font-family:inherit}
.swt.on{box-shadow:inset 0 0 0 1px var(--m06)}
.swt:disabled{opacity:.45;cursor:not-allowed}
table.lg th.grp{text-align:center;font-size:var(--fs-caption);color:var(--navy);background:var(--surface)}
table.lg th.sepL,table.lg td.sepL{border-left:2px solid var(--line2)}
table.lg td.num,table.lg td .lgnum{font-family:'Consolas',monospace;font-variant-numeric:tabular-nums;white-space:nowrap;text-align:right}
table.lg th.num{text-align:right}
table.lg tbody tr:hover{background:var(--surface2)}
table.lg td>input.ec,table.lg td>select.ec{width:100%;height:26px;box-sizing:border-box;vertical-align:top;margin:0}
table.lg td>select.ec{padding-right:2px;padding-top:0;padding-bottom:0}
table.lg tbody td>.lgsub{margin-top:3px;min-height:13px}
table.lg td.itm .lgsub{white-space:normal}
table.lg tr.sub td{background:var(--purplebg);padding-top:0;padding-bottom:0;font-size:var(--fs-caption);line-height:1.15}
table.lg tr.sub td.ind{padding-left:22px;font-size:var(--fs-caption);color:var(--purple);font-weight:600;white-space:normal;line-height:1.2}

<script>
/* BOOT AND IDENTITY */
(function(){ if(new URLSearchParams(location.search).get('embed')!=='1')return;
  var st=document.createElement('style'); st.textContent='.topbar{display:none!important}.rail{display:none!important}'; document.head.appendChild(st); })();
if(window.RKF&&RKF.theme)RKF.theme.apply();

var SB = (window.supabase && window.RKF && RKF.client)
  ? RKF.client('https://ntymdsbezetobrnjqqvl.supabase.co','sb_publishable_nev1rE7tHlu-bOWOm1JpXw_jd40773y')
  : (window.supabase ? window.supabase.createClient('https://ntymdsbezetobrnjqqvl.supabase.co','sb_publishable_nev1rE7tHlu-bOWOm1JpXw_jd40773y') : null);

var CAP={ASSIGN:'prod.assign', QUANTITY:'prod.quantity', OPERATION:'prod.operation',
         RELEASE:'prod.release', CANCEL:'prod.cancel', UNIT:'prod.unit'};
var SCOPE=null, CAPS={}, actorEmp=null, actorName='';
function can(c){ return CAPS[c]===true; }

var UNITS=[], BAYS=[], MACHINES=[], STORES=[], EMPS={}, LABEL={}, LISTS={}, POOL=[];
var STATUS_WORDS={WO:[], PL:[]};                 

var TERMINAL=['Closed','Cancelled','Superseded'];
function baysOf(u){ return BAYS.filter(function(b){return b.unit_code===u;}); }
function machinesOf(u){ return MACHINES.filter(function(m){return m.unit_code===u;}); }
function storesOf(u){ return STORES.filter(function(s){return s.unit_code===u;}); }
function bayById(id){ return BAYS.filter(function(b){return b.bay_id===id;})[0]||null; }
function machineById(id){ return MACHINES.filter(function(m){return m.machine_id===id;})[0]||null; }
function storeById(id){ return STORES.filter(function(s){return s.storage_id===id;})[0]||null; }
function unitName(c){ var u=UNITS.filter(function(x){return x.unit_code===c;})[0]; return u?u.unit_name:''; }
function empName(id){ return (id&&EMPS[id])||''; }
function labelOf(code){ return code?(LABEL[code]||code):''; }

function toast(m,k){ if(window.RKF&&RKF.toast)return RKF.toast(m,k); }
function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g,function(c){
  return ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'})[c]; }); }
function fmtDate(d){ if(!d)return '—'; if(window.RKF&&RKF.fmtDate)return RKF.fmtDate(d);
  var p=String(d).slice(0,10).split('-'); return p.length===3?(p[2]+'-'+p[1]+'-'+p[0]):String(d); }
function stampOf(ts){ if(!ts)return '—'; return (window.RKF&&RKF.fmtIST)?RKF.fmtIST(ts,true):String(ts); }
function num(v,dp){ if(v==null||v==='')return '—';
  var n=Number(v); if(isNaN(n))return String(v);
  var f=(dp==null?3:dp);
  return n.toLocaleString('en-IN',{minimumFractionDigits:f,maximumFractionDigits:f}); }
function uuid4(){ if(window.crypto&&crypto.randomUUID)return crypto.randomUUID();
  return 'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g,function(c){var r=Math.random()*16|0;return (c==='x'?r:(r&3|8)).toString(16);}); }

var APPKEY={};
function appKey(k){ if(!APPKEY[k])APPKEY[k]=uuid4(); return APPKEY[k]; }
function clearKey(k){ delete APPKEY[k]; }

function statusCls(s){ return 'tg-'+String(s||'').replace(/[^A-Za-z]/g,''); }
function statusTag(s){ return '<span class="tg-s '+statusCls(s)+'">'+esc(s||'?')+'</span>'; }
function kindWord(k){ return k==='WO'?'Production order':'Packing list'; }
function isTerminal(d){ return TERMINAL.indexOf(d.status)>=0; }

function emptyState(icon,sentence,ctaLabel,ctaJs){
  return '<div class="surf"><div style="font-size:var(--fs-display);line-height:1;margin-bottom:9px" aria-hidden="true">'+icon+'</div>'+
    '<div style="max-width:520px;margin:0 auto">'+sentence+'</div>'+
    (ctaLabel?('<div style="margin-top:11px"><button class="btn btn-p btn-sm" onclick="'+ctaJs+'">'+ctaLabel+'</button></div>'):'')+
    '</div>';
}

function surfLoading(el,msg){ document.getElementById(el).innerHTML='<div class="surf">'+esc(msg)+'<div class="skel" style="max-width:280px;margin:14px auto"></div><div class="skel" style="max-width:220px;margin:0 auto"></div></div>'; }
function surfError(el,msg){ document.getElementById(el).innerHTML='<div class="surf err" role="alert">'+esc(msg)+' <button class="link-btn" onclick="location.reload()">Retry</button></div>'; }

async function callA(name,payload){
  if(!SB)throw new Error('Connection unavailable.');
  var r=await SB.rpc(name,{p_payload:payload});
  if(r.error){ var pe=new Error(RKF.errText(r.error,{fallback:'Something went wrong. Nothing was saved.'})); pe.code=r.error.code; throw pe; }
  var env=r.data;
  if(env===null||typeof env!=='object'||typeof env.ok==='undefined')
    throw new Error('The server sent something this screen cannot read.');
  if(env.ok!==true){ var e=env.error||{}; var err=new Error(RKF.errText(e,{fallback:'Something went wrong. Nothing was saved.'})); err.code=e.code; throw err; }
  return env;
}

function msgFor(code,server){ return RKF.errVocab(code) || 'Something went wrong. Nothing was saved.'; }

/* ==========================================================================================
   BOOT LADDER
   ========================================================================================== */
var booted=false, loadErr={list:null,doc:null};
async function boot(){
  surfLoading('center','Loading the production queue…');
  if(!SB){ surfError('center','Connection unavailable. Reload.'); return; }
  var GLVL=null;
  try { GLVL = await RKF.accessGate('M10',{client:SB}); } catch(e){ return; }
  if(!GLVL) return;
  try {
    var s=await SB.rpc('m10_effective_scope');
    if(s.error) throw s.error;
    SCOPE=s.data||null;
  } catch(e){ surfError('center','Production could not be opened.'); return; }
  if(!SCOPE || SCOPE.bound!==true){
    var why=(SCOPE&&SCOPE.reason)||'Production is not available to you.';
    document.getElementById('gateSlot').innerHTML='<div class="saysit" role="alert">'+esc(why)+'</div>';
    document.getElementById('center').innerHTML=emptyState('&#128274;',esc(why),'','');
    document.getElementById('roleChip').textContent='role: none';
    document.getElementById('scopeChip').textContent='Access: none';
    document.getElementById('actorNote').textContent='actor: '+((SCOPE&&SCOPE.emp_name)||'—');
    return;
  }
  actorEmp=SCOPE.emp_id; actorName=SCOPE.emp_name||'';
  CAPS=SCOPE.caps||{}; POOL=SCOPE.incharge_pool||[];
  document.getElementById('actorNote').textContent='actor: '+actorName;
  document.getElementById('avatar').textContent=(actorName||'?').trim().charAt(0).toUpperCase();
  document.getElementById('roleChip').textContent='role: '+((SCOPE.role_codes||[]).join(', ')||'—');
  document.getElementById('scopeChip').textContent='Access: '+(SCOPE.access_level==='full'?'full':'read')+(SCOPE.unit?' · '+SCOPE.unit:'');

  try { await loadMasters(); }
  catch(e){ surfError('center','Reference lists could not be read.'); return; }
  try { await loadStatusVocabulary(); }
  catch(e){ document.getElementById('gateSlot').innerHTML='<div class="saysit" role="alert">The status words could not be read.</div>'; }
  mountListDates();
  booted=true;
  await loadDocs();
  wireKeys();
}

async function loadStatusVocabulary(){
  var names={WO:'work_order_status', PL:'packing_list_status'};
  for(var k in names){
    var sv=await SB.rpc('rpc_config_vocab',{p_vocab:names[k]});
    if(sv.error)throw sv.error;
    if(!(sv.data&&sv.data.ok===true)) throw new Error((sv.data&&sv.data.error&&sv.data.error.message)||('the '+names[k]+' vocabulary was not served'));
    STATUS_WORDS[k]=((sv.data.data&&sv.data.data.values)||[]).map(function(v){return v.v;});
  }
}
async function loadMasters(){
  var u=await SB.from('org_units').select('unit_code,unit_name,active,is_deleted').eq('active',true).order('unit_code');
  if(u.error)throw u.error; UNITS=(u.data||[]).filter(function(x){return !x.is_deleted;});
  var b=await SB.from('bays').select('bay_id,unit_code,bay_name,responsible_primary,active,is_deleted').eq('active',true);
  if(b.error)throw b.error; BAYS=(b.data||[]).filter(function(x){return !x.is_deleted;});
  var m=await SB.from('machines').select('machine_id,unit_code,bay_id,machine_name,responsible_primary,active,is_deleted').eq('active',true);
  if(m.error)throw m.error; MACHINES=(m.data||[]).filter(function(x){return !x.is_deleted;});
  var s=await SB.from('storage_locations').select('storage_id,unit_code,storage_name,responsible_primary,active,is_deleted').eq('active',true);
  if(s.error)throw s.error; STORES=(s.data||[]).filter(function(x){return !x.is_deleted;});
  var e=await SB.from('employees').select('id,full_name,active');
  if(e.error)throw e.error; (e.data||[]).forEach(function(x){ EMPS[x.id]=x.full_name; });

  var rv=await SB.from('reference_values').select('code,list_id,label,active,sort_order').eq('active',true).order('sort_order');
  if(rv.error)throw rv.error;
  var _lists={};
  (rv.data||[]).forEach(function(v){ LABEL[v.code]=v.label; (_lists[v.list_id]=_lists[v.list_id]||[]).push(v); });
  LISTS=_lists;
}

var DOCS=[], DMAP={}, RECS=[], curMode='queue';
async function readDocs(mode){
  var wq=SB.from('work_order').select('wo_id,wo_no,so_id,so_no,executing_unit,status,priority,required_delivery_date,revision_no,updated_at,updated_by,created_at,created_by,wo_seq_of_total,wo_total,customer_id,incharge_emp').eq('is_deleted',false);
  var pq=SB.from('packing_list').select('pl_id,pl_no,so_id,so_no,executing_unit,status,priority,required_delivery_date,revision_no,updated_at,updated_by,created_at,created_by,pl_seq_of_total,pl_total,customer_id,incharge_emp').eq('is_deleted',false);
  if(mode==='queue'){ wq=wq.eq('status','Draft'); pq=pq.eq('status','Draft'); }
  else { wq=wq.order('created_at',{ascending:false}).limit(500); pq=pq.order('created_at',{ascending:false}).limit(500); }
  var wo=await wq; if(wo.error)throw wo.error;
  var pl=await pq; if(pl.error)throw pl.error;
  var rows=(wo.data||[]).map(function(r){ r._kind='WO'; r._id=r.wo_id; r._no=r.wo_no; r._seq=r.wo_seq_of_total; r._tot=r.wo_total; return r; })
    .concat((pl.data||[]).map(function(r){ r._kind='PL'; r._id=r.pl_id; r._no=r.pl_no; r._seq=r.pl_seq_of_total; r._tot=r.pl_total; return r; }));
  var soIds=rows.map(function(r){return r.so_id;}).filter(function(v,i,a){return v&&a.indexOf(v)===i;});
  var ord={}, cust={}, addr={}, draw={}, plc={}, cont={}, refr={}, dia={};
  if(soIds.length){
    var SO=await SB.from('sales_orders').select('id,so_no,status,customer_id,ship_to_address_id,ship_contact_id,booking_unit,executing_unit,delivery_scope,mode_of_delivery,salesperson_emp,ccr_emp,priority_code,required_delivery_date,revision_no,fy,customer_po_no,customer_po_date,order_date,pt_code,referrer_id').in('id',soIds);
    if(SO.error)throw SO.error; (SO.data||[]).forEach(function(s){ ord[s.id]=s; });
    var cids=(SO.data||[]).map(function(s){return s.customer_id;}).filter(Boolean);
    if(cids.length){ var C=await SB.from('customers').select('id,name,customer_code').in('id',cids); if(C.error)throw C.error; (C.data||[]).forEach(function(c){ cust[c.id]=c; }); }
    var aids=(SO.data||[]).map(function(s){return s.ship_to_address_id;}).filter(Boolean);
    if(aids.length){ var AD=await SB.from('customer_addresses').select('address_id,city,district,area,pincode,address_line,address_line2').in('address_id',aids); if(AD.error)throw AD.error; (AD.data||[]).forEach(function(a){ addr[a.address_id]=a; }); }
    var ctids=(SO.data||[]).map(function(s){return s.ship_contact_id;}).filter(Boolean);
    if(ctids.length){ var CT=await SB.from('customer_contacts').select('contact_id,name,mobile,role').in('contact_id',ctids); if(CT.error)throw CT.error; (CT.data||[]).forEach(function(c){ cont[c.contact_id]=c; }); }
    var rids=(SO.data||[]).map(function(s){return s.referrer_id;}).filter(Boolean);
    if(rids.length){ var RF=await SB.from('referrers').select('id,name,referrer_type').in('id',rids); if(RF.error)throw RF.error; (RF.data||[]).forEach(function(r){ refr[r.id]=r; }); }

    var DD=await SB.from('so_documents').select('so_id,doc_type,file_ref,uploaded_at,uploaded_by,active').in('so_id',soIds).eq('active',true);
    if(DD.error)throw DD.error; (DD.data||[]).forEach(function(d){ (draw[d.so_id]=draw[d.so_id]||[]).push(d); });

    var SLZ=await SB.from('so_line_customization').select('so_line_id,diagram_ref').not('diagram_ref','is',null);
    var SLL=await SB.from('so_lines').select('id,so_id').in('so_id',soIds);
    var slso={}; if(!SLL.error)(SLL.data||[]).forEach(function(x){ slso[x.id]=x.so_id; });
    if(!SLZ.error)(SLZ.data||[]).forEach(function(c){ var so=slso[c.so_line_id]; if(so)(dia[so]=dia[so]||[]).push(c.so_line_id); });
  }
  var woIds=rows.filter(function(r){return r._kind==='WO';}).map(function(r){return r._id;});
  var plIds=rows.filter(function(r){return r._kind==='PL';}).map(function(r){return r._id;});
  if(woIds.length){

  if(p==='Month')return dt>=iso(new Date(day.getFullYear(),day.getMonth(),1))&&dt<=iso(new Date(day.getFullYear(),day.getMonth()+1,0));

function mountHdrDate(){

  el.onchange=function(){ rddCommit(false); };
  el.addEventListener('keydown',function(ev){ if(ev.key==='Enter'){ ev.preventDefault(); rddCommit(false); } });

function rddCommit(fromPick){
  var el=document.getElementById('rddIn'); if(!el||!D)return;
  var raw=String(el.value||'').trim();
  var iso=(typeof readDMY==='function')?readDMY('rddIn'):'';
  if(!iso){
    if(fromPick)return;                               
    if(!raw){ rddSet(); return; }

async function rddSet(){

  catch(e){ toast(e.message,'err'); }
  await afterWrite();
}

function readiness(){
  if(!LINES.length)return {k:'bad',s:'no line left'};
  var miss=[];
  if(!D.incharge_emp)miss.push('production incharge');   

  if(!D.required_delivery_date)miss.push('a required delivery date');
  else if(String(D.required_delivery_date)<TODAY_ISO)miss.push('a delivery date not in the past');
  if(D._kind==='WO'){
    if(!machinesOf(D.executing_unit).length)return {k:'bad',s:'no machine is set up at '+D.executing_unit+' (M03)'};
    var q=LINES.filter(function(l){return !(Number(l.qty)>0);}).length; if(q)miss.push(q+' line'+(q>1?'s':'')+' without a quantity to make');
    var n=0; LINES.forEach(function(l){ if(!(l._ops||[]).length){n++;return;} (l._ops||[]).forEach(function(o){ if(!o.bay_id||!o.machine_id)n++; }); });
    if(n)miss.push(n+' operation'+(n>1?'s':'')+' without a bay and a machine');
    return miss.length?{k:'no',s:miss.join(' · ')}:{k:'ok',s:'ready to release'};
  }
  if(!storesOf(D.executing_unit).length)return {k:'bad',s:'no store is set up at '+D.executing_unit+' (M03)'};
  var m=LINES.filter(function(l){return !l.storage_id;}).length; if(m)miss.push(m+' line'+(m>1?'s':'')+' without a store');
  return miss.length?{k:'no',s:miss.join(' · ')}:{k:'ok',s:'ready to release'};
}

var PDF_POLL_MS=1500, PDF_POLL_MAX=40, PDF_URL_TTL=120;   
function pdfTemplateCode(){ return D._kind==='WO' ? 'WO_STD_V1' : 'PL_STD_V1'; }
function openPdfDownload(){
  if(!D){ toast('Open a document first.','info'); return; }
  var rd=readiness();
  openModal((D._kind==='WO'?'Production order':'Packing list')+' · '+(D._no||''),
    '<div class="kmap"><b>'+esc(D._no||'')+'</b> of '+esc(D.so_no||'')+' · internal copy'+
      (rd.k!=='ok'?'<div class="hint">'+esc(rd.s)+'</div>':'')+'</div>'+
    '<div class="hint" id="pdfProg" role="status" aria-live="polite"></div>'+
    '<div id="pdfErr" role="alert" aria-live="polite"></div>',
    '<button class="btn btn-g" onclick="closeModal(false)">Close</button>'+
    '<button class="btn btn-p" id="pdfBtn" onclick="doPdfExport()">Download</button>');
}
async function doPdfExport(){
  if(!D)return;
  var prog=document.getElementById('pdfProg');
  function say(t){ if(prog)prog.textContent=t; }
  var btn=document.getElementById('pdfBtn');
  await saveGuard(btn,'Preparing…',async function(){
    try{
      var kk='pdf:'+D._id+':INTERNAL';
      say('Requesting the document…');
      var env=await callA('export_pdf_request',{module_code:'M10', document_id:D._id,
        template_code:pdfTemplateCode(), copy_type:'INTERNAL',
        p_actor_emp:actorEmp, p_app_key:appKey(kk)});
      if(!env.replay)clearKey(kk);
      var d=(env&&env.data&&typeof env.data==='object')?env.data:{};
      var eid=d.export_id;
      if(!eid)throw new Error('No export id came back.');

      say('Rendering…');
      var engineErr='';
      try{
        var rr=await fetch('api/export-pdf',{method:'POST',headers:{'Content-Type':'application/json'},
          body:JSON.stringify({export_id:eid})});
        if(!rr.ok){ var tt=''; try{ tt=await rr.text(); }catch(e2){}
          engineErr='the renderer answered '+rr.status+(tt?(': '+String(tt).slice(0,200)):''); }
      }catch(fx){ engineErr='the renderer could not be reached: '+((fx&&fx.message)||String(fx)); }
      var row=null;
      for(var i=0;i<PDF_POLL_MAX;i++){
        var pr=await SB.from('pdf_exports').select('status,file_path,file_name,error_message').eq('id',eid).maybeSingle();
        if(!pr.error&&pr.data){ row=pr.data; if(row.status==='DONE'||row.status==='ERROR')break; }
        await new Promise(function(res){ setTimeout(res,PDF_POLL_MS); });
      }
      if(!row||row.status!=='DONE'){
        var code=(row&&row.status==='ERROR')?'PDF_RENDER_ERROR':'PDF_NOT_READY';
        throw new Error(msgFor(code,''));
      }
      say('Fetching the file…');

      var su=await SB.storage.from('pdf-exports')
        .createSignedUrl(row.file_path,PDF_URL_TTL,{download:row.file_name||((D._no||'document')+'.pdf')});
      if(su.error||!su.data||!su.data.signedUrl)
        throw new Error(msgFor('PDF_URL_FAILED',(su.error&&su.error.message)||''));
      var a=document.createElement('a');
      a.href=su.data.signedUrl; a.rel='noopener';
      document.body.appendChild(a); a.click(); document.body.removeChild(a);
      closeModal(false);
      toast((D._no||'The document')+' is downloading.'+(env.replay?' (already produced)':''),'ok');
    }catch(e){
      say('');
      var slot=document.getElementById('pdfErr');
      if(slot)slot.innerHTML='<div class="wbanner hard" style="margin-top:10px">'+esc(e.message||String(e))+'</div>';
      else toast(e.message,'err');
    }
  });
}

async function doExport(variant,scope){
  toggleExportMenu(scope==='list'?'List':'Rec');
  var rows=(scope==='list')?matched():((scope==='rec')?recRows():[]);
  if(!rows.length){toast('Nothing to export.','warn');return;}
  var DC=expDocCols(), LC=expLineCols();
  var wantSummary=(variant==='summary'||variant==='both'), wantDetail=(variant==='detailed'||variant==='both');
  if(!wantSummary&&!wantDetail)wantSummary=true;
  var byDoc={}, lineCount=0;
  if(wantDetail){
    var woIds=rows.filter(function(d){return d._kind==='WO';}).map(function(d){return d._id;});
    var plIds=rows.filter(function(d){return d._kind==='PL';}).map(function(d){return d._id;});
    var all=[];
    if(woIds.length){ var L=await SB.from('work_order_lines').select('wo_id,wo_line_id,line_no,so_line_id,item_id,description,qty,customer_qty,customer_uom,customer_length,has_customization').in('wo_id',woIds).order('line_no');
      if(!L.error){ (L.data||[]).forEach(function(l){ l._doc=l.wo_id; all.push(l); });
        var lids=(L.data||[]).map(function(l){return l.wo_line_id;});
        if(lids.length){ var O=await SB.from('work_order_operations').select('wo_line_id,op_seq,bay_id,machine_id').in('wo_line_id',lids).order('op_seq');
          if(!O.error)all.forEach(function(l){ l._ops=(O.data||[]).filter(function(o){return o.wo_line_id===l.wo_line_id;}); }); } } }
    if(plIds.length){ var P=await SB.from('packing_list_lines').select('pl_id,pl_line_id,line_no,so_line_id,item_id,description,qty_ordered,storage_id').in('pl_id',plIds).order('line_no');
      if(!P.error)(P.data||[]).forEach(function(l){ l._doc=l.pl_id; all.push(l); }); }
    var slIds=all.map(function(l){return l.so_line_id;}).filter(Boolean);
    if(slIds.length){ var S=await SB.from('so_lines').select('id,customer_length,customer_uom,customer_qty,quoted_uom,quoted_total_qty,sw_basis,sw_value').in('id',slIds);
      var sm={}; if(!S.error)(S.data||[]).forEach(function(x){ sm[x.id]=x; }); all.forEach(function(l){ l._sol=sm[l.so_line_id]||{}; }); }
    all.forEach(function(l){ (byDoc[l._doc]=byDoc[l._doc]||[]).push(l); lineCount++; });
  }
  var out=[], summaryRows=0, detailRows=0, noLine=0;
  function dCells(d){ return DC.map(function(col){return csvCell(col.v(d));}); }
  if(wantSummary){ out.push(DC.map(function(c){return c.h;}).join(',')); rows.forEach(function(d){ out.push(dCells(d).join(',')); summaryRows++; }); }
  if(wantDetail){
    if(wantSummary)out.push('');
    out.push(DC.concat(LC).map(function(c){return c.h;}).join(','));
    rows.forEach(function(d){ var mine=byDoc[d._id]||[];
      if(!mine.length){ out.push(dCells(d).concat(LC.map(function(){return '';})).join(',')); noLine++; return; }
      mine.forEach(function(l){ out.push(dCells(d).concat(LC.map(function(c){return csvCell(c.v(l));})).join(',')); detailRows++; }); });
  }
  RKF.exportRows(out,'M10_production_'+variant+'_'+TODAY_ISO+'.csv');
  toast('Exported '+rows.length+' document(s)'+(wantSummary?' · '+summaryRows+' summary row(s)':'')+(wantDetail?' · '+detailRows+' line row(s) of '+lineCount+' read'+(noLine?' · '+noLine+' with no lines':''):'')+'.','ok');
}

    RKF.registerSurface('m10.workspace',{depth:5, isOpen:function(){ return !mdOpen()&&curTab==='ws'&&!!openDocId; }, close:function(){ closeWorkspace(); }});
  }
  document.addEventListener('keydown',function(e){
    var mod=e.ctrlKey||e.metaKey, typing=/^(INPUT|SELECT|TEXTAREA)$/.test((e.target&&e.target.tagName)||'');
    if(e.key==='Escape'&&!mod){
      if(mdOpen()){ closeModal(false); return; }                                   
      if(document.querySelectorAll('.ddmenu.show').length){ e.preventDefault(); closeMenus(); return; }
      if(curTab==='ws'&&openDocId){ e.preventDefault(); closeWorkspace(); return; }
      return;
    }
    if(mod&&(e.key==='k'||e.key==='K')){ e.preventDefault(); if(curTab!=='list')showTabNow('list'); var q=document.getElementById('q'); if(q){q.focus();q.select();} return; }
    if(mod&&(e.key==='s'||e.key==='S')){
      e.preventDefault();                                                            
      if(mdOpen()){ var prim=document.querySelector('#modalFoot .btn-p:not([disabled])'); if(prim)prim.click(); return; }
      var rb=document.getElementById('btnRelease'); if(rb&&!rb.disabled)release();
      return;
    }
    if(e.altKey&&(e.key==='h'||e.key==='H')){ e.preventDefault(); openHistory(); return; }
    if(e.altKey&&(e.key==='r'||e.key==='R')) return;                                
    if(e.key==='?'&&!typing){ e.preventDefault(); shortcutMap(); return; }
    if(!typing&&(e.key==='1'||e.key==='2'||e.key==='3'))showTab(['list','ws','rec'][Number(e.key)-1]);
    if(e.key==='Enter'){ var t=e.target; if(t&&t.getAttribute&&t.tagName==='TR'&&t.getAttribute('tabindex')==='0'){ e.preventDefault(); t.click(); }
      if(t&&t.classList&&(t.classList.contains('tab')||t.classList.contains('ri'))){ e.preventDefault(); t.click(); } }
  });
}
function shortcutMap(){
  openModal('Keyboard','<div class="kmap">'+
    '<div><kbd>Ctrl</kbd>+<kbd>K</kbd> &nbsp; search everything</div><div><kbd>Ctrl</kbd>+<kbd>S</kbd> &nbsp; release the open draft</div>'+
    '<div><kbd>Alt</kbd>+<kbd>R</kbd> &nbsp; recents</div><div><kbd>Alt</kbd>+<kbd>H</kbd> &nbsp; change history of the selected document</div>'+
    '<div><kbd>Enter</kbd> &nbsp; open the focused row</div><div><kbd>Esc</kbd> &nbsp; close the topmost: dialog, menu, then the open document</div><div><kbd>?</kbd> &nbsp; this list</div>'+
    '<div><kbd>1</kbd> <kbd>2</kbd> <kbd>3</kbd> &nbsp; Queue, Workspace, Records</div><div><kbd>Tab</kbd> &nbsp; move through the fields in order</div></div>',
    '<button class="btn btn-p" onclick="closeModal(false)">Close</button>');
}
function nav(where){
  var map={home:'index.html',m08:'m08.html',m01:'m01.html',config:'mconfig.html'};
  var u=map[where]; if(!u)return;
  if(new URLSearchParams(location.search).get('embed')==='1') u+='?embed=1';
  location.href=u;
}
(function(){ var h=(location.hash||'').replace('#',''); if(h==='rec')curTab='rec'; })();
window.addEventListener('DOMContentLoaded',function(){ showTabNow(curTab==='rec'?'rec':'list'); boot(); });

(function(){

  var _loader=async function(){
  await loadMasters();
  try{ await loadStatusVocabulary(); }catch(e){}
  await loadDocs();
  if(recLoaded)await loadRecords();
  await refreshOpenDoc();          
};
  var _opts={hold:function(){
  if(!booted||!actorEmp)return true;

  return mdOpen()||document.querySelectorAll('.ddmenu.show').length>0;
}};
  if(window.RKF&&RKF.live)RKF.live(SB,['work_order','packing_list','org_units','bays','machines','storage_locations','employees','reference_values'],_loader,_opts);
  else if(window.RKF&&RKF.liveMasters)RKF.liveMasters(_loader,_opts);
})();
</script>
