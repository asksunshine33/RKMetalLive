function f1Of(l){
  var d=l&&l.governed_pricing_decision; if(!d)return null;
  if(typeof d==='string'){ try{d=JSON.parse(d);}catch(e){return null;} }
  return (d&&typeof d==='object'&&!Array.isArray(d))?d:null;
}
function f1Frozen(l){ return !!f1Of(l); }
function leakOf(l){
  var d=f1Of(l); if(!d)return null;
  var gb=d.governed_base_amount, am=l?l.amount:null;
  if(gb===null||gb===undefined||am===null||am===undefined)return null;
  var v=Number(gb)-Number(am);
  return isNaN(v)?null:v;
}
function sumOrNull(arr,fn){
  var s=null;
  (arr||[]).forEach(function(x){ var v=fn(x);
    if(v!==null&&v!==undefined&&v!==''&&!isNaN(Number(v)))s=(s===null?0:s)+Number(v); });
  return s;
}
function linesLeak(arr){ return sumOrNull(arr,leakOf); }
function linesCost(arr){ return sumOrNull(arr,function(l){return l.cost;}); }
function linesMargin(arr){ return sumOrNull(arr,function(l){return l.margin;}); }

function f1Coverage(arr){
  var n=0,t=(arr||[]).length;
  (arr||[]).forEach(function(l){ if(f1Frozen(l))n++; });
  return {n:n,t:t};
}

function costEvidenceNote(arr){
  var c=f1Coverage(arr);

  if(!c.t)return '';
  return c.n+'/'+c.t;
}

function canEditHeader(q){

function editBlockReason(q){
  if(!q)return "Open a quote from the list first.";
  if(isTerminal(q.status))return "This quote is "+q.status+", so it cannot be changed.";
  if(isFrozen(q)&&!can(CAP.EDIT_APPROVED))return "This quote is "+q.status+". Terms are locked.";
  if(!can(CAP.EDIT))return capWhy(CAP.EDIT,"edit a quote");
  return "";
}

function envErr(code,message,detail,data){
  var e=new Error(message||'The write was refused.');
  e.rpcCode=code||'UNKNOWN'; e.rpcDetail=detail||null; e.isEnvelope=true;
  e.rpcData=(data===undefined||data===null)?null:data;
  return e;
}
async function callA(name,payload){
  if(!SB)throw new Error('Connection unavailable.');
  var r=await SB.rpc(name,{p_payload:payload});
  if(r.error)throw r.error;
  var env=r.data;
  if(env===null||typeof env!=='object'||typeof env.ok==='undefined')
    throw new Error('The server reply could not be read.');

  if(env.ok!==true){ var e=env.error||{};
    throw envErr(e.code||env.error_code, e.message||env.message,
                 (e.detail===undefined||e.detail===null)?env.detail:e.detail,
                 (env.data&&typeof env.data==='object')?env.data:null); }
  return env;
}

function detailText(d){
  if(d===null||d===undefined)return "";
  if(typeof d==='string')return d;
  try{return JSON.stringify(d);}catch(e){return String(d);}
}

function errClass(code){
  var c=String(code||'');
  if(/^M0\d_/.test(c))return 'refusal';        
  if(/^AUTH_/.test(c))return 'auth';
  if(c==='VALIDATION')return 'refusal';
  if(c==='STALE_WRITE'||c==='NOT_FOUND')return 'conflict';
  if(c==='INTERNAL')return 'internal';
  return c?'refusal':'internal';               
}

function errBannerCls(ex){ var k=errClass(ex&&ex.rpcCode); return (k==='internal')?'hard':(k==='auth'?'hard':'soft'); }

function errCodeOf(ex){ return (ex&&ex.isEnvelope&&ex.rpcCode)?String(ex.rpcCode):''; }

function logRefusal(ex){
  try{
    if(ex&&ex.isEnvelope&&window.console&&console.info)
      console.info('[M06 refusal]',ex.rpcCode,'|',ex.message,'|',detailText(ex.rpcDetail));
  }catch(e){}
}
function friendlyErrA(ex){
  if(ex&&ex.isEnvelope)logRefusal(ex);
  return RKF.errText(ex,{fallback:CLASSLEAD[errClass(ex&&ex.rpcCode)]||"'That change was not accepted.'"});
}

function unpriceableBox(ex){
  var d=ex&&ex.rpcDetail;
  var rows=[];
  if(Array.isArray(d))rows=d;
  else if(d&&typeof d==='object'&&Array.isArray(d.lines))rows=d.lines;
  else if(d&&typeof d==='object'&&(d.line_no!==undefined||d.item_id!==undefined||d.reason!==undefined))rows=[d];
  if(!rows.length)return '<div class="wbanner hard" style="margin:0 0 10px">'+esc(friendlyErrA(ex))+'</div>';

  var uc=errCodeOf(ex);

  var h='<div class="wbanner hard" style="margin:0 0 10px">'+
        esc(RKF.errText(ex,{fallback:RKF.errVocab('M06_UNPRICEABLE_LINE')}))+'</div>';
  h+='<div class="totbox" style="min-width:0">'+rows.map(function(r){
    if(typeof r==='string')return '<div class="totrow"><span></span><b>'+esc(r)+'</b></div>';
    return '<div class="trail-i"><b>Line '+esc(String(r.line_no!==undefined?r.line_no:'?'))+'</b>'+
      (r.item_id?' · '+esc(String(r.item_id)):'')+
      (r.reason?'<br>'+esc(String(r.reason)):'')+
      (r.sqlstate?'<span class="tm">sqlstate '+esc(String(r.sqlstate))+'</span>':'')+'</div>';
  }).join('')+'</div>';
  return h;
}

var FIELD_RULES={

  validdays:{test:function(v){
                if(v==='')return true;
                var n=Number(v);
                if(!(n>=1&&n===Math.floor(n)))return false;
                var mx=validityMax();
                return mx===null?true:n<=mx;
              },
             msg:function(){
                var mx=validityMax();
                return mx===null

                  ? 'Whole days, one or more.'
                  : ('Whole days, 1 to '+mx+'.');
              }},
  nonneg:{test:function(v){return v===''||Number(v)>=0;},msg:'Lead-time rule: days cannot be negative.'},
  pct100:{test:function(v){return v===''||(Number(v)>=0&&Number(v)<=100);},msg:'Percentage rule: between 0 and 100 percent.'},
  qtypos:{test:function(v){return v===''||Number(v)>0;},msg:'Quantity rule: more than zero.'},
  numpos:{test:function(v){return v===''||Number(v)>=0;},msg:'Number rule: zero or more.'}
};
function fieldRule(el,rule){
  if(!el)return;
  var r=FIELD_RULES[rule]; if(!r)return;
  var id=el.id?el.id+'-rule':null;
  var slot=id?document.getElementById(id):null;
  var v=(el.value===null||el.value===undefined)?'':String(el.value).trim();
  var bad=isNaN(v===''?0:Number(v))||!r.test(v);
  if(!slot&&bad&&id){
    slot=document.createElement('div'); slot.className='frule'; slot.id=id;
    if(el.parentNode)el.parentNode.insertBefore(slot,el.nextSibling);
  }
  if(slot)slot.textContent=bad?(typeof r.msg==='function'?r.msg():r.msg):'';
}

async function resolveCapabilities(){
  CAPS={}; CAPERR={};

  await Promise.all(SCREEN_CAPS.map(async function(c){
    try{
      var r;
      if(c===CAP.EXPORT){

        r=await SB.rpc('pdf_actor_may',{p_actor:actorEmp,p_module_code:'M06'});
      } else {
        r=await SB.rpc('m06_can',{p_by_emp:actorEmp,p_capability:c});

  }));

function seamQuoteId(){
  var qs=new URLSearchParams(location.search);
  var id=qs.get('quote')||qs.get('quote_id')||"";
  if(!id&&location.hash){
    var h=location.hash.replace(/^#/,''); var hp=new URLSearchParams(h.indexOf('=')>=0?h:'');
    id=hp.get('quote')||hp.get('quote_id')||"";
  }
  if(!id){
    var fl=qs.get('from_lead')||"";
    if(fl){ var m=quotes.filter(function(x){return x.from_lead_id===fl;});
      if(m.length){ m.sort(function(a,b){return (b.rev_no||0)-(a.rev_no||0);}); id=m[0].id; } }
  }
  return (id&&/^[0-9a-fA-F-]{36}$/.test(id))?id:null;
}

var LINE_CEIL={};
var CEIL_KEYS=['max_disc_pct','applied_max_disc_pct','discount_ceiling_pct'];
function pickCeil(o){
  if(!o||typeof o!=='object')return null;
  for(var i=0;i<CEIL_KEYS.length;i++){
    var v=o[CEIL_KEYS[i]];
    if(v!==null&&v!==undefined&&v!==''&&!isNaN(Number(v)))return Number(v);
  }
  return null;
}

function noteCeiling(lineId,src){ var v=pickCeil(src); if(lineId&&v!==null)LINE_CEIL[lineId]=v; }
function lineMaxDisc(l){
  if(!l)return null;
  var v=pickCeil(l);                                                   
  if(v===null&&l.id&&LINE_CEIL.hasOwnProperty(l.id))v=LINE_CEIL[l.id]; 
  return v;
}

  if(t!=='ws')creating=false;         
  if(t==='ws'&&!openQuoteId&&!creating){
    toast("Open a quote first.","warn");
    return;
  }
  curTab=t;
  markTab(t);
  document.getElementById("listZone").style.display=(t==="list")?"flex":"none";
  document.getElementById("wsZone").style.display=(t==="ws")?"flex":"none";
  document.getElementById("insZone").style.display=(t==="ins")?"block":"none";
  document.getElementById("recZone").style.display=(t==="rec")?"flex":"none";
  renderAll();

  if(t!=='ws'&&booted)refreshRegister();
}

  try{ await loadQuotes(); if(curTab!=='ws')renderAll(); }
  finally{ _regBusy=false; }
}

function statusCount(s){ return quotes.filter(function(q){return q.status===s;}).length; }

function expiringWindowNote(){
  return TATWIN?('validity runs out within '+TATWIN.days+' day(s)'):'already expired or expires today';
}
function isExpiring(q){
  if(!q.validity_date)return false;
  if(isTerminal(q.status))return false;
  var d=dDiff(TODAY_ISO,q.validity_date);
  return TATWIN?(d<=TATWIN.days):(d<=0);
}
function apprOf(q){ return APPR[q.id]||null; }
function apprStatus(q){ var a=apprOf(q); return a?(a.status||""):""; }
function apprCount(s){ return quotes.filter(function(q){return apprStatus(q)===s;}).length; }

function uniqVals(arr,key){ var o={},out=[]; arr.forEach(function(x){var k=key(x); if(k&&!o[k]){o[k]=1;out.push(k);}}); return out; }

function periodOK(q){
  var p=fval("fPeriod"); if(!p)return true;
  var d=q.quote_date||String(q.created_at||'').slice(0,10); if(!d)return false;
  var day=new Date(TODAY_ISO+"T00:00:00");
  function iso(x){function z(n){return(n<10?'0':'')+n;}return x.getFullYear()+'-'+z(x.getMonth()+1)+'-'+z(x.getDate());}
  if(p==="Day")return d===TODAY_ISO;
  if(p==="Week"){ var mon=new Date(day); mon.setDate(day.getDate()-((day.getDay()+6)%7)); return d>=iso(mon)&&d<=TODAY_ISO; }
  if(p==="Month")return d>=iso(new Date(day.getFullYear(),day.getMonth(),1))&&d<=iso(new Date(day.getFullYear(),day.getMonth()+1,0));
  if(p==="Quarter"){ var qs=Math.floor(day.getMonth()/3)*3; return d>=iso(new Date(day.getFullYear(),qs,1))&&d<=iso(new Date(day.getFullYear(),qs+3,0)); }
  if(p==="FY"){ var y=(day.getMonth()>=3)?day.getFullYear():day.getFullYear()-1; return d>=(y+'-04-01')&&d<=((y+1)+'-03-31'); }
  return true;
}
function rangeOK(q){
  var f=(typeof readDMY==='function')?readDMY("fFrom"):"", t=(typeof readDMY==='function')?readDMY("fTo"):"";
  if(!f&&!t)return true;
  var d=q.quote_date||String(q.created_at||'').slice(0,10); if(!d)return false;
  if(f&&d<f)return false; if(t&&d>t)return false; return true;
}

function unitOf(q){ return q.unit||""; }

function custDistrict(q){ var c=custOf(q); return (c&&c.district)?c.district:''; }
function ccrOf(q){ var c=custOf(q); return (c&&c.ccr_emp)?c.ccr_emp:''; }
function ccrName(q){ var e=ccrOf(q); return e?empName(e):''; }
function referrerName(q){
  if(!q.referrer_id)return '';
  var r=REFMAP[q.referrer_id];
  return r?(r.name||q.referrer_id):q.referrer_id;
}
function directHay(q){
  var c=custOf(q);
  return [q.quote_no,String(q.rev_no),c?c.name:"",c?c.customer_code:"",custDistrict(q),q.status,
          labelOf(q.pt_code),labelOf(q.delivery_scope),referrerName(q),ccrName(q),
          q.grand_total,q.total_weight_mt,q.validity_date,
          repName(q)].join("  ").toLowerCase();   
}
function indirectHay(q){
  var c=custOf(q);
  return {
    "customer code":c?c.customer_code:"",
    "unit":q.unit||"",
    "FY":q.fy||"",
    "payment terms":labelOf(q.pt_code),
    "delivery scope":labelOf(q.delivery_scope),
    "delivery terms":labelOf(q.delivery_terms),
    "insurance":labelOf(q.insurance_scope),
    "pricing status":q.pricing_status||"",
    "mode of delivery":labelOf(q.mode_of_delivery),
    "approval no":(apprOf(q)&&apprOf(q).approval_no)||"",
    "converted lead":q.from_lead_id||"",
    "raised by":empName(q.created_by)
  };
}
function listVisible(q){

  return inList(q);
}
function matched(){
  var qv=((document.getElementById("q")||{}).value||"").trim().toLowerCase();
  viaTag={};
  var rows=quotes.filter(listVisible);                       
  var st=Object.keys(filter.status);
  if(st.length)rows=rows.filter(function(q){return filter.status[q.status];});
  if(filter.approval)rows=rows.filter(function(q){return apprStatus(q)===filter.approval;});
  if(filter.expiring)rows=rows.filter(isExpiring);
  if(filter.stale)rows=rows.filter(function(q){return !!q.totals_dirty&&!isTerminal(q.status);});
  if(grpFilter.kind==='sales')rows=rows.filter(function(q){return (repOf(q)||"")===grpFilter.val;});
  if(grpFilter.kind==='unit')rows=rows.filter(function(q){return unitOf(q)===grpFilter.val;});
  if(fval("fCustR"))rows=rows.filter(function(q){return q.customer_id===fval("fCustR");});
  if(fval("fRep"))rows=rows.filter(function(q){return (repOf(q)||"")===fval("fRep");});
  if(fval("fUnit"))rows=rows.filter(function(q){return unitOf(q)===fval("fUnit");});
  if(fval("fPricing"))rows=rows.filter(function(q){return (q.pricing_status||"")===fval("fPricing");});
  rows=rows.filter(periodOK).filter(rangeOK);
  if(!qv)return rows;
  return rows.filter(function(q){
    if(directHay(q).indexOf(qv)>=0)return true;
    var ind=indirectHay(q);
    var hitKey=null;
    Object.keys(ind).forEach(function(k){ if(!hitKey&&String(ind[k]||"").toLowerCase().indexOf(qv)>=0)hitKey=k; });
    if(hitKey){ viaTag[q.id]=hitKey; return true; }
    return false;
  });
}
function sortVal(q,k){
  switch(k){
    case "quote_no": return q.quote_no||"";
    case "rev": return Number(q.rev_no||0);
    case "cust": return (custName(q)||"").toLowerCase();
    case "dist": return (custDistrict(q)||"").toLowerCase();      
    case "pt": return (labelOf(q.pt_code)||"").toLowerCase();      
    case "dsc": return (labelOf(q.delivery_scope)||"").toLowerCase(); 
    case "ref": return (referrerName(q)||"").toLowerCase();        
    case "ccr": return (ccrName(q)||"").toLowerCase();             
    case "status": return q.status||"";
    case "value": return Number(q.grand_total||0);
    case "weight": return Number(q.total_weight_mt||0);
    case "margin": return (q.__margin===null||q.__margin===undefined)?-Infinity:Number(q.__margin);
    case "rep": return (repName(q)||"").toLowerCase();
    case "validity": return q.validity_date||"9999-12-31";
    default: return q.updated_at||"";
  }
}

    th("status","Status")+th("pt","Payment terms")+th("dsc","Delivery scope")+
    th("ref","Referrer")+th("ccr","CCR")+
    th("value","Value","num")+th("weight","Weight MT","num")+
    (cost?th("margin","Margin","num","Frozen cost only; never a made-up zero"):'')+

    th("rep","Sales person",null,"the quote's own salesperson; where none is recorded, the person who raised it")+
    th("validity","Validity")+
    '</tr></thead><tbody>';

    h+='<tr><td colspan="'+span+'">'+
       (quotes.length===0
         ? emptyState('&#128196;','No quotes yet.',(can(CAP.CREATE)?'+ New quote':''),'openNewQuote()')

       ' onclick="setGrpFilter(\''+(on?'':gkind)+'\',\''+(on?'':esc(String(bk.key)).replace(/'/g,""))+'\')"'+
       ' title="'+esc(on?'Show every group':'Show only this group')+'">'+
       '<td colspan="'+span+'">'+esc(bk.label)+'<span class="gct">'+bk.rows.length+' quote(s)</span></td></tr>';
  }
  bk.rows.forEach(function(q){
    painted++;                                              

    h+='<tr'+(selId===q.id?' class="sel"':'')+' onclick="selectQuote(\''+q.id+'\')" tabindex="0">'+
      '<td class="d-code">'+esc(q.quote_no||'(no number)')+'</td>'+
      '<td class="num">'+esc(String(q.rev_no===null||q.rev_no===undefined?'—':q.rev_no))+'</td>'+
      '<td><b>'+esc(custName(q))+'</b>'+(viaTag[q.id]?' <span class="viachip">via '+esc(viaTag[q.id])+'</span>':'')+'</td>'+
      '<td>'+(custDistrict(q)?esc(custDistrict(q)):'<span class="na">not available</span>')+'</td>'+          
      '<td>'+statusTag(q.status)+(q.totals_dirty?' <span class="dirtychip">totals not recomputed</span>':'')+

        (apprStatus(q)==='Auto-Approved'?' <span class="viachip">auto-approved</span>':'')+'</td>'+
      '<td>'+(q.pt_code?esc(labelOf(q.pt_code)||q.pt_code):'<span class="na">not set</span>')+'</td>'+        
      '<td>'+(q.delivery_scope?esc(labelOf(q.delivery_scope)||q.delivery_scope):'<span class="na">not stated</span>')+'</td>'+ 
      '<td>'+(referrerName(q)?esc(referrerName(q)):'<span class="na">none</span>')+'</td>'+                   
      '<td>'+(ccrName(q)?esc(ccrName(q)):'<span class="na">not available</span>')+'</td>'+                    
      '<td class="num">'+(q.grand_total===null||q.grand_total===undefined?'<span class="na">not available</span>':rs(q.grand_total))+'</td>'+
      '<td class="num">'+num(q.total_weight_mt,3)+'</td>'+
      (cost?'<td class="num">'+marginCell(q)+'</td>':'')+
      '<td>'+esc(repName(q))+(repIsFallback(q)?' <span class="hint" style="margin:0">(raised by)</span>':'')+'</td>'+   
      '<td>'+(q.validity_date?(fmtDate(q.validity_date)+(isExpiring(q)?' <span class="flag">expiring</span>':'')):'<span class="na">not set</span>')+'</td>'+
      '</tr>';
  });
  });
  if(rows.length>painted)
    h+='<tr><td colspan="'+span+'"><div class="surf"><b>'+painted+'</b> of <b>'+rows.length+'</b> shown '+
       '<button class="link-btn" onclick="registerMore()">show '+Math.min(LIST_PAGE,rows.length-painted)+' more</button></div></td></tr>';

  c.innerHTML=h+'</tbody></table>'+
    (totalQuotes!==null&&totalQuotes>quotesRead   
      ? '<div class="hint" style="padding:4px 2px">newest <b>'+quotesRead+'</b> of <b>'+totalQuotes+'</b> loaded <button class="link-btn" onclick="loadMoreQuotes()">Load older</button></div>'

function groupKind(){ return grouping.sales?'sales':(grouping.unit?'unit':''); }
function groupKeyOf(q,kind){ return kind==='sales'?(repOf(q)||''):(kind==='unit'?unitOf(q):''); }
function groupLabelOf(k,kind){
  if(kind==='sales')return k?empName(k):'nobody recorded';
  if(kind==='unit')return k||'no unit';
  return '';
}
function groupRows(rows,kind){
  if(!kind)return [{key:null,label:null,rows:rows}];
  var order=[], bag={};
  rows.forEach(function(q){
    var k=groupKeyOf(q,kind);
    if(!bag[k]){ bag[k]=[]; order.push(k); }
    bag[k].push(q);
  });
  order.sort(function(a,b){ return groupLabelOf(a,kind).localeCompare(groupLabelOf(b,kind)); });
  return order.map(function(k){ return {key:k,label:groupLabelOf(k,kind),rows:bag[k]}; });
}

/* RECORDS TAB */

function lifePhase(q){ return isTerminal(q.status)?'Completed':(PARKED.indexOf(q.status)>=0?'Parked':'Open'); }
function recValidityPhase(q){
  if(!q.validity_date)return 'Not set';
  if(dDiff(TODAY_ISO,q.validity_date)<0)return 'Expired';
  return isExpiring(q)?'Expiring soon':'Valid';
}

function recRows(){
  var rows=quotes.filter(function(q){ return !inList(q)&&(recIncludeCompleted||!isTerminal(q.status)); });   
  if(recApprFilter)rows=rows.filter(function(q){return apprStatus(q)===recApprFilter;});
  if(recF.status)rows=rows.filter(function(q){return q.status===recF.status;});
  if(recF.life)rows=rows.filter(function(q){return lifePhase(q)===recF.life;});
  if(recF.rep)rows=rows.filter(function(q){return (repOf(q)||'')===recF.rep;});
  if(recF.ccr)rows=rows.filter(function(q){return (ccrOf(q)||'')===recF.ccr;});
  if(recF.validity)rows=rows.filter(function(q){return recValidityPhase(q)===recF.validity;});
  if(recF.createdBy)rows=rows.filter(function(q){return (q.created_by||'')===recF.createdBy;});
  if(recF.approvedBy)rows=rows.filter(function(q){return (q.approved_by||'')===recF.approvedBy;});
  if(recF.period)rows=rows.filter(function(q){return recPeriodOK(q);});
  return rows.slice().sort(function(a,b){ return String(b.updated_at||'').localeCompare(String(a.updated_at||'')); });
}
function recPeriodOK(q){
  var p=recF.period; if(!p)return true;
  var d=q.quote_date||String(q.created_at||'').slice(0,10); if(!d)return false;
  var day=new Date(TODAY_ISO+"T00:00:00");
  function iso(x){function z(n){return(n<10?'0':'')+n;}return x.getFullYear()+'-'+z(x.getMonth()+1)+'-'+z(x.getDate());}
  if(p==="Day")return d===TODAY_ISO;
  if(p==="Week"){ var mon=new Date(day); mon.setDate(day.getDate()-((day.getDay()+6)%7)); return d>=iso(mon)&&d<=TODAY_ISO; }
  if(p==="Month")return d>=iso(new Date(day.getFullYear(),day.getMonth(),1))&&d<=iso(new Date(day.getFullYear(),day.getMonth()+1,0));
  if(p==="Quarter"){ var qs=Math.floor(day.getMonth()/3)*3; return d>=iso(new Date(day.getFullYear(),qs,1))&&d<=iso(new Date(day.getFullYear(),qs+3,0)); }
  return true;
}
function recSet(k,v){ recF[k]=v; renderRecords(); }
function recOpts(id,label,key,items){
  return '<div class="lff"><label for="'+id+'">'+esc(label)+'</label><select id="'+id+'" onchange="recSet(\''+key+'\',this.value)">'+
    '<option value="">All</option>'+
    items.map(function(it){return '<option value="'+esc(it.v)+'"'+(recF[key]===String(it.v)?' selected':'')+'>'+esc(it.l)+'</option>';}).join('')+
    '</select></div>';
}

  {h:'Status',k:'status',                v:function(q,x){return statusTag(q.status);}},

  {h:'Sales person',k:'sales_person',          v:function(q,x){return esc(repName(q));}},

  {h:'Approval status',k:'approval_status',       v:function(q,x){return x.a?esc(x.a.status||''):'<span class="na">never routed</span>';}},

      ?'<button class="link-btn d-code" onclick="event.stopPropagation();openApprovalIn07(\''+esc(x.a.approval_id)+'\')">'+esc(x.a.approval_no)+'</button>'
      :'<span class="na">—</span>';}},

RECORD_COLS.forEach(function(c){ if(c.off)RECORD_HIDE[c.k]=true; });
function renderRecords(){

  var rows=recRows();

  RKF.sort.rows(rows,recSort,function(q,k){ var c=_rc.filter(function(col){return col.k===k;})[0]; return c?RKF.sort.cell(c.v(q,_x(q))):''; },

  var reps=uniqVals(quotes,function(q){return repOf(q);}).map(function(v){return {v:v,l:empName(v)};}).sort(function(a,b){return String(a.l).localeCompare(String(b.l));});
  var ccrs=uniqVals(quotes,function(q){return ccrOf(q);}).map(function(v){return {v:v,l:empName(v)};}).sort(function(a,b){return String(a.l).localeCompare(String(b.l));});
  var cbs=uniqVals(quotes,function(q){return q.created_by;}).map(function(v){return {v:v,l:empName(v)};}).sort(function(a,b){return String(a.l).localeCompare(String(b.l));});
  var abs=uniqVals(quotes,function(q){return q.approved_by;}).map(function(v){return {v:v,l:empName(v)};}).sort(function(a,b){return String(a.l).localeCompare(String(b.l));});
  var sts=uniqVals(quotes.filter(function(q){return !inList(q);}),function(q){return q.status;}).map(function(v){return {v:v,l:v};}).sort(function(a,b){return String(a.l).localeCompare(String(b.l));});   

  var _wf=(typeof readDMY==='function')?readDMY("fFrom"):"", _wt=(typeof readDMY==='function')?readDMY("fTo"):"";
  var h='<div class="lfbar" style="flex-shrink:0">'+
    ((_wf||_wt)?('<span class="pill">Dated '+(_wf?fmtDate(_wf):'any')+' to '+(_wt?fmtDate(_wt):'any')+
       ' <button onclick="clearDateWindow()" aria-label="Remove the date window">&times;</button></span>'):'')+
    '<button class="tgl'+(recIncludeCompleted?' on':'')+'" id="tglRecCompleted" onclick="toggleRecCompleted()" aria-pressed="'+(recIncludeCompleted?'true':'false')+'"'+
    ' title="Won, Lost, Dropped and Cancelled">'+(recIncludeCompleted?'Completed included':'Completed excluded')+'</button>'+
    recOpts('recPeriod','Time period','period',[{v:'Day',l:'Today'},{v:'Week',l:'This week'},{v:'Month',l:'This month'},{v:'Quarter',l:'This quarter'}])+
    recOpts('recStatus','Status','status',sts)+
    recOpts('recLife','Life cycle','life',[{v:'Open',l:'Open'},{v:'Parked',l:'Parked'},{v:'Completed',l:'Completed'}])+
    '<div class="lff"><label for="recAppr">Approval status</label><select id="recAppr" onchange="recApprFilter=this.value;renderRecords()">'+
      '<option value="">All</option>'+
      APPR_CHIPS.map(function(s){return '<option value="'+esc(s)+'"'+(recApprFilter===s?' selected':'')+'>'+esc(s)+'</option>';}).join('')+
    '</select></div>'+
    recOpts('recRep','Sales employee','rep',reps)+
    recOpts('recCcr','CCR','ccr',ccrs)+
    recOpts('recValidity','Validity','validity',[{v:'Valid',l:'Valid'},{v:'Expiring soon',l:'Expiring soon'},{v:'Expired',l:'Expired'},{v:'Not set',l:'Not set'}])+
    recOpts('recCreatedBy','Created by','createdBy',cbs)+
    recOpts('recApprovedBy','Approved by','approvedBy',abs)+
    '<button class="btn btn-g btn-sm clr" onclick="recClear()">Clear</button>'+

    '<span class="tawrap" style="display:inline-block;position:relative">'+
      '<button class="btn btn-g btn-sm" onclick="var p=document.getElementById(\'recColsPanel\');if(p)p.style.display=(p.style.display===\'none\'?\'block\':\'none\');">Columns</button>'+
      '<div class="colmenu" id="recColsPanel" style="display:none">'+recColsMenuHtml()+'</div>'+

  h+='<div class="recwrap"><table class="grid rkf-table dense"><thead><tr>'+

    var x={a:a,c:custOf(q),pending:!!(a&&(a.status==='Pending'||a.status==='Escalated'))};
    h+='<tr onclick="openWorkspace(\''+q.id+'\')" tabindex="0">'+
      recCols().map(function(col){ var _h=col.v(q,x); return '<td'+(col.tcls?' class="'+col.tcls+'"':(col.cls?' class="'+col.cls+'"':''))+(col.tcls==='wr'?' title="'+String(_h).replace(/<[^>]+>/g,'')+'"':'')+'>'+_h+'</td>'; }).join('')+  
      '</tr>';
  });
  h+='</tbody></table></div>';   
  z.innerHTML=h;

<script>

async function openWorkspace(id,fromSeam){

  dropTempRow();
  creating=false;                     
  lineState={}; lineVer={}; lineSeq={}; lineDeb={};
  openQuoteId=id; selId=id; hdrPatch={}; linePatch={}; hcDraft=null; pendingUom=null;
  var s=document.getElementById("wsScroll");
  if(s)s.innerHTML='<div class="surf">Loading the quote…<div class="skel" style="max-width:300px;margin:14px auto"></div><div class="skel" style="max-width:240px;margin:0 auto"></div></div>';
  document.getElementById("listZone").style.display='none';
  document.getElementById("wsZone").style.display='flex';
  document.getElementById("insZone").style.display='none';
  document.getElementById("recZone").style.display='none';
  curTab='ws';
  markTab('ws');
  await loadQuote(id);
  autoDefaultOne();               

  if(Q&&window.RKF&&RKF.recents)RKF.recents.push('Quote',Q.quote_no||String(id).slice(0,8),(Q.quote_no||'Quote')+' · '+custName(Q));
  renderTabState();
  renderWorkspace(); renderWsActions();
  if(fromSeam&&Q)toast("Opened "+(Q.quote_no||'the quote')+".","ok");

  if(Q&&Q.totals_dirty&&LINES.length&&linesEditable()){
    toast("Prices out of date — recomputing.","warn");
    await autoReprice(true);
    toast("Prices brought up to date.","ok");
  }
}

var ADDR_PURPOSE={bill_to_address_id:'Billing', ship_to_address_id:'Shipping'};
var hdrSeeded={};                    
function addrOfType(rows,type){
  return (rows||[]).filter(function(a){ return String(a.addr_type||'')===type; });
}

function soleOrFlagged(rows,flag){
  if(!rows||!rows.length)return null;
  if(rows.length===1)return rows[0];
  var f=rows.filter(function(r){ return r[flag]===true; });
  return f.length===1?f[0]:null;
}
function seedHdr(field,val){
  if(val===null||val===undefined||val==='')return;
  if(Q[field])return;                
  hdrPatch[field]=val; hdrSeeded[field]=true;
}
function autoDefaultOne(){
  hdrSeeded={};
  if(!Q||!canEditHeader(Q))return;

  var _c=custOf(Q); if(_c&&_c.ccr_emp)seedHdr('ccr_emp',_c.ccr_emp);

  if(_c&&_c.sales_emp)seedHdr('salesperson_emp',_c.sales_emp);
  var addrs=(CUSTADDR[Q.customer_id]||[]), cons=(CUSTCON[Q.customer_id]||[]);
  if(!addrs.err){
    Object.keys(ADDR_PURPOSE).forEach(function(field){
      var pick=soleOrFlagged(addrOfType(addrs,ADDR_PURPOSE[field]),'is_default');
      if(pick)seedHdr(field,pick.address_id);
    });
  }
  if(!cons.err){
    var c=soleOrFlagged(cons,'is_primary');
    if(c){ seedHdr('bill_contact_id',c.contact_id); seedHdr('ship_contact_id',c.contact_id); }
  }
}

function createTyped(){
  if(!creating)return false;
  if(nqCust||nqRefId)return true;

  var ids=["nqCustTA","nqRefTA","nqVal","nqLtP","nqLtN","nqLtD","nqUnit","nqPt","nqIns","nqScope","nqTerms"];
  for(var i=0;i<ids.length;i++){ var e=document.getElementById(ids[i]); if(e&&String(e.value||"").trim()!=="")return true; }
  return false;
}

function seedPending(){
  return Object.keys(hdrSeeded).some(function(k){ return hdrPatch.hasOwnProperty(k); });
}
function savable(){ return dirty()||seedPending(); }
function dirty(){
  return Object.keys(hdrPatch).filter(function(k){ return !hdrSeeded[k]; }).length>0
      || Object.keys(linePatch).length>0

      || hcDirty()
      || createTyped();
}

function hcDirty(){
  if(!hcDraft)return false;
  if(hcDraft.length!==HCROWS.length)return true;
  for(var i=0;i<hcDraft.length;i++){
    var d=hcDraft[i], s=HCROWS[i];
    if(!s)return true;
    if(String(d.code||'')!==String(s.charge_code||''))return true;
    if(Number(d.amount||0)!==Number(s.amount||0))return true;
  }
  return false;
}

function hdrCur(key,stored){
  return hdrPatch.hasOwnProperty(key)?hdrPatch[key]:stored;
}

var MONEY_HDR_KEYS=["deal_discount_pct","deal_commission_pct","bill_to_address_id","validity_days"];
var hdrDeb={t:null};
function queueHdrSave(){
  if(!Q||isFrozen(Q)||!canEditHeader(Q))return;   
  if(hdrDeb.t)clearTimeout(hdrDeb.t);
  hdrDeb.t=setTimeout(function(){ hdrDeb.t=null; runHdrSave(); },LINE_DEBOUNCE_MS);
}
async function runHdrSave(){
  if(!Q||!actorEmp||isFrozen(Q)||!canEditHeader(Q))return;
  var keys=Object.keys(hdrPatch).filter(function(k){return MONEY_HDR_KEYS.indexOf(k)>=0;});
  if(!keys.length)return;
  if(Q.updated_at===null||Q.updated_at===undefined||Q.updated_at==='')return;
  var sub={}; keys.forEach(function(k){ sub[k]=hdrPatch[k]; });
  var patch=normPatch(sub,HDR_KEYS);
  if(!Object.keys(patch).length)return;
  try{
    var env=await callA(RPC.UPD_HDR,{p_actor_emp:actorEmp,quote_id:Q.id,
                                     p_expected_updated_at:Q.updated_at,patch:patch});
    keys.forEach(function(k){ Q[k]=hdrPatch[k]; delete hdrPatch[k]; delete hdrSeeded[k]; });

    var nu=env&&env.data&&env.data.updated_at; if(nu)Q.updated_at=nu;

    if(keys.indexOf('validity_days')>=0)await repaintExpiry();

    if(LINES.length)await autoReprice(true);
    var ib=document.getElementById('idBar'); if(ib)ib.outerHTML=zIdBar();
    flagDirty();
  }catch(ex){

    var hstore=(ex&&ex.rpcData&&ex.rpcData.header&&typeof ex.rpcData.header==='object')?ex.rpcData.header:null;
    var hdrCtl={deal_discount_pct:'dealDisc',deal_commission_pct:'dealComm',
                bill_to_address_id:'selBillAddr',quote_date:'qDate'};
    var hact=document.activeElement;
    keys.forEach(function(k){
      delete hdrPatch[k];
      if(!hstore||hstore[k]===undefined)return;
      Q[k]=hstore[k];
      var ctl=document.getElementById(hdrCtl[k]);
      if(!ctl||ctl===hact||ctl.tagName==='DIV')return;
      ctl.value=(hstore[k]===null||hstore[k]===undefined)?''
               :(k==='quote_date'?isoToDMY(hstore[k]):String(hstore[k]));
    });
    if(hstore&&hstore.updated_at)Q.updated_at=hstore.updated_at;
    flagDirty(); renderWsActions();
    var ib2=document.getElementById('idBar'); if(ib2)ib2.outerHTML=zIdBar();
    if(ex&&ex.rpcCode==='STALE_WRITE'){ offerReload(ex); return; }
    toast((ex&&ex.rpcData&&ex.rpcData.reason)?wordy(ex.rpcData.reason):friendlyErrA(ex),"err");
  }
}

function markHdr(k,v){ hdrPatch[k]=v; delete hdrSeeded[k]; renderWsActions(); flagDirty();
  if(MONEY_HDR_KEYS.indexOf(k)>=0)queueHdrSave(); }

function validityEdit(v){
  var s=(v===null||v===undefined)?'':String(v).trim();
  if(FIELD_RULES.validdays.test(s)){ markHdr('validity_days',v); return; }
  var el=document.getElementById('valDays');
  var prev=hdrCur('validity_days',Q?Q.validity_days:null);
  if(el)el.value=(prev===null||prev===undefined)?'':String(prev);
  toast(FIELD_RULES.validdays.msg()+' Previous value restored.',"warn");
}

async function repaintExpiry(){
  if(!Q||!Q.id)return;
  try{
    var r=await SB.from('quotes').select('validity_date,validity_days').eq('id',Q.id).maybeSingle();
    if(r.error||!r.data)return;
    Q.validity_date=r.data.validity_date;
    Q.validity_days=r.data.validity_days;
    var slot=document.getElementById('qExpiry');
    if(slot)slot.innerHTML=expiryHtml();
    var vd=document.getElementById('valDays');
    if(vd&&vd!==document.activeElement)vd.value=(Q.validity_days===null||Q.validity_days===undefined)?'':String(Q.validity_days);
  }catch(e){}
}

function renderWorkspace(){
  var s=document.getElementById("wsScroll"); if(!s)return;
  if(creating)return;                 
  var st=wsState(); if(st){ s.innerHTML=st; return; }

  var bands=[['the quote header',zHeader],['customer and terms',zTerms],['the line items',zLines],
             ['the charges',zChargesGov],
             ['the deal band',zDeal],['the approval gate',zGate],['the totals',zTotals],
             ['notes and history',zPanels]];
  var out='';
  for(var i=0;i<bands.length;i++){

               .sort(function(a,b){return String(b.created_at||"").localeCompare(String(a.created_at||""));});
}

var STATECODE={};                                
var NOT_SET='- not set -';                       
var BLANK_PRE_S07={};                            

BLANK_PRE_S07[LIST.PT]=false;
BLANK_PRE_S07[LIST.INS]=false;

function notSetLabel(){
  var ls=Object.keys(LISTS);
  for(var i=0;i<ls.length;i++){
    var rows=LISTS[ls[i]]||[];
    for(var j=0;j<rows.length;j++){
      var m=rows[j]&&rows[j].metadata;
      if(m&&String(m.is_not_set)==='true'&&rows[j].label)return rows[j].label;
    }
  }
  return NOT_SET;
}

function listDecl(listId){
  var rows=LISTS[listId]||[];
  for(var i=0;i<rows.length;i++){
    var m=rows[i]&&rows[i].metadata;
    if(m&&m.selection_rule)return m;
  }
  return null;
}
function blankPolicy(listId){
  var d=listDecl(listId);
  if(d)return {allow:String(d.selection_rule).toLowerCase()!=='mandatory', label:d.unset_label||notSetLabel(), governed:true};
  return {allow:BLANK_PRE_S07[listId]!==false, label:notSetLabel(), governed:false};
}

function rqMark(listId){ return blankPolicy(listId).allow?'':' <span class="rq">*</span>'; }

function isNotSetRow(v){ return !!(v&&v.metadata&&String(v.metadata.is_not_set)==='true'); }
function notSetCode(listId){
  var rows=LISTS[listId]||[];
  for(var i=0;i<rows.length;i++)if(isNotSetRow(rows[i]))return rows[i].code;
  return null;
}
function optList(listId,cur){
  var rows=LISTS[listId]||[];
  var pol=blankPolicy(listId);

  var ns=notSetCode(listId);
  if(ns&&cur===ns)cur='';
  var h='';
  if(pol.allow)h+='<option value=""'+((cur===null||cur===undefined||cur==="")?' selected':'')+'>'+esc(pol.label)+'</option>';
  rows.forEach(function(v){ if(isNotSetRow(v))return;   
    h+='<option value="'+esc(v.code)+'"'+(cur===v.code?' selected':'')+'>'+esc(v.code+' · '+v.label)+'</option>'; });
  if(cur&&!rows.filter(function(v){return v.code===cur;}).length)
    h+='<option value="'+esc(cur)+'" selected>'+esc(cur)+' — no longer on the published list</option>';
  return h;
}
function provTag(listId){ return PROV[listId]?' <span class="p2note">provisional</span>':''; }

function creditChip(){
  var c=custOf(Q); if(!c)return '<span class="na">unreadable</span>';
  var lim=(c.credit_limit===null||c.credit_limit===undefined)?null:Number(c.credit_limit);
  var used=(c.credit_used===null||c.credit_used===undefined)?null:Number(c.credit_used);
  if(lim===null)return '<span class="na">not set</span>';
  var left=(used===null)?null:(lim-used);
  return '<b>'+(left===null?'not available':rsPlain(left))+'</b> left'+
         (c.credit_hold?' <span class="flag bad">on credit hold</span>':'')+
         (left!==null&&Number(Q.grand_total||0)>left?' '+msym('This quote is over the credit left for this customer.','bad'):'');
}
function creditPlain(){
  var t=creditNote();
  return String(t).replace(/<[^>]*>/g,'').replace(/\s+/g,' ').trim();
}
function creditNote(){
  var c=custOf(Q); if(!c)return '<span class="na">this customer record cannot be read</span>';
  var lim=(c.credit_limit===null||c.credit_limit===undefined)?null:Number(c.credit_limit);
  var used=(c.credit_used===null||c.credit_used===undefined)?null:Number(c.credit_used);
  if(lim===null)return '<span class="na">credit limit not set</span>';
  var head=(used===null)?null:(lim-used);

  return 'limit '+rsPlain(lim)+' · used '+(used===null?'not available':rsPlain(used))+
         ' · left <b>'+(head===null?'not available':rsPlain(head))+'</b>'+
         ((c.credit_days!==null&&c.credit_days!==undefined)?(' · '+esc(String(c.credit_days))+' credit days'):'')+
         (c.credit_hold?' <span class="flag bad">on credit hold</span>':'')+
         (head!==null&&Number(Q.grand_total||0)>head?' '+msym('This quote is over the credit left for this customer.','bad'):'');
}
function applyRefRate(p){
  var el=document.getElementById('dealComm');
  if(el)el.value=String(p);
  markHdr('deal_commission_pct',String(p));
  toast("Deal commission set to "+p+"%.","ok");

function snapAddrLine(a){
  if(!a)return null;
  var parts=[a.address_line,a.city||a.district,a.state,a.pincode].filter(function(x){return !!x;});
  return parts.length?parts.join(', '):null;
}

function idStripPlain(q,c){
  var p=[custName(q)];
  if(c){ p.push(c.customer_code); p.push(c.status); }
  if(custDistrict(q))p.push(custDistrict(q));
  p.push('FY '+(q.fy||'-'));
  p.push('salesperson '+repName(q));
  if(ccrName(q))p.push('CCR '+ccrName(q));
  p.push('raised by '+empName(q.created_by)+' on '+stampOf(q.created_at));
  p.push('last updated '+stampOf(q.updated_at));
  if(q.approved_by_name)p.push('approved by '+q.approved_by_name+(q.approved_at?(' on '+stampOf(q.approved_at)):''));
  return p.join(' - ');
}
function custNote(c){
  if(!c)return 'this customer record cannot be read';
  var addrs=CUSTADDR[c.id]||[];
  var bills=addrs.filter(function(a){return a.addr_type==='Billing';});
  var billLive=bills.filter(function(a){return a.is_default;})[0]||bills[0]||null;

  var forThisQuote=!!(Q&&Q.customer_id===c.id);
  var S=(forThisQuote&&DOCSNAP&&typeof DOCSNAP==='object')?DOCSNAP:null;
  var snapCust=(S&&S.customer&&typeof S.customer==='object')?S.customer:null;
  var frozen=!!snapCust;                               
  /* GSTIN */
  var gstin=frozen?(snapCust.gstin||null):(c.gstin||null);

  var addrTxt=frozen?snapAddrLine(S.bill_to_address):null;
  if(addrTxt===null&&!frozen)addrTxt=snapAddrLine(billLive);

  var ptTxt=null;
  if(frozen&&S.payment_terms&&S.payment_terms.label)ptTxt=S.payment_terms.label;
  else if(frozen&&S.payment_terms&&S.payment_terms.code)ptTxt=String(S.payment_terms.code);
  else if(!frozen&&c.terms_code)ptTxt=String(codeLabel(c.terms_code)).replace(/<[^>]+>/g,'');

  var snap=(forThisQuote&&Q.customer_tally_alias)?Q.customer_tally_alias:null;

  var out='<b>'+esc(c.customer_code)+'</b> · '+esc(c.status)+' · '+esc(gateWord(c))+
    (c.district?' · '+esc(c.district):'')+

    (gstin?(' · GSTIN <b class="m01v">'+esc(gstin)+'</b>'):' · <span class="na">GSTIN not available</span>')+
    ((c.credit_days!==null&&c.credit_days!==undefined)?' · '+esc(String(c.credit_days))+' credit days':'')+
    (c.ccr_emp?' · CCR '+esc(empName(c.ccr_emp)):'')+
    (snap&&c.tally_alias&&c.tally_alias!==snap
      ? ' <span class="flag" title="Master now reads '+esc(c.tally_alias)+'">accounts name differs from master</span>' : '');

  if(forThisQuote){
    var provTail=(frozen?'frozen on this quote':(Q.status&&Q.status!=='Draft'
         ?(''+(DOCSNAPERR?(' (not available)'):''))
         :''));
    if(provTail)out+=' · <span style="opacity:.8">'+provTail+'</span>';
  }
  if(frozen&&gstin&&c.gstin&&c.gstin!==gstin)out+=' <span class="flag" title="Master now reads GSTIN '+esc(c.gstin)+'">GSTIN differs from master</span>';
  return out;
}

function refNorm(r){
  if(!r)return null;
  if(r.incentive_pct!==null&&r.incentive_pct!==undefined)return Number(r.incentive_pct);
  if(r.commission_pct!==null&&r.commission_pct!==undefined)return Number(r.commission_pct);
  if(r.default_commission_pct!==null&&r.default_commission_pct!==undefined)return Number(r.default_commission_pct);
  return null;
}
function refTds(r){
  if(!r)return null;
  return (r.tds_pct!==null&&r.tds_pct!==undefined)?Number(r.tds_pct):null;
}
function refInfoHtml(refRow,refCur,ed){
  if(!refRow)return refCur?'<span class="na">this referrer is no longer active</span>':'<span class="na">no referrer on this quote</span>';
  var p=refNorm(refRow), t=refTds(refRow);

  return esc(refRow.name)+(refRow.referrer_type?' · '+esc(refRow.referrer_type):'')+
    (p!==null?(' · usual rate <b>'+esc(String(p))+'%</b>'+
       ((ed&&Number(Q.deal_commission_pct||0)!==Number(p))?' <button class="link-btn" onclick="applyRefRate('+Number(p)+')">use this rate</button>':''))
             :' · <span class="na">usual rate not available</span>')+
    (t!==null?(' · TDS <b>'+esc(String(t))+'%</b>'):' · <span class="na">TDS not available</span>');
}

var REF_SEARCH_FIELDS=[
  {n:'name',   g:function(r){return r.name;}},
  {n:'code',   g:function(r){return r.id;}},
  {n:'type',   g:function(r){return r.referrer_type;}},
  {n:'mobile', g:function(r){return r.mobile;}},
  {n:'email',  g:function(r){return r.email;}},
  {n:'PAN',    g:function(r){return r.pan;}},
  {n:'GSTIN',  g:function(r){return r.gstin;}}
];
function searchFields(defs){ return defs.map(function(f){return f.n;}).join(' / '); }
function fieldMatch(defs,row,v){
  return defs.some(function(f){ return String(f.g(row)||'').toLowerCase().indexOf(v)>=0; });
}
function refMatch(r,v){ return fieldMatch(REF_SEARCH_FIELDS,r,v); }
function refHitHtml(r,pickJs){
  var p=refNorm(r);
  return '<button class="hit" onclick="'+pickJs+'"><b>'+esc(r.name)+'</b> · '+esc(r.id)+
    (r.referrer_type?' · '+esc(r.referrer_type):'')+(r.mobile?' · '+esc(r.mobile):'')+
    (p!==null?' · usual rate '+esc(String(p))+'%':'')+'</button>';
}
function refType(){
  var el=document.getElementById('refTA'); if(!el)return;
  var v=(el.value||'').trim().toLowerCase();
  var box=document.getElementById('refHits'); if(!box)return;
  if(v.length<1){
    box.style.display='none'; box.innerHTML='';

    var refHeld=(hdrPatch.hasOwnProperty('referrer_id')?hdrPatch.referrer_id:(Q&&Q.referrer_id))||'';
    if(refHeld)clearReferrer();
    return;
  }

  var all=REFERRERS.filter(function(r){return refMatch(r,v);});
  var hits=all.slice(0,SEARCH_CAP);
  box.style.display='block';
  box.innerHTML=hits.length
    ? hits.map(function(r){return refHitHtml(r,'pickRef(\''+esc(r.id)+'\')');}).join('')+capNote(all.length)
    : '<div class="hint" style="padding:6px 9px">no active referrer matches</div>';   
}
function pickRef(id){
  var r=REFMAP[id]; if(!r)return;
  var box=document.getElementById('refHits'); if(box){box.style.display='none';box.innerHTML='';}
  var el=document.getElementById('refTA'); if(el)el.value=r.name;
  markHdr('referrer_id',id);
  var info=document.getElementById('refInfo'); if(info)info.innerHTML=refInfoHtml(r,id,canEditHeader(Q));

  var p=refNorm(r);
  var dc=document.getElementById('dealComm');
  var cur=(hdrPatch.hasOwnProperty('deal_commission_pct')?hdrPatch.deal_commission_pct:Q.deal_commission_pct);
  if(p!==null&&(cur===null||cur===undefined||cur===''||Number(cur)===0)){
    if(dc)dc.value=String(p);
    markHdr('deal_commission_pct',String(p));
    toast('Deal commission prefilled at '+p+'%.','ok');
  } else {
    toast('Referrer set to '+r.name+'. Save to keep it.','ok');
  }

var ADDHERE=null, ADDA=null, ADDC={};
function openAddHere(k){
  ADDHERE=(ADDHERE===k?null:k);
  ADDA=(ADDHERE==='ship')?RKF.addr.blank('Shipping',false):null; ADDC={};
  renderWorkspace(); mountWsFields();
  var e=document.getElementById(ADDHERE==='ship'?'ahline1':'acname'); if(e)e.focus();
}
function ahSet(k,v){ if(ADDA)ADDA[k]=v; }
function acSet(k,v){ ADDC[k]=v; }
function ahPin(v){ if(!ADDA)return; ADDA.pincode=v;
  RKF.addr.pin(SB,ADDA,function(h){ if(!h)toast('Pincode not in the postal master.','warn');
    renderWorkspace(); mountWsFields(); }); }
async function saveAddShip(){
  var btn=document.getElementById('ahSave');
  await saveGuard(btn,'Adding…',async function(){
    var slot=document.getElementById('ahErr');
    try{
      var bad=RKF.addr.check(ADDA);
      if(bad)throw envErr('VALIDATION',bad,null);
      var p=RKF.addr.payload(ADDA);
      p.from_document=Q.id; p.p_app_key=appKey('addship:'+Q.id+':'+(ADDA.line1||'')+(ADDA.pincode||''));
      var r=await SB.rpc('m01_address_add',{p_customer:Q.customer_id,p:p,p_by_emp:actorEmp});
      if(r.error)throw r.error;
      var a=await SB.from('customer_addresses').select('address_id,customer_id,addr_type,pincode,area,district,state,address_line,gst_at_addr,is_default,created_at,created_by,city,address_line2,consignee_name,consignee_contact_name,consignee_mobile').eq('customer_id',Q.customer_id);
      CUSTADDR[Q.customer_id]=a.error?[]:(a.data||[]);
      ADDHERE=null; ADDA=null; markHdr('ship_to_address_id',r.data);
      renderWorkspace(); mountWsFields();
      toast('Ship-to added and selected. Save the quote to keep it.','ok');
    }catch(ex){ if(slot)slot.innerHTML=errBox(ex); else toast(friendlyErrA(ex),'err'); }
  });
}
async function saveAddContact(){
  var btn=document.getElementById('acSave');
  await saveGuard(btn,'Adding…',async function(){
    var slot=document.getElementById('acErr');
    try{
      if(!String(ADDC.name||'').trim())throw envErr('VALIDATION','A contact needs a name.',null);
      if(!/^[6-9][0-9]{9}$/.test(String(ADDC.mobile||'')))throw envErr('VALIDATION','Mobile must be 10 digits starting 6 to 9.',null);
      var p={from_document:Q.id,p_app_key:appKey('addcon:'+Q.id+':'+ADDC.mobile),
             name:RKF.inputLaw.pc(ADDC.name),mobile:ADDC.mobile,email:ADDC.email||''};
      var r=await SB.rpc('m01_contact_add',{p_customer:Q.customer_id,p:p,p_by_emp:actorEmp});
      if(r.error)throw r.error;
      var ct=await SB.from('customer_contacts').select('contact_id,customer_id,name,mobile,email,role,is_primary,created_at,created_by').eq('customer_id',Q.customer_id);
      CUSTCON[Q.customer_id]=ct.error?[]:(ct.data||[]);
      ADDHERE=null; ADDC={}; markHdr('ship_contact_id',r.data);
      renderWorkspace(); mountWsFields();
      toast('Contact added and selected. Save the quote to keep it.','ok');
    }catch(ex){ if(slot)slot.innerHTML=errBox(ex); else toast(friendlyErrA(ex),'err'); }
  });
}

function gcList(){ return (LISTS[LIST.CHARGE]||[]); }
function chargesEditable(){
  return !!Q&&!isTerminal(Q.status)&&!isFrozen(Q)&&can(CAP.EDIT);
}
function chargesBlockReason(){
  if(!Q)return "";
  if(isTerminal(Q.status))return "This quote is "+Q.status+", so its charges cannot be changed.";
  if(isFrozen(Q))return "Charges are locked.";   
  if(!can(CAP.EDIT))return capWhy(CAP.EDIT,"edit a quote");
  return "";
}

  var TAIL='</div></div></div></div>';
  if(masterErr('lists'))
    return h+'<div class="ro"><span class="na">'+esc(masterWhy('lists','The list of charges'))+'</span></div>'+TAIL;
  var list=gcList();
  if(!list.length)
    return h+'<div class="ro"><span class="na">no charge list is published</span></div>'+TAIL;   
  var ed=chargesEditable();
  var storedTotal=0; HCROWS.forEach(function(r){ storedTotal+=Number(r.amount||0); });
  if(hcDraft===null){

    h+='<div class="ro">';
    if(HCROWS.err)h+='<span class="na">The charges could not be read.</span>';
    else if(!HCROWS.length)h+='<span class="na">no charges on this quote</span>';   
    else h+=HCROWS.map(function(r){
      return '<span style="margin-right:14px"><b>'+esc(labelOf(r.charge_code)||r.charge_code)+'</b> ('+esc(r.charge_code)+') '+rsPlain(r.amount)+'</span>';
    }).join('')+' &middot; total <b>'+rsPlain(storedTotal)+'</b>';
    h+='</div>';
    h+='<div style="margin-top:6px"><button class="btn btn-g btn-sm" id="btnEditCharges" onclick="startChargesEdit()"'+
       (ed?'':' disabled title="'+esc(chargesBlockReason())+'" aria-describedby="hcWhy"')+'>&#9998; Edit charges</button>'+
       (ed?'':'<span class="vh" id="hcWhy">'+esc(chargesBlockReason())+'</span>')+'</div>';

    return h+TAIL;
  }

  function codeOpts(cur,usedElsewhere){
    var hh='<option value=""'+(cur?'':' selected')+'>- pick a charge -</option>';
    list.forEach(function(v){
      if(usedElsewhere.indexOf(v.code)>=0&&v.code!==cur)return;
      hh+='<option value="'+esc(v.code)+'"'+(cur===v.code?' selected':'')+'>'+esc(v.code+' · '+(v.label||v.code))+'</option>';
    });
    if(cur&&!list.filter(function(v){return v.code===cur;}).length)
      hh+='<option value="'+esc(cur)+'" selected>'+esc(cur)+' — retired</option>';   
    return hh;
  }
  hcDraft.forEach(function(row,i){
    var used=hcDraft.filter(function(x,j){return j!==i&&x.code;}).map(function(x){return x.code;});
    h+='<div class="hcrow">'+
       '<select class="in" id="hcCode-'+i+'" onchange="chgCode('+i+',this.value)" aria-label="Charge code">'+codeOpts(row.code,used)+'</select>'+
       '<input class="in" id="hcAmt-'+i+'" type="number" min="0" step="0.01" value="'+esc(row.amount===''?'':String(row.amount))+'" onchange="chgAmt('+i+',this.value)" aria-label="Charge amount" placeholder="amount"/>'+
       '<button class="iconbtn d" id="hcDel-'+i+'" onclick="removeChargeRow('+i+')">&#128465;</button>'+
       '</div>';
  });
  var canAdd=hcDraft.length<list.length;
  h+='<div class="hcrow">'+
     '<button class="iconbtn" id="btnAddCharge" onclick="addChargeRow()"'+(canAdd?'':' disabled title="Every published charge is already on the set."')+'>+ Add a charge</button>'+
     '<span class="hint" style="margin:0">draft total <b id="hcDraftTotal">'+rsPlain(hcDraftTotal())+'</b></span>'+
     '<span style="flex:1"></span>'+
     '<button class="btn btn-g btn-sm" id="btnCancelCharges" onclick="cancelCharges()">Cancel</button>'+
     '<button class="btn btn-p btn-sm" id="btnSaveCharges" onclick="saveCharges()">Save charges</button>'+
     '</div>';

  return h+TAIL;
}
function hcDraftTotal(){
  var t=0; (hcDraft||[]).forEach(function(r){ if(r.amount!==''&&!isNaN(Number(r.amount)))t+=Number(r.amount); });
  return t;
}
function startChargesEdit(){
  if(!chargesEditable()){ toast(chargesBlockReason(),"err"); return; }
  hcDraft=HCROWS.map(function(r){return {code:r.charge_code,amount:Number(r.amount||0)};});
  renderWorkspace(); renderWsActions();
}
function cancelCharges(){ hcDraft=null; renderWorkspace(); renderWsActions(); }
function chgCode(i,v){ if(hcDraft&&hcDraft[i])hcDraft[i].code=v; renderWorkspace(); }
function chgAmt(i,v){ if(hcDraft&&hcDraft[i])hcDraft[i].amount=(v===''?'':Number(v));
  var e=document.getElementById('hcDraftTotal'); if(e)e.innerHTML=rsPlain(hcDraftTotal()); }
function addChargeRow(){
  if(!hcDraft)return;
  var used=hcDraft.map(function(x){return x.code;});
  var free=gcList().filter(function(v){return used.indexOf(v.code)<0;});
  hcDraft.push({code:(free.length?free[0].code:''),amount:''});
  renderWorkspace();
}
function removeChargeRow(i){ if(!hcDraft)return; hcDraft.splice(i,1); renderWorkspace(); }

function gateOf(c){
  if(!c)return {level:'ok',word:''};
  var g=GATE[c.status], l=g?(g.quote||'ok'):'ok', w='is '+c.status;
  if(c.credit_hold){ var h=GATE['Credit-hold'], hl=h?(h.quote||'ok'):'ok';
    if((hl==='block'&&l!=='block')||(hl==='warn'&&l==='ok')){ l=hl; w='is on credit hold'; } }
  return {level:l, word:w};
}
function gateLevel(c){ return gateOf(c).level; }
function gateIs(c){ return gateOf(c).word; }
function gateWord(c){
  var l=gateLevel(c);
  return l==='block'?'cannot be quoted right now':(l==='warn'?'can be quoted, with a caution':'clear to quote');
}
function gateBanner(c){
  if(!c)return '';
  var l=gateLevel(c);
  if(l==='block')
    return '<div class="wbanner hard" style="margin-top:9px"><b>'+esc(c.name)+' '+esc(gateIs(c))+', so this quote cannot be sent or marked won.</b></div>';
  if(l==='warn')

    return '<div class="wbanner soft" style="margin-top:9px"><b>'+esc(c.name)+' '+esc(gateIs(c))+'</b> — quoting is allowed.</div>';
  if(c.credit_hold)
    return '<div class="wbanner soft" style="margin-top:9px"><b>'+esc(c.name)+' is on credit hold</b> — quoting is allowed.</div>';
  return '';
}
function progressBlockReason(q){
  var c=custOf(q); if(!c)return '';
  if(gateLevel(c)==='block')return c.name+' '+gateIs(c)+'.';
  if(String(c.status||'').toLowerCase()==='pending')return c.name+' is awaiting approval as a customer — the quote cannot be sent or marked won yet.';
  return '';
}

var CUST_SEARCH_FIELDS=[
  {n:'name',     g:function(c){return c.name;}},
  {n:'code',     g:function(c){return c.customer_code;}},
  {n:'GSTIN',    g:function(c){return c.gstin;}},
  {n:'PAN',      g:function(c){return c.pan;}},
  {n:'mobile',   g:function(c){return c.mobile;}},
  {n:'city',     g:function(c){return c.city;}},
  {n:'district', g:function(c){return c.district;}}
];
function custMatch(c,v){ return fieldMatch(CUST_SEARCH_FIELDS,c,v); }
function custHitHtml(c,pickJs){
  return '<button class="hit" onclick="'+pickJs+'"><b>'+esc(c.name)+'</b> · '+esc(c.customer_code)+' · '+esc(c.status)+
    (c.district?' · '+esc(c.district):'')+(c.mobile?' · '+esc(c.mobile):'')+(c.gstin?' · '+esc(c.gstin):'')+'</button>';
}
function custType(){
  var el=document.getElementById("custTA"); if(!el)return;
  var v=(el.value||"").trim().toLowerCase();
  var box=document.getElementById("custHits");
  if(v.length<1){ box.style.display='none'; box.innerHTML=''; return; }

  var all=CUSTS.filter(function(c){return c.partner_side!=='Creditor'&&custMatch(c,v);});
  var hits=all.slice(0,SEARCH_CAP);
  box.style.display='block';
  box.innerHTML=hits.length
    ? hits.map(function(c){return custHitHtml(c,'pickCust(\''+esc(c.id)+'\')');}).join('')+capNote(all.length)
    : '<button class="hit mk" onclick="openInlineCreate()">No match — create this customer</button>';
}
function pickCust(id){
  var c=CUSTMAP[id]; if(!c)return;
  document.getElementById("custHits").style.display='none';
  var note=document.getElementById("custPickNote");
  if(c.id===Q.customer_id){
    document.getElementById("custTA").value=c.name;
    if(note)note.innerHTML='<b>'+esc(c.customer_code)+'</b> · '+esc(c.status)+' · '+esc(gateWord(c));
    return;
  }
  document.getElementById("custTA").value=custName(Q);
  if(note)note.innerHTML='<span style="color:var(--accent)">The customer cannot change. Raise a new quote.</span>';
  toast("The customer cannot change. Raise a new quote.","warn");
}
</script>
<script>

function linesEditable(){
  if(!Q)return false;
  if(isTerminal(Q.status)||isFrozen(Q))return false;   
  return can(CAP.PRICE);
}
function lineBlockReason(){
  if(!Q)return "Open a quote first.";

  if(isTerminal(Q.status))return "This quote is "+Q.status+", so its lines cannot be changed.";
  if(isFrozen(Q))return "This quote is "+Q.status+". Lines are locked.";
  if(!can(CAP.PRICE))return capWhy(CAP.PRICE,"price a quote line");
  return "";
}

function notPriced(l){
  return l.pricing_stale===true
      || l.rate===null||l.rate===undefined||Number(l.rate)===0
      || l.amount===null||l.amount===undefined||Number(l.amount)===0;
}
function unpricedLines(){
  return LINES.filter(notPriced);
}

function persistedRefusalReason(l){
  var r=l&&l.price_refusal_reason;
  return (r===null||r===undefined)?'':String(r);
}
function lp(id,k,fallback){ return (linePatch[id]&&linePatch[id].hasOwnProperty(k))?linePatch[id][k]:fallback; }

var LINE_DEBOUNCE_MS=300;      
var NEWKEY='__new__';          
var lineDeb={};                
var lineSeq={};                
var lineVer={};                
var lineState={};              
var TEMPROW=null;              

var LINE_REASON={ qty:'User Changed Qty', customer_length:'User Changed Length',
  disc:'User Changed Discount', item_id:'User Changed Item', customer_uom:'User Changed UOM',
  quoted_uom:'User Changed UOM', sw_basis:'User Changed SW', sw_value:'User Changed SW',
  rate:'User Changed Rate', clear_rate_override:'User Changed Rate' };
var NEW_LINE_REASON='New Line', AUTO_REPRICE_REASON='Auto Reprice';

var LINE_NUMERIC=['qty','customer_length','disc','sw_value','rate'];
var LINE_CLEARED={cleared:true};   
function lineVal(k,v){
  if(k==='clear_rate_override')return true;
  if(v===undefined)return undefined;                                          
  if(v===''||v===null)return (LINE_NUMERIC.indexOf(k)>=0)?LINE_CLEARED:null;  /* emptied on purpose */
  return (LINE_NUMERIC.indexOf(k)>=0)?Number(v):v;
}

function lineStateWord(s){
  return s==='CALCULATING'?'working it out'
       :(s==='PRICED'?'priced'
       :(s==='UNABLE_TO_PRICE'?'cannot be priced'
       :'not complete yet'));
}
function lineStateCls(s){
  return s==='CALCULATING'?'calc':(s==='PRICED'?'pr':(s==='UNABLE_TO_PRICE'?'no':'inc'));
}
function paintState(key,s,why){
  lineState[key]={s:s,why:why||''};
  var el=document.getElementById('lst-'+key);
  if(el){ el.className='lst '+lineStateCls(s); el.textContent=lineStateWord(s); }
  var w=document.getElementById('lwhy-'+key);
  if(w)w.innerHTML=why?msym(wordy(why),'warn'):'';
}
function stateBadgeHtml(key){
  var st=lineState[key]||{s:'',why:''};
  var s=st.s||'';
  return '<div><span class="lst '+lineStateCls(s)+'" id="lst-'+esc(key)+'">'+esc(s?lineStateWord(s):'')+'</span>'+
         '<div class="lstwhy" id="lwhy-'+esc(key)+'">'+(st.why?msym(wordy(st.why),'warn'):'')+'</div></div>';
}

function keyPending(id,k){
  if(linePatch[id]&&linePatch[id].hasOwnProperty(k))return true;
  var d=lineDeb[id];
  return !!(d&&d.patch&&d.patch.hasOwnProperty(k));
}

function paintLengthReq(id){
  var l=lineOf(id); if(!l)return;
  var need=lengthRequired(l);
  var rq=document.getElementById('clenrq-'+id);
  if(rq){
    rq.textContent=need?'*':'';
    if(need)rq.setAttribute('title','A Length unit needs the customer length.');
    else rq.removeAttribute('title');
  }
  var box=document.getElementById('clen-'+id);
  if(box){ if(need)box.setAttribute('aria-required','true'); else box.removeAttribute('aria-required'); }
}

function paintLineRow(l,refused){
  if(!l||!l.id)return;
  var id=l.id, cost=canCost(), act=document.activeElement;
  function set(sfx,html){ var e=document.getElementById(sfx+'-'+id); if(e)e.innerHTML=html; }
  set('ltq',(l.quoted_total_qty===null||l.quoted_total_qty===undefined)?'<span class="na">not available</span>':num(l.quoted_total_qty,3));
  set('lamt',(l.amount===null||l.amount===undefined)?'<span class="na">not available</span>':rs(l.amount));
  set('lgst',(l.applied_gst_rate!==null&&l.applied_gst_rate!==undefined)
      ?'GST '+esc(String(l.applied_gst_rate))+'%'
      :'GST: <span class="na">not available</span>');
  if(cost){
    set('lcost',(l.cost===null||l.cost===undefined)?'<span class="na">not available</span>':rs(l.cost));
    set('lmg',(l.margin===null||l.margin===undefined)?'<span class="na">not available</span>':rs(l.margin));
  }
  set('lrflag',rateFlagHtml(l,linesEditable()));
  set('ldflag',discFlagHtml(l));

  set('lswflag',swFlagHtml(l,ITEMMAP[l.item_id]));

  var st=lineState[id];
  if(st)paintState(id,st.s||'',st.why||'');

  [{box:'rate-',key:'rate',stored:l.rate},
   {box:'cqty-',key:'qty', stored:l.customer_qty}].forEach(function(f){
    var e=document.getElementById(f.box+id);
    if(!e||e===act)return;
    if(keyPending(id,f.key))return;              
    e.value=(f.stored===null||f.stored===undefined)?'':String(f.stored);
  });
  paintLengthReq(id);                            

  var dsc=document.getElementById('disc-'+id);
  if(!refused&&dsc&&dsc!==act&&!keyPending(id,'disc'))
    dsc.value=(l.discount_pct===null||l.discount_pct===undefined)?'':String(l.discount_pct);
}

function paintTotals(totals,flags){
  if(totals&&typeof totals==='object'){
    ['sub_total','cgst','sgst','igst','round_off','grand_total','total_weight_mt',
     'blended_rate_per_kg','total_commission','supply_type'].forEach(function(k){
      if(totals[k]!==undefined)Q[k]=totals[k];
    });
    if(totals.other_charges!==undefined)Q.other_charges_amount=totals.other_charges;
    if(totals.freight!==undefined)Q.freight_amount=totals.freight;
    if(totals.insurance!==undefined)Q.insurance_amount=totals.insurance;
  }
  if(flags&&typeof flags==='object'){
    ['pricing_status','has_unpriced_lines','unpriced_line_count','totals_dirty'].forEach(function(k){
      if(flags[k]!==undefined)Q[k]=flags[k];
    });
  }

  if(flags&&flags.quote_updated_at)Q.updated_at=flags.quote_updated_at;
  var t=document.getElementById('totBand'); if(t)t.outerHTML=zTotals();
  var lh=document.getElementById('lineBandHint'); if(lh)lh.innerHTML=lineBandHint();

  var ib=document.getElementById('idBar'); if(ib)ib.outerHTML=zIdBar();

  paintDealDerived();
  renderWsActions();
}

function queueLineSave(key,patch,reason){
  if(!linesEditable()){ toast(lineBlockReason(),"err"); return; }
  var d=lineDeb[key]; if(!d)d=lineDeb[key]={t:null,patch:{},reason:reason};
  Object.keys(patch).forEach(function(k){ d.patch[k]=patch[k]; });
  d.reason=reason;
  paintState(key,'CALCULATING','');
  if(d.t)clearTimeout(d.t);
  d.t=setTimeout(function(){ runLineSave(key); },LINE_DEBOUNCE_MS);
}

async function refreshLineCz(lineId){
  if(!lineId||!Q)return;
  if(!(CUSTOMIZ[lineId]||[]).length)return;        
  var r=await SB.from('quote_line_customization').select('id,quote_line_id,created_at,created_by,calculation_method,customization_qty,cust_code,sub_line_no,asked_values,manual_unit_price').eq('quote_line_id',lineId);
  if(r.error||!r.data)return;                      
  CUSTOMIZ[lineId]=r.data;
  var l=null; for(var i=0;i<LINES.length;i++){ if(LINES[i].id===lineId){ l=LINES[i]; break; } }
  if(!l)return;
  var cost=canCost();
  r.data.forEach(function(cz){
    var d=document.getElementById('czdesc-'+cz.id); if(d)d.innerHTML=czDescHtml(l,cz,null,cost,true);
    var a=document.getElementById('czamt-'+cz.id);  if(a)a.innerHTML=czCharge(cz);
  });
}
async function runLineSave(key){
  var d=lineDeb[key]; if(!d)return;
  if(d.t){ clearTimeout(d.t); d.t=null; }
  var patch=d.patch, reason=d.reason;
  delete lineDeb[key];
  if(!Q||!needActor())return;
  var seq=(lineSeq[key]=(lineSeq[key]||0)+1);
  var body={p_actor_emp:actorEmp,p_app_key:uuid4(),quote_id:Q.id,reason:reason};
  var src=(key===NEWKEY&&TEMPROW)?TEMPROW.fields:patch;   
  Object.keys(src).forEach(function(k){
    var v=lineVal(k,src[k]);
    if(v===undefined)return;                    
    if(v===LINE_CLEARED){

      if(key===NEWKEY)return;
      body[k]=null; return;
    }
    body[k]=v;
  });
  if(key!==NEWKEY)body.line_id=key;
  var env;
  try{ env=await callA('rpc_line_save',body); }
  catch(ex){
    if(seq!==lineSeq[key])return;                 

    var rd=(ex&&ex.rpcData)||null;
    var rl=(rd&&rd.line&&rd.line.id)?rd.line:null;

    delete linePatch[key];
    if(rl){
      for(var ri=0;ri<LINES.length;ri++){ if(LINES[ri].id===rl.id){ LINES[ri]=rl; break; } }
      if(linePatch[rl.id])delete linePatch[rl.id];
      paintLineRow(rl,true);          
    }

    else if(key!==NEWKEY){
      var known=lineOf(key);
      if(known)paintLineRow(known,true);
    }
    flagDirty();

    var rwhy=(rd&&rd.reason)?wordy(rd.reason):friendlyErrA(ex);
    paintState(key,'UNABLE_TO_PRICE',rwhy);
    if(ex&&ex.rpcCode==='M06_UNPRICEABLE_LINE')
      openModal("This line could not be priced",unpriceableBox(ex)+
        '',
        [{t:"Close",c:"btn-g",f:"closeModal()"}]);
    else toast(rwhy,"err");
    return;
  }
  if(seq!==lineSeq[key])return;                   
  var dta=(env&&env.data&&typeof env.data==='object')?env.data:{};
  var f=(dta.flags&&typeof dta.flags==='object')?dta.flags:{};
  var line=dta.line||null;

  if(line&&line.id){ noteCeiling(line.id,line); noteCeiling(line.id,f); noteCeiling(line.id,dta.pricing); }

  if(f.replay_needs_refresh===true){ await refreshQuote(); return; }
  if(f.persisted!==true){

    paintState(key,f.line_state||'INCOMPLETE',f.line_state_reason||'');
    return;
  }
  if(line&&f.line_version!==undefined&&f.line_version!==null){
    var painted=lineVer[line.id];
    if(painted!==undefined&&Number(f.line_version)<=Number(painted))return;   
    lineVer[line.id]=f.line_version;
  }
  if(key===NEWKEY){

    TEMPROW=null; delete lineState[NEWKEY]; delete lineVer[NEWKEY]; delete lineSeq[NEWKEY]; NR_ITEM=null;
    if(line){ LINES.push(line); LINES.sort(function(a,b){return (a.line_no||0)-(b.line_no||0);});
      lineState[line.id]={s:f.line_state||'',why:f.line_state_reason||''};
      lineVer[line.id]=f.line_version; }
    paintTotals(dta.totals,f);
    var lb=document.getElementById('lineBand'); if(lb)lb.outerHTML=zLines();
    if(f.line_state==='UNABLE_TO_PRICE')toast("Line added. "+wordy(f.line_state_reason||'It could not be priced yet.'),"warn");
    return;
  }
  if(line){
    for(var i=0;i<LINES.length;i++){ if(LINES[i].id===line.id){ LINES[i]=line; break; } }
    if(linePatch[line.id])delete linePatch[line.id];      
    paintLineRow(line);
  }
  paintState(key,f.line_state||'',f.line_state_reason||'');
  paintTotals(dta.totals,f);
  flagDirty();

  if(line&&line.id)await refreshLineCz(line.id);
}

async function flushLineSaves(){
  var keys=Object.keys(lineDeb);
  for(var i=0;i<keys.length;i++){ await runLineSave(keys[i]); }
}

var NR_OFF=false;   
function dropTempRow(){
  if(lineDeb[NEWKEY]&&lineDeb[NEWKEY].t)clearTimeout(lineDeb[NEWKEY].t);
  delete lineDeb[NEWKEY]; delete lineState[NEWKEY]; delete lineSeq[NEWKEY]; delete lineVer[NEWKEY];
  TEMPROW=null;
  NR_ITEM=null;
  NR_OFF=false;                       
}

function nrTyped(){
  return ['nrItem','nrLen','nrQty','nrDisc','nrCuom','nrQuom','nrSwv'].some(function(id){
    var e=document.getElementById(id);
    return !!(e&&String(e.value||'').trim());
  });
}
function clearTempRow(){
  var had=!!(TEMPROW&&TEMPROW.fields&&Object.keys(TEMPROW.fields).length)||!!NR_ITEM||nrTyped();
  dropTempRow();
  if(had){
    var row=document.getElementById('nrRow');
    if(row)row.outerHTML=nrRowHtml(canCost());
    else { var lb0=document.getElementById('lineBand'); if(lb0)lb0.outerHTML=zLines(); }
    flagDirty();
    toast("The new row was cleared. Nothing was saved.","ok");
    return;
  }

  NR_OFF=true;
  var lb=document.getElementById('lineBand'); if(lb)lb.outerHTML=zLines();
}

function restoreTempRow(){
  NR_OFF=false;
  var lb=document.getElementById('lineBand'); if(lb)lb.outerHTML=zLines();
  setTimeout(function(){ var i=document.getElementById('nrItem'); if(i)i.focus(); },0);
}

function lineEdit(id,k,v,reason){
  (linePatch[id]=linePatch[id]||{})[k]=v;               
  if(k==='rate'&&linePatch[id].clear_rate_override)delete linePatch[id].clear_rate_override;
  var p={}; p[k]=v;
  queueLineSave(id,p,reason||LINE_REASON[k]||'Auto Reprice');

  if(k==='customer_uom'||k==='quoted_uom')paintLengthReq(id);
  flagDirty();
}

function tempEdit(k,v){
  if(!TEMPROW)TEMPROW={fields:{}};
  TEMPROW.fields[k]=v;
  queueLineSave(NEWKEY,TEMPROW.fields,NEW_LINE_REASON);
}

async function refreshQuoteCz(){
  if(!Q||!LINES.length)return;
  var ids=LINES.map(function(x){return x.id;}).filter(Boolean);
  if(!ids.length)return;
  var r=await SB.from('quote_line_customization').select('id,quote_line_id,created_at,created_by,calculation_method,customization_qty,cust_code,sub_line_no,asked_values,manual_unit_price').in('quote_line_id',ids);
  if(r.error||!r.data)return;
  var next={};

async function autoReprice(quiet){
  if(!Q||!LINES.length)return;
  if(!linesEditable())return;
  for(var i=0;i<LINES.length;i++){
    var l=LINES[i];

    var seq=(lineSeq[l.id]=(lineSeq[l.id]||0)+1);
    try{
      var env=await callA('rpc_line_save',{p_actor_emp:actorEmp,p_app_key:uuid4(),
                                           quote_id:Q.id,line_id:l.id,reason:AUTO_REPRICE_REASON});
      if(seq!==lineSeq[l.id])continue;              
      var dta=(env&&env.data)||{}, f=(dta.flags&&typeof dta.flags==='object')?dta.flags:{};
      if(dta.line){
        var painted=lineVer[dta.line.id];
        if(painted!==undefined&&f.line_version!==undefined&&f.line_version!==null
           &&Number(f.line_version)<Number(painted))continue;   
        LINES[i]=dta.line;
        if(f.line_version!==undefined&&f.line_version!==null)lineVer[dta.line.id]=f.line_version;
        lineState[dta.line.id]={s:f.line_state||'',why:f.line_state_reason||''};
      }

      if(i===LINES.length-1)paintTotals(dta.totals,f);
    }catch(ex){
      if(seq!==lineSeq[l.id])continue;              
      lineState[l.id]={s:'UNABLE_TO_PRICE',why:friendlyErrA(ex)};
      if(!quiet)toast('Line '+lineNoOf(l.id)+': '+friendlyErrA(ex),"err");
    }
  }
  await refreshQuoteCz();        
  var lb=document.getElementById('lineBand'); if(lb)lb.outerHTML=zLines();
  renderWsActions();
  if(!quiet)toast("Prices brought up to date.","ok");
}

  DIRECT_UOM_PRICE:"the price list for this unit",

function priceWhy(l){

function czValues(cz){
  var vals=cz.asked_values||{};
  var out=Object.keys(vals).sort().map(function(k){
    var name=specName(k);
    var raw=vals[k], num='', uomc='';
    if(raw&&typeof raw==='object'&&!Array.isArray(raw)){
      num=(raw.v===null||raw.v===undefined)?'':raw.v;      
      uomc=(raw.u===null||raw.u===undefined)?'':raw.u;     
    }else{
      num=(raw===null||raw===undefined)?'':raw;

    return (name?name+' ':'')+num+(uomc?(' '+uomc):'');

function wordy(x){
  if(x===null||x===undefined)return "";
  if(typeof x==='string')return x;
  if(typeof x==='object')return String(x.message||x.reason||x.text||x.norm||x.code||JSON.stringify(x));
  return String(x);
}

function gateParts(a){
  if(!a)return null;
  var fs=(a.factor_snapshot&&typeof a.factor_snapshot==='object')?a.factor_snapshot:{};
  var nv=(fs.norms_verdict&&typeof fs.norms_verdict==='object')?fs.norms_verdict:{};
  var lv=(a.levers_snapshot&&typeof a.levers_snapshot==='object')?a.levers_snapshot:{};
  var lnv=(lv.norms_verdict&&typeof lv.norms_verdict==='object')?lv.norms_verdict:{};
  function arr(o,k){var v=o&&o[k];return (Array.isArray(v)&&v.length)?v:null;}
  function n(o,k){return (o&&o[k]!==undefined&&o[k]!==null)?o[k]:null;}
  return {
    breaches: arr(nv,'breaches')||arr(fs,'breaches')||arr(lnv,'breaches')||arr(lv,'breaches')||[],
    warnings: arr(nv,'warnings')||arr(fs,'warnings')||arr(lnv,'warnings')||arr(lv,'warnings')||[],
    ni:       arr(nv,'not_implemented')||arr(fs,'not_implemented')||arr(lnv,'not_implemented')||arr(lv,'not_implemented')||[],
    netMargin:n(nv,'net_margin')!==null?n(nv,'net_margin')
              :(n(fs,'net_margin')!==null?n(fs,'net_margin')
              :(n(lnv,'net_margin')!==null?n(lnv,'net_margin'):n(lv,'net_margin'))),
    verdict:  nv.verdict||lnv.verdict||null,

    reason:   a.why_routed||nv.reason||fs.reason||lnv.reason||lv.reason||nv.why_routed||null,
    why:      a.why_routed||nv.why_routed||null
  };
}

var ATT_KINDS=['BOM','Image','Document'];

var QATT_BUCKET='lead-attachments', QATT_PREFIX='quotes/';
function attPick(){ var f=document.getElementById("attFile"); if(f)f.click(); }
async function attPicked(){
  var el=document.getElementById("attFile");
  var f=el&&el.files&&el.files[0]; if(!f)return;

  var kind=(document.getElementById("attKind")||{}).value||attKindCur();
  ATT_KIND_SEL=kind;
  el.value='';
  if(!needActor())return;
  var btn=document.getElementById("btnAttach");
  await saveGuard(btn,"Attaching…",async function(){
    var path=QATT_PREFIX+Q.id+'/'+Date.now()+'_'+String(f.name).replace(/[^A-Za-z0-9._-]/g,'_');
    try{
      var up=await SB.storage.from(QATT_BUCKET).upload(path,f);
      if(up.error)throw up.error;
    }catch(ex){
      toast("The file was not stored.","err");
      return;
    }
    try{
      var env=await callA('rpc_m06_quote_attachment_add',{p_actor_emp:actorEmp,p_app_key:uuid4(),
        quote_id:Q.id,kind:kind,storage_path:path,file_name:f.name});

      var at=await SB.from('quote_attachments').select('id,quote_id,kind,storage_path,file_name,by_emp,at').eq('quote_id',Q.id).order('at',{ascending:false});
      if(!at.error)ATTACH=at.data||[];
      renderWorkspace();
      okToast(env,"Attached "+f.name+" to this quote.");
    }catch(ex2){
      toast(friendlyErrA(ex2),"err");
    }
  });
}

  bill_to_address_id:"Bill-to address", ship_to_address_id:"Ship-to address",
  bill_contact_id:"Billing contact", ship_contact_id:"Shipping contact",
  grand_total:"Grand total", sub_total:"Sub-total", status:"Status",

function fieldWord(f){

}

  if(!Q){ a.innerHTML='<span class="ctx">'+(openQuoteId?'Loading…':'No quote open.')+'</span>'; return; }
  var ed=canEditHeader(Q);
  var miss=missingMandatory();

  var owner='';
  if(Q.status==='Pending Approval'&&APPRFULL&&!APPRFULL.decided_at)
    owner=' · with <b>'+esc(empName(APPRFULL.approver_emp))+'</b>'+(APPRFULL.tat_due?(', answer due '+esc(stampOf(APPRFULL.tat_due))):'');
  var ctx='<span class="ctx">'+
    '<b>'+esc(Q.quote_no||'(no number)')+'</b> '+statusTag(Q.status)+
    ' · '+LINES.length+' line(s) · <b>'+num(Q.total_weight_mt,3)+'</b> MT · <b>'+(Q.grand_total===null?'not available':rsPlain(Q.grand_total))+'</b>'+
    (Q.totals_dirty?' · <span style="color:var(--warn);font-weight:700">totals not recomputed</span>':'')+
    (miss.length?' · <span style="color:var(--warn);font-weight:700">'+miss.length+' still to fill in</span>':'')+
    (dirty()?' · <span style="color:var(--warn);font-weight:700">unsaved changes</span>':'')+
    owner+
    ' · next: <b>'+esc(nextAction(miss))+'</b>'+
    '</span>';

  var saveLbl=isFrozen(Q)?'Save as new revision':'Save draft &middot; Ctrl+S';

  var missSave=mandatoryMissing('save');
  var saveOk=ed&&savable()&&missSave.length===0;          

  var saveWhy=!ed?editBlockReason(Q):(!savable()?((LINES&&LINES.length)?'':'Nothing entered yet.')
    :(missSave.length?('This quote still needs '+missSave.join(' · ')+'.'):''));

  var missSub=mandatoryMissing('submit');
  var subOk=can(CAP.SUBMIT)&&Q.status==='Draft'&&!Q.totals_dirty&&missSub.length===0;
  var subWhy=!can(CAP.SUBMIT)?capWhy(CAP.SUBMIT,'send a quote for approval')
    :(Q.status!=='Draft'?('Only a draft goes for approval. This is '+Q.status+'.')
    :(missSub.length?('Still needs '+missSub.join(' · ')+'.')
    :(Q.totals_dirty?'The stored totals are out of date.':'')));

  var subTitle=subOk?approverPreviewNames().replace(/<[^>]+>/g,''):subWhy;
  var revOk=can(CAP.REVISE)&&!isTerminal(Q.status)&&isFrozen(Q);
  var revWhy=!can(CAP.REVISE)?capWhy(CAP.REVISE,'raise a revision')
    :(isTerminal(Q.status)?('This quote is '+Q.status+', so it cannot be revised.')
    :('This is '+Q.status+' — edit it directly.'));
  var pb=progressBlockReason(Q);
  var sendOk=can(CAP.TRANSITION)&&Q.status==='Approved'&&!pb;
  var sendWhy=!can(CAP.TRANSITION)?capWhy(CAP.TRANSITION,'move a quote to the next stage')
    :(pb?pb:('Only an approved quote can be sent — this is '+Q.status+'.'));
  var rt=resumeTarget(Q);
  var parked=PARKED.indexOf(Q.status)>=0;
  var resOk=parked&&can(CAP.TRANSITION)&&!!rt;
  var resWhy=!can(CAP.TRANSITION)?capWhy(CAP.TRANSITION,'move a quote to the next stage')
    :'No parked-from status recorded, so it cannot resume.';
  var outOk=can(CAP.TRANSITION)&&!isTerminal(Q.status);
  var outWhy=!can(CAP.TRANSITION)?capWhy(CAP.TRANSITION,'move a quote to the next stage'):('This quote is already closed as '+Q.status+'.');
  var tg=parkTargets(Q.status).filter(function(s){return s!=='Cancelled'||cancelAllowed(Q);});
  var dcOk=can(CAP.TRANSITION)&&!isTerminal(Q.status)&&tg.length>0;
  var dcWhy=!can(CAP.TRANSITION)?capWhy(CAP.TRANSITION,'move a quote to the next stage')
    :(isTerminal(Q.status)?('This quote is already closed as '+Q.status+'.')
    :'Nothing can be parked or cancelled from here.');

  var primaryId=null;
  if(parked){ if(resOk)primaryId='btnResume'; }
  else if(Q.status==='Draft'){ primaryId=saveOk?'btnSave':(subOk?'btnSubmit':null); }
  else if(Q.status==='Approved'){ primaryId=saveOk?'btnSave':(sendOk?'btnSend':(revOk?'btnRevise':null)); }
  else if(Q.status==='Sent'){ primaryId=outOk?'btnOutcome':null; }
  else if(Q.status==='Won'){ primaryId='btnMakeSo'; }     
  function mk(id,label,js,ok,why,title){
    var prim=(id===primaryId&&ok);
    return '<button class="btn '+(prim?'btn-p':(id==='btnDropCancel'?'btn-d':'btn-g'))+'" id="'+id+'"'+(js?' onclick="'+js+'"':'')+
      (ok?(title?' title="'+esc(title)+'"':''):' disabled title="'+esc(why||'')+'" aria-describedby="'+id+'Why"')+'>'+label+'</button>'+
      (ok?'':'<span class="vh" id="'+id+'Why">'+esc(why||'')+'</span>');
  }
  function mi(id,label,js,ok,why){
    return '<button id="'+id+'"'+(js&&ok?' onclick="toggleMoreMenu();'+js+'"':'')+(ok?'':' disabled title="'+esc(why||'')+'"')+'>'+label+'</button>';
  }
  var front=[], more=[];
  var bSave=['btnSave',saveLbl,'saveDraft()',saveOk,saveWhy];

  var bSubmit=['btnSubmit','Submit for approval','submitQuote()',subOk,subOk?subTitle:subWhy];

  var bRevise=['btnRevise','&#8635; Revise','confirmLeave(openRevise)',revOk,revWhy];
  var bSend=['btnSend','&#9993; Send','sendQuote()',sendOk,sendWhy];
  var bResume=['btnResume','&#9654; Resume'+(rt?(' to '+esc(rt)):''),'resumeQuote()',resOk,resWhy];
  var bOutcome=['btnOutcome','&#9873; Mark outcome','openOutcome()',outOk,outWhy];
  var bParkCancel=['btnDropCancel','Park / cancel','openStatusChange()',dcOk,dcWhy];

  var bPdf=['btnDownloadPdf','&#128196; Download PDF','openPdfDownload()',true,''];

  var wdOk=can(CAP.TRANSITION)&&!Q.is_deleted;
  var wdWhy=!can(CAP.TRANSITION)?capWhy(CAP.TRANSITION,'withdraw a quote')
    :'This quote has already been withdrawn.';
  var bWithdraw=['btnWithdraw','&#9003; Withdraw this quote','openWithdraw()',wdOk,wdWhy];
  if(parked){ front=[bResume,bOutcome]; more=[bSave,bParkCancel,bWithdraw,bPdf]; }
  else if(Q.status==='Draft'){ front=[bSave,bSubmit]; more=[bRevise,bOutcome,bParkCancel,bWithdraw,bPdf]; }
  else if(Q.status==='Pending Approval'){ front=[bSave,bParkCancel]; more=[bOutcome,bWithdraw,bPdf]; }
  else if(Q.status==='Approved'){ front=[bSave,bSend,bRevise]; more=[bOutcome,bParkCancel,bWithdraw,bPdf]; }
  else if(Q.status==='Sent'){ front=[bOutcome,bParkCancel]; more=[bRevise,bWithdraw,bPdf]; }

  else if(Q.status==='Won'){ front=[['btnMakeSo','&#10148; Create sale order','openSaleOrderFromQuote()',true,'']]; more=[bPdf,bWithdraw]; }
  else { front=[]; more=[bPdf,bWithdraw]; }               

  if(!can(CAP.EXPORT))more=more.filter(function(b){ return b[0]!=='btnDownloadPdf'; });

  if(can(CAP.CREATE)){
    var newOk=!catBlocked;
    more=more.concat([['btnNewQuoteWs','+ New quote','openNewQuote()',newOk,
      'Reference data has not loaded.']]);
  }

  front=front.concat([['btnCloseWs','Close','closeWorkspace()',true,'']]);
  var h=ctx+'<div style="flex:1"></div>';
  front.forEach(function(b){ h+=mk(b[0],b[1],b[2],b[3],b[4],b[3]?b[4]:null); });
  if(more.length){
    h+='<div class="ddwrap"><button class="btn btn-g" id="btnMore" onclick="toggleMoreMenu()" aria-haspopup="true" aria-expanded="false">More actions &#9662;</button>'+
       '<div class="ddmenu" id="moreMenu">'+more.map(function(b){ return mi(b[0],b[1],b[2],b[3],b[4]); }).join('')+'</div></div>';
  }
  a.innerHTML=h;
}

function placeMenu(btnId,menuId){
  var b=document.getElementById(btnId), m=document.getElementById(menuId);
  if(!b||!m)return;
  var r=b.getBoundingClientRect();
  var vw=window.innerWidth||document.documentElement.clientWidth;
  var vh=window.innerHeight||document.documentElement.clientHeight;
  m.style.left='0px'; m.style.top='0px';                 /* measure unconstrained */
  var w=m.offsetWidth||210, hgt=m.offsetHeight||120;
  var left=Math.min(Math.max(8,r.right-w),Math.max(8,vw-w-8));
  var below=(vh-r.bottom), above=r.top;
  var top=(below>=hgt+8||below>=above)?(r.bottom+4):(r.top-hgt-4);
  top=Math.min(Math.max(8,top),Math.max(8,vh-hgt-8));
  m.style.left=left+'px'; m.style.top=top+'px';
}
function toggleMoreMenu(){
  var m=document.getElementById("moreMenu"); if(!m)return;
  var open=m.classList.toggle("show");
  if(open)placeMenu("btnMore","moreMenu");
  var b=document.getElementById("btnMore"); if(b)b.setAttribute('aria-expanded',open?'true':'false');
}

function askAttr(attr,val){

  if(!attrOK()){ toast(attrWhy(),"err"); attrRepaint(); return; }
  var stored=attrStored(attr);

      '<div class="totrow"><span>Changing to</span><b>'+esc(attrText(attr,val))+'</b></div></div>'+

    '<div class="fg"><label for="atReason">Reason (required)</label>'+
