    '<div id="atErr"></div>',
    [{t:"Leave it as it is",c:"btn-g",f:"cancelAttr()"},{t:"Save the change",c:"btn-p",id:"atBtn",f:"doAttr()"}]);
}

async function doAttr(presetReason){
  if(!attrPending||!Q||!needActor())return;
  var attr=attrPending.attr, val=attrPending.val;
  var box=document.getElementById("atReason");
  var reason=presetReason?String(presetReason)
                         :((box?(box.value||""):"").trim());

  if(!reason){
    var rs0=document.getElementById("atErr");
    if(rs0)rs0.innerHTML='<div class="wbanner hard" style="margin:0">A reason is required for this change.</div>';
    toast("A reason is required for this change.","err");
    return;
  }
  var btn=document.getElementById("atBtn");
  await saveGuard(btn,"Saving…",async function(){
    try{
      var kk='attr:'+Q.id+':'+attr+':'+val;

      var env=await callA('rpc_m06_quote_attribute_change',{
        p_actor_emp:actorEmp, p_app_key:k, quote_id:Q.id,

    }catch(ex){
      var slot=document.getElementById("atErr");
      if(slot)slot.innerHTML=errBox(ex); else toast(friendlyErrA(ex),"err");
      attrRepaint();
    }
  });
}

function cancelAllowed(q){
  if(!q)return false;
  if(q.status==='Draft')return q.created_by===actorEmp||isElevated();
  if(q.status==='Approved'||q.status==='Sent')return isElevated();
  return true;
}

function mandatoryMissing(scope){
  if(!Q)return [];
  var m=[];
  /* what SAVE writes */
  if(!hdrCur('pt',Q.pt_code))m.push('payment terms');
  if(!hdrCur('insurance',Q.insurance_scope))m.push('insurance');
  if(!hdrCur('delivery_scope',Q.delivery_scope))m.push('a delivery scope');  
  if(!Q.validity_days)m.push('validity');

  var _ref=hdrCur('referrer_id',Q.referrer_id);
  var _cm =hdrCur('deal_commission_pct',Q.deal_commission_pct);
  if(_ref&&(_cm===null||_cm===undefined||_cm===''))
    m.push('a referrer commission');
  if(scope==='save')return m;

  if(!Q.customer_id)m.push('a customer');
  if(!LINES.length)m.push('at least one line');
  var _nr=unpricedLines().map(function(l){return l.line_no;});
  if(_nr.length)m.push('a price on line '+_nr.join(', '));                                  

  var noLen=LINES.filter(lengthMissing).map(function(l){return l.line_no;});
  if(noLen.length)m.push('the customer length on line '+noLen.join(', '));
  if(Number(Q.grand_total||0)===0)m.push('a non-zero total');            
  return m;
}
function missingMandatory(){ return mandatoryMissing('submit'); }

function nextAction(miss){
  if(!Q)return '—';
  if(isTerminal(Q.status))return 'nothing — this quote is closed';
  if(miss&&miss.length)return 'fill in '+miss.join(', ');
  if(PARKED.indexOf(Q.status)>=0)return resumeTarget(Q)?('resume to '+resumeTarget(Q)):'close it with Mark outcome';

  var np=unpricedLines();
  if(Q.status==='Draft')return np.length?('put a price on line '+np.map(function(x){return x.line_no;}).join(', ')):'submit for approval';
  if(np.length)return 'put a price on line '+np.map(function(x){return x.line_no;}).join(', ');
  if(Q.status==='Pending Approval')return 'waiting for the approver';
  if(Q.status==='Approved')return 'send it to the customer';
  if(Q.status==='Sent')return 'record whether it was won or lost';
  return '—';
}

var HDR_KEYS=["ccr_emp","bill_contact_id","bill_to_address_id","deal_commission_pct","deal_discount_pct",
              "delivery_scope","delivery_terms","insurance","lead_time_delivery","lead_time_product",
              "lead_time_production","pt","referrer_id","ship_contact_id",
              "ship_to_address_id","validity_days"];
var BANNED_HDR_KEYS=["freight","insurance_amt","other_charges"];   
var LINE_KEYS=["customer_length","customer_uom","disc","qty","quoted_uom","rate","sw_basis","sw_value","clear_rate_override"];
var NUMERIC_KEYS=["deal_commission_pct","deal_discount_pct","lead_time_delivery","lead_time_product",
                  "lead_time_production","validity_days","disc","qty","customer_length","sw_value","rate"];

function normPatch(src,allowed){
  var out={};
  Object.keys(src).forEach(function(k){
    if(BANNED_HDR_KEYS.indexOf(k)>=0)return;      
    if(allowed.indexOf(k)<0)return;
    var v=src[k];
    if(v===undefined)return;                      
    if(v===""||v===null){ out[k]=null; return; }  
    out[k]=(NUMERIC_KEYS.indexOf(k)>=0)?Number(v):v;
  });
  return out;
}
async function saveDraft(){
  if(!needActor())return;

  await flushLineSaves();
  if(!savable()){ toast("Nothing to save.","warn"); return; }   

  if(isFrozen(Q)&&can(CAP.EDIT_APPROVED)){ openReviseSave(); return; }
  var btn=document.getElementById("btnSave");
  await saveGuard(btn,"Saving…",async function(){
    var wrote=[], failed=[];
    if(Object.keys(hdrPatch).length){
      try{
        if(Q.updated_at===null||Q.updated_at===undefined||Q.updated_at===''){
          throw envErr('STALE_WRITE',
            'Version unconfirmed. Reload.',null);
        }
        var patch=normPatch(hdrPatch,HDR_KEYS);
        if(!Object.keys(patch).length)throw envErr('VALIDATION','Nothing to save.',null);
        var env=await callA(RPC.UPD_HDR,{p_actor_emp:actorEmp,quote_id:Q.id,p_expected_updated_at:Q.updated_at,patch:patch});
        wrote.push(Object.keys(patch).map(fieldWord).join(', '));
        hdrPatch={};
      }catch(ex){
        failed.push(friendlyErrA(ex));

        Object.keys(patch||{}).forEach(function(k){ delete hdrPatch[k]; });
        if(ex&&ex.rpcCode==='STALE_WRITE'){

          var notTried=Object.keys(linePatch).length;
          offerReload(ex);
          if(notTried)toast(notTried+' line edit(s) not attempted. Reload.',"warn");
          return;
        }
      }
    }
    var ids=Object.keys(linePatch);
    for(var i=0;i<ids.length;i++){
      var lid=ids[i], patch2=linePatch[lid];
      if(!patch2||!Object.keys(patch2).length)continue;
      try{
        var np=normPatch(patch2,LINE_KEYS);
        if(!Object.keys(np).length){ delete linePatch[lid]; continue; }

        if(np.rate!==undefined&&np.clear_rate_override)
          throw envErr('M06_OVERRIDE_CONFLICT','A typed rate and a clear cannot be saved together.',null);
        var env2=await callA(RPC.LINE_UPD,{p_actor_emp:actorEmp,line_id:lid,patch:np});
        wrote.push('line '+lineNoOf(lid)+' ('+Object.keys(np).map(fieldWord).join(', ')+')');
        delete linePatch[lid];
      }catch(ex2){
        failed.push('line '+lineNoOf(lid)+': '+friendlyErrA(ex2));

        var rd2=(ex2&&ex2.rpcData)||null;
        if(rd2&&rd2.line&&rd2.line.id)
          for(var li=0;li<LINES.length;li++){ if(LINES[li].id===rd2.line.id){ LINES[li]=rd2.line; break; } }
        delete linePatch[lid];
      }
    }
    await refreshQuote();
    if(failed.length){
      openModal("Part of that could not be saved",
        '<div class="wbanner hard" style="margin:0 0 10px">'+failed.map(function(m){return esc(m);}).join('<br>')+'</div>'+
        (wrote.length?'<div class="wbanner info" style="margin:0">Saved: '+esc(wrote.join(' · '))+'</div>':'')+
        '',
        [{t:"Close",c:"btn-g",f:"closeModal()"}]);
    } else if(wrote.length){

      toast("Saved: "+wrote.join(' · ')+".","ok");
      if(Q&&Q.totals_dirty&&LINES.length&&linesEditable())await autoReprice(true);
    } else {
      toast("Nothing to save.","warn");
    }
  });
}
function lineNoOf(id){ var l=lineOf(id); return l?l.line_no:String(id).slice(0,8); }
function offerReload(ex){
  openModal("Someone else changed this quote",
    errBox(ex)+
    '<div class="hint">Nothing was saved. Reload.</div>',
    [{t:"Stay here",c:"btn-g",f:"closeModal()"},{t:"Reload this quote",c:"btn-p",f:"closeModal();refreshQuote()"}]);
}

function openReviseSave(){
  var patch=normPatch(hdrPatch,HDR_KEYS);
  openModal("This creates revision "+String((Q.rev_no||0)+1),

    '<div class="wbanner soft" style="margin:0 0 11px"><b>'+esc(Q.quote_no||'This quote')+'</b> is '+esc(Q.status)+'. Saving creates <b>revision '+esc(String((Q.rev_no||0)+1))+'</b>.</div>'+
    (Object.keys(patch).length?('<div class="hint">Changes: <b>'+esc(Object.keys(patch).map(fieldWord).join(', '))+'</b></div>'):'')+
    '<div id="rvsErr"></div>',
    [{t:"Cancel — change nothing",c:"btn-g",f:"closeModal()"},{t:"Create revision and apply",c:"btn-p",id:"rvsBtn",f:"doReviseSave()"}]);

async function doReviseSave(){
  var btn=document.getElementById("rvsBtn");
  await saveGuard(btn,"Revising…",async function(){
    try{
      var k=appKey('revise:'+Q.id+':'+Q.rev_no);
      var env=await callA(RPC.REVISE,{p_actor_emp:actorEmp,p_app_key:k,quote_id:Q.id});
      var d=env.data||{};
      var nid=d.quote_id||d.id||null;
      if(!env.replay)clearKey('revise:'+Q.id+':'+Q.rev_no);

  for(var i=0;i<hcDraft.length;i++){
    var r=hcDraft[i];
    if(!r.code){ bad.push("Row "+(i+1)+" has no charge picked."); continue; }
    if(seen[r.code]){ bad.push("The charge "+r.code+" appears twice."); continue; }
    seen[r.code]=1;
    if(r.amount===''||r.amount===null||isNaN(Number(r.amount))){ bad.push("The amount for "+r.code+" is missing."); continue; }
    if(Number(r.amount)<0){ bad.push("The amount for "+r.code+" is negative."); continue; }
    rows.push({code:r.code,amount:Number(r.amount)});
  }
  if(bad.length){ toast(bad.join(' '),"err"); return; }
  if(Q.updated_at===null||Q.updated_at===undefined||Q.updated_at===''){
    toast("Version unconfirmed. Reload.","err"); return;

    try{
      var env=await callA(RPC.CHARGE_SET,{p_actor_emp:actorEmp,quote_id:Q.id,p_expected_updated_at:Q.updated_at,charges:rows});

      await refreshQuote();
      toast("Charges saved as one set ("+rows.length+" charge(s))."+(env&&env.replay?" (already applied)":""),"ok");

var PDF_POLL_MS=1500, PDF_POLL_MAX=40, PDF_URL_TTL=120;  
function openPdfDownload(){
  if(!needActor())return;
  if(!can(CAP.EXPORT)){ toast(capWhy(CAP.EXPORT,'produce the printed quotation'),"err"); return; }

  var custOk=!!(Q&&(Q.status==='Approved'||Q.status==='Sent'||Q.status==='Won'||Q.approved_at));

    '</select>'+

    [{t:"Cancel",c:"btn-g",f:"closeModal()"},{t:"Download",c:"btn-p",id:"pdfBtn",f:"doPdfExport()"}]);

async function doPdfExport(){
  if(!Q||!needActor())return;
  var sel=document.getElementById('pdfCopy');
  var copy=(sel&&sel.value)||'INTERNAL';
  var prog=document.getElementById('pdfProg');
  function say(t){ if(prog)prog.textContent=t; }
  var btn=document.getElementById('pdfBtn');
  await saveGuard(btn,"Preparing…",async function(){
    try{
      var kk='pdf:'+Q.id+':'+copy;
      say('Requesting the document…');
      var env=await callA('export_pdf_request',{module_code:'M06',document_id:Q.id,
        template_code:'QUOTE_STD_V1',copy_type:copy,
        p_actor_emp:actorEmp,p_app_key:appKey(kk)});
      if(!env.replay)clearKey(kk);
      var d=(env&&env.data&&typeof env.data==='object')?env.data:{};
      var eid=d.export_id;
      if(!eid)throw envErr('INTERNAL','No export id came back.',null);

      say('Rendering…');
      var engineErr='';
      try{
        var rr=await fetch('api/export-pdf',{method:'POST',
          headers:{'Content-Type':'application/json'},
          body:JSON.stringify({export_id:eid})});
        if(!rr.ok){
          var tt=''; try{ tt=await rr.text(); }catch(e2){}
          engineErr='the renderer answered '+rr.status+(tt?(': '+String(tt).slice(0,200)):'');
        }
      }catch(fx){ engineErr='the renderer could not be reached'; }
      var row=null;
      for(var i=0;i<PDF_POLL_MAX;i++){
        var pr=await SB.from('pdf_exports').select('status,file_path,file_name,error_message')
          .eq('id',eid).maybeSingle();
        if(!pr.error&&pr.data){
          row=pr.data;
          if(row.status==='DONE'||row.status==='ERROR')break;
        }
        await new Promise(function(res){ setTimeout(res,PDF_POLL_MS); });
      }
      if(!row||row.status!=='DONE'){
        throw envErr(row&&row.status==='ERROR'?'PDF_RENDER_ERROR':'PDF_NOT_READY',
          row&&row.status==='ERROR'
            ? (/gateway timeout|failed \(50\d\)/i.test(String(row.error_message||''))
                ? 'The document service did not answer. Try again.'
                : 'the renderer recorded an error')
            : 'The document is still being prepared. Try again shortly.',null);
      }
      say('Fetching the file…');

      var su=await SB.storage.from('pdf-exports')
        .createSignedUrl(row.file_path,PDF_URL_TTL,{download:row.file_name||'quotation.pdf'});
      if(su.error||!su.data||!su.data.signedUrl)
        throw envErr('PDF_URL_FAILED','No download link could be made.',null);
      var a=document.createElement('a');
      a.href=su.data.signedUrl; a.rel='noopener';
      document.body.appendChild(a); a.click(); document.body.removeChild(a);
      closeModal();
      toast('The '+(copy==='CUSTOMER'?'customer':'internal')+' copy of '+(Q.quote_no||'the quote')+
        ' is downloading.'+(env.replay?' (already produced)':''),"ok");
    }catch(ex){
      say('');
      var slot=document.getElementById('pdfErr');
      if(slot)slot.innerHTML=errBox(ex); else toast(friendlyErrA(ex),"err");
    }
  });
}

var OUTCOME_MATRIX={
  "Draft":["Dropped"],
  "Pending Approval":[],
  "Approved":[],
  "Sent":["Won","Lost"],
  "Under-Follow-Up":["Lost","Dropped"],
  "Hold":["Lost","Dropped"]
};
function outcomesAllowed(st){ return (OUTCOME_MATRIX[st]||[]).slice(); }
function outcomeBlockWhy(st,o){
  var ok=outcomesAllowed(st);
  if(ok.indexOf(o)>=0)return '';
  if(!ok.length)return st+' cannot be closed here';
  return st+' cannot be marked '+o+' — only '+ok.join(' or ');
}

<script>

var NR_ITEM=null, czLineId=null, czEditId=null;

function nrVal(k,d){ return (TEMPROW&&TEMPROW.fields&&TEMPROW.fields[k]!==undefined&&TEMPROW.fields[k]!==null)?TEMPROW.fields[k]:(d===undefined?'':d); }
function nrSwCell(){

  var ap=NR_ITEM?swApplicable(NR_ITEM):null;
  if(NR_ITEM&&ap===false)
    return '<td class="lockro" id="nrSwCell"><span class="na">not applicable</span></td>';
  if(NR_ITEM&&ap===null)
    return '<td class="lockro" id="nrSwCell"><span class="na">not known</span></td>';
  var basis=nrVal('sw_basis','Standard');
  return '<td id="nrSwCell"><select class="ec mk" style="width:82px" id="nrSw" onchange="nrSwChanged()"'+(NR_ITEM?'':' disabled title="Pick the item first"')+
    ' aria-label="Section weight basis for the new line">'+
    '<option value="Standard"'+(basis==='Standard'?' selected':'')+'>Standard</option>'+
    '<option value="Specific"'+(basis==='Specific'?' selected':'')+'>Specific</option></select>'+
    '<input class="ec mk n d3" style="margin-top:3px;display:'+(basis==='Specific'?'inline-block':'none')+'" id="nrSwv" type="number" step="0.0001" min="0" value="'+esc(String(nrVal('sw_value','')))+'"'+
    ' onchange="tempEdit(\'sw_value\',this.value)" aria-label="Measured section weight for the new line"/></td>';
}

function nrRowHtml(cost){
  return '<tr class="nr" id="nrRow">'+
    '<td>+</td>'+

    '<td class="itm"><div class="tawrap">'+
      '<input class="ec mk" style="width:100%" id="nrItem" autocomplete="off" placeholder="'+esc(searchFields(ITEM_SEARCH_FIELDS))+'" oninput="nrItemType()" aria-label="Item for the new line" value="'+
        esc(NR_ITEM?(NR_ITEM+' · '+String(itemLabel(NR_ITEM))):'')+'"/>'+
      '<div class="hits inrow" id="nrHits" style="display:none"></div></div>'+

      '<div class="lgsub" id="nrNote" style="margin:2px 0 0;white-space:normal"></div></td>'+
    '<td><input class="ec mk n d4" id="nrLen" type="number" step="0.001" min="0" value="'+esc(String(nrVal('customer_length','')))+'" onchange="tempEdit(\'customer_length\',this.value)" onblur="fieldRule(this,\'numpos\')" aria-label="Customer length for the new line"/></td>'+

    '<td><select class="ec mk" id="nrCuom" onchange="tempEdit(\'customer_uom\',this.value)" aria-label="Customer unit for the new line"><option value="">-</option>'+
      (NR_ITEM?itemUoms(NR_ITEM):[]).map(function(u){return '<option value="'+esc(u)+'"'+(nrVal('customer_uom','')===u?' selected':'')+'>'+esc(u)+'</option>';}).join('')+'</select></td>'+
    '<td><input class="ec mk n" id="nrQty" type="number" step="0.001" min="0" value="'+esc(String(nrVal('qty','')))+'" onchange="tempEdit(\'qty\',this.value)" onblur="fieldRule(this,\'qtypos\')" aria-label="Customer quantity for the new line"/></td>'+

    '<td class="sepL"><select class="ec mk d4" id="nrQuom" onchange="tempEdit(\'quoted_uom\',this.value)" aria-label="Quoted unit for the new line">'+nrQuomOpts()+'</select></td>'+
    '<td class="num lockro"><span class="na">worked out on saving</span></td>'+
    nrSwCell()+
    '<td class="lockro"><span class="na">worked out on saving</span></td>'+
    '<td><input class="ec ci n d2" id="nrDisc" type="number" step="0.01" min="0" max="100" value="'+esc(String(nrVal('disc','')))+'" onchange="tempEdit(\'disc\',this.value)" onblur="fieldRule(this,\'pct100\')" aria-label="Discount percent for the new line"/>'+
      '<div class="hint" id="nrDiscHint" style="margin:0;white-space:normal">0&ndash;100%</div></td>'+
    '<td>'+stateBadgeHtml(NEWKEY)+'</td>'+
    (cost?'<td class="sepL"></td><td></td>':'')+
    '<td class="sepL"></td>'+

    '<td class="act"><button class="nradd" id="nrAddBtn" onclick="nrCommit()" aria-label="Save this row now">+</button> '+
      '<button class="iconbtn d" id="nrClearBtn" onclick="clearTempRow()" aria-label="Clear this new row">&#10005;</button></td>'+
    '</tr>';
}
function nrQuomOpts(){
  var set=NR_ITEM?itemUoms(NR_ITEM):[];
  var cur=nrVal('quoted_uom','');
  return '<option value=""'+(cur?'':' selected')+'>- item default -</option>'+
    set.map(function(u){return '<option value="'+esc(u)+'"'+(cur===u?' selected':'')+'>'+esc(u)+'</option>';}).join('');
}

function nrUomRebuild(){
  var set=NR_ITEM?itemUoms(NR_ITEM):[];
  var cu=document.getElementById('nrCuom');
  if(cu){
    var cur=nrField('customer_uom','nrCuom');
    cu.innerHTML='<option value=""'+(cur?'':' selected')+'>-</option>'+
      set.map(function(u){return '<option value="'+esc(u)+'"'+(cur===u?' selected':'')+'>'+esc(u)+'</option>';}).join('')+
      ((cur&&set.indexOf(cur)<0)?'<option value="'+esc(cur)+'" selected>'+esc(cur)+' — not allowed for this item</option>':'');
  }
  var qu=document.getElementById('nrQuom');
  if(qu){
    var qcur=nrField('quoted_uom','nrQuom');
    qu.innerHTML=nrQuomOpts()+
      ((qcur&&set.indexOf(qcur)<0)?'<option value="'+esc(qcur)+'" selected>'+esc(qcur)+' — not allowed for this item</option>':'');
  }
}
function nrSwChanged(){
  var v=document.getElementById("nrSw").value;
  var w=document.getElementById("nrSwv");
  if(w)w.style.display=(v==='Specific')?'inline-block':'none';
  tempEdit('sw_basis',v);
}

function nrField(k,domId){
  var e=document.getElementById(domId);
  var v=e?String(e.value||'').trim():'';
  if(v)return v;
  var f=(TEMPROW&&TEMPROW.fields)||{};
  return (f[k]===null||f[k]===undefined)?'':String(f[k]).trim();
}
async function nrCommit(){
  var miss=[];
  if(!NR_ITEM&&!nrField('item_id','nrItem'))miss.push('the item');
  if(!nrField('customer_uom','nrCuom'))miss.push('the customer unit');
  if(!(Number(nrField('qty','nrQty'))>0))miss.push('a quantity above zero');

  var uset=NR_ITEM?itemUoms(NR_ITEM):[];
  var cuv=nrField('customer_uom','nrCuom');
  if(cuv&&uset.length&&uset.indexOf(cuv)<0)miss.push('an approved customer unit ('+cuv+' is not allowed)');
  var quv=nrField('quoted_uom','nrQuom');
  if(quv&&uset.length&&uset.indexOf(quv)<0)miss.push('an approved quoted unit ('+quv+' is not allowed)');
  if(miss.length){
    var why='Still needs: '+miss.join(', ')+'.';
    paintState(NEWKEY,'INCOMPLETE',why);
    toast(why,"warn");
    return;
  }
  var btn=document.getElementById("nrAddBtn");
  await saveGuard(btn,"…",async function(){ await runLineSave(NEWKEY); });
}

var ITEM_SEARCH_FIELDS=[{n:'code',        g:function(i){ return i.item_id; }},
                        {n:'description', g:function(i){ return i.description_override||i.description; }}];
function itemMatch(i,tokens){
  var hay=ITEM_SEARCH_FIELDS.map(function(f){ return String(f.g(i)||"").toLowerCase(); });
  return tokens.every(function(t){
    return hay.some(function(s){ return s.indexOf(t)>=0; });
  });
}

function nrPlaceHits(){
  var el=document.getElementById('nrItem'), b=document.getElementById('nrHits');
  if(!el||!b||b.style.display==='none'||!b.innerHTML)return;
  var r=el.getBoundingClientRect();
  var vh=window.innerHeight||document.documentElement.clientHeight;
  var vw=window.innerWidth||document.documentElement.clientWidth;
  b.style.width=Math.max(240,Math.round(r.width))+'px';
  b.style.left='0px'; b.style.top='0px';                    /* measure unconstrained */
  var hgt=b.offsetHeight||150;
  var left=Math.min(Math.max(8,r.left),Math.max(8,vw-b.offsetWidth-8));
  var below=(vh-r.bottom), above=r.top;
  var top=(below>=hgt+8||below>=above)?(r.bottom+3):(r.top-hgt-3);
  top=Math.min(Math.max(8,top),Math.max(8,vh-hgt-8));
  b.style.left=left+'px'; b.style.top=top+'px';
}

window.addEventListener('scroll',function(){ nrPlaceHits(); },true);
window.addEventListener('resize',function(){ nrPlaceHits(); });
function nrItemType(){
  var el=document.getElementById("nrItem"); if(!el)return;

  setTimeout(nrPlaceHits,0);
  var v=(el.value||"").trim().toLowerCase();

  if(NR_ITEM&&v.indexOf(String(NR_ITEM).toLowerCase())!==0){
    NR_ITEM=null;
    if(TEMPROW&&TEMPROW.fields)delete TEMPROW.fields.item_id;
    var sc=document.getElementById("nrSwCell"); if(sc)sc.outerHTML=nrSwCell();
    var nn=document.getElementById("nrNote"); if(nn)nn.innerHTML='';
    nrUomRebuild();   
  }
  var box=document.getElementById("nrHits"); if(!box)return;
  if(v.length<1){box.style.display='none';box.innerHTML='';return;}
  var tokens=v.split(/\s+/).filter(function(t){ return t!==''; });
  if(!tokens.length){box.style.display='none';box.innerHTML='';return;}
  var all=ITEMS.filter(function(i){ return itemMatch(i,tokens); });

  var hits=all.slice(0,SEARCH_CAP);
  box.style.display='block';
  box.innerHTML=hits.length

    ? hits.map(function(i){return '<button class="hit" onclick="nrPickItem(\''+esc(i.item_id)+'\')"><b>'+esc(i.item_id)+'</b> · '+esc(i.description_override||i.description||'')+
        (i.lifecycle_status==='Pending'?' · <span class="flag">awaiting approval</span>':'')+'</button>';}).join('')+capNote(all.length)
    : '<button class="hit mk" onclick="openInlineItemCreate()">No match — create this item</button>';
}
function nrPickItem(id){

  NR_ITEM=id;
  if(!TEMPROW)TEMPROW={fields:{}};
  TEMPROW.fields.item_id=id;
  var it=ITEMMAP[id];
  document.getElementById("nrItem").value=id+' · '+(it?(it.description_override||it.description||''):'');
  document.getElementById("nrHits").style.display='none';
  var note=document.getElementById("nrNote");

  var set=itemUoms(id);

  var pr=it?PRICEBY[it.type_code]:null;
  var hg=(it&&it.hsn_code)?HSNGST[it.hsn_code]:null;

  if(note)note.innerHTML='<b>'+esc(id)+'</b> · '+esc(it?(it.description_override||it.description||''):'')+
    (it&&it.lifecycle_status==='Pending'?' · <span class="flag">awaiting approval</span>':'');

  var dEl=document.getElementById('nrDisc');
  if(dEl&&!dEl.value){
    var cty=custOf(Q)?custOf(Q).customer_type:null;
    var ctRow=(LISTS[LIST.CUSTTYPE]||[]).filter(function(v){return v.code===cty;})[0];
    var md=ctRow&&ctRow.metadata?ctRow.metadata:{};
    var dDef=null;
    ['default_disc_pct','disc_pct','default_discount_pct','discount_pct'].forEach(function(k){
      if(dDef===null&&md[k]!==undefined&&md[k]!==null&&md[k]!=='')dDef=Number(md[k]);
    });

    var dh0=document.getElementById("nrDiscHint");
    if(dDef!==null&&!isNaN(dDef)){
      dEl.value=String(dDef);
      if(dh0)dh0.innerHTML='<b>'+esc(String(dDef))+'%</b> from type '+esc(cty||'');
    } else if(dh0){
      dh0.innerHTML='0&ndash;100%';   
    }
  }

  nrUomRebuild();

  var nrow=document.getElementById("nrRow");
  if(nrow&&nrow.cells&&nrow.cells.length>7){
    var tmp=document.createElement('tbody'); tmp.innerHTML='<tr>'+nrSwCell()+'</tr>';
    nrow.replaceChild(tmp.rows[0].cells[0],nrow.cells[7]);
  }
  if(dEl&&dEl.value)tempEdit('disc',dEl.value);
  tempEdit('item_id',id);
}

/* ---------- delete line ---------- */
function removeLine(lineId){
  if(!needActor())return;
  var l=lineOf(lineId); if(!l)return;
  var kids=(CUSTOMIZ[lineId]||[]).length;
  openModal("Remove line "+l.line_no+"?",
    '<div class="wbanner soft" style="margin:0 0 10px">Line <b>'+l.line_no+'</b> · '+esc(l.item_id)+' · '+esc(itemLabel(l.item_id))+
      (kids?(' · <b>'+kids+' customisation(s)</b> go with it'):'')+'</div>'+

    '<div id="rlErr"></div>',
    [{t:"Keep the line",c:"btn-g",f:"closeModal()"},{t:"Remove line",c:"btn-d btn-nokey",id:"rlBtn",f:"doRemoveLine(\'"+lineId+"\')"}]);
}

var REMOVED_LINE=null;
async function doRemoveLine(lineId){
  var l=lineOf(lineId);
  var snap=l?{quote_id:l.quote_id,item_id:l.item_id,line_no:l.line_no,qty:l.customer_qty,
              customer_qty:l.customer_qty,quoted_uom:l.quoted_uom,customer_uom:l.customer_uom,
              customer_length:l.customer_length,sw_basis:l.sw_basis,sw_value:l.sw_value,
              disc:l.discount_pct}:null;   
  var btn=document.getElementById("rlBtn");
  await saveGuard(btn,"Removing…",async function(){
    try{
      var env=await callA(RPC.LINE_DEL,{p_actor_emp:actorEmp,line_id:lineId});
      closeModal(); await refreshQuote();
      await autoReprice(true);        
      REMOVED_LINE=snap;
      toast("Line "+(snap?snap.line_no:'')+" removed. The totals are now out of date."+(env&&env.replay?" (already applied)":""),"ok","Undo",undoRemoveLine);
    }catch(ex){ var slot=document.getElementById("rlErr"); if(slot)slot.innerHTML=errBox(ex); }
  });
}
async function undoRemoveLine(){
  if(!REMOVED_LINE){ toast("There is nothing left to undo.","warn"); return; }
  if(!needActor())return;
  var s=REMOVED_LINE; REMOVED_LINE=null;
  try{

    var body={p_actor_emp:actorEmp,p_app_key:uuid4(),quote_id:s.quote_id,item_id:s.item_id,
              qty:s.qty,customer_uom:s.customer_uom,reason:NEW_LINE_REASON};
    if(s.quoted_uom)body.quoted_uom=s.quoted_uom;
    if(s.customer_length!==null&&s.customer_length!==undefined)body.customer_length=s.customer_length;
    if(s.sw_basis)body.sw_basis=s.sw_basis;
    if(s.sw_value!==null&&s.sw_value!==undefined)body.sw_value=s.sw_value;
    if(s.disc!==null&&s.disc!==undefined)body.disc=s.disc;
    var env=await callA('rpc_line_save',body);
    await refreshQuote();
    toast("Line restored. Customisations not restored.","ok");
  }catch(ex){ toast(friendlyErrA(ex),"err"); }
}

function eligibleCusts(itemId){
  var m=ICUST[itemId]||{};
  return Object.keys(m).sort();
}
function custSpecs(itemId,code){ return ((ICSPEC[itemId]||{})[code]||[]); }
function custUoms(itemId,code){ return ((ICUOM[itemId]||{})[code]||[]); }

function specName(code){ return czCodeLabel(code)||code; }

function czCodeLabel(code){ return LABEL[code]?(code+' \u00b7 '+LABEL[code]):String(code||''); }

function czQtySeed(l,existing){
  if(existing&&existing.customization_qty!==null&&existing.customization_qty!==undefined)
    return String(existing.customization_qty);
  var pq=lp(l.id,'qty',l.customer_qty);
  return (pq===null||pq===undefined||pq==='')?'':String(pq);
}
function openCustomize(lineId,editSub){
  if(!needActor())return;
  czLineId=lineId; czEditId=(editSub===undefined||editSub===null||editSub==='')?null:Number(editSub);
  var l=lineOf(lineId); if(!l)return;
  var it=ITEMMAP[l.item_id];
  var codes=eligibleCusts(l.item_id);
  var existing=czEditId?(CUSTOMIZ[lineId]||[]).filter(function(c){return Number(c.sub_line_no)===czEditId;})[0]:null;
  var ask=ASKSPEC[lineId]||null;   
  var h='';
  if(!codes.length)
    h+='<div class="wbanner hard" style="margin:0 0 11px"><b>'+esc(l.item_id)+' carries no customisation.</b></div>';

  h+='<div class="fg"><label>Customisation</label><select class="in" id="czType" onchange="czTypeChanged()">'+
     '<option value="">- select -</option>'+
     codes.map(function(c){return '<option value="'+esc(c)+'"'+(existing&&existing.cust_code===c?' selected':'')+'>'+esc(czCodeLabel(c))+'</option>';}).join('')+
     '</select>'+(codes.length?'':'<div class="hint">this item carries no customisation</div>')+'</div>'+

     '<div id="czDrivers"></div>'+

     '<div class="fr">'+
       '<div class="fg"><label for="czQty">Qty <span class="rq">*</span></label>'+
         '<input class="in" id="czQty" type="number" step="0.001" min="0.001" oninput="czAmtPreview()"'+
         ' value="'+esc(czQtySeed(l,existing))+'"'+
         ' placeholder="how many" aria-label="Customisation quantity"></div>'+
       '<div class="fg"><label for="czUnit">Unit price <span class="rq">*</span></label>'+
         '<input class="in" id="czUnit" type="number" step="0.01" min="0" oninput="czAmtPreview()"'+
         ' value="'+esc(existing&&existing.manual_unit_price!==null&&existing.manual_unit_price!==undefined?String(existing.manual_unit_price):'')+'"'+
         ' placeholder="what one costs" aria-label="Customisation unit price"></div>'+
     '</div>'+
     '<div class="hint" id="czAmt"></div>'+

     '<div class="fg"><label for="czAsk">Remarks</label>'+
       '<input class="in" id="czAsk" maxlength="400" placeholder="Prints on the document" value="'+esc(ask&&ask.asked_customization?ask.asked_customization:'')+'">'+
     '</div>'+

     '<div id="czErr"></div>';
  openModal((czEditId?'Replace customisation · line ':'Customise line ')+l.line_no,h,
    [{t:"Cancel",c:"btn-g",f:"closeModal()"},{t:(czEditId?"Replace":"Add customisation"),c:"btn-p",id:"czBtn",f:"applyCustomize()"}],'l');
  czTypeChanged();
}

function czAmtPreview(){
  var box=document.getElementById('czAmt'); if(!box)return;
  var gv=function(id){ var e=document.getElementById(id); return e?String(e.value||'').trim():''; };
  var u=gv('czUnit'), q=gv('czQty');
  if(u===''||q===''||isNaN(Number(u))||isNaN(Number(q))){ box.innerHTML=''; return; }
  var amt=Math.round(Number(u)*Number(q)*100)/100;
  box.innerHTML=esc(rsPlain(u)+' x '+q+' = ')+'<b>'+esc(rsPlain(amt))+'</b>';
}

function czInputs(code){ var l=lineOf(czLineId)||{}; return custSpecs(l.item_id,code); }
function czTypeChanged(){
  var box=document.getElementById("czDrivers"); if(!box)return;
  var tid=(document.getElementById("czType")||{}).value||'';
  czAmtPreview();
  if(!tid){ box.innerHTML=''; return; }
  var _l0=lineOf(czLineId)||{};
  var drv=czInputs(tid);
  var _units=custUoms(_l0.item_id,tid);
  var _meta=((ICUST[_l0.item_id]||{})[tid])||{};
  var prev=(czEditId?((CUSTOMIZ[czLineId]||[]).filter(function(c){return Number(c.sub_line_no)===czEditId;})[0]||{}).asked_values:null)||{};

  var _note=(_meta.diagram_mandatory?'<div class="hint">A diagram is required.</div>':'');
  if(!drv.length){
    box.innerHTML=_note+'<div class="hint">This customisation asks for no measurement.</div>';
    return;
  }

  var _l=_l0;

  var _d0=drv[0];
  box.innerHTML=_note+drv.map(function(d){
    var name=czCodeLabel(d);

    var pv=prev[d];
    var pval=(pv&&typeof pv==='object')?pv.v:pv;
    var puom=(pv&&typeof pv==='object'&&pv.u)?pv.u:'';
    if(_d0&&d===_d0){
      var _ask=ASKSPEC[czLineId];
      if(_ask&&_ask.asked_customer_length!==null&&_ask.asked_customer_length!==undefined
         &&String(_ask.asked_customer_length)!==''&&_ask.asked_customer_uom){
        pval=_ask.asked_customer_length; puom=_ask.asked_customer_uom;   
      }
    }

    if(!puom){
      var _pu=lp(_l0.id,'customer_uom',_l0.customer_uom);
      if(_pu&&_units.indexOf(String(_pu))>=0)puom=String(_pu);
    }
    var _opts=_units.map(function(u){
      return '<option value="'+esc(u)+'"'+(String(puom)===u?' selected':'')+'>'+esc(u)+'</option>';
    }).join('');

    return '<div class="fr">'+
      '<div class="fg"><label for="czu-'+esc(d)+'">UOM <span class="rq">*</span></label>'+
      '<select class="in" id="czu-'+esc(d)+'">'+
        (_units.length?_opts:'<option value="">- none declared -</option>')+'</select></div>'+
      '<div class="fg"><label for="czv-'+esc(d)+'">'+esc(name)+' <span class="rq">*</span></label>'+
      '<input class="in" id="czv-'+esc(d)+'" type="number" step="0.0001" value="'+esc(String(pval!==undefined&&pval!==null?pval:''))+'"'+
      ' placeholder="a number" aria-label="'+esc(name)+'"/></div>'+
    '</div>';
  }).join('')+
  (_units.length?'':'<div class="wbanner hard" style="margin:8px 0 0">This customisation declares no unit on '+esc(_l.item_id)+'.</div>');
}
async function applyCustomize(){
  var tid=document.getElementById("czType").value;

  if(!tid){
    var s0=document.getElementById("czErr");
    if(s0)s0.innerHTML='<div class="wbanner hard" style="margin:0">Pick the customisation.</div>';
    toast("Pick the customisation.","err");
    return;
  }

  var gvv=function(id){ var e=document.getElementById(id); return e?String(e.value||'').trim():''; };
  var uRaw=gvv('czUnit'), qRaw=gvv('czQty');
  var priceErr='';
  if(uRaw===''||isNaN(Number(uRaw)))            priceErr='Enter the unit price for this customisation.';
  else if(Number(uRaw)<0)                        priceErr='The unit price cannot be less than zero.';
  else if(qRaw===''||isNaN(Number(qRaw)))        priceErr='Enter the quantity.';
  else if(Number(qRaw)<=0)                       priceErr='The quantity must be greater than zero.';
  if(priceErr){
    var sp=document.getElementById("czErr");
    if(sp)sp.innerHTML='<div class="wbanner hard" style="margin:0">'+esc(priceErr)+'</div>';
    toast(priceErr,"err");
    return;
  }

  var drv={}, missing=[], stated=[], statedExtra=false;
  czInputs(tid).forEach(function(d,ix){
    var el=document.getElementById('czv-'+d);
    var ue=document.getElementById('czu-'+d);
    var raw=el?String(el.value||'').trim():'';
    var uom=ue?String(ue.value||'').trim():'';
    var v=specName(d);
    if(raw===''||isNaN(Number(raw))||uom===''){
      missing.push(v);
      return;
    }
    drv[d]={v:Number(raw),u:uom};                 
    stated.push(v+' '+raw+' '+uom);
    if(ix>0)statedExtra=true;                     
  });
  if(missing.length){

    var _m="Fill in "+missing.join(', ')+" — with the unit — because this item asks for "+(missing.length===1?'it':'them')+" on this customisation.";
    var _s=document.getElementById("czErr");
    if(_s)_s.innerHTML='<div class="wbanner hard" style="margin:0">'+esc(_m)+'</div>';
    toast(_m,"err");
    return;
  }
  var btn=document.getElementById("czBtn");
  await saveGuard(btn,"Saving…",async function(){
    try{

      var gv=function(id){ var e=document.getElementById(id); return e?String(e.value||'').trim():''; };

      var czPayload={p_actor_emp:actorEmp,line_id:czLineId,

async function doCreateQuote(){
  if(!needActor())return;
  if(!nqCust){toast("Pick the customer first.","err");return;}
  if(gateLevel(nqCust)==='block'){toast(nqCust.name+" "+gateIs(nqCust)+", so a quote cannot be raised for them.","err");return;}
  var unit=(document.getElementById("nqUnit").value||"").trim();
  if(!unit){toast("The raising unit is required.","err");return;}
  var pt=document.getElementById("nqPt").value||"";
  var ins=document.getElementById("nqIns").value||"";
  if(!pt){toast("Pick the payment terms.","err");return;}
  if(!ins){toast("Pick the insurance option.","err");return;}

  var qd=TODAY_ISO;
  var vd=(document.getElementById("nqVal").value||"").trim();

  var vmax=validityMax();
  if(vd&&(Number(vd)<1||(vmax!==null&&Number(vd)>vmax))){
    toast(vmax===null?"The validity must be one day or more.":("The validity must be between 1 and "+vmax+" days."),"err");
    return;
  }

  var charges=[];
  gcList().forEach(function(v){
    var el=document.getElementById('nqhc-'+v.code);
    var raw=el?(el.value||"").trim():"";
    if(raw!==""&&Number(raw)>0)charges.push({code:v.code,amount:Number(raw)});
  });

  var terms={
    pt:pt,
    insurance:ins,
    delivery_scope:document.getElementById("nqScope").value||null,
    delivery_terms:document.getElementById("nqTerms").value||null
  };
  if(vd!=="")terms.validity_days=Number(vd);
  [["nqLtP","lead_time_product"],["nqLtN","lead_time_production"],["nqLtD","lead_time_delivery"]].forEach(function(p){
    var raw=(document.getElementById(p[0]).value||"").trim();
    if(raw!=="")terms[p[1]]=Number(raw);
  });
  var btn=document.getElementById("nqBtn");
  var prog=document.getElementById("nqProgress");
  await saveGuard(btn,"Creating…",async function(){
    try{
      var k=appKey('newquote:'+nqCust.id+':'+qd);

      var pay={
        p_actor_emp:actorEmp,
        p_app_key:k,
        customer_id:nqCust.id,
        booking_unit:unit,
        product_terms:terms
      };
      Object.keys(terms).forEach(function(tk){ pay[tk]=terms[tk]; });
      var ref=nqRefId||"";
      if(ref)pay.referrer_id=ref;
      if(charges.length)pay.header_charges=charges;

      var env=await callA(RPC.CREATE,pay);
      var d=env.data||{};
      var nid=d.quote_id, nno=d.quote_no;
      if(!env.replay)clearKey('newquote:'+nqCust.id+':'+qd);
      if(prog)prog.innerHTML='Created <b>'+esc(nno||nid||'')+'</b>.';
      creating=false;                 
      await loadQuotes();
      if(nid){
        await openWorkspace(nid);
        toast((nno||'The quote')+" created for "+nqCust.name+".","ok");   
      } else {
        showTab('list');
        okToast(env,"The quote was created. Open it from the list.");
      }
    }catch(ex){
      creating=true;                  
      if(prog)prog.innerHTML='';
      var slot=document.getElementById("nqErr"); if(slot)slot.innerHTML=errBox(ex);
    }
  });
}

async function doCopyLast(srcId){
  var src=QMAP[srcId]; if(!src)return;
  var btn=document.getElementById("clBtn");
  var prog=document.getElementById("clProgress");
  await saveGuard(btn,"Creating…",async function(){
    var newId=null, newNo=null;
    try{
      var k=appKey('copylast:'+srcId);
      var terms={
        pt:src.pt_code,
        delivery_scope:src.delivery_scope,
        delivery_terms:src.delivery_terms,
        insurance:src.insurance_scope,
        validity_days:src.validity_days,
        lead_time_product:src.lead_time_product,
        lead_time_production:src.lead_time_production,
        lead_time_delivery:src.lead_time_delivery

      };
      var cpay={
        p_actor_emp:actorEmp,
        p_app_key:k,
        customer_id:src.customer_id,
        booking_unit:src.unit||actorUnit||null,
        product_terms:terms
      };
      Object.keys(terms).forEach(function(tk){ cpay[tk]=terms[tk]; });
      var env=await callA(RPC.CREATE,cpay);
      newId=(env.data||{}).quote_id; newNo=(env.data||{}).quote_no;
      if(prog)prog.innerHTML='Created <b>'+esc(newNo||newId)+'</b>'+(env.replay?' (already created)':'')+'. Copying the lines…';
    }catch(ex){
      if(prog)prog.innerHTML='';
      var slot=document.getElementById("clErr"); if(slot)slot.innerHTML=errBox(ex);
      return;
    }
    var sl=await SB.from('quote_lines').select('id,quote_id,line_no,item_id,item_type_code,line_type,customer_length,customer_uom,customer_qty,quoted_uom,quoted_total_qty,rate,discount_pct,commission_pct,amount,sw_basis,sw_value,sw_needs_approval,cost,margin,created_by,created_by_name,created_at,updated_at,version,pricing_resolution_method,applied_gst_rate,supply_type,commission_amount,discount_over_ceiling,applied_hsn,price_source_type,price_source_revision,governed_pricing_decision,pricing_stale,price_refusal_reason').eq('quote_id',srcId).order('line_no');
    var srcLines=sl.error?[]:(sl.data||[]);
    var made=0, failed=[];
    for(var i=0;i<srcLines.length;i++){
      var l=srcLines[i];
      try{

        var cb={p_actor_emp:actorEmp,p_app_key:uuid4(),quote_id:newId,item_id:l.item_id,
                qty:l.customer_qty,customer_uom:l.customer_uom,reason:NEW_LINE_REASON};
        if(l.quoted_uom)cb.quoted_uom=l.quoted_uom;
        if(l.customer_length!==null&&l.customer_length!==undefined)cb.customer_length=l.customer_length;
        if(l.sw_basis)cb.sw_basis=l.sw_basis;
        if(l.sw_value!==null&&l.sw_value!==undefined)cb.sw_value=l.sw_value;
        if(l.discount_pct!==null&&l.discount_pct!==undefined)cb.disc=l.discount_pct;
        var ce=await callA('rpc_line_save',cb);
        var cf=((ce&&ce.data&&ce.data.flags)||{});
        if(cf.persisted!==true)throw envErr('VALIDATION',(cf.line_state_reason||'the line could not be created'),null);
        made++;
      }catch(ex2){ failed.push('line '+l.line_no+' ('+l.item_id+'): '+friendlyErrA(ex2)); }
    }
    clearKey('copylast:'+srcId);
    await loadQuotes();
    closeModal();
    if(failed.length){
      openModal("Only part of the quote was copied",
        '<div class="wbanner soft" style="margin:0 0 10px">Quote <b>'+esc(newNo||newId)+'</b> was created with <b>'+made+' of '+srcLines.length+'</b> line(s).</div>'+
        '<div class="wbanner hard" style="margin:0 0 10px">'+failed.map(function(m){return esc(m);}).join('<br>')+'</div>'+
        '',
        [{t:"Open the new quote",c:"btn-p",f:"closeModal();openWorkspace('"+newId+"')"}]);
    } else {
      toast("Created "+(newNo||'the copy')+" with "+made+" line(s). They have been priced.","ok");
      await openWorkspace(newId);
    }
  });
}

async function refreshCustomersAfterCreate(){

  CUSTS=cu.data||[]; CUSTMAP={}; CUSTS.forEach(function(c){CUSTMAP[c.id]=c;});
  var fresh=CUSTSNAP?CUSTS.filter(function(c){return !CUSTSNAP[c.id];}):[];
  CUSTSNAP=null;
  if(!fresh.length){ toast('Customer list re-read — nothing new yet.','warn'); return; }

      toast(fresh.length+' new item(s) arrived: '+fresh.map(function(i){return i.item_id;}).join(', ')+'.','ok');
      if(box)nrItemType();
    }
  } else {
    toast('Item catalogue re-read — nothing new yet.','warn');
  }
}
</script>
<script>

function rangeWindow(){
  var d=new Date(TODAY_ISO+"T00:00:00");
  function iso(x){function z(n){return(n<10?'0':'')+n;}return x.getFullYear()+'-'+z(x.getMonth()+1)+'-'+z(x.getDate());}
  if(insRange.key==='month')  return {from:iso(new Date(d.getFullYear(),d.getMonth(),1)), to:iso(new Date(d.getFullYear(),d.getMonth()+1,0)), label:'this month'};
  if(insRange.key==='quarter'){var qs=Math.floor(d.getMonth()/3)*3; return {from:iso(new Date(d.getFullYear(),qs,1)), to:iso(new Date(d.getFullYear(),qs+3,0)), label:'this quarter'};}
  if(insRange.key==='fy'){
    var y=(d.getMonth()>=3)?d.getFullYear():d.getFullYear()-1;
    return {from:y+'-04-01', to:(y+1)+'-03-31', label:'this FY (1 Apr - 31 Mar)'};
  }
  return {from:insRange.from, to:insRange.to, label:'custom range'};
}
function inRange(q){
  var w=rangeWindow();
  var d=q.quote_date||String(q.created_at||'').slice(0,10);
  if(!d)return false;
  if(w.from&&d<w.from)return false;
  if(w.to&&d>w.to)return false;
  return true;
}
function setRange(k){
  if(k==='custom'){ openCustomRange(); return; }
  insRange={key:k,from:null,to:null}; renderInsights();
}
function openCustomRange(){
  openModal("Custom date range",
    '<div class="fr"><div class="fg"><label>From</label><div id="crFromSlot"></div></div>'+
    '<div class="fg"><label>To</label><div id="crToSlot"></div></div></div>'+
    '',
    [{t:"Cancel",c:"btn-g",f:"closeModal()"},{t:"Apply range",c:"btn-p",f:"applyCustomRange()"}],'s');
  ['crFromSlot','crToSlot'].forEach(function(s,i){
    var slot=document.getElementById(s);
    if(slot)slot.innerHTML=dateFieldHTML(i===0?'crFrom':'crTo');
  });
}
function applyCustomRange(){
  var f=readDMY('crFrom')||null, t=readDMY('crTo')||null;
  if(!f&&!t){toast("Give at least one end of the range.","warn");return;}
  insRange={key:'custom',from:f,to:t};
  closeModal(); renderInsights();
}
function renderInsights(){
  var z=document.getElementById("insZone"); if(!z)return;
  if(!booted){ z.innerHTML='<div class="surf">Loading…</div>'; return; }
  if(loadErr.list){ z.innerHTML='<div class="surf err">The quotes could not be read.</div>'; return; }
  if(!actorEmp){ z.innerHTML=notSignedIn(); return; }
  var w=rangeWindow();
  var rows=quotes.filter(inRange);
  var val=0, mt=0, won=0, lost=0, decided=0;
  var marginSum=null, marginN=0;
  var costSum=null, costN=0, leakSum=null, leakN=0, f1n=0, f1t=0;   
  rows.forEach(function(q){
    val+=Number(q.grand_total||0);
    mt+=Number(q.total_weight_mt||0);

    if(q.status==='Won')won++;
    if(q.status==='Lost')lost++;
    if(TERMINAL.indexOf(q.status)>=0)decided++;
    if(q.__margin!==null&&q.__margin!==undefined){marginSum=(marginSum||0)+Number(q.__margin);marginN++;}
    if(q.__cost!==null&&q.__cost!==undefined){costSum=(costSum||0)+Number(q.__cost);costN++;}
    if(q.__leak!==null&&q.__leak!==undefined){leakSum=(leakSum||0)+Number(q.__leak);leakN++;}
    if(q.__f1){f1n+=q.__f1.n;f1t+=q.__f1.t;}
  });
  var expiring=rows.filter(isExpiring).length;
  var winRate=decided?Math.round((won/decided)*1000)/10:null;
  var h='<div class="ins-grid">';
  h+='<div class="ins-card w3"><div class="ins-bd" style="display:flex;gap:9px;align-items:center;flex-wrap:wrap">'+
     '<span class="fgl">Range</span>'+
     '<button class="chip'+(insRange.key==='month'?' on':'')+'" id="rngMonth" onclick="setRange(\'month\')">This month</button>'+
     '<button class="chip'+(insRange.key==='quarter'?' on':'')+'" id="rngQuarter" onclick="setRange(\'quarter\')">This quarter</button>'+
     '<button class="chip'+(insRange.key==='fy'?' on':'')+'" id="rngFY" onclick="setRange(\'fy\')">This FY</button>'+
     '<button class="chip'+(insRange.key==='custom'?' on':'')+'" id="rngCustom" onclick="setRange(\'custom\')">Custom&hellip;</button>'+
     '<span class="hint" style="margin:0">'+esc(w.label)+' · '+(w.from?fmtDate(w.from):'…')+' &rarr; '+(w.to?fmtDate(w.to):'…')+' · <b>'+rows.length+'</b> quote(s) in range, from the '+quotes.length+' loaded'+(totalQuotes!==null?(' of '+totalQuotes+' in total'):'')+'</span>'+
     '<span style="flex:1"></span>'+exportControl('ins')+
     '</div></div>';
  h+='<div class="ins-card w3"><div class="ins-hd">Quoted volume</div><div class="ins-bd"><div class="kpi-row">'+
     '<div class="kpi"><div class="v">'+rsPlain(val)+'</div><div class="l">quoted value</div></div>'+
     '<div class="kpi"><div class="v">'+Number(mt).toLocaleString("en-IN",{minimumFractionDigits:3,maximumFractionDigits:3})+'</div><div class="l">quoted MT</div></div>'+
     '<div class="kpi"><div class="v">'+(winRate===null?'<span class="na">not available</span>':(winRate+'%'))+'</div><div class="l">win rate'+(decided?(' ('+won+' of '+decided+' decided)'):' (nothing decided yet)')+'</div></div>'+
     '<div class="kpi"><div class="v">'+expiring+'</div><div class="l">expiring soon</div></div>'+
     '</div>'+
     '<div class="hint">'+esc(expiringWindowNote())+'</div></div></div>';
  if(canCost()){

    h+='<div class="ins-card w2"><div class="ins-hd">Cost, margin &amp; leakage (Admin / Directors only)</div><div class="ins-bd"><div class="kpi-row">'+
       '<div class="kpi"><div class="v">'+(costN?rsPlain(costSum):'<span class="na">not available</span>')+'</div><div class="l">frozen cost</div></div>'+
       '<div class="kpi"><div class="v">'+(marginN?rsPlain(marginSum):'<span class="na">not available</span>')+'</div><div class="l">total margin</div></div>'+
       '<div class="kpi"><div class="v">'+(leakN?rsPlain(leakSum):'<span class="na">not available</span>')+'</div><div class="l">leakage</div></div>'+
       '</div>'+

       (f1t===0?'':('<div class="hint">'+esc(f1n+'/'+f1t)+'</div>'))+
       '</div></div>';
  }
  h+='<div class="ins-card'+(canCost()?'':' w2')+'"><div class="ins-hd">TAT to send</div><div class="ins-bd">'+
     '<div class="kpi"><div class="v"><span class="na">not available</span></div><div class="l">median hours, Draft &rarr; Sent</div></div>'+
          '</div></div>';
  var mix={}; rows.forEach(function(q){mix[q.status]=(mix[q.status]||0)+1;});
  var keys=Object.keys(mix).sort(function(a,b){return mix[b]-mix[a];});
  var top=keys.length?mix[keys[0]]:0;
  h+='<div class="ins-card w3"><div class="ins-hd">Status mix in range</div><div class="ins-bd">'+
     (keys.length?keys.map(function(k){
        return '<div class="bar-row"><div class="bl">'+statusTag(k)+'</div><div class="bar-track">'+
          '<div class="bar-fill" style="width:'+(top?Math.max(6,Math.round((mix[k]/top)*100)):0)+'%;background:var(--m06)">'+mix[k]+'</div></div></div>';
      }).join(''):'<div class="hint">no quote in this range</div>')+
     '</div></div>';

  var byMonth={};
  rows.forEach(function(q){
    var d=q.quote_date||String(q.created_at||'').slice(0,10); if(!d)return;
    var mkey=d.slice(0,7);
    var b=(byMonth[mkey]=byMonth[mkey]||{q:0,w:0});
    b.q+=Number(q.grand_total||0);
    if(q.status==='Won')b.w+=Number(q.grand_total||0);
  });
  var mkeys=Object.keys(byMonth).sort();
  var mtop=0; mkeys.forEach(function(k){ if(byMonth[k].q>mtop)mtop=byMonth[k].q; });
  h+='<div class="ins-card w3"><div class="ins-hd">Quoted vs won — month by month</div><div class="ins-bd">'+
     (mkeys.length?mkeys.map(function(k){
        var b=byMonth[k];
        return '<div class="bar-row"><div class="bl">'+esc(k)+' · quoted</div><div class="bar-track">'+
                 '<div class="bar-fill" style="width:'+(mtop?Math.max(4,Math.round((b.q/mtop)*100)):0)+'%;background:var(--m06)">'+esc(rsPlain(b.q))+'</div></div></div>'+
               '<div class="bar-row"><div class="bl">'+esc(k)+' · won</div><div class="bar-track">'+
                 '<div class="bar-fill" style="width:'+(mtop?Math.max(b.w>0?4:0,Math.round((b.w/mtop)*100)):0)+'%;background:var(--green)">'+(b.w>0?esc(rsPlain(b.w)):'')+'</div></div></div>';
      }).join(''):'<div class="hint">no quote falls in this range</div>')+

     '</div></div>';

  var rcaAgg={}, wonN=0, lostN=0, dropN=0, noRca=0;
  rows.forEach(function(q){
    if(q.status==='Won'){wonN++;return;}
    if(q.status!=='Lost'&&q.status!=='Dropped')return;
    if(q.status==='Lost')lostN++; else dropN++;
    if(q.rca1_code){
      var k=q.status+' · '+(labelOf(q.rca1_code)||q.rca1_code);
      rcaAgg[k]=(rcaAgg[k]||0)+1;
    } else noRca++;
  });
  var rkeys=Object.keys(rcaAgg).sort(function(a,b){return rcaAgg[b]-rcaAgg[a];});
  var rtop=rkeys.length?rcaAgg[rkeys[0]]:0;
  h+='<div class="ins-card w3"><div class="ins-hd">Win / loss and why — the recorded reasons</div><div class="ins-bd">'+
     '<div class="kpi-row" style="margin-bottom:10px">'+
       '<div class="kpi"><div class="v">'+wonN+'</div><div class="l">won in range</div></div>'+
       '<div class="kpi"><div class="v">'+lostN+'</div><div class="l">lost in range</div></div>'+
       '<div class="kpi"><div class="v">'+dropN+'</div><div class="l">dropped in range</div></div>'+
     '</div>'+
     (rkeys.length?rkeys.map(function(k){
        return '<div class="bar-row"><div class="bl">'+esc(k)+'</div><div class="bar-track">'+
          '<div class="bar-fill" style="width:'+(rtop?Math.max(6,Math.round((rcaAgg[k]/rtop)*100)):0)+'%;background:var(--m06)">'+rcaAgg[k]+'</div></div></div>';
      }).join(''):'<div class="hint">no recorded reason in this range</div>')+
     (noRca?'<div class="hint">'+noRca+' closed quote(s) in range carry no coded reason</div>':'')+
     '</div></div>';
  h+='</div>';
  z.innerHTML=h;
}

function exportControl(scope){
  if(!can(CAP.EXPORT))return '';                 

  var sfx=scope==='list'?'List':(scope==='rec'?'Rec':'Ins');
  return '<div class="ddwrap">'+
    '<button class="btn btn-g btn-sm" id="btnExport'+sfx+'" onclick="toggleExportMenu(\''+sfx+'\')"'+

    '<div class="ddmenu'+(scope==='ins'?'':' down')+'" id="exportMenu'+sfx+'">'+
      '<button onclick="doExport(\'summary\',\''+scope+'\')">Summary — one row per quote</button>'+
      '<button onclick="doExport(\'detailed\',\''+scope+'\')">Detailed — one row per quote line</button>'+
      '<button onclick="doExport(\'both\',\''+scope+'\')">Both — summary then detail</button>'+

  var m=document.getElementById("exportMenu"+sfx); if(!m)return;

function csvCell(v){
  if(v===null||v===undefined)return '';
  var s=String(v);
  return /[",\n]/.test(s)?('"'+s.replace(/"/g,'""')+'"'):s;
}

function expDesc(code){ return code?(LABEL[code]||''):''; }

function expUomDesc(code){ var u=code?UOMMAP[code]:null; return (u&&u.label)?u.label:''; }

var EXP_NO_DESC=' (no description)';

function expQuoteCols(cost){
  var C=[
    {h:'quote_no',                v:function(q,c){return q.quote_no;}},
    {h:'rev_no',                  v:function(q,c){return q.rev_no;}},
    {h:'status',                  v:function(q,c){return q.status;}},
    {h:'customer_code',           v:function(q,c){return c?c.customer_code:'';}},
    {h:'customer_name',           v:function(q,c){return c?c.name:'';}},
    {h:'quote_date',              v:function(q,c){return q.quote_date;}},
    {h:'validity_date',           v:function(q,c){return q.validity_date;}},
    {h:'pt_code',                 v:function(q,c){return q.pt_code;}},
    {h:'pt_description',          v:function(q,c){return expDesc(q.pt_code);}},
    {h:'delivery_scope',          v:function(q,c){return q.delivery_scope;}},
    {h:'delivery_scope_description', v:function(q,c){return expDesc(q.delivery_scope);}},
    {h:'delivery_terms',          v:function(q,c){return q.delivery_terms;}},
    {h:'delivery_terms_description', v:function(q,c){return expDesc(q.delivery_terms);}},
    {h:'insurance_scope',         v:function(q,c){return q.insurance_scope;}},
    {h:'insurance_scope_description', v:function(q,c){return expDesc(q.insurance_scope);}},
    {h:'mode_of_delivery',        v:function(q,c){return q.mode_of_delivery;}},
    {h:'mode_of_delivery_description', v:function(q,c){return expDesc(q.mode_of_delivery);}},
    {h:'supply_type',             v:function(q,c){return q.supply_type;}},

    {h:'supply_type_description'+EXP_NO_DESC, v:function(q,c){return '';}},
    {h:'sub_total',               v:function(q,c){return q.sub_total;}},
    {h:'cgst',                    v:function(q,c){return q.cgst;}},
    {h:'sgst',                    v:function(q,c){return q.sgst;}},
    {h:'igst',                    v:function(q,c){return q.igst;}},
    {h:'round_off',               v:function(q,c){return q.round_off;}},
    {h:'grand_total',             v:function(q,c){return q.grand_total;}},
    {h:'total_weight_mt',         v:function(q,c){return q.total_weight_mt;}},
    {h:'blended_rate_per_kg',     v:function(q,c){return q.blended_rate_per_kg;}},
    {h:'pricing_status',          v:function(q,c){return q.pricing_status;}},
    {h:'unpriced_line_count',     v:function(q,c){return q.unpriced_line_count;}},
    {h:'totals_dirty',            v:function(q,c){return q.totals_dirty;}},

    {h:'deal_commission_pct',     v:function(q,c){return q.deal_commission_pct;}},
    {h:'unit',                    v:function(q,c){return q.unit;}},

    {h:'unit_description',        v:function(q,c){var u=ORGUNITS[q.unit]; return (u&&u.unit_name)?u.unit_name:'';}},
    {h:'fy',                      v:function(q,c){return q.fy;}},
    {h:'created_by_name',         v:function(q,c){return q.created_by_name;}},
    {h:'updated_at',              v:function(q,c){return q.updated_at;}}
  ];

  if(cost)C=C.concat([
    {h:'total_commission',        v:function(q,c){return q.total_commission;}},
    {h:'margin_sum',              v:function(q,c){return (q.__margin===null||q.__margin===undefined)?'':q.__margin;}},
    {h:'cost_sum',                v:function(q,c){return (q.__cost===null||q.__cost===undefined)?'':q.__cost;}}
  ]);
  return C;
}

function expLineCols(cost){
  var C=[
    {h:'line_no',       k:'line_no',       v:function(l){return l.line_no;}},
    {h:'item_id',       k:'item_id',       v:function(l){return l.item_id;}},
    {h:'item_description',             v:function(l){return l.item_id?String(itemLabel(l.item_id)||''):'';}},
    {h:'item_type_code',k:'item_type_code',v:function(l){return l.item_type_code;}},

    {h:'item_type_code_description'+EXP_NO_DESC, v:function(l){return '';}},

    {h:'rate',          k:'rate',          v:function(l){return l.rate;}},
    {h:'discount_pct',  k:'discount_pct',  v:function(l){return l.discount_pct;}},

    {h:'amount',        k:'amount',        v:function(l){return l.amount;}},
    {h:'sw_basis',      k:'sw_basis',      v:function(l){return l.sw_basis;}},

    {h:'sw_basis_description'+EXP_NO_DESC, v:function(l){return '';}},
    {h:'sw_value',      k:'sw_value',      v:function(l){return l.sw_value;}},
    {h:'sw_needs_approval',k:'sw_needs_approval',v:function(l){return l.sw_needs_approval;}},
    {h:'applied_gst_rate',k:'applied_gst_rate',v:function(l){return l.applied_gst_rate;}},
    {h:'applied_hsn',   k:'applied_hsn',   v:function(l){return l.applied_hsn;}},
    {h:'price_source_type',k:'price_source_type',v:function(l){return l.price_source_type;}},

    {h:'price_source_description',     v:function(l){return l.price_source_type?(PRICEWORDS[l.price_source_type]||''):'';}},
    {h:'pricing_resolution_method',k:'pricing_resolution_method',v:function(l){return l.pricing_resolution_method;}},

  if(cost)C=C.concat([                                        
    {h:'cost',        k:'cost',        v:function(l){return l.cost;}},

    {h:'commission_amount',k:'commission_amount',v:function(l){return l.commission_amount;}},
    {h:'governed_pricing_decision',k:'governed_pricing_decision',v:function(l){return l.governed_pricing_decision;}}
  ]);
  return C;
}
async function doExport(variant,scope){
  toggleExportMenu(scope==='list'?'List':(scope==='rec'?'Rec':'Ins'));
  if(!can(CAP.EXPORT)){toast(capWhy(CAP.EXPORT,'export quotes'),"err");return;}

  var rows=(scope==='list')?matched():((scope==='rec')?recRows():quotes.filter(inRange));
  if(!rows.length){toast("Nothing to export.","warn");return;}
  var cost=canCost();
  var QC=expQuoteCols(cost), LC=expLineCols(cost);
  var wantSummary=(variant==='summary'||variant==='both');
  var wantDetail=(variant==='detailed'||variant==='both');
  if(!wantSummary&&!wantDetail)wantSummary=true;          
  var byQuote={}, lineCount=0;
  if(wantDetail){
    var ids=rows.map(function(q){return q.id;});
    var sel=['id','quote_id'].concat(LC.filter(function(c){return !!c.k;}).map(function(c){return c.k;})).join(',');
    var dl=await SB.from('quote_lines').select(sel).in('quote_id',ids).order('line_no');
    if(dl.error){toast("The line detail could not be read.","err");return;}
    (dl.data||[]).forEach(function(l){
      if(!byQuote[l.quote_id])byQuote[l.quote_id]=[];
      byQuote[l.quote_id].push(l); lineCount++;
    });
  }
  var out=[], summaryRows=0, detailRows=0, noLineQuotes=0;
  function qCells(q,c){ return QC.map(function(col){return csvCell(col.v(q,c));}); }
  if(wantSummary){
    out.push(QC.map(function(col){return col.h;}).join(','));
    rows.forEach(function(q){ out.push(qCells(q,custOf(q)).join(',')); summaryRows++; });
  }
  if(wantDetail){
    if(wantSummary)out.push('');                           
    out.push(QC.concat(LC).map(function(col){return col.h;}).join(','));
    rows.forEach(function(q){
      var c=custOf(q), mine=byQuote[q.id]||[];
      if(!mine.length){

        out.push(qCells(q,c).concat(LC.map(function(){return '';})).join(','));
        noLineQuotes++; return;
      }
      mine.forEach(function(l){
        out.push(qCells(q,c).concat(LC.map(function(col){return csvCell(col.v(l));})).join(','));
        detailRows++;
      });
    });
  }
  RKF.exportRows(out,'M06_quotes_'+variant+'_'+TODAY_ISO+'.csv');

  toast("Exported "+rows.length+" quote(s)"+
    (wantSummary?" · "+summaryRows+" summary row(s)":"")+
    (wantDetail?" · "+detailRows+" line row(s) of "+lineCount+" line(s) read"+(noLineQuotes?" · "+noLineQuotes+" quote(s) with no lines":""):"")+
    (cost?" · with cost and margin":" · without cost or margin")+".","ok");
}

function closeHistory(){ RKF.history.close(); }

document.addEventListener('keydown',function(e){
  var mod=e.ctrlKey||e.metaKey;

  if(e.key==='Escape'&&!mod){
    var bd0=document.getElementById("modalBd");
    if(bd0&&bd0.classList.contains("show"))return;          

    var openMenus=document.querySelectorAll('.ddmenu.show');
    if(openMenus.length){
      e.preventDefault();
      Array.prototype.slice.call(openMenus).forEach(function(m){
        m.classList.remove("show");
        var wrap=m.closest?m.closest('.ddwrap'):null;
        var trg=wrap?wrap.querySelector('button[aria-expanded]'):null;
        if(trg)trg.setAttribute('aria-expanded','false');
      });
      return;
    }
    var hits=document.getElementById("nrHits");
    if(hits&&hits.style.display!=='none'){ e.preventDefault(); hits.style.display='none'; hits.innerHTML=''; return; }
    var nqh=document.getElementById("nqHits");
    if(nqh&&nqh.style.display!=='none'){ e.preventDefault(); nqh.style.display='none'; nqh.innerHTML=''; return; }
    if(creating){

      e.preventDefault(); confirmLeave(function(){ cancelNewQuote(); }); return;
    }
    if(curTab==='ws'&&openQuoteId){
      e.preventDefault();

      closeWorkspace(); return;
    }
  }
  if(mod&&(e.key==='k'||e.key==='K')){
    e.preventDefault();
    if(curTab!=='list'){ showTab('list'); if(curTab!=='list')return; }  
    var s=document.getElementById('q'); if(s){s.focus();s.select();}
    return;
  }
  if(mod&&(e.key==='s'||e.key==='S')){
    e.preventDefault();                              

    var bd=document.getElementById("modalBd");
    if(bd&&bd.classList.contains("show")){
      var ft=document.getElementById("modalFoot");

      var prim=ft?ft.querySelector('.btn-p:not([disabled])'):null;
      if(prim)prim.click();
      return;
    }
    var sv=document.getElementById('btnSave');
    if(sv&&!sv.disabled)saveDraft();
    return;
  }
  if(mod&&(e.key==='n'||e.key==='N')){
    var nb=document.getElementById('btnNewQuote');

    if(nb&&!nb.disabled){ e.preventDefault(); confirmLeave(function(){ openNewQuote(); }); }
    return;
  }
  if(e.key==='Enter'&&!e.shiftKey){
    var bd0=document.getElementById("modalBd");
    if(bd0&&bd0.classList.contains("show")&&e.target&&e.target.tagName!=='TEXTAREA'&&e.target.tagName!=='BUTTON'){
      var ft=document.getElementById("modalFoot");

      var prim=ft?ft.querySelector('.btn-p,.btn-d:not(.btn-nokey)'):null;
      if(prim&&!prim.disabled){ e.preventDefault(); prim.click(); }
    }
  }
});

document.addEventListener('keydown',function(e){
  if(e.key!=='Enter')return;
  var t=e.target;
  if(!t||!t.getAttribute)return;
  if(t.tagName==='TR'&&t.getAttribute('tabindex')==='0'){ e.preventDefault(); t.click(); }
  if(t.classList&&t.classList.contains('terr-i')){ e.preventDefault(); t.click(); }
  if(t.classList&&t.classList.contains('tab')){ e.preventDefault(); t.click(); }
  if(t.classList&&t.classList.contains('ri')){ e.preventDefault(); t.click(); }
});

(function(){
  if(!(window.RKF&&RKF.registerSurface))return;
  function mdOpen(){ var b=document.getElementById('modalBd'); return !!(b&&b.classList.contains('show')); }
  RKF.registerSurface('m06.menus',{depth:18,
    isOpen:function(){ return !mdOpen()&&document.querySelectorAll('.ddmenu.show').length>0; },
    close:function(){
      Array.prototype.slice.call(document.querySelectorAll('.ddmenu.show')).forEach(function(m){
        m.classList.remove('show');
        var wrap=m.closest?m.closest('.ddwrap'):null;
        var trg=wrap?wrap.querySelector('button[aria-expanded]'):null;
        if(trg)trg.setAttribute('aria-expanded','false');
      });
    }});
  var HITS=['custHits','refHits','nrHits','nqHits','nqRefHits'];
  RKF.registerSurface('m06.hits',{depth:16,
    isOpen:function(){ return !mdOpen()&&HITS.some(function(id){ var b=document.getElementById(id); return !!(b&&b.style.display!=='none'&&b.innerHTML); }); },
    close:function(){
      HITS.forEach(function(id){ var b=document.getElementById(id); if(b){ b.style.display='none'; b.innerHTML=''; } });
    }});
  RKF.registerSurface('m06.create',{depth:6,
    isOpen:function(){ return !mdOpen()&&creating; },
    close:function(){ confirmLeave(function(){ cancelNewQuote(); }); }});   
  RKF.registerSurface('m06.workspace',{depth:5,
    isOpen:function(){ return !mdOpen()&&curTab==='ws'&&!!openQuoteId; },
    close:function(){ closeWorkspace(); }});                                
})();

(function(){
  var f=window.openNewQuote;
  if(typeof f!=='function')return;
  window.openNewQuote=async function(){
    try{ await loadCatalogs(); }
    catch(e){ toast('Lists could not be refreshed.','warn'); }
    return f.apply(this,arguments);
  };
})();

/* ============================================================================================
   BOOT
   ============================================================================================ */
boot();
</script>
<script>

if(window.RKF&&RKF.liveMasters)RKF.liveMasters(loadCatalogs);

(function(){

  var _loader=refreshRegister;
  var _opts={channel:'m06-register'};
  if(window.RKF&&RKF.live)RKF.live(SB,['quotes','quote_approvals'],_loader,_opts);
  else if(window.RKF&&RKF.liveMasters)RKF.liveMasters(_loader,_opts);
})();
</script>
