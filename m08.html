function envErr(code,message,detail,data){
  var e=new Error(message||'The write was refused.');
  e.rpcCode=code||'UNKNOWN'; e.rpcDetail=detail||null; e.isEnvelope=true;
  e.rpcData=(data===undefined||data===null)?null:data;
  return e;
}
async function callA(name,payload){
  if(!SB)throw new Error('Connection unavailable.');
  var r=await SB.rpc(name,{p_payload:payload});
  if(r.error)throw r.error;
  var env=r.data;
  if(env===null||typeof env!=='object'||typeof env.ok==='undefined')
    throw new Error('The server reply could not be read.');

  if(env.ok!==true){ var e=env.error||{};
    throw envErr(e.code||env.error_code, e.message||env.message,
                 (e.detail===undefined||e.detail===null)?env.detail:e.detail,
                 (env.data&&typeof env.data==='object')?env.data:null); }
  return env;
}


function detailText(d){
  if(d===null||d===undefined)return "";
  if(typeof d==='string')return d;
  try{return JSON.stringify(d);}catch(e){return String(d);}
}

function errClass(code){
  var c=String(code||'');
  if(/^M0\d_/.test(c))return 'refusal';        
  if(/^AUTH_/.test(c))return 'auth';
  if(c==='VALIDATION')return 'refusal';
  if(c==='STALE_WRITE'||c==='NOT_FOUND')return 'conflict';
  if(c==='INTERNAL')return 'internal';
  return c?'refusal':'internal';               
}

function fieldRule(el,rule){
  if(!el)return;
  var r=FIELD_RULES[rule]; if(!r)return;
  var id=el.id?el.id+'-rule':null;
  var slot=id?document.getElementById(id):null;
  var v=(el.value===null||el.value===undefined)?'':String(el.value).trim();
  var bad=isNaN(v===''?0:Number(v))||!r.test(v);
  if(!slot&&bad&&id){
    slot=document.createElement('div'); slot.className='frule'; slot.id=id;
    if(el.parentNode)el.parentNode.insertBefore(slot,el.nextSibling);

  if(slot)slot.textContent=bad?(typeof r.msg==='function'?r.msg():r.msg):'';
}

  }));

  P.push(readMaster('statusvocab','the order statuses',async function(){
    var sv=await SB.rpc('rpc_config_vocab',{p_vocab:'so_status'});

    var rv=await SB.from('reference_values').select('code,list_id,label,metadata,active,sort_order').eq('active',true).order('sort_order');

    LISTS={};

var CEIL_KEYS=['max_disc_pct','applied_max_disc_pct','discount_ceiling_pct'];
function pickCeil(o){
  if(!o||typeof o!=='object')return null;
  for(var i=0;i<CEIL_KEYS.length;i++){
    var v=o[CEIL_KEYS[i]];
    if(v!==null&&v!==undefined&&v!==''&&!isNaN(Number(v)))return Number(v);
  }
  return null;
}

}

function periodOK(q){
  var p=fval("fPeriod"); if(!p)return true;
  var d=q.order_date||String(q.created_at||'').slice(0,10); if(!d)return false;
  var day=new Date(TODAY_ISO+"T00:00:00");
  function iso(x){function z(n){return(n<10?'0':'')+n;}return x.getFullYear()+'-'+z(x.getMonth()+1)+'-'+z(x.getDate());}
  if(p==="Day")return d===TODAY_ISO;
  if(p==="Week"){ var mon=new Date(day); mon.setDate(day.getDate()-((day.getDay()+6)%7)); return d>=iso(mon)&&d<=TODAY_ISO; }
  if(p==="Month")return d>=iso(new Date(day.getFullYear(),day.getMonth(),1))&&d<=iso(new Date(day.getFullYear(),day.getMonth()+1,0));
  if(p==="Quarter"){ var qs=Math.floor(day.getMonth()/3)*3; return d>=iso(new Date(day.getFullYear(),qs,1))&&d<=iso(new Date(day.getFullYear(),qs+3,0)); }
  if(p==="FY"){ var y=(day.getMonth()>=3)?day.getFullYear():day.getFullYear()-1; return d>=(y+'-04-01')&&d<=((y+1)+'-03-31'); }
  return true;
}

}

function matched(omit){
  var qv=((document.getElementById("q")||{}).value||"").trim().toLowerCase();
  if(!omit)viaTag={};
  var rows=orders.filter(listVisible);                       
  var st=Object.keys(filter.status);
  if(st.length&&omit!=='status')rows=rows.filter(function(q){return filter.status[q.status];});
  if(filter.approval&&omit!=='approval')rows=rows.filter(function(q){return apprStatus(q)===filter.approval;});
  if(filter.stale)rows=rows.filter(function(q){return !!q.totals_dirty&&!isTerminal(q.status);});
  if(grpFilter.kind==='sales')rows=rows.filter(function(q){return (repOf(q)||"")===grpFilter.val;});
  if(grpFilter.kind==='unit')rows=rows.filter(function(q){return unitOf(q)===grpFilter.val;});
  if(fval("fCustR"))rows=rows.filter(function(q){return q.customer_id===fval("fCustR");});
  if(fval("fRep"))rows=rows.filter(function(q){return (repOf(q)||"")===fval("fRep");});

  if(fval("fUnit"))rows=rows.filter(function(q){return String(q.executing_unit||'')===fval("fUnit");});
  if(fval("fPricing"))rows=rows.filter(function(q){return (q.pricing_status||"")===fval("fPricing");});
  rows=rows.filter(originOK).filter(catOK).filter(prioOK).filter(periodOK).filter(rangeOK);
  if(!qv)return rows;
  return rows.filter(function(q){
    if(directHay(q).indexOf(qv)>=0)return true;
    var ind=indirectHay(q);
    var hitKey=null;
    Object.keys(ind).forEach(function(k){ if(!hitKey&&String(ind[k]||"").toLowerCase().indexOf(qv)>=0)hitKey=k; });
    if(hitKey){ if(!omit)viaTag[q.id]=hitKey; return true; }
    return false;
  });
}

function groupRows(rows,kind){
  if(!kind)return [{key:null,label:null,rows:rows}];

  if(recApprFilter)rows=rows.filter(function(q){return apprStatus(q)===recApprFilter;});
  if(recF.status)rows=rows.filter(function(q){return q.status===recF.status;});
  if(recF.life)rows=rows.filter(function(q){return lifePhase(q)===recF.life;});
  if(recF.rep)rows=rows.filter(function(q){return (repOf(q)||'')===recF.rep;});

function recPeriodOK(q){
  var p=recF.period; if(!p)return true;
  var d=q.order_date||String(q.created_at||'').slice(0,10); if(!d)return false;
  var day=new Date(TODAY_ISO+"T00:00:00");
  function iso(x){function z(n){return(n<10?'0':'')+n;}return x.getFullYear()+'-'+z(x.getMonth()+1)+'-'+z(x.getDate());}
  if(p==="Day")return d===TODAY_ISO;
  if(p==="Week"){ var mon=new Date(day); mon.setDate(day.getDate()-((day.getDay()+6)%7)); return d>=iso(mon)&&d<=TODAY_ISO; }
  if(p==="Month")return d>=iso(new Date(day.getFullYear(),day.getMonth(),1))&&d<=iso(new Date(day.getFullYear(),day.getMonth()+1,0));
  if(p==="Quarter"){ var qs=Math.floor(day.getMonth()/3)*3; return d>=iso(new Date(day.getFullYear(),qs,1))&&d<=iso(new Date(day.getFullYear(),qs+3,0)); }
  return true;
}

      '<option value="">All</option>'+
      APPR_CHIPS.map(function(s){return '<option value="'+esc(s)+'"'+(recApprFilter===s?' selected':'')+'>'+esc(s)+'</option>';}).join('')+
    '</select></div>'+
    recOpts('recRep','Sales employee','rep',reps)+
    recOpts('recCcr','CCR','ccr',ccrs)+
    recOpts('recCreatedBy','Created by','createdBy',cbs)+
    recOpts('recApprovedBy','Approved by','approvedBy',abs)+
    '<button class="btn btn-g btn-sm clr" onclick="recClear()">Clear</button>'+

    '<span class="tawrap" style="display:inline-block;position:relative">'+
      '<button class="btn btn-g btn-sm" onclick="var p=document.getElementById(\'recColsPanel\');if(p)p.style.display=(p.style.display===\'none\'?\'block\':\'none\');">Columns</button>'+

      '<div class="colmenu" id="recColsPanel" style="display:none">'+recColsMenuHtml()+'</div>'+
    '</span>'+

    '<span class="hint" style="margin:0" role="status" aria-live="polite"><b>'+rows.length+'</b> of '+orders.length+' loaded'+
      (totalOrders!==null?(' · '+totalOrders+((_wf||_wt)?' in the date range':' in total')):'')+'</span>'+
    '<span style="flex:1"></span>'+exportControl('rec')+'</div>';

  h+='<div class="recwrap"><table class="grid rkf-table dense"><thead><tr>'+
     recCols().map(function(col){ return RKF.sort.th(recSort,col.k,esc(col.h),"recSortBy('"+col.k+"')",col.cls,null,'rth-'); }).join('')+
     '</tr></thead><tbody>';
  if(!rows.length){
    h+='<tr><td colspan="'+recCols().length+'">'+emptyState('&#128451;','No record matches these filters.','Clear filters','recClear()')+'</td></tr>';
  }
  rows.forEach(function(q){
    var a=apprOf(q);
    var x={a:a,c:custOf(q),pending:!!(a&&(a.status==='Pending'||a.status==='Escalated'))};
    h+='<tr onclick="openWorkspace(\''+q.id+'\')" tabindex="0">'+
      recCols().map(function(col){ var _h=col.v(q,x); return '<td'+(col.tcls?' class="'+col.tcls+'"':(col.cls?' class="'+col.cls+'"':''))+(col.tcls==='wr'?' title="'+String(_h).replace(/<[^>]+>/g,'')+'"':'')+'>'+_h+'</td>'; }).join('')+  
      '</tr>';
  });
  h+='</tbody></table></div>';   
  z.innerHTML=h;
}
function recClear(){
  recApprFilter="";
  Object.keys(recF).forEach(function(k){ recF[k]=""; });

  if((typeof readDMY==='function')&&(readDMY("fFrom")||readDMY("fTo"))){ clearDateWindow(); return; }
  renderRecords();
}
function toggleRecCompleted(){ recIncludeCompleted=!recIncludeCompleted; renderRecords(); }
</script>
<script>

async function openWorkspace(id,fromSeam){

  dropTempRow();
  creating=false;                     
  lineState={}; lineVer={}; lineSeq={}; lineDeb={};
  openQuoteId=id; selId=id; hdrPatch={}; linePatch={}; hcDraft=null; pendingUom=null;
  var s=document.getElementById("wsScroll");
  if(s)s.innerHTML='<div class="surf">Loading the order…<div class="skel" style="max-width:300px;margin:14px auto"></div><div class="skel" style="max-width:240px;margin:0 auto"></div></div>';
  document.getElementById("listZone").style.display='none';
  document.getElementById("wsZone").style.display='flex';
  document.getElementById("recZone").style.display='none';
  curTab='ws';
  markTab('ws');
  await loadOrder(id);
  autoDefaultOne();               

  if(Q&&window.RKF&&RKF.recents)RKF.recents.push('Order',Q.so_no||String(id).slice(0,8),(Q.so_no||'Order')+' · '+custName(Q));
  renderTabState();
  renderWorkspace(); renderWsActions();
  if(fromSeam&&Q)toast("Opened "+(Q.so_no||'the order')+".","ok");

  if(Q&&Q.totals_dirty&&LINES.length&&linesEditable()){
    toast("Prices out of date — recomputing.","warn");
    await autoReprice(true);
    toast("Prices brought up to date.","ok");
  }
}

var ADDR_PURPOSE={bill_to_address_id:'Billing', ship_to_address_id:'Shipping'};
var hdrSeeded={};                    
function addrOfType(rows,type){
  return (rows||[]).filter(function(a){ return String(a.addr_type||'')===type; });
}

function soleOrFlagged(rows,flag){
  if(!rows||!rows.length)return null;
  if(rows.length===1)return rows[0];
  var f=rows.filter(function(r){ return r[flag]===true; });
  return f.length===1?f[0]:null;
}
function seedHdr(field,val){
  if(val===null||val===undefined||val==='')return;
  if(Q[field])return;                
  hdrPatch[field]=val; hdrSeeded[field]=true;
}
function autoDefaultOne(){
  hdrSeeded={};
  if(!Q||!canEditHeader(Q))return;

  var _c=custOf(Q); if(_c&&_c.ccr_emp)seedHdr('ccr_emp',_c.ccr_emp);

  if(_c&&_c.sales_emp)seedHdr('salesperson_emp',_c.sales_emp);
  var addrs=(CUSTADDR[Q.customer_id]||[]), cons=(CUSTCON[Q.customer_id]||[]);
  if(!addrs.err){
    Object.keys(ADDR_PURPOSE).forEach(function(field){
      var pick=soleOrFlagged(addrOfType(addrs,ADDR_PURPOSE[field]),'is_default');
      if(pick)seedHdr(field,pick.address_id);
    });
  }
  if(!cons.err){
    var c=soleOrFlagged(cons,'is_primary');
    if(c){ seedHdr('bill_contact_id',c.contact_id); seedHdr('ship_contact_id',c.contact_id); }
  }
}

var nqOpened=null;
function nqSnapshotOpened(){
  nqOpened={};
  ["nqCustTA","nqRefTA","nqUnit","nqExu","nqCat","nqRDD","nqPoNo","nqPoDt","nqPrio",
   "nqPt","nqIns","nqScope","nqTerms","nqMod","nqSales","nqCcr","nqRefComm","nqPartyUnit"].forEach(function(id){
    var e=document.getElementById(id); if(e)nqOpened[id]=String(e.value||"");
  });
}
function createTyped(){
  if(!creating)return false;
  if(nqCust||nqRefId)return true;
  if(nqOrigin==='FROM_QUOTE'&&nqQuote)return true;

  var ids=["nqCustTA","nqRefTA","nqUnit","nqExu","nqCat","nqRDD","nqPoNo","nqPoDt","nqPrio",
           "nqPt","nqIns","nqScope","nqTerms","nqMod","nqSales","nqCcr","nqRefComm","nqPartyUnit"];
  for(var i=0;i<ids.length;i++){
    var e=document.getElementById(ids[i]); if(!e)continue;
    var now=String(e.value||"").trim();

    var was=(nqOpened&&nqOpened[ids[i]]!==undefined)?String(nqOpened[ids[i]]).trim():null;
    if(was===null){ if(now!=="")return true; continue; }
    if(now!==was)return true;
  }
  return false;
}

function seedPending(){
  return Object.keys(hdrSeeded).some(function(k){ return hdrPatch.hasOwnProperty(k); });
}
function savable(){ return dirty()||seedPending(); }
function dirty(){
  return Object.keys(hdrPatch).filter(function(k){ return !hdrSeeded[k]; }).length>0
      || Object.keys(linePatch).length>0

      || hcDirty()
      || createTyped();
}

function hcDirty(){
  if(!hcDraft)return false;
  if(hcDraft.length!==HCROWS.length)return true;
  for(var i=0;i<hcDraft.length;i++){
    var d=hcDraft[i], s=HCROWS[i];
    if(!s)return true;
    if(String(d.code||'')!==String(s.charge_code||''))return true;
    if(Number(d.amount||0)!==Number(s.amount||0))return true;
  }
  return false;
}

function hdrCur(key,stored){
  return hdrPatch.hasOwnProperty(key)?hdrPatch[key]:stored;
}

var MONEY_HDR_KEYS=["deal_discount_pct","deal_commission_pct","bill_to_address_id","validity_days"];
var hdrDeb={t:null};
function queueHdrSave(){
  if(!Q||isFrozen(Q)||!canEditHeader(Q))return;   
  if(hdrDeb.t)clearTimeout(hdrDeb.t);
  hdrDeb.t=setTimeout(function(){ hdrDeb.t=null; runHdrSave(); },LINE_DEBOUNCE_MS);
}
async function runHdrSave(){
  if(!Q||!actorEmp||isFrozen(Q)||!canEditHeader(Q))return;
  var keys=Object.keys(hdrPatch).filter(function(k){return MONEY_HDR_KEYS.indexOf(k)>=0;});
  if(!keys.length)return;
  if(Q.updated_at===null||Q.updated_at===undefined||Q.updated_at==='')return;
  var sub={}; keys.forEach(function(k){ sub[k]=hdrPatch[k]; });
  var patch=normPatch(sub,HDR_KEYS);
  if(!Object.keys(patch).length)return;
  try{
    var env=await callA(RPC.UPD_HDR,{p_actor_emp:actorEmp,so_id:Q.id,
                                     p_expected_updated_at:Q.updated_at,patch:patch});
    keys.forEach(function(k){ Q[k]=hdrPatch[k]; delete hdrPatch[k]; delete hdrSeeded[k]; });

    var nu=env&&env.data&&env.data.updated_at; if(nu)Q.updated_at=nu;

    if(LINES.length)await autoReprice(true);
    var lf0=document.getElementById('lifeStrip'); if(lf0&&lf0.parentNode)lf0.parentNode.removeChild(lf0);
    var ib=document.getElementById('idBar'); if(ib)ib.outerHTML=zIdBar()+zLifecycle();
    flagDirty();
  }catch(ex){

    var hstore=(ex&&ex.rpcData&&ex.rpcData.header&&typeof ex.rpcData.header==='object')?ex.rpcData.header:null;
    var hdrCtl={deal_commission_pct:'dealComm',
                bill_to_address_id:'selBillAddr',order_date:'qDate'};
    var hact=document.activeElement;
    keys.forEach(function(k){
      delete hdrPatch[k];
      if(!hstore||hstore[k]===undefined)return;
      Q[k]=hstore[k];
      var ctl=document.getElementById(hdrCtl[k]);
      if(!ctl||ctl===hact||ctl.tagName==='DIV')return;
      ctl.value=(hstore[k]===null||hstore[k]===undefined)?''
               :(k==='order_date'?isoToDMY(hstore[k]):String(hstore[k]));
    });
    if(hstore&&hstore.updated_at)Q.updated_at=hstore.updated_at;
    flagDirty(); renderWsActions();
    var lf1=document.getElementById('lifeStrip'); if(lf1&&lf1.parentNode)lf1.parentNode.removeChild(lf1);
    var ib2=document.getElementById('idBar'); if(ib2)ib2.outerHTML=zIdBar()+zLifecycle();
    if(ex&&ex.rpcCode==='STALE_WRITE'){ offerReload(ex); return; }
    toast((ex&&ex.rpcData&&ex.rpcData.reason)?wordy(ex.rpcData.reason):friendlyErrA(ex),"err");
  }
}

function markHdr(k,v){ hdrPatch[k]=v; delete hdrSeeded[k]; renderWsActions(); flagDirty();
  if(MONEY_HDR_KEYS.indexOf(k)>=0)queueHdrSave(); }

function flagDirty(){
  var e=document.getElementById("dirtyFlag");
  if(e)e.innerHTML=dirty()
    ? '<span class="dirtychip">unsaved edits</span>'
    : '';
}
function wsState(){
  if(!openQuoteId)return emptyState('&#128196;','No order open.',(can(CAP.CREATE)?'+ New order':''),'openNewQuote()');
  if(loadErr.doc)return '<div class="surf err">Could not load the order. <button class="link-btn" onclick="refreshOrder()">Retry</button>.</div>';
  if(!Q)return '<div class="surf">Loading…</div>';
  return null;
}
function renderWorkspace(){
  var s=document.getElementById("wsScroll"); if(!s)return;
  if(creating)return;                 
  var st=wsState(); if(st){ s.innerHTML=st; return; }

  var bands=[['the order header',zHeader],['customer and terms',zTerms],['the line items',zLines],
             ['the charges',zChargesGov],
             ['the deal band',zDeal],['the approval gate',zGate],['the totals',zTotals],
             ['notes and history',zPanels]];
  var out='';
  for(var i=0;i<bands.length;i++){
    try{ out+=bands[i][1](); }
    catch(ex){ out+='<div class="band"><div class="band-bd"><div class="wbanner hard" style="margin:0">'+

      esc(RKF.inputLaw.sc(String(bands[i][0]||'').trim()))+' could not be drawn.'+
      '</div></div></div>'; }
  }
  s.innerHTML=out;
  mountWsFields();
}

function mountWsFields(){
  var slot=document.getElementById("qDateSlot");
  if(slot&&!slot.getAttribute('data-mounted')){
    slot.innerHTML='<div class="ro lockro" id="qDate"><span class="lk" aria-hidden="true">&#128274;</span>'+
      ((Q&&Q.order_date)?esc(isoToDMY(Q.order_date)):'<span class="na">not set</span>')+'</div>';
    slot.setAttribute('data-mounted','1');
  }

  var pd=document.getElementById("poDateSlot");
  if(pd&&!pd.getAttribute('data-mounted')){
    pd.innerHTML=(typeof dateFieldHTML==='function')?dateFieldHTML('poDate')
      :'<input class="in" id="poDate" placeholder="DD-MM-YYYY"/>';
    var pe=document.getElementById('poDate');
    if(pe){

      var _pdv=hdrCur('customer_po_date',Q?Q.customer_po_date:null);
      pe.value=_pdv?isoToDMY(String(_pdv).slice(0,10)):'';
      if(!(canEditHeader(Q)||attrOK())){ pe.disabled=true; pe.title=canEditHeader(Q)?'':attrWhy(); }
      pe.onchange=function(){ hdrAct('customer_po_date',readDMY('poDate')); };
    }
    pd.setAttribute('data-mounted','1');
  }
  var rd=document.getElementById("reqDelSlot");
  if(rd&&!rd.getAttribute('data-mounted')){
    rd.innerHTML=(typeof dateFieldHTML==='function')
      ? dateFieldHTML('reqDel')
      : '<input class="in" id="reqDel" placeholder="DD-MM-YYYY"/>';
    var el=document.getElementById('reqDel');
    if(el){

      var _rdv=hdrCur('required_delivery_date',Q?Q.required_delivery_date:null);
      el.value=_rdv?isoToDMY(_rdv):'';

      if(!(canEditHeader(Q)||attrOK())){ el.disabled=true; el.title=attrWhy(); }
      el.onchange=function(){ hdrAct('required_delivery_date',readDMY('reqDel')); };
    }
    rd.setAttribute('data-mounted','1');
  }
  flagDirty();
}

var LIFE_STEPS=["Draft","Pending Approval","Approved","Confirmed"];
var LIFE_ENDS=["Rejected","Credit-Hold","Cancelled"];
function zLifecycle(){
  if(!Q)return '';
  var cur=String(Q.status||'');
  var at=LIFE_STEPS.indexOf(cur);
  var h='<div class="life" id="lifeStrip" role="list" aria-label="Order lifecycle">';
  LIFE_STEPS.forEach(function(st,i){
    var cls=(st===cur)?'now':((at>=0&&i<at)?'done':'');
    h+='<span role="listitem"'+(cls?' class="'+cls+'"':'')+'>'+esc(st)+'</span>';
  });
  LIFE_ENDS.forEach(function(st){
    h+='<span role="listitem"'+(st===cur?' class="now"':'')+'>'+esc(st)+'</span>';
  });
  return h+'</div>';
}
function zIdBar(){

  var daysLeft=(Q.days_to_delivery===null||Q.days_to_delivery===undefined)?null:Number(Q.days_to_delivery);
  return '<div class="idbar" id="idBar"><span class="qno lockro"><span class="lk" aria-hidden="true">&#128274;</span>'+esc(Q.so_no||'(number not allotted)')+'</span>'+
    '<span class="revchip">rev '+esc(String(Q.revision_no))+'</span>'+
    '<span class="revchip">'+esc(Q.so_origin==='FROM_QUOTE'?'From quote':'Direct')+
      (Q.direct_so_category?(' · '+esc(labelOf(Q.direct_so_category)||Q.direct_so_category)):'')+'</span>'+
    statusTag(Q.status)+
    (Q.totals_dirty?'<span class="dirtychip">totals not recomputed</span>':'')+

    (Q.pricing_status?'<span class="tg-s" title="Pricing status">'+esc(enumWord(Q.pricing_status))+'</span>':'')+
    '<span id="dirtyFlag" role="status" aria-live="polite"></span>'+
    '<span style="flex:1"></span>'+

    '<span class="mini">unit <b>'+esc(Q.booking_unit||'—')+'</b></span>'+
    '<span class="mini">dated <b>'+(Q.order_date?esc(isoToDMY(Q.order_date)):'—')+'</b></span>'+
    '<span class="mini">value <b>'+(Q.grand_total===null||Q.grand_total===undefined?'n/a':esc(rsPlain(Q.grand_total)))+'</b></span>'+
    '<span class="mini">weight <b>'+(Q.total_weight_mt===null||Q.total_weight_mt===undefined?'n/a':esc(Number(Q.total_weight_mt).toLocaleString('en-IN',{maximumFractionDigits:3})))+' MT</b></span>'+
    '<span class="mini">lines <b>'+LINES.length+'</b></span>'+
    (daysLeft!==null?'<span class="mini"'+(daysLeft<=0?' style="color:var(--accent)"':'')+'>delivery <b>'+(daysLeft<0?('over by '+(-daysLeft)+'d'):(daysLeft+'d left'))+'</b></span>':'')+

    (canCost()?(function(){ var _mg=linesMargin(LINES);
        return (_mg===null||_mg===undefined)?'':'<span class="mini">margin <b>'+rs0(_mg)+'</b></span>'; })():'')+
    '</div>';
}
function zHeader(){
  var c=custOf(Q);

  var daysLeft=(Q.days_to_delivery===null||Q.days_to_delivery===undefined)?null:Number(Q.days_to_delivery);
  var h=zIdBar()+zLifecycle();

  h+='<div class="band hdrband"><div class="band-bd"><div class="hdrrow">';

  if(Q.from_lead_id)
    h+='<button class="btn btn-g btn-sm" id="btnFromLead" onclick="openLead(\''+esc(Q.from_lead_id)+'\')">&#8599; From enquiry '+
       (LEADROW&&LEADROW.lead_code?'<b>'+esc(LEADROW.lead_code)+'</b>':'(code not readable)')+'</button>';
  else

    h+='<span class="hint" style="margin:0" id="noLeadNote">no originating enquiry</span>';

  h+='<span class="ro oneline" title="'+esc(idStripPlain(Q,c))+'">'+

     '<b class="m01v">'+esc(custName(Q))+'</b>'+(c?' · <b class="m01v">'+esc(c.customer_code)+'</b> · <b class="m01v">'+esc(c.status)+'</b>':'')+
     (custDistrict(Q)?' · '+esc(custDistrict(Q)):'')+

     ' · FY <b>'+esc(Q.fy||'—')+'</b>'+
     ' · salesperson <b>'+esc(repName(Q))+'</b>'+(repIsFallback(Q)?' <span class="hint" style="margin:0">(raised by)</span>':'')+
     (ccrName(Q)?' · CCR <b>'+esc(ccrName(Q))+'</b>':'')+
     ' · raised by '+esc(empName(Q.created_by))+' on '+esc(stampOf(Q.created_at))+
     ' · last updated '+esc(stampOf(Q.updated_at))+
     (Q.approved_by_name?' · approved by <b>'+esc(Q.approved_by_name)+'</b>'+(Q.approved_at?' on '+esc(stampOf(Q.approved_at)):''):'')+
     '</span>';
  h+='</div>';

  if(isFrozen(Q)){

    h+=can(CAP.REVISE)
      ? '<div class="wbanner soft" style="margin-top:6px">'+esc(Q.status)+' — a change creates revision '+esc(String((Q.revision_no||0)+1))+'.</div>'
      : '<div class="wbanner soft" style="margin-top:6px">'+esc(Q.status)+' — terms are locked.</div>';
  }
  var gb=gateBanner(c);
  if(gb)h+=gb;
  return h+'</div></div>';
}
function priorQuotes(){
  if(!Q||!Q.customer_id)return [];
  return orders.filter(function(x){return x.customer_id===Q.customer_id&&x.id!==Q.id;})
               .sort(function(a,b){return String(b.created_at||"").localeCompare(String(a.created_at||""));});
}
function openLead(id){ location.href=embedded('m05.html?lead='+encodeURIComponent(id)); }

var STATECODE={};                                
var NOT_SET='- not set -';                       
var BLANK_PRE_S07={};                            

BLANK_PRE_S07[LIST.PT]=false;
BLANK_PRE_S07[LIST.INS]=false;

function notSetLabel(){
  var ls=Object.keys(LISTS);
  for(var i=0;i<ls.length;i++){
    var rows=LISTS[ls[i]]||[];
    for(var j=0;j<rows.length;j++){
      var m=rows[j]&&rows[j].metadata;
      if(m&&String(m.is_not_set)==='true'&&rows[j].label)return rows[j].label;
    }
  }
  return NOT_SET;
}

function listDecl(listId){
  var rows=LISTS[listId]||[];
  for(var i=0;i<rows.length;i++){
    var m=rows[i]&&rows[i].metadata;
    if(m&&m.selection_rule)return m;
  }
  return null;
}
function blankPolicy(listId){
  var d=listDecl(listId);
  if(d)return {allow:String(d.selection_rule).toLowerCase()!=='mandatory', label:d.unset_label||notSetLabel(), governed:true};
  return {allow:BLANK_PRE_S07[listId]!==false, label:notSetLabel(), governed:false};
}

function rqMark(listId){ return blankPolicy(listId).allow?'':' <span class="rq">*</span>'; }

function isNotSetRow(v){ return !!(v&&v.metadata&&String(v.metadata.is_not_set)==='true'); }
function notSetCode(listId){
  var rows=LISTS[listId]||[];
  for(var i=0;i<rows.length;i++)if(isNotSetRow(rows[i]))return rows[i].code;
  return null;
}
function optList(listId,cur){
  var rows=LISTS[listId]||[];
  var pol=blankPolicy(listId);

  var ns=notSetCode(listId);
  if(ns&&cur===ns)cur='';
  var h='';
  if(pol.allow)h+='<option value=""'+((cur===null||cur===undefined||cur==="")?' selected':'')+'>'+esc(pol.label)+'</option>';
  rows.forEach(function(v){ if(isNotSetRow(v))return;   
    h+='<option value="'+esc(v.code)+'"'+(cur===v.code?' selected':'')+'>'+esc(v.code+' · '+v.label)+'</option>'; });
  if(cur&&!rows.filter(function(v){return v.code===cur;}).length)
    h+='<option value="'+esc(cur)+'" selected>'+esc(cur)+' — no longer on the published list</option>';
  return h;
}
function provTag(listId){ return PROV[listId]?' <span class="p2note">provisional</span>':''; }

function creditChip(){
  var c=custOf(Q); if(!c)return '<span class="na">unreadable</span>';
  var lim=(c.credit_limit===null||c.credit_limit===undefined)?null:Number(c.credit_limit);
  var used=(c.credit_used===null||c.credit_used===undefined)?null:Number(c.credit_used);
  if(lim===null)return '<span class="na">not set</span>';
  var left=(used===null)?null:(lim-used);
  return '<b>'+(left===null?'not available':rsPlain(left))+'</b> left'+
         (c.credit_hold?' <span class="flag bad">on credit hold</span>':'')+
         (left!==null&&Number(Q.grand_total||0)>left?' '+msym('This order is over the credit left for this customer.','bad'):'');
}
function creditPlain(){
  var t=creditNote();
  return String(t).replace(/<[^>]*>/g,'').replace(/\s+/g,' ').trim();
}
function creditNote(){
  var c=custOf(Q); if(!c)return '<span class="na">this customer record cannot be read</span>';
  var lim=(c.credit_limit===null||c.credit_limit===undefined)?null:Number(c.credit_limit);
  var used=(c.credit_used===null||c.credit_used===undefined)?null:Number(c.credit_used);
  if(lim===null)return '<span class="na">credit limit not set</span>';
  var head=(used===null)?null:(lim-used);

  return 'limit '+rsPlain(lim)+' · used '+(used===null?'not available':rsPlain(used))+
         ' · left <b>'+(head===null?'not available':rsPlain(head))+'</b>'+

function custNote(c){
  if(!c)return 'this customer record cannot be read';
  var addrs=CUSTADDR[c.id]||[];
  var bills=addrs.filter(function(a){return a.addr_type==='Billing';});
  var billLive=bills.filter(function(a){return a.is_default;})[0]||bills[0]||null;

  var forThisQuote=!!(Q&&Q.customer_id===c.id);
  var S=(forThisQuote&&DOCSNAP&&typeof DOCSNAP==='object')?DOCSNAP:null;
  var snapCust=(S&&S.customer&&typeof S.customer==='object')?S.customer:null;
  var frozen=!!snapCust;                               
  /* GSTIN */
  var gstin=frozen?(snapCust.gstin||null):(c.gstin||null);

  var addrTxt=frozen?snapAddrLine(S.bill_to_address):null;
  if(addrTxt===null&&!frozen)addrTxt=snapAddrLine(billLive);

  var ptTxt=null;
  if(frozen&&S.payment_terms&&S.payment_terms.label)ptTxt=S.payment_terms.label;
  else if(frozen&&S.payment_terms&&S.payment_terms.code)ptTxt=String(S.payment_terms.code);
  else if(!frozen&&c.terms_code)ptTxt=String(codeLabel(c.terms_code)).replace(/<[^>]+>/g,'');

  var snap=(forThisQuote&&Q.customer_tally_alias)?Q.customer_tally_alias:null;

  var out='<b>'+esc(c.customer_code)+'</b> · '+esc(c.status)+' · '+esc(gateWord(c))+
    (c.district?' · '+esc(c.district):'')+

    (gstin?(' · GSTIN <b class="m01v">'+esc(gstin)+'</b>'):' · <span class="na">GSTIN not available</span>')+
    ((c.credit_days!==null&&c.credit_days!==undefined)?' · '+esc(String(c.credit_days))+' credit days':'')+
    (c.ccr_emp?' · CCR '+esc(empName(c.ccr_emp)):'')+
    (snap&&c.tally_alias&&c.tally_alias!==snap
      ? ' <span class="flag" title="Master now reads '+esc(c.tally_alias)+'">accounts name differs from master</span>' : '');

  if(forThisQuote){
    var provTail=(frozen?'frozen on this order':(Q.status&&Q.status!=='Draft'
         ?(''+(DOCSNAPERR?(' (not available)'):''))
         :''));
    if(provTail)out+=' · <span style="opacity:.8">'+provTail+'</span>';
  }
  if(frozen&&gstin&&c.gstin&&c.gstin!==gstin)out+=' <span class="flag" title="Master now reads GSTIN '+esc(c.gstin)+'">GSTIN differs from master</span>';
  return out;
}

function refType(){
  var el=document.getElementById('refTA'); if(!el)return;
  var v=(el.value||'').trim().toLowerCase();
  var box=document.getElementById('refHits'); if(!box)return;
  if(v.length<1){
    box.style.display='none'; box.innerHTML='';

    var refHeld=(hdrPatch.hasOwnProperty('referrer_id')?hdrPatch.referrer_id:(Q&&Q.referrer_id))||'';
    if(refHeld)clearReferrer();
    return;
  }

  var all=REFERRERS.filter(function(r){return refMatch(r,v);});
  var hits=all.slice(0,SEARCH_CAP);
  box.style.display='block';
  box.innerHTML=hits.length
    ? hits.map(function(r){return refHitHtml(r,'pickRef(\''+esc(r.id)+'\')');}).join('')+capNote(all.length)
    : '<div class="hint" style="padding:6px 9px">no active referrer matches</div>';

function pickRef(id){
  var r=REFMAP[id]; if(!r)return;

  var p=refNorm(r);
  var dc=document.getElementById('dealComm');
  var cur=(hdrPatch.hasOwnProperty('deal_commission_pct')?hdrPatch.deal_commission_pct:Q.deal_commission_pct);

async function saveAddContact(){
  var btn=document.getElementById('acSave');

             name:RKF.inputLaw.pc(ADDC.name),mobile:ADDC.mobile,email:ADDC.email||''};

function zChargesGov(){
  var h='<div class="band"><div class="band-hd">Charges<span class="sp"></span></div><div class="band-bd">'+
        '<div class="frow"><div class="ff w2" style="flex:1 1 100%">';
  var TAIL='</div></div></div></div>';
  if(masterErr('lists'))
    return h+'<div class="ro"><span class="na">'+esc(masterWhy('lists','The list of charges'))+'</span></div>'+TAIL;
  var list=gcList();
  if(!list.length)
    return h+'<div class="ro"><span class="na">no charge list is published</span></div>'+TAIL;   
  var ed=chargesEditable();
  var storedTotal=0; HCROWS.forEach(function(r){ storedTotal+=Number(r.amount||0); });
  if(hcDraft===null){

    h+='<div class="ro">';
    if(HCROWS.err)h+='<span class="na">The charges could not be read.</span>';
    else if(!HCROWS.length)h+='<span class="na">no charges on this order</span>';   
    else h+=HCROWS.map(function(r){
      return '<span style="margin-right:14px"><b>'+esc(labelOf(r.charge_code)||r.charge_code)+'</b> ('+esc(r.charge_code)+') '+rsPlain(r.amount)+'</span>';
    }).join('')+' &middot; total <b>'+rsPlain(storedTotal)+'</b>';
    h+='</div>';
    h+='<div style="margin-top:6px"><button class="btn btn-g btn-sm" id="btnEditCharges" onclick="startChargesEdit()"'+
       (ed?'':' disabled title="'+esc(chargesBlockReason())+'" aria-describedby="hcWhy"')+'>&#9998; Edit charges</button>'+
       (ed?'':'<span class="vh" id="hcWhy">'+esc(chargesBlockReason())+'</span>')+'</div>';

    return h+TAIL;
  }

  function codeOpts(cur,usedElsewhere){
    var hh='<option value=""'+(cur?'':' selected')+'>- pick a charge -</option>';
    list.forEach(function(v){
      if(usedElsewhere.indexOf(v.code)>=0&&v.code!==cur)return;
      hh+='<option value="'+esc(v.code)+'"'+(cur===v.code?' selected':'')+'>'+esc(v.code+' · '+(v.label||v.code))+'</option>';
    });
    if(cur&&!list.filter(function(v){return v.code===cur;}).length)
      hh+='<option value="'+esc(cur)+'" selected>'+esc(cur)+' — retired</option>';   
    return hh;
  }
  hcDraft.forEach(function(row,i){
    var used=hcDraft.filter(function(x,j){return j!==i&&x.code;}).map(function(x){return x.code;});
    h+='<div class="hcrow">'+
       '<select class="in" id="hcCode-'+i+'" onchange="chgCode('+i+',this.value)" aria-label="Charge code">'+codeOpts(row.code,used)+'</select>'+
       '<input class="in" id="hcAmt-'+i+'" type="number" min="0" step="0.01" value="'+esc(row.amount===''?'':String(row.amount))+'" onchange="chgAmt('+i+',this.value)" aria-label="Charge amount" placeholder="amount"/>'+
       '<button class="iconbtn d" id="hcDel-'+i+'" onclick="removeChargeRow('+i+')">&#128465;</button>'+
       '</div>';
  });
  var canAdd=hcDraft.length<list.length;
  h+='<div class="hcrow">'+
     '<button class="iconbtn" id="btnAddCharge" onclick="addChargeRow()"'+(canAdd?'':' disabled title="Every published charge is already on the set."')+'>+ Add a charge</button>'+
     '<span class="hint" style="margin:0">draft total <b id="hcDraftTotal">'+rsPlain(hcDraftTotal())+'</b></span>'+
     '<span style="flex:1"></span>'+
     '<button class="btn btn-g btn-sm" id="btnCancelCharges" onclick="cancelCharges()">Cancel</button>'+
     '<button class="btn btn-p btn-sm" id="btnSaveCharges" onclick="saveCharges()">Save charges</button>'+
     '</div>';

  return h+TAIL;
}
function hcDraftTotal(){
  var t=0; (hcDraft||[]).forEach(function(r){ if(r.amount!==''&&!isNaN(Number(r.amount)))t+=Number(r.amount); });
  return t;
}
function startChargesEdit(){
  if(!chargesEditable()){ toast(chargesBlockReason(),"err"); return; }
  hcDraft=HCROWS.map(function(r){return {code:r.charge_code,amount:Number(r.amount||0)};});
  renderWorkspace(); renderWsActions();
}
function cancelCharges(){ hcDraft=null; renderWorkspace(); renderWsActions(); }
function chgCode(i,v){ if(hcDraft&&hcDraft[i])hcDraft[i].code=v; renderWorkspace(); }
function chgAmt(i,v){ if(hcDraft&&hcDraft[i])hcDraft[i].amount=(v===''?'':Number(v));
  var e=document.getElementById('hcDraftTotal'); if(e)e.innerHTML=rsPlain(hcDraftTotal()); }
function addChargeRow(){
  if(!hcDraft)return;
  var used=hcDraft.map(function(x){return x.code;});
  var free=gcList().filter(function(v){return used.indexOf(v.code)<0;});
  hcDraft.push({code:(free.length?free[0].code:''),amount:''});
  renderWorkspace();
}
function removeChargeRow(i){ if(!hcDraft)return; hcDraft.splice(i,1); renderWorkspace(); }

function gateOf(c){
  if(!c)return {level:'ok',word:''};
  var g=GATE[c.status], l=g?(g.so||'ok'):'ok', w='is '+c.status;
  if(c.credit_hold){ var h=GATE['Credit-hold'], hl=h?(h.so||'ok'):'ok';
    if((hl==='block'&&l!=='block')||(hl==='warn'&&l==='ok')){ l=hl; w='is on credit hold'; } }
  return {level:l, word:w};
}
function gateLevel(c){ return gateOf(c).level; }
function gateIs(c){ return gateOf(c).word; }
function gateWord(c){
  var l=gateLevel(c);
  return l==='block'?'cannot take an order right now':(l==='warn'?'can take an order, with a caution':'clear to order');
}
function gateBanner(c){
  if(!c)return '';
  var l=gateLevel(c);
  if(l==='block')
    return '<div class="wbanner hard" style="margin-top:9px"><b>'+esc(c.name)+' '+esc(gateIs(c))+', so this order cannot be confirmed.</b></div>';
  if(l==='warn')

    return '<div class="wbanner soft" style="margin-top:9px"><b>'+esc(c.name)+' '+esc(gateIs(c))+'</b> — the order is allowed.</div>';
  if(c.credit_hold)
    return '<div class="wbanner soft" style="margin-top:9px"><b>'+esc(c.name)+' is on credit hold</b> — the order is allowed.</div>';
  return '';
}
function progressBlockReason(q){
  var c=custOf(q); if(!c)return '';
  if(gateLevel(c)==='block')return c.name+' '+gateIs(c)+'.';

  return '';
}

var CUST_SEARCH_FIELDS=[
  {n:'name',     g:function(c){return c.name;}},
  {n:'code',     g:function(c){return c.customer_code;}},
  {n:'GSTIN',    g:function(c){return c.gstin;}},
  {n:'PAN',      g:function(c){return c.pan;}},

  {n:'city',     g:function(c){return c.city;}},
  {n:'district', g:function(c){return c.district;}}
];
function custMatch(c,v){ return fieldMatch(CUST_SEARCH_FIELDS,c,v); }
function custHitHtml(c,pickJs){
  return '<button class="hit" onclick="'+pickJs+'"><b>'+esc(c.name)+'</b> · '+esc(c.customer_code)+' · '+esc(c.status)+
    (c.district?' · '+esc(c.district):'')+(c.mobile?' · '+esc(c.mobile):'')+(c.gstin?' · '+esc(c.gstin):'')+'</button>';
}
function custType(){
  var el=document.getElementById("custTA"); if(!el)return;
  var v=(el.value||"").trim().toLowerCase();
  var box=document.getElementById("custHits");
  if(v.length<1){ box.style.display='none'; box.innerHTML=''; return; }

  var all=CUSTS.filter(function(c){return c.partner_side!=='Creditor'&&custMatch(c,v);});
  var hits=all.slice(0,SEARCH_CAP);
  box.style.display='block';
  box.innerHTML=hits.length
    ? hits.map(function(c){return custHitHtml(c,'pickCust(\''+esc(c.id)+'\')');}).join('')+capNote(all.length)
    : '<button class="hit mk" onclick="openInlineCreate()">No match — create this customer</button>';
}
function pickCust(id){
  var c=CUSTMAP[id]; if(!c)return;
  document.getElementById("custHits").style.display='none';
  var note=document.getElementById("custPickNote");
  if(c.id===Q.customer_id){
    document.getElementById("custTA").value=c.name;
    if(note)note.innerHTML='<b>'+esc(c.customer_code)+'</b> · '+esc(c.status)+' · '+esc(gateWord(c));
    return;
  }
  document.getElementById("custTA").value=custName(Q);
  if(note)note.innerHTML='<span style="color:var(--accent)">The customer cannot change. Raise a new order.</span>';
  toast("The customer cannot change. Raise a new order.","warn");
}

<script>

function linesEditable(){
  if(!Q)return false;
  if(isTerminal(Q.status)||linesFrozen(Q))return false;   

  return can(CAP.EDIT);
}
function lineBlockReason(){
  if(!Q)return "Open an order first.";

  if(isTerminal(Q.status))return "This order is "+Q.status+", so its lines cannot be changed.";
  if(linesFrozen(Q))return "This order is "+Q.status+". Lines are locked.";

  if(!can(CAP.EDIT))return capWhy(CAP.EDIT,"price an order line");
  return "";
}

function notPriced(l){
  return l.pricing_stale===true
      || l.rate===null||l.rate===undefined||Number(l.rate)===0
      || l.amount===null||l.amount===undefined||Number(l.amount)===0;
}
function unpricedLines(){
  return LINES.filter(notPriced);
}

function persistedRefusalReason(l){
  var r=l&&l.price_refusal_reason;
  return (r===null||r===undefined)?'':String(r);
}
function lp(id,k,fallback){ return (linePatch[id]&&linePatch[id].hasOwnProperty(k))?linePatch[id][k]:fallback; }

var LINE_DEBOUNCE_MS=300;      
var NEWKEY='__new__';          

var NEW_INFLIGHT=false, NEW_SENT=null;
var lineDeb={};                
var lineSeq={};                
var lineVer={};                
var lineState={};              
var TEMPROW=null;              

var LINE_REASON={ qty:'User Changed Qty', customer_length:'User Changed Length',
  disc:'User Changed Discount', item_id:'User Changed Item', customer_uom:'User Changed UOM',
  quoted_uom:'User Changed UOM', sw_basis:'User Changed SW', sw_value:'User Changed SW',
  rate:'User Changed Rate', clear_rate_override:'User Changed Rate' };
var NEW_LINE_REASON='New Line', AUTO_REPRICE_REASON='Auto Reprice';

var LINE_NUMERIC=['qty','customer_length','disc','sw_value','rate'];
var LINE_CLEARED={cleared:true};   
function lineVal(k,v){
  if(k==='clear_rate_override')return true;
  if(v===undefined)return undefined;                                          
  if(v===''||v===null)return (LINE_NUMERIC.indexOf(k)>=0)?LINE_CLEARED:null;  /* emptied on purpose */
  return (LINE_NUMERIC.indexOf(k)>=0)?Number(v):v;
}

function lineStateWord(s){
  return s==='CALCULATING'?'working it out'
       :(s==='PRICED'?'priced'
       :(s==='UNABLE_TO_PRICE'?'cannot be priced'
       :'not complete yet'));
}
function lineStateCls(s){
  return s==='CALCULATING'?'calc':(s==='PRICED'?'pr':(s==='UNABLE_TO_PRICE'?'no':'inc'));
}
function paintState(key,s,why){
  lineState[key]={s:s,why:why||''};
  var el=document.getElementById('lst-'+key);
  if(el){ el.className='lst '+lineStateCls(s); el.textContent=lineStateWord(s); }
  var w=document.getElementById('lwhy-'+key);
  if(w)w.innerHTML=why?msym(wordy(why),'warn'):'';
}
function stateBadgeHtml(key){
  var st=lineState[key]||{s:'',why:''};
  var s=st.s||'';
  return '<div><span class="lst '+lineStateCls(s)+'" id="lst-'+esc(key)+'">'+esc(s?lineStateWord(s):'')+'</span>'+
         '<div class="lstwhy" id="lwhy-'+esc(key)+'">'+(st.why?msym(wordy(st.why),'warn'):'')+'</div></div>';
}

function keyPending(id,k){
  if(linePatch[id]&&linePatch[id].hasOwnProperty(k))return true;
  var d=lineDeb[id];
  return !!(d&&d.patch&&d.patch.hasOwnProperty(k));
}

function paintLengthReq(id){
  var l=lineOf(id); if(!l)return;
  var need=lengthRequired(l);
  var rq=document.getElementById('clenrq-'+id);
  if(rq){
    rq.textContent=need?'*':'';
    if(need)rq.setAttribute('title','A Length unit needs the customer length.');
    else rq.removeAttribute('title');
  }
  var box=document.getElementById('clen-'+id);
  if(box){ if(need)box.setAttribute('aria-required','true'); else box.removeAttribute('aria-required'); }
}

function paintLineRow(l,refused){
  if(!l||!l.id)return;
  var id=l.id, cost=canCost(), act=document.activeElement;
  function set(sfx,html){ var e=document.getElementById(sfx+'-'+id); if(e)e.innerHTML=html; }
  set('ltq',(l.quoted_total_qty===null||l.quoted_total_qty===undefined)?'<span class="na">not available</span>':num(l.quoted_total_qty,3));
  set('lamt',(l.amount===null||l.amount===undefined)?'<span class="na">not available</span>':rs(l.amount));
  set('lgst',(l.applied_gst_rate!==null&&l.applied_gst_rate!==undefined)
      ?'GST '+esc(String(l.applied_gst_rate))+'%'
      :'GST: <span class="na">not available</span>');
  if(cost){

    set('lcost',(l.cost===null||l.cost===undefined)?'<span class="na">not available</span>':rs0(l.cost));
    set('lmg',(l.margin===null||l.margin===undefined)?'<span class="na">not available</span>':rs0(l.margin));
  }
  set('lrflag',rateFlagHtml(l,linesEditable()));
  set('ldflag',discFlagHtml(l));

  set('lswflag',swFlagHtml(l,ITEMMAP[l.item_id]));

  var st=lineState[id];
  if(st)paintState(id,st.s||'',st.why||'');

  [{box:'rate-',key:'rate',stored:l.rate},
   {box:'cqty-',key:'qty', stored:l.customer_qty}].forEach(function(f){
    var e=document.getElementById(f.box+id);
    if(!e||e===act)return;
    if(keyPending(id,f.key))return;              
    e.value=(f.stored===null||f.stored===undefined)?'':String(f.stored);
  });
  paintLengthReq(id);                            

  var dsc=document.getElementById('disc-'+id);
  if(!refused&&dsc&&dsc!==act&&!keyPending(id,'disc'))
    dsc.value=(l.discount_pct===null||l.discount_pct===undefined)?'':String(l.discount_pct);
}

function paintTotals(totals,flags){
  if(totals&&typeof totals==='object'){
    ['sub_total','cgst','sgst','igst','round_off','grand_total','total_weight_mt',
     'blended_rate_per_kg','total_commission','supply_type'].forEach(function(k){
      if(totals[k]!==undefined)Q[k]=totals[k];
    });

function queueLineSave(key,patch,reason){

  if(key===NEWKEY && NEW_INFLIGHT){ paintState(key,'CALCULATING',''); return; }

async function runLineSave(key){
  var d=lineDeb[key]; if(!d)return;
  if(d.t){ clearTimeout(d.t); d.t=null; }
  var patch=d.patch, reason=d.reason;
  delete lineDeb[key];
  if(!Q||!needActor())return;
  var seq=(lineSeq[key]=(lineSeq[key]||0)+1);
  var body={p_actor_emp:actorEmp,p_app_key:uuid4(),so_id:Q.id,reason:reason};
  var src=(key===NEWKEY&&TEMPROW)?TEMPROW.fields:patch;   
  Object.keys(src).forEach(function(k){
    var v=lineVal(k,src[k]);
    if(v===undefined)return;                    
    if(v===LINE_CLEARED){

      if(key===NEWKEY)return;
      body[k]=null; return;
    }
    body[k]=v;
  });
  if(key!==NEWKEY)body.line_id=key;

  if(key===NEWKEY){
    NEW_INFLIGHT=true;
    NEW_SENT={};
    Object.keys(src).forEach(function(k){ NEW_SENT[k]=src[k]; });
  }
  var env;
  try{ env=await callA('rpc_m08_line_save',body); }
  catch(ex){
    if(key===NEWKEY){ NEW_INFLIGHT=false; NEW_SENT=null; }   
    if(seq!==lineSeq[key])return;                 

    var rd=(ex&&ex.rpcData)||null;
    var rl=(rd&&rd.line&&rd.line.id)?rd.line:null;

    delete linePatch[key];
    if(rl){
      for(var ri=0;ri<LINES.length;ri++){ if(LINES[ri].id===rl.id){ LINES[ri]=rl; break; } }
      if(linePatch[rl.id])delete linePatch[rl.id];
      paintLineRow(rl,true);          
    }

    else if(key!==NEWKEY){
      var known=lineOf(key);
      if(known)paintLineRow(known,true);
    }
    flagDirty();

    var rwhy=(rd&&rd.reason)?wordy(rd.reason):friendlyErrA(ex);
    paintState(key,'UNABLE_TO_PRICE',rwhy);
    if(ex&&ex.rpcCode==='M06_UNPRICEABLE_LINE')
      openModal("This line could not be priced",unpriceableBox(ex)+
        '',
        [{t:"Close",c:"btn-g",f:"closeModal()"}]);
    else toast(rwhy,"err");
    return;
  }

  var v07held=null;
  if(key===NEWKEY){
    NEW_INFLIGHT=false;
    if(TEMPROW&&TEMPROW.fields&&NEW_SENT){
      v07held={};
      Object.keys(TEMPROW.fields).forEach(function(k){
        var was=(NEW_SENT[k]===undefined||NEW_SENT[k]===null)?'':String(NEW_SENT[k]);
        var now=(TEMPROW.fields[k]===undefined||TEMPROW.fields[k]===null)?'':String(TEMPROW.fields[k]);
        if(was!==now)v07held[k]=TEMPROW.fields[k];
      });
      if(!Object.keys(v07held).length)v07held=null;
    }
    NEW_SENT=null;
  }
  if(seq!==lineSeq[key])return;                   
  var dta=(env&&env.data&&typeof env.data==='object')?env.data:{};
  var f=(dta.flags&&typeof dta.flags==='object')?dta.flags:{};
  var line=dta.line||null;

  if(line&&line.id){ noteCeiling(line.id,line); noteCeiling(line.id,f); noteCeiling(line.id,dta.pricing); }

  if(f.replay_needs_refresh===true){ await refreshOrder(); return; }
  if(f.persisted!==true){

    paintState(key,f.line_state||'INCOMPLETE',f.line_state_reason||'');

    if(key===NEWKEY&&v07held)queueLineSave(NEWKEY,v07held,reason);
    return;
  }
  if(line&&f.line_version!==undefined&&f.line_version!==null){
    var painted=lineVer[line.id];
    if(painted!==undefined&&Number(f.line_version)<=Number(painted))return;   
    lineVer[line.id]=f.line_version;
  }
  if(key===NEWKEY){

    TEMPROW=null; delete lineState[NEWKEY]; delete lineVer[NEWKEY]; delete lineSeq[NEWKEY]; NR_ITEM=null;
    if(line){ LINES.push(line); LINES.sort(function(a,b){return (a.line_no||0)-(b.line_no||0);});
      lineState[line.id]={s:f.line_state||'',why:f.line_state_reason||''};
      lineVer[line.id]=f.line_version; }
    paintTotals(dta.totals,f);
    var lb=document.getElementById('lineBand'); if(lb)lb.outerHTML=zLines();
    if(f.line_state==='UNABLE_TO_PRICE')toast("Line added. "+wordy(f.line_state_reason||'It could not be priced yet.'),"warn");

    if(line&&line.id&&v07held)queueLineSave(line.id,v07held,reason);
    return;
  }
  if(line){
    for(var i=0;i<LINES.length;i++){ if(LINES[i].id===line.id){ LINES[i]=line; break; } }
    if(linePatch[line.id])delete linePatch[line.id];      
    paintLineRow(line);
  }
  paintState(key,f.line_state||'',f.line_state_reason||'');
  paintTotals(dta.totals,f);
  flagDirty();

  if(line&&line.id)await refreshLineCz(line.id);
}

async function autoReprice(quiet){
  if(!Q||!LINES.length)return;
  if(!linesEditable())return;
  for(var i=0;i<LINES.length;i++){
    var l=LINES[i];

    var seq=(lineSeq[l.id]=(lineSeq[l.id]||0)+1);
    try{
      var env=await callA('rpc_m08_line_save',{p_actor_emp:actorEmp,p_app_key:uuid4(),
                                           so_id:Q.id,line_id:l.id,reason:AUTO_REPRICE_REASON});
      if(seq!==lineSeq[l.id])continue;              
      var dta=(env&&env.data)||{}, f=(dta.flags&&typeof dta.flags==='object')?dta.flags:{};
      if(dta.line){
        var painted=lineVer[dta.line.id];
        if(painted!==undefined&&f.line_version!==undefined&&f.line_version!==null
           &&Number(f.line_version)<Number(painted))continue;   
        LINES[i]=dta.line;
        if(f.line_version!==undefined&&f.line_version!==null)lineVer[dta.line.id]=f.line_version;
        lineState[dta.line.id]={s:f.line_state||'',why:f.line_state_reason||''};
      }

      if(i===LINES.length-1)paintTotals(dta.totals,f);
    }catch(ex){
      if(seq!==lineSeq[l.id])continue;              
      lineState[l.id]={s:'UNABLE_TO_PRICE',why:friendlyErrA(ex)};
      if(!quiet)toast('Line '+lineNoOf(l.id)+': '+friendlyErrA(ex),"err");
    }
  }
  await refreshQuoteCz();        
  var lb=document.getElementById('lineBand'); if(lb)lb.outerHTML=zLines();
  renderWsActions();
  if(!quiet)toast("Prices brought up to date.","ok");
}

var PRICEWORDS={
  SPECIAL_PRICE:"a special price agreed for this customer",
  CUSTOMER_SPECIAL_PRICE:"a special price agreed for this customer",
  CUSTOMER_TYPE_PRICE:"the price for this customer's category",
  DIRECT_UOM_PRICE:"the price list for this unit",
  CONVERTED_FROM_BASIS:"the price list, converted to this unit",
  MANUAL_OVERRIDE:"a rate typed by hand",
  PRICE_LIST:"the standard price list",
  CONTRACT_PRICE:"a contract price",
  PROJECT_PRICE:"a project price",
  ITEM_FIXED_PRICE:"a fixed price held against the item",
  PROMOTIONAL_PRICE:"a promotional price",
  SYSTEM_CALCULATED:"worked out by the system",
  IMPORT:"brought in from an import"
};
function priceWhy(l){
  var k=l.pricing_resolution_method||l.price_source_type;
  if(!k)return "";
  var w=PRICEWORDS[k]||PRICEWORDS[l.price_source_type]||"";
  var when=l.price_source_revision?(' as at '+fmtDate(l.price_source_revision)):'';
  return w?('from '+w+when):('price source: '+String(k).toLowerCase().replace(/_/g,' ')+when);
}

var ASKED_FIELDS=[["asked_customization","asked as"],["asked_specification","specification"]];
function askedText(lineId){
  if(ASKSPECERR)return '<span class="na">the customer\'s wording could not be read</span>';
  var r=ASKSPEC[lineId];
  if(!r)return '<span class="na">nothing recorded</span>';
  var out=ASKED_FIELDS.map(function(f){
    var v=r[f[0]];
    return (v===null||v===undefined||String(v).trim()==='')?null:(esc(f[1])+' <b>'+esc(String(v))+'</b>');
  }).filter(function(s){ return !!s; });
  return out.length?out.join(' · '):'<span class="na">nothing recorded</span>';
}

     ((cz.manual_unit_price!==null&&cz.manual_unit_price!==undefined)

function czCharge(cz){
  if(cz.manual_unit_price!==null&&cz.manual_unit_price!==undefined&&!isNaN(Number(cz.manual_unit_price))
     &&cz.customization_qty!==null&&cz.customization_qty!==undefined&&!isNaN(Number(cz.customization_qty)))

function czValues(cz){
  var vals=cz.asked_values||{};
  var out=Object.keys(vals).sort().map(function(k){
    var name=specName(k);
    var raw=vals[k], num='', uomc='';
    if(raw&&typeof raw==='object'&&!Array.isArray(raw)){
      num=(raw.v===null||raw.v===undefined)?'':raw.v;      
      uomc=(raw.u===null||raw.u===undefined)?'':raw.u;     
    }else{
      num=(raw===null||raw===undefined)?'':raw;
    }
    if(String(num).trim()==='')return '';        
    return (name?name+' ':'')+num+(uomc?(' '+uomc):'');
  }).filter(function(s){return String(s).trim()!=='';});
  return out.length?out.join(' · '):'no measurements recorded';
}

function wordy(x){
  if(x===null||x===undefined)return "";
  if(typeof x==='string')return x;
  if(typeof x==='object')return String(x.message||x.reason||x.text||x.norm||x.code||JSON.stringify(x));
  return String(x);
}

function gateParts(a){
  if(!a)return null;
  var fs=(a.factor_snapshot&&typeof a.factor_snapshot==='object')?a.factor_snapshot:{};
  var nv=(fs.norms_verdict&&typeof fs.norms_verdict==='object')?fs.norms_verdict:{};
  var lv=(a.levers_snapshot&&typeof a.levers_snapshot==='object')?a.levers_snapshot:{};
  var lnv=(lv.norms_verdict&&typeof lv.norms_verdict==='object')?lv.norms_verdict:{};
  function arr(o,k){var v=o&&o[k];return (Array.isArray(v)&&v.length)?v:null;}
  function n(o,k){return (o&&o[k]!==undefined&&o[k]!==null)?o[k]:null;}
  return {
    breaches: arr(nv,'breaches')||arr(fs,'breaches')||arr(lnv,'breaches')||arr(lv,'breaches')||[],
    warnings: arr(nv,'warnings')||arr(fs,'warnings')||arr(lnv,'warnings')||arr(lv,'warnings')||[],
    ni:       arr(nv,'not_implemented')||arr(fs,'not_implemented')||arr(lnv,'not_implemented')||arr(lv,'not_implemented')||[],
    netMargin:n(nv,'net_margin')!==null?n(nv,'net_margin')
              :(n(fs,'net_margin')!==null?n(fs,'net_margin')
              :(n(lnv,'net_margin')!==null?n(lnv,'net_margin'):n(lv,'net_margin'))),
    verdict:  nv.verdict||lnv.verdict||null,

    reason:   a.why_routed||nv.reason||fs.reason||lnv.reason||lv.reason||nv.why_routed||null,
    why:      a.why_routed||nv.why_routed||null
  };
}

  if(canCost()){

       '<div class="totrow"><span>Governed cost</span><b>'+(ct===null?'<span class="na">not available</span>':rs0(ct))+'</b></div>'+
       '<div class="totrow"><span>Total commission</span><b>'+(Q.total_commission===null||Q.total_commission===undefined?'<span class="na">not available</span>':rs(Q.total_commission))+'</b></div>'+
       '<div class="totrow"><span>Net margin</span><b>'+(hasM?rs0(mg):'<span class="na">not available</span>')+'</b></div>'+
       '<div class="totrow"><span>Leakage</span><b>'+(lk===null?'<span class="na">not available</span>':rs0(lk))+'</b></div>'+
       (hasM&&mg<0?'<div class="wbanner soft" style="margin:6px 0 0">Margin is negative — below cost.</div>':'')+
       '<div class="hint">'+esc(costEvidenceNote(LINES))+'</div>'+

  return h+'</div></div></div>';
}

function zPanels(){

  h+='<div><div class="ins-hd" style="border:none;padding:0 0 8px">Status history ('+TRAIL.length+')</div><div class="trail">'+
     (TRAIL.length?TRAIL.map(function(t){
        return '<div class="trail-i">'+esc(String(t.from_status||'raised'))+' &rarr; <b>'+esc(t.new_status)+'</b>'+(t.reason?' · '+esc(t.reason):'')+
               '<span class="tm">'+esc(t.by_name||empName(t.by_emp))+' · '+esc(stampOf(t.at))+'</span></div>';

     (ATTRAUDBLIND?'<div class="wbanner soft" style="margin:0 0 8px">Saved changes are not showing here. They are kept.</div>':'')+
     '<div class="trail">'+
     (ATTRAUD.length?ATTRAUD.map(function(r){
        return '<div class="trail-i"><b>'+esc(ATTRWORD[r.attribute]||fieldWord(r.attribute))+'</b>: '+
          esc(attrText(r.attribute,r.old_value))+' &rarr; <b>'+esc(attrText(r.attribute,r.new_value))+'</b>'+
          (r.reason?' · '+esc(r.reason):'')+
          '<span class="tm">'+esc(r.by_name||empName(r.by_emp))+' · '+esc(stampOf(r.at))+'</span></div>';
      }).join(''):'')+
     '</div></div>';

  var canAtt=!!actorEmp&&can(CAP.EDIT);
  h+='<div><div class="ins-hd" style="border:none;padding:0 0 8px">Attachments ('+ATTACH.length+')</div>'+

     '<div class="fr" style="gap:6px;margin-bottom:6px">'+

       '<select class="in" id="attKind"'+(canAtt?'':' disabled')+' onchange="ATT_KIND_SEL=this.value" aria-label="What kind of file">'+  
         attKinds().map(function(k){return '<option value="'+esc(k)+'"'+(k===attKindCur()?' selected':'')+'>'+esc(labelOf(k)||k)+'</option>';}).join('')+

     (canAtt?'':'<span class="vh" id="attWhy">'+esc(!actorEmp?'Your login is not linked to an active employee record.':capWhy(CAP.EDIT,'attach a file to an order'))+'</span>')+

}

function attKinds(){ return (LISTS[LIST.DOC]||[]).map(function(r){return r.code;}); }

var ATT_KIND_SEL=null;
function attKindCur(){ var k=attKinds(); return (ATT_KIND_SEL&&k.indexOf(ATT_KIND_SEL)>=0)?ATT_KIND_SEL:(k[0]||''); }

var QATT_BUCKET='lead-attachments', QATT_PREFIX='sales-orders/';
function attPick(){ var f=document.getElementById("attFile"); if(f)f.click(); }
async function attPicked(){
  var el=document.getElementById("attFile");
  var f=el&&el.files&&el.files[0]; if(!f)return;

  var kind=(document.getElementById("attKind")||{}).value||attKindCur();
  ATT_KIND_SEL=kind;
  el.value='';
  if(!needActor())return;
  var btn=document.getElementById("btnAttach");
  await saveGuard(btn,"Attaching…",async function(){
    var path=QATT_PREFIX+Q.id+'/'+Date.now()+'_'+String(f.name).replace(/[^A-Za-z0-9._-]/g,'_');
    try{
      var up=await SB.storage.from(QATT_BUCKET).upload(path,f);
      if(up.error)throw up.error;
    }catch(ex){
      toast("The file was not stored.","err");
      return;
    }
    try{

      var env=await callA(RPC.DOC_ATTACH,{p_actor_emp:actorEmp,p_app_key:uuid4(),
        so_id:Q.id,doc_type:kind,file_ref:path,active:true});

      await loadOrder(Q.id);
      renderWorkspace();
      okToast(env,"Attached "+f.name+" to this order.");
    }catch(ex2){
      toast(friendlyErrA(ex2),"err");
    }
  });
}
var FIELDWORDS={
  ccr_emp:"CCR",   
  pt_code:"Payment terms", insurance_scope:"Insurance", delivery_scope:"Delivery scope",
  delivery_terms:"Delivery terms", mode_of_delivery:"Mode of delivery", salesperson_emp:"Salesperson",
  required_delivery_date:"Required delivery", customer_po_no:"Customer PO number",
  customer_po_date:"Customer PO date", priority_code:"Priority", executing_unit:"Executing unit",
  booking_unit:"Booking unit", direct_so_category:"Order category",
  quote_date:"Order date", referrer_id:"Referred by",
  deal_commission_pct:"Commission %",
  freight_amount:"Freight", insurance_amount:"Insurance charge", other_charges_amount:"Other charges",
  bill_to_address_id:"Bill-to address", ship_to_address_id:"Ship-to address",
  bill_contact_id:"Billing contact", ship_contact_id:"Shipping contact",
  grand_total:"Grand total", sub_total:"Sub-total", status:"Status",
  customer_length:"Length", customer_qty:"Quantity", customer_uom:"Customer unit",
  quoted_uom:"Ordered unit", discount_pct:"Discount %", commission_pct:"Commission %",
  sw_basis:"Section weight basis", sw_value:"Section weight", rate:"Rate", amount:"Amount",
  clear_rate_override:"Back to the price list"
};
function fieldWord(f){
  if(!f)return "";
  return FIELDWORDS[f]||String(f).replace(/_/g,' ').replace(/\b\w/g,function(c){return c.toUpperCase();});
}
</script>
<script>

function openModal(title,body,btns,size){
  document.getElementById("modalTitle").textContent=title;
  document.getElementById("modalBody").innerHTML=body;
  document.getElementById("modalFoot").innerHTML=btns.map(function(b){
    return '<button class="btn '+b.c+'"'+(b.id?' id="'+b.id+'"':'')+' onclick="'+b.f+'">'+b.t+'</button>';
  }).join("");
  var box=document.getElementById("modalBox");
  box.className='modal'+(size?(' '+size):'');
  document.getElementById("modalBd").classList.add("show");
}
function closeModal(){ document.getElementById("modalBd").classList.remove("show"); }

function errBox(ex){
  var c=errCodeOf(ex);
  return '<div class="wbanner '+errBannerCls(ex)+'" style="margin:0">'+esc(friendlyErrA(ex))+'</div>';
}

function renderWsActions(){
  var a=document.getElementById("wsActions"); if(!a)return;

  if(creating){
    a.innerHTML='<span class="ctx">New order</span><span style="flex:1"></span>'+
      '<button class="btn btn-g" onclick="confirmLeave(cancelNewQuote)">Cancel</button>'+
      '<button class="btn btn-p" id="nqBtn" onclick="doCreateQuote()">Create the order</button>';
    return;
  }
  if(!Q){ a.innerHTML='<span class="ctx">'+(openQuoteId?'Loading…':'No order open.')+'</span>'; return; }
  var ed=canEditHeader(Q);
  var miss=missingMandatory();

  var owner='';
  if(Q.status==='Pending Approval'&&APPRFULL&&!APPRFULL.decided_at)
    owner=' · with <b>'+esc(empName(APPRFULL.approver_emp))+'</b>'+(APPRFULL.tat_due?(', answer due '+esc(stampOf(APPRFULL.tat_due))):'');
  var ctx='<span class="ctx">'+
    '<b>'+esc(Q.so_no||'(no number)')+'</b> '+statusTag(Q.status)+
    ' · '+LINES.length+' line(s) · <b>'+num(Q.total_weight_mt,3)+'</b> MT · <b>'+(Q.grand_total===null?'not available':rsPlain(Q.grand_total))+'</b>'+
    (Q.totals_dirty?' · <span style="color:var(--warn);font-weight:700">totals not recomputed</span>':'')+
    (miss.length?' · <span style="color:var(--warn);font-weight:700">'+miss.length+' still to fill in</span>':'')+
    (dirty()?' · <span style="color:var(--warn);font-weight:700">unsaved changes</span>':'')+
    owner+
    ' · next: <b>'+esc(nextAction(miss))+'</b>'+
    '</span>';

  var saveLbl=isFrozen(Q)?'Save as new revision':'Save draft &middot; Ctrl+S';

  var missSave=mandatoryMissing('save');
  var saveOk=ed&&savable()&&missSave.length===0;          

  var saveWhy=!ed?editBlockReason(Q):(!savable()?((LINES&&LINES.length)?'':'Nothing entered yet.')
    :(missSave.length?('This order still needs '+missSave.join(' · ')+'.'):''));

  var noLen=LINES.filter(lengthMissing);

  var missSub=mandatoryMissing('submit');
  var subOk=can(CAP.SUBMIT)&&Q.status==='Draft'&&!Q.totals_dirty&&missSub.length===0;
  var subWhy=!can(CAP.SUBMIT)?capWhy(CAP.SUBMIT,'send an order for approval')
    :(Q.status!=='Draft'?('Only a draft goes for approval. This is '+Q.status+'.')
    :(missSub.length?('Still needs '+missSub.join(' · ')+'.')
    :(Q.totals_dirty?'The stored totals are out of date.':'')));

  var subTitle=subOk?approverPreviewNames().replace(/<[^>]+>/g,''):subWhy;
  var revOk=can(CAP.REVISE)&&!isTerminal(Q.status)&&isFrozen(Q);
  var revWhy=!can(CAP.REVISE)?capWhy(CAP.REVISE,'raise a revision')
    :(isTerminal(Q.status)?('This order is '+Q.status+', so it cannot be revised.')
    :('This is '+Q.status+' — edit it directly.'));
  var pb=progressBlockReason(Q);

  var confirmOk=can(CAP.TRANSITION)&&Q.status==='Approved'&&!pb;
  var confirmWhy=!can(CAP.TRANSITION)?capWhy(CAP.TRANSITION,'confirm a sales order')
    :(pb?pb:'An order is confirmed once it has been approved.');
  var rt=resumeTarget(Q);
  var parked=PARKED.indexOf(Q.status)>=0;
  var resOk=parked&&can(CAP.TRANSITION)&&!!rt;
  var resWhy=!can(CAP.TRANSITION)?capWhy(CAP.TRANSITION,'move an order to the next stage')
    :'No parked-from status recorded, so it cannot resume.';

  var tg=parkTargets(Q.status).filter(function(s){return s!=='Cancelled'||cancelAllowed(Q);});
  var dcOk=can(CAP.TRANSITION)&&!isTerminal(Q.status)&&tg.length>0;
  var dcWhy=!can(CAP.TRANSITION)?capWhy(CAP.TRANSITION,'move an order to the next stage')
    :(isTerminal(Q.status)?('This order is already closed as '+Q.status+'.')
    :'Nothing can be parked or cancelled from here.');

  var primaryId=null;
  if(parked){ if(resOk)primaryId='btnResume'; }
  else if(Q.status==='Draft'||Q.status==='Rejected'){ primaryId=saveOk?'btnSave':(subOk?'btnSubmit':null); }
  else if(Q.status==='Approved'){ primaryId=confirmOk?'btnConfirm':(revOk?'btnRevise':null); }
  else if(Q.status==='Confirmed'){ primaryId=revOk?'btnRevise':null; }
  function mk(id,label,js,ok,why,title){
    var prim=(id===primaryId&&ok);
    return '<button class="btn '+(prim?'btn-p':(id==='btnDropCancel'?'btn-d':'btn-g'))+'" id="'+id+'"'+(js?' onclick="'+js+'"':'')+
      (ok?(title?' title="'+esc(title)+'"':''):' disabled title="'+esc(why||'')+'" aria-describedby="'+id+'Why"')+'>'+label+'</button>'+
      (ok?'':'<span class="vh" id="'+id+'Why">'+esc(why||'')+'</span>');
  }
  function mi(id,label,js,ok,why){
    return '<button id="'+id+'"'+(js&&ok?' onclick="toggleMoreMenu();'+js+'"':'')+(ok?'':' disabled title="'+esc(why||'')+'"')+'>'+label+'</button>';
  }
  var front=[], more=[];
  var bSave=['btnSave',saveLbl,'saveDraft()',saveOk,saveWhy];

  var bSubmit=['btnSubmit','Submit for approval','submitQuote()',subOk,subOk?subTitle:subWhy];

  var bRevise=['btnRevise','&#8635; Revise','confirmLeave(openRevise)',revOk,revWhy];
  var bConfirm=['btnConfirm','&#10003; Confirm','openConfirm()',confirmOk,confirmWhy];
  var bResume=['btnResume','&#9654; Resume'+(rt?(' to '+esc(rt)):''),'resumeQuote()',resOk,resWhy];
  var bParkCancel=['btnDropCancel','Park / cancel','openStatusChange()',dcOk,dcWhy];

  var bPdf=['btnDownloadPdf','&#128196; Download PDF','openPdfDownload()',true,''];

  if(parked){ front=[bResume]; more=[bSave,bParkCancel,bPdf]; }
  else if(Q.status==='Draft'||Q.status==='Rejected'){ front=[bSave,bSubmit]; more=[bParkCancel,bPdf]; }
  else if(Q.status==='Pending Approval'){ front=[bSave]; more=[bParkCancel,bPdf]; }
  else if(Q.status==='Approved'){ front=[bConfirm,bRevise]; more=[bSave,bParkCancel,bPdf]; }
  else if(Q.status==='Confirmed'){ front=[bRevise]; more=[bParkCancel,bPdf]; }

  else { front=[]; more=[bParkCancel,bPdf]; }   

  if(can(CAP.CREATE)){
    var newOk=!catBlocked;
    more=more.concat([['btnNewQuoteWs','+ New order','openNewQuote()',newOk,
      'Reference data has not loaded.']]);
  }

  front=front.concat([['btnCloseWs','Close','closeWorkspace()',true,'']]);
  var h=ctx+'<div style="flex:1"></div>';
  front.forEach(function(b){ h+=mk(b[0],b[1],b[2],b[3],b[4],b[3]?b[4]:null); });
  if(more.length){
    h+='<div class="ddwrap"><button class="btn btn-g" id="btnMore" onclick="toggleMoreMenu()" aria-haspopup="true" aria-expanded="false">More actions &#9662;</button>'+
       '<div class="ddmenu" id="moreMenu">'+more.map(function(b){ return mi(b[0],b[1],b[2],b[3],b[4]); }).join('')+'</div></div>';
  }
  a.innerHTML=h;
}

function placeMenu(btnId,menuId){
  var b=document.getElementById(btnId), m=document.getElementById(menuId);
  if(!b||!m)return;
  var r=b.getBoundingClientRect();
  var vw=window.innerWidth||document.documentElement.clientWidth;
  var vh=window.innerHeight||document.documentElement.clientHeight;
  m.style.left='0px'; m.style.top='0px';                 /* measure unconstrained */
  var w=m.offsetWidth||210, hgt=m.offsetHeight||120;
  var left=Math.min(Math.max(8,r.right-w),Math.max(8,vw-w-8));
  var below=(vh-r.bottom), above=r.top;
  var top=(below>=hgt+8||below>=above)?(r.bottom+4):(r.top-hgt-4);
  top=Math.min(Math.max(8,top),Math.max(8,vh-hgt-8));
  m.style.left=left+'px'; m.style.top=top+'px';
}
function toggleMoreMenu(){
  var m=document.getElementById("moreMenu"); if(!m)return;
  var open=m.classList.toggle("show");
  if(open)placeMenu("btnMore","moreMenu");
  var b=document.getElementById("btnMore"); if(b)b.setAttribute('aria-expanded',open?'true':'false');
}

var attrPending=null;                       

function attrRepaint(){
  var a=document.getElementById('selDelMode');
  if(a){
    var mv=(Q&&Q.mode_of_delivery)||'';
    var ns=notSetCode(LIST.DELMODE);
    if(ns&&mv===ns)mv='';
    a.value=mv;
  }
  var b=document.getElementById('selRep');     if(b)b.value=(Q&&Q.salesperson_emp)||'';
}
function cancelAttr(){ attrPending=null; closeModal(); attrRepaint(); }

var ATTRCOL={required_delivery_date:'required_delivery_date', executing_unit:'executing_unit',
             priority_code:'priority_code', customer_po_no:'customer_po_no',
             customer_po_date:'customer_po_date', mode_of_delivery:'mode_of_delivery',
             salesperson_emp:'salesperson_emp', ccr_emp:'ccr_emp'};
function attrStored(attr){
  var v=Q?Q[ATTRCOL[attr]||attr]:null;
  return (v===null||v===undefined||String(v)==='')?null:String(v);
}

function hdrAct(key,val){
  if(!Q)return;
  if(canEditHeader(Q)){ markHdr(key,val); return; }
  askAttr(key,val);
}
var FIRST_RECORD_REASON='First recorded on this order.';
function askAttr(attr,val){
  if(!Q||!ATTRWORD[attr])return;
  if(!attrOK()){ toast(attrWhy(),"err"); attrRepaint(); return; }
  var stored=attrStored(attr);
  var cur=stored===null?'':stored;

  if(!val&&attr!=='customer_po_no'&&attr!=='customer_po_date'){ toast("The "+ATTRWORD[attr]+" cannot be emptied once it is recorded. Choose a different one, or leave it as it is.","warn"); attrRepaint(); return; }
  if(val===cur){ attrRepaint(); return; }
  attrPending={attr:attr,val:val};

  if(stored===null){ doAttr(FIRST_RECORD_REASON); return; }
  openModal("Change the "+ATTRWORD[attr],
    '<div class="totbox" style="min-width:0;margin:0 0 11px"><div class="totrow"><span>Now</span><b>'+esc(attrText(attr,cur))+'</b></div>'+
      '<div class="totrow"><span>Changing to</span><b>'+esc(attrText(attr,val))+'</b></div></div>'+

    '<div class="fg"><label for="atReason">Reason (required)</label>'+
      '<input class="in" id="atReason" placeholder="why is the '+esc(ATTRWORD[attr])+' being changed?"/></div>'+
    '<div id="atErr"></div>',
    [{t:"Leave it as it is",c:"btn-g",f:"cancelAttr()"},{t:"Save the change",c:"btn-p",id:"atBtn",f:"doAttr()"}]);
}

async function doAttr(presetReason){
  if(!attrPending||!Q||!needActor())return;
  var attr=attrPending.attr, val=attrPending.val;
  var box=document.getElementById("atReason");
  var reason=presetReason?String(presetReason)
                         :((box?(box.value||""):"").trim());

  if(!reason){
    var rs0=document.getElementById("atErr");
    if(rs0)rs0.innerHTML='<div class="wbanner hard" style="margin:0">A reason is required for this change.</div>';
    toast("A reason is required for this change.","err");
    return;
  }
  var btn=document.getElementById("atBtn");
  await saveGuard(btn,"Saving…",async function(){
    try{
      var kk='attr:'+Q.id+':'+attr+':'+val;
      var k=appKey(kk);

      var env=await callA('rpc_m08_so_attribute_change',{
        p_actor_emp:actorEmp, p_app_key:k, so_id:Q.id,
        p_expected_updated_at:Q.updated_at,
        attribute:attr, new_value:val, reason:reason});

      var replayed=(env.replay===true||env.outcome==='replay');
      if(!replayed)clearKey(kk);
      var noop=(env.outcome==='noop');
      var d=(env&&env.data&&typeof env.data==='object')?env.data:{};
      attrPending=null; closeModal();
      await refreshOrder();
      if(d.audit_id)attrProbe(d.audit_id);
      toast(noop?("The "+ATTRWORD[attr]+" is already "+attrText(attr,val)+" — nothing changed.")
                :("The "+ATTRWORD[attr]+" is now "+attrText(attr,val)+"."+(replayed?" (already applied)":"")),
            noop?"warn":"ok");
    }catch(ex){
      var slot=document.getElementById("atErr");
      if(slot)slot.innerHTML=errBox(ex); else toast(friendlyErrA(ex),"err");
      attrRepaint();
    }
  });
}

function attrProbe(auditId){
  if(!auditId||ATTRAUDERR)return;
  var found=false;

  var haveIds=ATTRAUD.some(function(r){return r&&r.id!==undefined&&r.id!==null;});
  if(!haveIds)return;
  for(var i=0;i<ATTRAUD.length;i++)if(ATTRAUD[i]&&ATTRAUD[i].id===auditId){found=true;break;}
  if(!found&&!ATTRAUDBLIND){ ATTRAUDBLIND=true; if(openQuoteId)renderWorkspace(); }
}

/* WITHDRAW */

function cancelAllowed(q){
  if(!q)return false;
  if(TERMINAL.indexOf(q.status)>=0)return false;
  if(q.status==='Draft')return q.created_by===actorEmp||isElevated();
  return isElevated()||hasRole('R08')||hasRole('R16')||hasRole('R19')||hasRole('R20');
}

function isAccounts(){ return actorRoles.indexOf('R07')>=0||isElevated(); }

function mandatoryMissing(scope){
  if(!Q)return [];
  var m=[];
  /* what SAVE writes */
  if(!hdrCur('pt',Q.pt_code))m.push('payment terms');
  if(!hdrCur('insurance',Q.insurance_scope))m.push('insurance');
  if(!hdrCur('delivery_scope',Q.delivery_scope))m.push('a delivery scope');                 
  if(!hdrCur('delivery_terms',Q.delivery_terms))m.push('delivery terms');                   

  var _ref=hdrCur('referrer_id',Q.referrer_id);
  var _cm =hdrCur('deal_commission_pct',Q.deal_commission_pct);
  if(_ref&&(_cm===null||_cm===undefined||_cm===''))
    m.push('a referrer commission');

  if(!hdrCur('mode_of_delivery',Q.mode_of_delivery))m.push('a mode of delivery');                 
  if(!hdrCur('required_delivery_date',Q.required_delivery_date))m.push('a required delivery date'); 
  if(!hdrCur('executing_unit',Q.executing_unit))m.push('an executing unit');                      
  if(scope==='save')return m;

  if(!Q.customer_id&&!Q.customer_org_unit_id)m.push('a customer');

  if(!LINES.length)m.push('at least one line');

  var _nr=unpricedLines().map(function(l){return l.line_no;});
  if(_nr.length)m.push('a price on line '+_nr.join(', '));

  var noLen=LINES.filter(lengthMissing).map(function(l){return l.line_no;});
  if(noLen.length)m.push('the customer length on line '+noLen.join(', '));

  if(Number(Q.grand_total||0)===0&&!Q.customer_org_unit_id)
    m.push('a non-zero total');
  return m;
}

function nextAction(miss){
  if(!Q)return '—';
  if(isTerminal(Q.status))return 'nothing — this order is closed';
  if(miss&&miss.length)return 'fill in '+miss.join(', ');
  if(PARKED.indexOf(Q.status)>=0)return resumeTarget(Q)?('resume to '+resumeTarget(Q)):'close it with Mark outcome';

  var np=unpricedLines();
  if(Q.status==='Draft')return np.length?('put a price on line '+np.map(function(x){return x.line_no;}).join(', ')):'submit for approval';
  if(np.length)return 'put a price on line '+np.map(function(x){return x.line_no;}).join(', ');
  if(Q.status==='Pending Approval')return 'waiting for the approver';
  if(Q.status==='Approved')return 'confirm the order';
  if(Q.status==='Confirmed')return 'release it for production';
  if(Q.status==='Credit-Hold')return 'waiting on Accounts to release the hold';
  return '—';
}

var HDR_KEYS=["salesperson_emp","ccr_emp","bill_contact_id","bill_to_address_id",
              "ship_contact_id","ship_to_address_id","pt","delivery_scope","delivery_terms",
              "insurance","mode_of_delivery","referrer_id","deal_commission_pct","executing_unit",
              "required_delivery_date","customer_po_no","customer_po_date","priority_code"];
var BANNED_HDR_KEYS=["freight","insurance_amt","other_charges"];   
var LINE_KEYS=["customer_length","customer_uom","disc","qty","quoted_uom","rate","sw_basis","sw_value","clear_rate_override"];
var NUMERIC_KEYS=["deal_commission_pct","disc","qty","customer_length","sw_value","rate"];

function normPatch(src,allowed){
  var out={};
  Object.keys(src).forEach(function(k){
    if(BANNED_HDR_KEYS.indexOf(k)>=0)return;      
    if(allowed.indexOf(k)<0)return;
    var v=src[k];
    if(v===undefined)return;                      
    if(v===""||v===null){ out[k]=null; return; }  
    out[k]=(NUMERIC_KEYS.indexOf(k)>=0)?Number(v):v;
  });
  return out;
}
async function saveDraft(){
  if(!needActor())return;

  await flushLineSaves();
  if(!savable()){ toast("Nothing to save.","warn"); return; }   

  if(isFrozen(Q)&&can(CAP.REVISE)){ openReviseSave(); return; }
  var btn=document.getElementById("btnSave");
  await saveGuard(btn,"Saving…",async function(){
    var wrote=[], failed=[];
    if(Object.keys(hdrPatch).length){
      try{
        if(Q.updated_at===null||Q.updated_at===undefined||Q.updated_at===''){
          throw envErr('STALE_WRITE',
            'Version unconfirmed. Reload.',null);
        }
        var patch=normPatch(hdrPatch,HDR_KEYS);
        if(!Object.keys(patch).length)throw envErr('VALIDATION','Nothing to save.',null);
        var env=await callA(RPC.UPD_HDR,{p_actor_emp:actorEmp,so_id:Q.id,p_expected_updated_at:Q.updated_at,patch:patch});
        wrote.push(Object.keys(patch).map(fieldWord).join(', '));
        hdrPatch={};
      }catch(ex){
        failed.push(friendlyErrA(ex));

        Object.keys(patch||{}).forEach(function(k){ delete hdrPatch[k]; });
        if(ex&&ex.rpcCode==='STALE_WRITE'){

          var notTried=Object.keys(linePatch).length;
          offerReload(ex);
          if(notTried)toast(notTried+' line edit(s) not attempted. Reload.',"warn");
          return;
        }
      }
    }
    var ids=Object.keys(linePatch);
    for(var i=0;i<ids.length;i++){
      var lid=ids[i], patch2=linePatch[lid];
      if(!patch2||!Object.keys(patch2).length)continue;
      try{
        var np=normPatch(patch2,LINE_KEYS);
        if(!Object.keys(np).length){ delete linePatch[lid]; continue; }

        if(np.rate!==undefined&&np.clear_rate_override)
          throw envErr('M06_OVERRIDE_CONFLICT','A typed rate and a clear cannot be saved together.',null);
        var env2=await callA(RPC.LINE_UPD,{p_actor_emp:actorEmp,line_id:lid,patch:np});
        wrote.push('line '+lineNoOf(lid)+' ('+Object.keys(np).map(fieldWord).join(', ')+')');
        delete linePatch[lid];
      }catch(ex2){
        failed.push('line '+lineNoOf(lid)+': '+friendlyErrA(ex2));

        var rd2=(ex2&&ex2.rpcData)||null;
        if(rd2&&rd2.line&&rd2.line.id)
          for(var li=0;li<LINES.length;li++){ if(LINES[li].id===rd2.line.id){ LINES[li]=rd2.line; break; } }
        delete linePatch[lid];
      }
    }
    await refreshOrder();
    if(failed.length){
      openModal("Part of that could not be saved",
        '<div class="wbanner hard" style="margin:0 0 10px">'+failed.map(function(m){return esc(m);}).join('<br>')+'</div>'+
        (wrote.length?'<div class="wbanner info" style="margin:0">Saved: '+esc(wrote.join(' · '))+'</div>':'')+
        '',
        [{t:"Close",c:"btn-g",f:"closeModal()"}]);
    } else if(wrote.length){

      toast("Saved: "+wrote.join(' · ')+".","ok");
      if(Q&&Q.totals_dirty&&LINES.length&&linesEditable())await autoReprice(true);
    } else {
      toast("Nothing to save.","warn");
    }
  });
}

async function doPdfExport(){
  if(!Q||!needActor())return;
  var sel=document.getElementById('pdfCopy');
  var copy=(sel&&sel.value)||'INTERNAL';
  var prog=document.getElementById('pdfProg');
  function say(t){ if(prog)prog.textContent=t; }
  var btn=document.getElementById('pdfBtn');
  await saveGuard(btn,"Preparing…",async function(){
    try{
      var kk='pdf:'+Q.id+':'+copy;
      say('Requesting the document…');

      var env=await callA('export_pdf_request',{module_code:'M08',document_id:Q.id,
        template_code:'SO_STD_V1',copy_type:copy,
        p_actor_emp:actorEmp,p_app_key:appKey(kk)});
      if(!env.replay)clearKey(kk);
      var d=(env&&env.data&&typeof env.data==='object')?env.data:{};
      var eid=d.export_id;
      if(!eid)throw envErr('INTERNAL','No export id came back.',null);

      say('Rendering…');
      var engineErr='';
      try{
        var rr=await fetch('api/export-pdf',{method:'POST',
          headers:{'Content-Type':'application/json'},
          body:JSON.stringify({export_id:eid})});
        if(!rr.ok){
          var tt=''; try{ tt=await rr.text(); }catch(e2){}
          engineErr='the renderer answered '+rr.status+(tt?(': '+String(tt).slice(0,200)):'');
        }
      }catch(fx){ engineErr='the renderer could not be reached'; }
      var row=null;
      for(var i=0;i<PDF_POLL_MAX;i++){
        var pr=await SB.from('pdf_exports').select('status,file_path,file_name,error_message')
          .eq('id',eid).maybeSingle();
        if(!pr.error&&pr.data){
          row=pr.data;
          if(row.status==='DONE'||row.status==='ERROR')break;
        }
        await new Promise(function(res){ setTimeout(res,PDF_POLL_MS); });
      }
      if(!row||row.status!=='DONE'){
        throw envErr(row&&row.status==='ERROR'?'PDF_RENDER_ERROR':'PDF_NOT_READY',
          row&&row.status==='ERROR'
            ? (/gateway timeout|failed \(50\d\)/i.test(String(row.error_message||''))
                ? 'The document service did not answer. Try again.'
                : 'the renderer recorded an error')
            : 'The document is still being prepared. Try again shortly.',null);
      }
      say('Fetching the file…');

      var su=await SB.storage.from('pdf-exports')
        .createSignedUrl(row.file_path,PDF_URL_TTL,{download:row.file_name||((Q.so_no||'sales-order')+'.pdf')});
      if(su.error||!su.data||!su.data.signedUrl)
        throw envErr('PDF_URL_FAILED','No download link could be made.',null);
      var a=document.createElement('a');
      a.href=su.data.signedUrl; a.rel='noopener';
      document.body.appendChild(a); a.click(); document.body.removeChild(a);
      closeModal();
      toast('The '+(copy==='CUSTOMER'?'customer':'internal')+' copy of '+(Q.so_no||'the order')+
        ' is downloading.'+(env.replay?' (already produced)':''),"ok");
    }catch(ex){
      say('');
      var slot=document.getElementById('pdfErr');
      if(slot)slot.innerHTML=errBox(ex); else toast(friendlyErrA(ex),"err");
    }
  });
}

    '<div id="scErr"></div>',
