async function nrCommit(){
  var miss=[];
  if(!NR_ITEM&&!nrField('item_id','nrItem'))miss.push('the item');
  if(!nrField('customer_uom','nrCuom'))miss.push('the customer unit');
  if(!(Number(nrField('qty','nrQty'))>0))miss.push('a quantity above zero');

  var uset=NR_ITEM?itemUoms(NR_ITEM):[];
  var cuv=nrField('customer_uom','nrCuom');
  if(cuv&&uset.length&&uset.indexOf(cuv)<0)miss.push('an approved customer unit ('+cuv+' is not allowed)');
  var quv=nrField('quoted_uom','nrQuom');
  if(quv&&uset.length&&uset.indexOf(quv)<0)miss.push('an approved quoted unit ('+quv+' is not allowed)');
  if(miss.length){
    var why='Still needs: '+miss.join(', ')+'.';
    paintState(NEWKEY,'INCOMPLETE',why);
    toast(why,"warn");
    return;
  }
  var btn=document.getElementById("nrAddBtn");
  await saveGuard(btn,"…",async function(){ await runLineSave(NEWKEY); });
}

var ITEM_SEARCH_FIELDS=[{n:'code',        g:function(i){ return i.item_id; }},
                        {n:'description', g:function(i){ return i.description_override||i.description; }}];
function itemMatch(i,tokens){
  var hay=ITEM_SEARCH_FIELDS.map(function(f){ return String(f.g(i)||"").toLowerCase(); });
  return tokens.every(function(t){
    return hay.some(function(s){ return s.indexOf(t)>=0; });
  });
}

function nrPlaceHits(){
  var el=document.getElementById('nrItem'), b=document.getElementById('nrHits');
  if(!el||!b||b.style.display==='none'||!b.innerHTML)return;
  var r=el.getBoundingClientRect();
  var vh=window.innerHeight||document.documentElement.clientHeight;
  var vw=window.innerWidth||document.documentElement.clientWidth;
  b.style.width=Math.max(240,Math.round(r.width))+'px';
  b.style.left='0px'; b.style.top='0px';                    /* measure unconstrained */
  var hgt=b.offsetHeight||150;
  var left=Math.min(Math.max(8,r.left),Math.max(8,vw-b.offsetWidth-8));
  var below=(vh-r.bottom), above=r.top;
  var top=(below>=hgt+8||below>=above)?(r.bottom+3):(r.top-hgt-3);
  top=Math.min(Math.max(8,top),Math.max(8,vh-hgt-8));
  b.style.left=left+'px'; b.style.top=top+'px';
}

window.addEventListener('scroll',function(){ nrPlaceHits(); },true);
window.addEventListener('resize',function(){ nrPlaceHits(); });

var _lgxLock=false;
function lgXbarSync(){
  var wrap=document.querySelector('#lineBand .lgwrap'), bar=document.getElementById('lgXbar'),
      ws=document.getElementById('wsScroll');
  if(!wrap||!bar||!ws)return;
  var needs=wrap.scrollWidth>wrap.clientWidth+1;
  var footOff=wrap.getBoundingClientRect().bottom>ws.getBoundingClientRect().bottom;
  bar.style.display=(needs&&footOff)?'':'none';
  if(!_lgxLock){ _lgxLock=true; bar.scrollLeft=wrap.scrollLeft; _lgxLock=false; }
}
document.addEventListener('scroll',function(e){
  var t=e.target; if(!t||t===document)return;
  var wrap=document.querySelector('#lineBand .lgwrap'), bar=document.getElementById('lgXbar');
  if(!wrap||!bar)return;
  if(t===bar){ if(_lgxLock)return; _lgxLock=true; wrap.scrollLeft=bar.scrollLeft; _lgxLock=false; return; }
  if(t===wrap){ if(_lgxLock)return; _lgxLock=true; bar.scrollLeft=wrap.scrollLeft; _lgxLock=false; return; }
  if(t.id==='wsScroll')lgXbarSync();
},true);
window.addEventListener('resize',lgXbarSync);
function nrItemType(){
  var el=document.getElementById("nrItem"); if(!el)return;

  setTimeout(nrPlaceHits,0);
  var v=(el.value||"").trim().toLowerCase();

  if(NR_ITEM&&v.indexOf(String(NR_ITEM).toLowerCase())!==0){
    NR_ITEM=null;
    if(TEMPROW&&TEMPROW.fields)delete TEMPROW.fields.item_id;
    var sc=document.getElementById("nrSwCell"); if(sc)sc.outerHTML=nrSwCell();
    var nn=document.getElementById("nrNote"); if(nn)nn.innerHTML='';
    nrUomRebuild();   
  }
  var box=document.getElementById("nrHits"); if(!box)return;
  if(v.length<1){box.style.display='none';box.innerHTML='';return;}
  var tokens=v.split(/\s+/).filter(function(t){ return t!==''; });
  if(!tokens.length){box.style.display='none';box.innerHTML='';return;}
  var all=ITEMS.filter(function(i){ return itemMatch(i,tokens); });

  var hits=all.slice(0,SEARCH_CAP);
  box.style.display='block';
  box.innerHTML=hits.length

    ? hits.map(function(i){return '<button class="hit" onclick="nrPickItem(\''+esc(i.item_id)+'\')"><b>'+esc(i.item_id)+'</b> · '+esc(i.description_override||i.description||'')+
        (i.lifecycle_status==='Pending'?' · <span class="flag">awaiting approval</span>':'')+'</button>';}).join('')+capNote(all.length)
    : '<button class="hit mk" onclick="openInlineItemCreate()">No match — create this item</button>';
}
function nrPickItem(id){

  NR_ITEM=id;
  if(!TEMPROW)TEMPROW={fields:{}};
  TEMPROW.fields.item_id=id;
  var it=ITEMMAP[id];
  document.getElementById("nrItem").value=id+' · '+(it?(it.description_override||it.description||''):'');
  document.getElementById("nrHits").style.display='none';
  var note=document.getElementById("nrNote");

  var set=itemUoms(id);

  var pr=it?PRICEBY[it.type_code]:null;
  var hg=(it&&it.hsn_code)?HSNGST[it.hsn_code]:null;

  if(note)note.innerHTML='<b>'+esc(id)+'</b> · '+esc(it?(it.description_override||it.description||''):'')+
    (it&&it.lifecycle_status==='Pending'?' · <span class="flag">awaiting approval</span>':'');

  var dEl=document.getElementById('nrDisc');
  if(dEl&&!dEl.value){
    var cty=custOf(Q)?custOf(Q).customer_type:null;
    var ctRow=(LISTS[LIST.CUSTTYPE]||[]).filter(function(v){return v.code===cty;})[0];
    var md=ctRow&&ctRow.metadata?ctRow.metadata:{};
    var dDef=null;
    ['default_disc_pct','disc_pct','default_discount_pct','discount_pct'].forEach(function(k){
      if(dDef===null&&md[k]!==undefined&&md[k]!==null&&md[k]!=='')dDef=Number(md[k]);
    });

    var dh0=document.getElementById("nrDiscHint");
    if(dDef!==null&&!isNaN(dDef)){
      dEl.value=String(dDef);
      if(dh0)dh0.innerHTML='<b>'+esc(String(dDef))+'%</b> from type '+esc(cty||'');
    } else if(dh0){
      dh0.innerHTML='0&ndash;100%';   
    }
  }

  nrUomRebuild();

  var nrow=document.getElementById("nrRow");
  if(nrow&&nrow.cells&&nrow.cells.length>7){
    var tmp=document.createElement('tbody'); tmp.innerHTML='<tr>'+nrSwCell()+'</tr>';
    nrow.replaceChild(tmp.rows[0].cells[0],nrow.cells[7]);
  }
  if(dEl&&dEl.value)tempEdit('disc',dEl.value);
  tempEdit('item_id',id);

async function applyCustomize(){
  var tid=document.getElementById("czType").value;

  if(!tid){
    var s0=document.getElementById("czErr");
    if(s0)s0.innerHTML='<div class="wbanner hard" style="margin:0">Pick the customisation.</div>';
    toast("Pick the customisation.","err");
    return;
  }

  var gvv=function(id){ var e=document.getElementById(id); return e?String(e.value||'').trim():''; };
  var uRaw=gvv('czUnit'), qRaw=gvv('czQty');
  var priceErr='';
  if(uRaw===''||isNaN(Number(uRaw)))            priceErr='Enter the unit price for this customisation.';
  else if(Number(uRaw)<0)                        priceErr='The unit price cannot be less than zero.';
  else if(qRaw===''||isNaN(Number(qRaw)))        priceErr='Enter the quantity.';
  else if(Number(qRaw)<=0)                       priceErr='The quantity must be greater than zero.';
  if(priceErr){
    var sp=document.getElementById("czErr");
    if(sp)sp.innerHTML='<div class="wbanner hard" style="margin:0">'+esc(priceErr)+'</div>';
    toast(priceErr,"err");
    return;
  }

  var drv={}, missing=[], stated=[], statedExtra=false;
  czInputs(tid).forEach(function(d,ix){
    var el=document.getElementById('czv-'+d);
    var ue=document.getElementById('czu-'+d);
    var raw=el?String(el.value||'').trim():'';
    var uom=ue?String(ue.value||'').trim():'';
    var v=specName(d);
    if(raw===''||isNaN(Number(raw))||uom===''){
      missing.push(v);
      return;
    }
    drv[d]={v:Number(raw),u:uom};                 
    stated.push(v+' '+raw+' '+uom);
    if(ix>0)statedExtra=true;                     
  });
  if(missing.length){

    var _m="Fill in "+missing.join(', ')+" — with the unit — because this item asks for "+(missing.length===1?'it':'them')+" on this customisation.";
    var _s=document.getElementById("czErr");
    if(_s)_s.innerHTML='<div class="wbanner hard" style="margin:0">'+esc(_m)+'</div>';
    toast(_m,"err");
    return;
  }
  var btn=document.getElementById("czBtn");
  await saveGuard(btn,"Saving…",async function(){
    try{

      var gv=function(id){ var e=document.getElementById(id); return e?String(e.value||'').trim():''; };

      var czPayload={p_actor_emp:actorEmp,line_id:czLineId,
                     cust_code:tid, asked_values:drv,
                     manual_unit_price:Number(uRaw), customization_qty:Number(qRaw)};
      if(czEditId)czPayload.sub_line_no=czEditId;   
      var env=await callA(RPC.CUSTOMIZE,czPayload);

      var askMsg='';
      var askPayload={p_actor_emp:actorEmp,line_id:czLineId}, askAny=false;
      if(gv('czAsk')){ askPayload.asked_customization=gv('czAsk'); askAny=true; }

      if(statedExtra){ askPayload.asked_specification=stated.join(' \u00b7 '); askAny=true; }
      var d0=czInputs(tid)[0];
      var dv0=d0?drv[d0]:null;
      if(dv0&&typeof dv0==='object'&&dv0.u&&Number(dv0.v)>0){
        askPayload.asked_customer_length=Number(dv0.v);
        askPayload.asked_customer_uom=String(dv0.u);

      }
      if(askAny){
        try{ await callA(RPC.ASKED_SAVE,askPayload); }
        catch(ax){ askMsg=friendlyErrA(ax); }
      }
      closeModal(); await refreshOrder();
      if(askMsg)toast("Customisation saved. The customer's ask was not.","warn");
      await autoReprice(true);        
      okToast(env,(czEditId?"Customisation updated":"Customisation added")+".");
    }catch(ex){
      var slot=document.getElementById("czErr"); if(slot)slot.innerHTML=errBox(ex);

      try{ await refreshOrder(); }catch(e2){}
    }
  });
}

async function nqLoadWon(){

    .select('id,quote_no,rev_no,quote_date,grand_total,status,lead_time_delivery')
    .eq('customer_id',nqCust.id).eq('status','Won').order('quote_date',{ascending:false}).limit(200);

          if(!(qt>0)||cv<qt)open[l.quote_id]=true;

}

  nqQuote=(nqWon.filter(function(x){return x.id===id;})[0])||null;
  nqQL=[]; nqQLErr=null;

  var _rddBox=document.getElementById('nqRDD');
  if(nqQuote&&_rddBox&&!String(_rddBox.value||'').trim()&&nqQuote.lead_time_delivery!=null){
    var _pd=new Date(TODAY_ISO+'T00:00:00'); _pd.setDate(_pd.getDate()+Number(nqQuote.lead_time_delivery));
    function _z(n){return (n<10?'0':'')+n;}
    _rddBox.value=isoToDMY(_pd.getFullYear()+'-'+_z(_pd.getMonth()+1)+'-'+_z(_pd.getDate()));
    nqRddCheck(false);
  }
  if(nqQuote){
    var r=await SB.from('quote_lines')
      .select('id,line_no,item_id,customer_qty,customer_uom,customer_length,quoted_total_qty,quoted_uom,converted_qty,rate')
      .eq('quote_id',nqQuote.id).order('line_no',{ascending:true});
    if(r.error)nqQLErr=r.error.message;
    else nqQL=(r.data||[]).map(function(l){

      var qt=Number(l.quoted_total_qty||0), cq=Number(l.customer_qty||0), cv=Number(l.converted_qty||0);
      var leftQuoted=Math.max(qt-cv,0);
      var left=(qt>0)?(leftQuoted*cq/qt):cq;
      l.__left=left; l.__take=left;
      return l;
    });
  }

  nqiGate();
}
function nqTakeChanged(lineId,v){
  var l=nqQL.filter(function(x){return x.id===lineId;})[0]; if(!l)return;
  l.__take=(String(v).trim()==='')?0:Number(v);
  var b=document.getElementById('nqBtn'); if(b)b.disabled=!nqCanCreate();
}
function nqCanCreate(){

  if(nqParty==='UNIT'){
    var u=document.getElementById('nqPartyUnit');
    return !!(u&&u.value);
  }
  if(!nqCust||gateLevel(nqCust)==='block')return false;
  if(nqOrigin!=='FROM_QUOTE')return true;
  if(!nqQuote)return false;
  return nqQL.some(function(l){return Number(l.__take||0)>0;});
}

function nqQuoteSelHtml(){
  if(nqOrigin!=='FROM_QUOTE')return '';
  if(nqWonErr)return '<div class="wbanner soft" style="margin:0 0 11px">The won quotes could not be read.</div>';
  if(!nqWon.length)return '<div class="hint">'+esc(nqCust?nqCust.name:'This customer')+' has no open Won quote.</div>';
  return '<div class="fr"><div class="fg" style="flex:1"><label for="nqWonSel">Quote</label><select class="in" id="nqWonSel" onchange="nqPickQuote(this.value)">'+
    '<option value="">Pick a quote</option>'+
    nqWon.map(function(q){ return '<option value="'+esc(q.id)+'">'+esc((q.quote_no||'')+' rev '+String(q.rev_no==null?0:q.rev_no)+
      (q.quote_date?(' \u00b7 '+isoToDMY(q.quote_date)):'')+(q.grand_total!=null?(' \u00b7 '+rsPlain(q.grand_total)):''))+'</option>';}).join('')+
    '</select></div></div>';
}

function nqQuoteBoxHtml(){
  if(nqOrigin!=='FROM_QUOTE'||!nqQuote)return '';
  if(nqQLErr)return '<div class="wbanner soft" style="margin:0 0 11px">The quote lines could not be read.</div>';
  if(!nqQL.length)return '<div class="hint">That quote carries no line to convert.</div>';
  var h='<div class="fg" style="flex:1"><label>Lines to convert from '+esc(nqQuote.quote_no||'')+'</label>'+
    '<table class="grid rkf-table dense"><thead><tr><th>#</th><th>Item</th><th class="num">On the quote</th>'+
    '<th class="num">Left</th><th class="num">Take</th></tr></thead><tbody>';

    var it=ITEMMAP[l.item_id];
    h+='<tr><td class="num">'+esc(String(l.line_no))+'</td>'+
       '<td>'+esc(it?(it.description_override||it.description||l.item_id):l.item_id)+'</td>'+
       '<td class="num">'+num(l.customer_qty,3)+' '+esc(l.customer_uom||'')+'</td>'+
       '<td class="num">'+num(l.__left,3)+'</td>'+
       '<td class="num"><input class="in num" style="width:90px" inputmode="decimal" value="'+esc(String(l.__take))+
         '" oninput="nqTakeChanged(\''+esc(l.id)+'\',this.value)" aria-label="Quantity to convert from line '+esc(String(l.line_no))+'"/></td></tr>';
  });
  h+='</tbody></table>'+
     ''+

  return '<div class="fr">'+h+'</div>';
}

function nqiGate(){

function nqType(){
  var el=document.getElementById("nqCustTA"); if(!el)return;
  var v=(el.value||"").trim().toLowerCase();
  var box=document.getElementById("nqHits"); if(!box)return;
  if(v.length<1){ box.style.display='none'; box.innerHTML=''; return; }
  var all=CUSTS.filter(function(c){return c.partner_side!=='Creditor'&&custMatch(c,v);});
  var hits=all.slice(0,SEARCH_CAP);
  box.style.display='block';
  box.innerHTML=hits.length
    ? hits.map(function(c){return custHitHtml(c,'nqPick(\''+esc(c.id)+'\')');}).join('')+capNote(all.length)
    : '<button class="hit mk" onclick="openInlineCreate()">No match — create this customer</button>';
}
function nqPick(id){
  var c=CUSTMAP[id]; if(!c)return;
  nqCust=c;
  document.getElementById("nqHits").style.display='none';
  document.getElementById("nqCustTA").value=c.name;

  var n=document.getElementById("nqNote");
  if(n)n.innerHTML=custNote(c);

  nqOrigin='DIRECT'; nqWon=[]; nqWonErr=null; nqQuote=null; nqQL=[]; nqQLErr=null;
  var _d=document.getElementById('nqOrgD'), _q=document.getElementById('nqOrgQ');
  if(_d)_d.className='btn btn-sm btn-p';
  if(_q){_q.className='btn btn-sm btn-g'; _q.disabled=false;}
  if(!CUSTADDR[c.id]){
    SB.from('customer_addresses').select('address_id,customer_id,addr_type,pincode,area,district,state,address_line,gst_at_addr,is_default,created_at,created_by,city,address_line2,consignee_name,consignee_contact_name,consignee_mobile').eq('customer_id',c.id).then(function(a){
      CUSTADDR[c.id]=a.error?[]:(a.data||[]);
      var n2=document.getElementById("nqNote");
      if(n2&&nqCust&&nqCust.id===c.id)n2.innerHTML=custNote(c);
    });
  }
  var g=document.getElementById("nqGate");
  if(g){
    var lvl=gateLevel(c);
    g.innerHTML = lvl==='block'
      ? '<div class="wbanner hard" style="margin:0 0 11px"><b>'+esc(c.name)+' '+esc(gateIs(c))+', so a new order cannot be raised for them.</b></div>'
      : (lvl==='warn'||c.credit_hold

          ? '<div class="wbanner soft" style="margin:0 0 11px"><b>'+esc(c.name)+' is '+esc(c.credit_hold?'on credit hold':c.status)+'</b> &mdash; you can take their order, and the approver will see it.</div>'
          : '');
  }

  if(c.terms_code){
    var pt=document.getElementById("nqPt");
    var dflt=cfgCode('quote_default_pt_code');
    if(pt&&(!pt.value||(dflt!==null&&pt.value===dflt)))pt.value=c.terms_code;
  }

  var se=document.getElementById('nqSales');

  var cce=document.getElementById('nqCcr');
  if(cce&&!cce.value&&c.ccr_emp)cce.value=c.ccr_emp;

  nqiGate();
}
async function doCreateQuote(){
  if(!needActor())return;
  var uParty=(nqParty==='UNIT');
  var partyUnit='';
  if(uParty){
    partyUnit=((document.getElementById('nqPartyUnit')||{}).value||'').trim();
    if(!partyUnit){toast("Pick the unit this order is for.","err");return;}
  }else{
    if(!nqCust){toast("Pick the customer first.","err");return;}
    if(gateLevel(nqCust)==='block'){toast(nqCust.name+" "+gateIs(nqCust)+", so an order cannot be raised for them.","err");return;}
  }
  var unit=(document.getElementById("nqUnit").value||"").trim();
  if(!unit){toast("The raising unit is required.","err");return;}
  var pt=document.getElementById("nqPt").value||"";
  var ins=document.getElementById("nqIns").value||"";
  if(!pt){toast("Pick the payment terms.","err");return;}
  if(!ins){toast("Pick the insurance option.","err");return;}

  if(nqOrigin!=='FROM_QUOTE'){

    if(!((document.getElementById('nqCat')||{}).value||'').trim()){toast("Pick the order category.","err");return;}
    if(!((document.getElementById('nqMod')||{}).value||'').trim()){toast("Pick the mode of delivery.","err");return;}
  }

  if(!((document.getElementById('nqExu')||{}).value||'').trim()){toast("Pick the executing unit.","err");return;}

  if(!readDMY('nqRDD')){toast("Give the required delivery date.","err");return;}

  if(!nqRddCheck(false)){toast((document.getElementById('nqRddHint')||{}).textContent||'The RDD is outside the allowed window.','err');return;}

  var commRaw=((document.getElementById('nqRefComm')||{}).value||'').trim();
  if(commRaw!==''&&!nqRefId&&!uParty){toast("A commission needs a referrer.","err");return;}

  var qd=TODAY_ISO;

  var charges=[];
  gcList().forEach(function(v){
    var el=document.getElementById('nqhc-'+v.code);
    var raw=el?(el.value||"").trim():"";
    if(raw!==""&&Number(raw)>0)charges.push({code:v.code,amount:Number(raw)});
  });

  var terms={
    pt:pt,
    insurance:ins,
    delivery_scope:document.getElementById("nqScope").value||null,
    delivery_terms:document.getElementById("nqTerms").value||null,

    mode_of_delivery:(document.getElementById("nqMod")||{}).value||null
  };
  var btn=document.getElementById("nqBtn");
  var prog=document.getElementById("nqProgress");
  var partyKey=uParty?('unit:'+partyUnit):nqCust.id;
  await saveGuard(btn,"Creating…",async function(){
    try{
      var k=appKey('newquote:'+partyKey+':'+qd);

      var pay={
        p_actor_emp:actorEmp,
        p_app_key:k,
        booking_unit:unit,
        direct_so_category:(document.getElementById("nqCat")||{}).value||null,
        product_terms:terms
      };

      if(uParty)pay.customer_org_unit_id=partyUnit; else pay.customer_id=nqCust.id;

      var _rdd=(typeof readDMY==='function')?readDMY('nqRDD'):'';
      if(_rdd)pay.required_delivery_date=_rdd;

      var _exu=((document.getElementById('nqExu')||{}).value||'').trim();
      if(_exu)pay.executing_unit=_exu;
      var _pono=((document.getElementById('nqPoNo')||{}).value||'').trim();
      if(_pono)pay.customer_po_no=_pono;
      var _podt=(typeof readDMY==='function')?readDMY('nqPoDt'):'';
      if(_podt)pay.customer_po_date=_podt;
      var _prio=((document.getElementById('nqPrio')||{}).value||'').trim();
      if(_prio)pay.priority_code=_prio;
      var _sal=((document.getElementById('nqSales')||{}).value||'').trim();
      if(_sal)pay.salesperson_emp=_sal;
      var _ccr2=((document.getElementById('nqCcr')||{}).value||'').trim();
      if(_ccr2)pay.ccr_emp=_ccr2;
      Object.keys(terms).forEach(function(tk){ pay[tk]=terms[tk]; });
      var ref=(!uParty&&nqRefId)||"";
      if(ref){
        pay.referrer_id=ref;
        if(commRaw!=='')pay.deal_commission_pct=Number(commRaw);
      }
      if(charges.length)pay.header_charges=charges;

      var env, d, nid, nno;
      if(nqOrigin==='FROM_QUOTE'){

        var takes=nqQL.filter(function(l){return Number(l.__take||0)>0;})
                      .map(function(l){return {quote_line_id:l.id, qty:Number(l.__take)};});
        if(!takes.length){ toast('Give at least one line a quantity.','warn'); creating=true; return; }
        var fqPay={
          p_actor_emp:actorEmp,
          p_idem_key:appKey('so-from-quote:'+nqQuote.id+':'+qd),
          quote_id:nqQuote.id,
          booking_unit:unit,
          lines:takes,
          allow_over:false
        };
        if(_exu)fqPay.executing_unit=_exu;
        if(_rdd)fqPay.required_delivery_date=_rdd;
        env=await callA(RPC.FROM_QUOTE,fqPay);
      } else {
        env=await callA(RPC.CREATE,pay);
      }
      d=env.data||{};
      nid=d.so_id; nno=d.so_no;
      if(!env.replay)clearKey('newquote:'+partyKey+':'+qd);
      if(prog)prog.innerHTML='Created <b>'+esc(nno||nid||'')+'</b>.';
      creating=false;                 
      await loadOrders();
      if(nid){
        await openWorkspace(nid);
        toast((nno||'The order')+" created for "+(uParty?partyUnit:nqCust.name)+".","ok");   
      } else {
        showTab('list');
        okToast(env,"The order was created. Open it from the list.");
      }
    }catch(ex){
      creating=true;                  
      if(prog)prog.innerHTML='';
      var slot=document.getElementById("nqErr"); if(slot)slot.innerHTML=errBox(ex);
    }
  });
}

var _tabWatch=null;
function watchReturn(kind){
  if(_tabWatch)window.removeEventListener('focus',_tabWatch);
  _tabWatch=function(){
    window.removeEventListener('focus',_tabWatch); _tabWatch=null;
    if(kind==='customer')refreshCustomersAfterCreate();
    else refreshItemsAfterCreate();
  };
  window.addEventListener('focus',_tabWatch);
}
function openInlineCreate(){
  var typed=((document.getElementById('nqCustTA')||document.getElementById('custTA')||{}).value||'').trim();
  CUSTSNAP={}; CUSTS.forEach(function(c){CUSTSNAP[c.id]=1;});
  window.open('m01.html?intent=create'+(typed?('&name='+encodeURIComponent(typed)):''),'_blank');
  watchReturn('customer');
  toast('Customer screen opened.','ok');
}
async function refreshCustomersAfterCreate(){
  var cu=await SB.from('customers').select('id,customer_code,customer_type,name,mobile,email,referrer_id,gstin,pan,tan,credit_limit,credit_days,credit_hold,terms_code,status,sales_emp,ccr_emp,unit,tally_alias,created_at,updated_at,created_by,version,is_deleted,district,area,city,state,pincode,credit_used,partner_side').eq('is_deleted',false);
  if(cu.error){ toast('The customer master could not be re-read.','err'); return; }
  CUSTS=cu.data||[]; CUSTMAP={}; CUSTS.forEach(function(c){CUSTMAP[c.id]=c;});
  var fresh=CUSTSNAP?CUSTS.filter(function(c){return !CUSTSNAP[c.id];}):[];
  CUSTSNAP=null;
  if(!fresh.length){ toast('Customer list re-read — nothing new yet.','warn'); return; }

  var nqOpen=!!document.getElementById('nqCustTA')&&creating;
  if(fresh.length===1&&nqOpen){
    nqPick(fresh[0].id);
    var ta=document.getElementById('nqCustTA'); if(ta)ta.value=fresh[0].name;
    toast(fresh[0].name+' ('+fresh[0].customer_code+') picked.','ok');
  } else {
    toast(fresh.length+' new customer(s) arrived: '+fresh.map(function(c){return c.name+' ('+c.customer_code+')';}).join(', ')+'.','ok');
  }
}

function openInlineItemCreate(){
  if(!needActor())return;

  var typed=((document.getElementById('nrItem')||{}).value||'').trim();
  ITEMSNAP={}; ITEMS.forEach(function(i){ITEMSNAP[i.item_id]=1;});
  window.open('m02c.html?intent=create'+(typed?('&code='+encodeURIComponent(typed)):''),'_blank');
  watchReturn('item');
  toast('Item Master opened.','ok');
}
async function refreshItemsAfterCreate(){
  var it=await SB.from('items').select('item_id,type_code,description,description_override,hsn_code,customization_eligible,lifecycle_status,sw_standard').in('lifecycle_status',['Active','Pending']);
  if(it.error){ toast('The item catalogue could not be re-read.','err'); return; }
  ITEMS=it.data||[]; ITEMMAP={}; ITEMS.forEach(function(i){ITEMMAP[i.item_id]=i;});
  var fresh=ITEMSNAP?ITEMS.filter(function(i){return !ITEMSNAP[i.item_id];}):[];
  ITEMSNAP=null;
  if(fresh.length){

    var box=document.getElementById('nrItem');
    if(fresh.length===1&&box){
      box.value=fresh[0].item_id;
      nrItemType();
      toast(fresh[0].item_id+' picked.','ok');
    } else {
      toast(fresh.length+' new item(s) arrived: '+fresh.map(function(i){return i.item_id;}).join(', ')+'.','ok');
      if(box)nrItemType();
    }
  } else {
    toast('Item catalogue re-read — nothing new yet.','warn');
  }
}

async function doExport(variant,scope){
  toggleExportMenu(scope==='list'?'List':'Rec');

  var rows=(scope==='list')?matched():((scope==='rec')?recRows():[]);
  if(!rows.length){toast("Nothing to export.","warn");return;}
  var cost=canCost();
  var QC=expQuoteCols(cost), LC=expLineCols(cost);
  var wantSummary=(variant==='summary'||variant==='both');
  var wantDetail=(variant==='detailed'||variant==='both');
  if(!wantSummary&&!wantDetail)wantSummary=true;          
  var byQuote={}, lineCount=0;
  if(wantDetail){

    var ids=rows.map(function(q){return q.id;});
    var ll=await SB.from('so_lines').select('id,so_id,line_no,item_id,item_type_code,line_type,customer_length,customer_uom,customer_qty,quoted_uom,quoted_total_qty,rate,discount_pct,commission_pct,amount,applied_gst_rate,supply_type,commission_amount,pricing_resolution_method,sw_basis,sw_value,sw_needs_approval,route,executing_unit,cost,margin,quote_id,quote_line_id,created_by,created_by_name,created_at,updated_at,version,applied_hsn,price_source_type,price_source_revision,discount_over_ceiling,governed_pricing_decision,price_refusal_reason,pricing_stale').in('so_id',ids).order('line_no');
    if(!ll.error)(ll.data||[]).forEach(function(l){
      if(!byQuote[l.so_id])byQuote[l.so_id]=[];
      byQuote[l.so_id].push(l); lineCount++;
    });
  }
  var out=[], summaryRows=0, detailRows=0, noLineQuotes=0;
  function qCells(q,c){ return QC.map(function(col){return csvCell(col.v(q,c));}); }
  if(wantSummary){
    out.push(QC.map(function(col){return col.h;}).join(','));
    rows.forEach(function(q){ out.push(qCells(q,custOf(q)).join(',')); summaryRows++; });
  }
  if(wantDetail){
    if(wantSummary)out.push('');                           
    out.push(QC.concat(LC).map(function(col){return col.h;}).join(','));
    rows.forEach(function(q){
      var c=custOf(q), mine=byQuote[q.id]||[];
      if(!mine.length){

        out.push(qCells(q,c).concat(LC.map(function(){return '';})).join(','));
        noLineQuotes++; return;
      }
      mine.forEach(function(l){
        out.push(qCells(q,c).concat(LC.map(function(col){return csvCell(col.v(l));})).join(','));
        detailRows++;
      });
    });
  }
  RKF.exportRows(out,'M08_orders_'+variant+'_'+TODAY_ISO+'.csv');

  toast("Exported "+rows.length+" order(s)"+
    (wantSummary?" · "+summaryRows+" summary row(s)":"")+
    (wantDetail?" · "+detailRows+" line row(s) of "+lineCount+" line(s) read"+(noLineQuotes?" · "+noLineQuotes+" order(s) with no lines":""):"")+
    (cost?" · with cost and margin":" · without cost or margin")+".","ok");
}

document.addEventListener('keydown',function(e){
  var mod=e.ctrlKey||e.metaKey;

  if(e.key==='Escape'&&!mod){
    var bd0=document.getElementById("modalBd");
    if(bd0&&bd0.classList.contains("show"))return;          

    var openMenus=document.querySelectorAll('.ddmenu.show');
    if(openMenus.length){
      e.preventDefault();
      Array.prototype.slice.call(openMenus).forEach(function(m){
        m.classList.remove("show");
        var wrap=m.closest?m.closest('.ddwrap'):null;
        var trg=wrap?wrap.querySelector('button[aria-expanded]'):null;
        if(trg)trg.setAttribute('aria-expanded','false');
      });
      return;
    }
    var hits=document.getElementById("nrHits");
    if(hits&&hits.style.display!=='none'){ e.preventDefault(); hits.style.display='none'; hits.innerHTML=''; return; }
    var nqh=document.getElementById("nqHits");
    if(nqh&&nqh.style.display!=='none'){ e.preventDefault(); nqh.style.display='none'; nqh.innerHTML=''; return; }
    if(creating){

      e.preventDefault(); confirmLeave(function(){ cancelNewQuote(); }); return;
    }
    if(curTab==='ws'&&openQuoteId){
      e.preventDefault();

      closeWorkspace(); return;
    }
  }
  if(mod&&(e.key==='k'||e.key==='K')){
    e.preventDefault();
    if(curTab!=='list'){ showTab('list'); if(curTab!=='list')return; }  
    var s=document.getElementById('q'); if(s){s.focus();s.select();}
    return;
  }
  if(mod&&(e.key==='s'||e.key==='S')){
    e.preventDefault();                              

    var bd=document.getElementById("modalBd");
    if(bd&&bd.classList.contains("show")){
      var ft=document.getElementById("modalFoot");

      var prim=ft?ft.querySelector('.btn-p:not([disabled])'):null;
      if(prim)prim.click();
      return;
    }
    var sv=document.getElementById('btnSave');
    if(sv&&!sv.disabled)saveDraft();
    return;
  }
  if(mod&&(e.key==='n'||e.key==='N')){
    var nb=document.getElementById('btnNewQuote');

    if(nb&&!nb.disabled){ e.preventDefault(); confirmLeave(function(){ openNewQuote(); }); }
    return;
  }
  if(e.key==='Enter'&&!e.shiftKey){
    var bd0=document.getElementById("modalBd");
    if(bd0&&bd0.classList.contains("show")&&e.target&&e.target.tagName!=='TEXTAREA'&&e.target.tagName!=='BUTTON'){
      var ft=document.getElementById("modalFoot");

      var prim=ft?ft.querySelector('.btn-p,.btn-d:not(.btn-nokey)'):null;
      if(prim&&!prim.disabled){ e.preventDefault(); prim.click(); }
    }
  }
});

document.addEventListener('keydown',function(e){
  if(e.key!=='Enter')return;
  var t=e.target;
  if(!t||!t.getAttribute)return;
  if(t.tagName==='TR'&&t.getAttribute('tabindex')==='0'){ e.preventDefault(); t.click(); }
  if(t.classList&&t.classList.contains('terr-i')){ e.preventDefault(); t.click(); }
  if(t.classList&&t.classList.contains('tab')){ e.preventDefault(); t.click(); }
  if(t.classList&&t.classList.contains('ri')){ e.preventDefault(); t.click(); }
});
