<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>M-CUS Customization Types</title>
<link rel="stylesheet" href="rk-foundation.css?v=RKF-1.1.0">
<style>

*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Segoe UI',system-ui,sans-serif;background:var(--bg);color:var(--ink);font-size:var(--fs-body);height:100vh;overflow:hidden;display:flex;flex-direction:column}
.shell{flex:1;display:flex;overflow:hidden}
.main{flex:1;display:flex;flex-direction:column;overflow:hidden}
/* FTF R1 - SCREEN 9: private .mod-hdr REMOVED; banner is the foundation .rkf-halfbar (M0818A). */
.mod-badge{font-size:var(--fs-caption);font-weight:800;color:var(--surface);background:var(--mcus);padding:3px 8px;border-radius:5px}
.mod-title{font-size:var(--fs-emphasis);font-weight:800;color:var(--navy)}.mod-crumb{font-size:var(--fs-caption);color:var(--muted)}
.mod-role{font-size:var(--fs-caption);background:var(--mcusbg);color:var(--mcus);padding:2px 7px;border-radius:5px;font-weight:700}
.hdr-sp{flex:1}
.actor-note{font-size:var(--fs-caption);color:var(--ink2);background:var(--greybg);border:1px solid var(--line2);border-radius:7px;padding:4px 9px;font-weight:600}
.icon-btn{width:30px;height:30px;border-radius:8px;border:1px solid var(--line2);background:var(--surface);color:var(--ink2);display:inline-flex;align-items:center;justify-content:center;cursor:pointer;font-size:15px}
.icon-btn:hover{border-color:var(--mcus);color:var(--mcus)}
.cost-tg{display:inline-flex;align-items:center;gap:7px;border:1px solid var(--line2);background:var(--surface);border-radius:8px;padding:4px 9px;cursor:pointer;user-select:none;font-size:var(--fs-caption);font-weight:700;color:var(--ink2)}
.cost-tg .tg{width:32px;height:18px;border-radius:20px;background:var(--line2);position:relative;transition:.15s;flex-shrink:0}
.cost-tg .tg::after{content:"";position:absolute;width:14px;height:14px;border-radius:50%;background:var(--surface);top:2px;left:2px;transition:.15s;box-shadow:0 1px 2px rgba(0,0,0,.2)}
.cost-tg.on{color:var(--mcus);border-color:var(--mcus)}.cost-tg.on .tg{background:var(--mcus)}.cost-tg.on .tg::after{left:16px}
.tabs{background:var(--surface);border-bottom:1px solid var(--line);padding:0 18px;display:flex;gap:4px;flex-shrink:0}
.tab{padding:11px 16px;font-size:var(--fs-body);font-weight:600;color:var(--ink2);cursor:pointer;border-bottom:2.5px solid transparent;margin-bottom:-1px}
.tab:hover{color:var(--navy)}.tab.act{color:var(--mcus);border-bottom-color:var(--mcus)}
.pane{flex:1;display:none;overflow:hidden}.pane.act{display:flex}
/* workbench */
.wb{flex:1;display:flex;overflow:hidden}
.wb-left{width:288px;background:var(--surface);border-right:1px solid var(--line);display:flex;flex-direction:column;flex-shrink:0}
.wb-lhdr{padding:11px 14px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:8px}
.wb-lhdr .t{font-size:var(--fs-caption);font-weight:800;color:var(--muted);text-transform:uppercase;letter-spacing:.4px}
.wb-search{padding:10px 12px;border-bottom:1px solid var(--line)}
.si{position:relative;min-width:280px}/*P6-C-03*/.si input{width:100%;padding:7px 10px 7px 30px;border:1.5px solid var(--line2);border-radius:8px;font-size:var(--fs-body);font-family:inherit;outline:none}.si input:focus{border-color:var(--mcus)}.si .mag{position:absolute;left:10px;top:50%;transform:translateY(-50%);color:var(--muted);font-size:12px}
.tlist{flex:1;overflow:auto;padding:6px}
.tcard{padding:9px 11px;border-radius:9px;border:1.5px solid transparent;cursor:pointer;margin-bottom:3px}
.tcard:hover{background:var(--surface2)}.tcard.sel{background:var(--mcusbg);border-color:var(--mcus)}
.tcard .nm{font-size:var(--fs-body);font-weight:700;color:var(--navy);display:flex;align-items:center;gap:6px}
.tcard .mt{font-size:var(--fs-caption);color:var(--ink2);margin-top:3px;display:flex;gap:8px;flex-wrap:wrap}
.tcard .mt .b{font-family:'Consolas',monospace}
.dot{width:7px;height:7px;border-radius:50%;flex-shrink:0}.dot.on{background:var(--green)}.dot.off{background:var(--muted)}
.pill{font-size:var(--fs-tag);font-weight:800;padding:1px 6px;border-radius:20px;text-transform:uppercase;letter-spacing:.3px}
.pill.dia{background:var(--warnbg);color:var(--warn)}.pill.nodia{background:var(--greybg);color:var(--grey)}
.wb-lftr{padding:10px 12px;border-top:1px solid var(--line);display:flex;gap:7px}
.wb-cfg{flex:1;overflow:auto;background:var(--bg);padding:16px 20px}
.cfg-card{background:var(--surface);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow-sm);margin-bottom:14px;overflow:hidden}
.cfg-hd{padding:11px 16px;border-bottom:1px solid var(--line);background:var(--surface2);display:flex;align-items:center;gap:9px}
.cfg-hd .h{font-size:var(--fs-caption);font-weight:800;color:var(--mcus);text-transform:uppercase;letter-spacing:.4px}
.cfg-bd{padding:14px 16px}
.fr{display:flex;gap:14px;flex-wrap:wrap;margin-bottom:12px}.fr:last-child{margin-bottom:0}
.fg{display:flex;flex-direction:column;gap:5px}.fg.gr{flex:1;min-width:150px}
.fg label{font-size:var(--fs-caption);font-weight:800;color:var(--muted);text-transform:uppercase;letter-spacing:.4px}
.in{border:1.5px solid var(--line2);border-radius:8px;padding:8px 10px;font-size:var(--fs-body);font-family:inherit;outline:none;background:var(--surface);color:var(--ink)}
.in:focus{border-color:var(--mcus)}.in:disabled{background:var(--surface2);color:var(--muted)}
.in.big{font-size:var(--fs-emphasis);font-weight:700;color:var(--navy)}
.calc-note{font-size:var(--fs-caption);color:var(--ink2);background:var(--mcusbg);border:1px solid #bfe3cf;border-radius:8px;padding:8px 11px;font-family:'Consolas',monospace}
.toggle{display:inline-flex;align-items:center;gap:8px;cursor:pointer;user-select:none}
.tg{width:38px;height:21px;border-radius:20px;background:var(--line2);position:relative;transition:.15s;flex-shrink:0}
.tg::after{content:"";position:absolute;width:17px;height:17px;border-radius:50%;background:var(--surface);top:2px;left:2px;transition:.15s;box-shadow:0 1px 2px rgba(0,0,0,.2)}
.toggle.on .tg{background:var(--mcus)}.toggle.on .tg::after{left:19px}
.toggle .tl{font-size:var(--fs-body);font-weight:600;color:var(--ink2)}
.inh-uom{display:inline-flex;flex-direction:column;gap:2px;background:var(--purplebg);border:1.5px dashed var(--purple);border-radius:8px;padding:7px 11px;min-width:150px}
.inh-uom .k{font-size:var(--fs-tag);font-weight:800;color:var(--purple);text-transform:uppercase;letter-spacing:.4px}
.inh-uom .v{font-size:var(--fs-body);font-weight:700;color:var(--purple);font-family:'Consolas',monospace}
/* inputs table */
.itbl{width:100%;border-collapse:collapse;font-size:var(--fs-body)}
.itbl th{text-align:left;padding:7px 9px;font-size:var(--fs-tag);font-weight:800;color:var(--muted);text-transform:uppercase;letter-spacing:.3px;border-bottom:1px solid var(--line)}
.itbl td{padding:6px 9px;border-bottom:1px solid var(--line)}
.itbl tr:last-child td{border-bottom:none}
.rtag{font-size:var(--fs-tag);font-weight:800;padding:2px 7px;border-radius:5px;text-transform:uppercase;letter-spacing:.3px}
.rtag.drv{background:var(--accentbg);color:var(--accent)}.rtag.spec{background:var(--bluebg);color:var(--blue)}.rtag.mat{background:var(--purplebg);color:var(--purple)}
.chip{font-size:var(--fs-caption);font-weight:600;padding:4px 10px;border-radius:7px;border:1.5px solid var(--line2);background:var(--surface);color:var(--ink2);cursor:pointer;user-select:none;display:inline-flex;align-items:center;gap:5px}
.chip:hover{border-color:var(--mcus)}.chip.on{background:var(--mcus);border-color:var(--mcus);color:var(--surface)}
.chips{display:flex;gap:7px;flex-wrap:wrap}
/* effective-dated rate/cost */
.eff-tbl{width:100%;border-collapse:collapse;font-size:var(--fs-body)}
.eff-tbl th{text-align:left;padding:7px 10px;font-size:var(--fs-tag);font-weight:800;color:var(--muted);text-transform:uppercase;border-bottom:1px solid var(--line);background:var(--surface2)}
.eff-tbl td{padding:7px 10px;border-bottom:1px solid var(--line);font-family:'Consolas',monospace}
.eff-tbl tr.cur td{background:var(--mcusbg);font-weight:700}
.eff-tbl tr:last-child td{border-bottom:none}
.costcol.hidecost{filter:blur(5px);user-select:none}
.cost-lock{font-size:var(--fs-caption);color:var(--muted);font-style:italic;margin-left:6px}
/* preview */
.qprev{background:var(--surface);border:1.5px dashed var(--mcus);border-radius:9px;padding:11px 13px;font-size:var(--fs-body)}
.qprev .ql{font-weight:700;color:var(--navy)}
.qprev .qc{color:var(--mcus);font-family:'Consolas',monospace;margin-top:4px}
.warn-line{font-size:var(--fs-body);color:var(--warn);background:var(--warnbg);border:1px solid #e7cd8e;border-radius:8px;padding:8px 11px;margin-top:10px;display:none}
.warn-line.show{display:block}
.warn-line b{color:var(--ink)}
/* records */
.recwrap{flex:1;overflow:auto;background:var(--bg);padding:14px 18px}
table.grid{border-collapse:separate;border-spacing:0;background:var(--surface);border:1px solid var(--line);border-radius:10px;overflow:hidden;font-size:var(--fs-body);width:100%}
table.grid th{background:var(--surface2);text-align:left;padding:9px 11px;font-size:var(--fs-caption);font-weight:800;color:var(--ink2);text-transform:uppercase;letter-spacing:.3px;border-bottom:1px solid var(--line);white-space:nowrap;cursor:pointer;position:sticky;top:0;z-index:var(--z-sticky)}
table.grid th:hover{color:var(--mcus)}
table.grid td{padding:8px 11px;border-bottom:1px solid var(--line);white-space:nowrap}
table.grid tr:last-child td{border-bottom:none}table.grid tbody tr:hover{background:var(--surface2);cursor:pointer}
td.num{text-align:right;font-family:'Consolas',monospace}
.subbar{background:var(--surface);border-bottom:1px solid var(--line);padding:10px 18px;display:flex;gap:12px;align-items:center;flex-shrink:0;flex-wrap:wrap}
.ctrl{display:flex;align-items:center;gap:7px}.ctrl label{font-size:var(--fs-caption);font-weight:800;color:var(--muted);text-transform:uppercase;letter-spacing:.4px}
/* insights */
.inswrap{flex:1;overflow:auto;background:var(--bg);padding:16px 18px}
.ins-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:14px;max-width:1100px}
.ins-card{background:var(--surface);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow-sm);overflow:hidden}
.ins-card.wide{grid-column:1/-1}
.ins-hd{padding:11px 15px;border-bottom:1px solid var(--line);font-size:var(--fs-caption);font-weight:800;color:var(--navy);text-transform:uppercase;letter-spacing:.4px;display:flex;align-items:center;gap:8px}
.ins-bd{padding:14px 15px}
.bar-row{display:flex;align-items:center;gap:10px;margin-bottom:9px}
.bar-row .bl{font-size:var(--fs-body);font-weight:600;color:var(--ink2);width:120px;flex-shrink:0}
.bar-track{flex:1;height:18px;background:var(--bg);border-radius:5px;overflow:hidden}
.bar-fill{height:100%;border-radius:5px;display:flex;align-items:center;justify-content:flex-end;padding-right:7px;font-size:var(--fs-caption);font-weight:700;color:var(--surface)}
.kpi-row{display:flex;gap:12px;flex-wrap:wrap}
.kpi{flex:1;min-width:90px;background:var(--surface2);border:1px solid var(--line);border-radius:9px;padding:11px 13px}
.kpi .v{font-size:var(--fs-metric);font-weight:800;color:var(--navy)}.kpi .l{font-size:var(--fs-caption);color:var(--muted);font-weight:700;text-transform:uppercase;letter-spacing:.3px;margin-top:2px}
.mtag{font-size:var(--fs-caption);font-weight:700;padding:2px 7px;border-radius:5px}.mtag.ok{background:var(--mcusbg);color:var(--mcus)}.mtag.bad{background:var(--accentbg);color:var(--accent)}
.retire-row{display:flex;align-items:center;gap:9px;padding:7px 0;border-bottom:1px solid var(--line);font-size:var(--fs-body)}.retire-row:last-child{border-bottom:none}
/* drawer */
.drawer-bd{position:fixed;inset:0;background:rgba(15,30,45,.35);display:none;z-index:var(--z-drawer)}.drawer-bd.show{display:block}
.drawer{position:fixed;top:0;right:0;height:100vh;width:420px;background:var(--surface);box-shadow:-6px 0 24px rgba(0,0,0,.18);transform:translateX(100%);transition:transform .2s;z-index:var(--z-drawer);display:flex;flex-direction:column}
.drawer.show{transform:translateX(0)}
.dwr-hd{padding:14px 18px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:10px}
.dwr-hd .t{font-size:var(--fs-emphasis);font-weight:800;color:var(--navy)}.dwr-x{margin-left:auto;cursor:pointer;color:var(--muted);font-size:var(--fs-display);font-weight:700}
.dwr-bd{flex:1;overflow:auto;padding:16px 18px}
.dwr-ft{padding:13px 18px;border-top:1px solid var(--line);display:flex;gap:9px;justify-content:flex-end}
.aud-row{padding:9px 2px;border-bottom:1px solid var(--line);font-size:var(--fs-body)}.aud-row:last-child{border-bottom:none}
.aud-row .a-ts{color:var(--muted);font-family:Consolas,monospace;font-size:var(--fs-caption)}
.aud-row .a-act{font-weight:700;color:var(--blue)}
/* modal */
.modal-bd{position:fixed;inset:0;background:rgba(15,30,45,.4);display:none;align-items:center;justify-content:center;z-index:var(--z-modal)}.modal-bd.show{display:flex}
.modal{background:var(--surface);border-radius:14px;box-shadow:var(--shadow-lg);width:480px;max-width:92vw;overflow:hidden}
.modal-hd{padding:15px 18px;border-bottom:1px solid var(--line);font-size:var(--fs-emphasis);font-weight:800;color:var(--navy)}
.modal-bd2{padding:18px}.modal-ft{padding:13px 18px;border-top:1px solid var(--line);display:flex;gap:9px;justify-content:flex-end}
.btn{display:inline-flex;align-items:center;gap:5px;padding:8px 13px;border-radius:8px;font-size:var(--fs-body);font-weight:600;cursor:pointer;border:none;font-family:inherit;transition:all .15s;white-space:nowrap}
.btn-p,.btn-primary{background:var(--mcus);color:var(--surface);box-shadow:0 1px 4px rgba(28,122,74,.3)}.btn-p:hover,.btn-primary:hover{background:#155e39}
.btn-g{background:var(--surface);color:var(--ink2);border:1px solid var(--line2)}.btn-g:hover{background:var(--surface2)}
.btn-d{background:var(--accentbg);color:var(--accent);border:1px solid #edb8ae}.btn-d:hover{background:#f7d9d3}
.btn-sm{padding:6px 11px;font-size:var(--fs-body)}.btn:disabled{opacity:.45;cursor:not-allowed;box-shadow:none}




.hint{font-size:var(--fs-caption);color:var(--muted);margin-top:4px}
.req-star{color:var(--accent)}
/* tri-state */
.state-load{padding:22px}.state-load .sk{height:13px;border-radius:6px;background:linear-gradient(90deg,var(--bg),var(--line),var(--bg));background-size:200% 100%;animation:skmv 1.1s infinite;margin:9px 0}.state-load .sk:nth-child(2){width:78%}.state-load .sk:nth-child(3){width:58%}@keyframes skmv{0%{background-position:200% 0}100%{background-position:-200% 0}}.state-msg{color:var(--muted);font-size:var(--fs-body);margin-top:10px}
.state-err{padding:34px 20px;text-align:center;color:var(--warn)}.state-err .state-ic{font-size:24px;margin-bottom:8px}.state-retry{margin-left:8px;border:1px solid var(--line2);background:var(--surface);border-radius:7px;padding:4px 12px;font-size:var(--fs-body);font-weight:600;cursor:pointer;color:var(--ink)}
.state-empty{padding:34px 20px;text-align:center;color:var(--muted)}.state-empty .state-ic{font-size:26px;margin-bottom:8px;opacity:.7}
/* datepicker (STD-DATEPICKER, reused from m02d) */
.dpf .in,.dpf input{padding-right:26px}







</style>
</head>
<body>
<div class="shell">
  <div class="main">
    <div class="mod-hdr rkf-halfbar">
      <div class="mod-badge">M-CUS</div>
      <div class="mod-title">Customization Types</div>
      <div class="mod-crumb">Products sub-master</div>
      <div class="hdr-sp"></div>
      <div class="cost-tg" id="costToggle" data-cost-toggle onclick="toggleCost()" title="Simulate a cost-authorised role (blur off)"><span class="tg"></span><span id="costTgLbl">Cost view: off</span></div>
      <div class="icon-btn" id="histBtn" data-history-access onclick="openHistory()" title="Activity Log">&#128340;</div>
      <span class="actor-note" id="actorNote">actor: &mdash;</span>
      <div class="mod-role" id="roleChip">definitions</div>
    </div>
    <div class="tabs">
      <div class="tab act" id="tab-wb" onclick="showTab('wb')">Workbench</div>
      <div class="tab" id="tab-rec" onclick="showTab('rec')">Records</div>
      <div class="tab" id="tab-var" onclick="showTab('var')">Variables</div>
      <div class="tab" id="tab-ins" onclick="showTab('ins')">Insights</div>
    </div>

    <!-- WORKBENCH -->
    <div class="pane act" id="pane-wb">
      <div class="wb">
        <div class="wb-left">
          <div class="wb-lhdr"><span class="t">Customization Types</span><span class="t" id="typeCount" style="margin-left:auto"></span></div>
          <div class="wb-search"><div class="si"><span class="mag">&#9906;</span><input id="typeSearch" placeholder="Search type / basis" oninput="renderTypes()"/></div></div>
          <div class="tlist" id="typeList"></div>
          <div class="wb-lftr">
            <button class="btn btn-g btn-sm" style="flex:1" onclick="newType()">+ New Type</button>
          </div>
        </div>
        <div class="wb-cfg" id="cfgArea"></div>
      </div>
    </div>

    <!-- RECORDS -->
    <div class="pane" id="pane-rec">
      <div class="main" style="overflow:hidden">
        <div class="subbar">
          <div class="ctrl"><label>Filter</label>
            <select class="in" id="recFilter" onchange="renderRecords()">
              <option value="all">All types</option><option value="active">Active</option>
              <option value="inactive">Inactive</option><option value="diagram">Diagram-required</option>
            </select>
          </div>
          <div class="ctrl"><label>Search</label><div class="si"><span class="mag">&#9906;</span><input class="in" id="recSearch" style="padding-left:30px" placeholder="Type / basis" oninput="renderRecords()"/></div></div>
          <div style="flex:1"></div>
          <button class="btn btn-g btn-sm" id="openBulk" onclick="openBulk()">&#8645; Bulk rate revise</button>
        </div>
        <div class="recwrap"><table class="grid" id="recTable"></table></div>
      </div>
    </div>

    <!-- VARIABLES -->
    <div class="pane" id="pane-var">
      <div class="main" style="overflow:hidden">
        <div class="subbar">
          <div class="ctrl"><label>Search</label><div class="si"><span class="mag">&#9906;</span><input class="in" id="varSearch" style="padding-left:30px" placeholder="Variable / UOM" oninput="renderVariables()"/></div></div>
          <div class="ctrl" style="font-size:var(--fs-caption);color:var(--muted)">Input variables</div>
          <div style="flex:1"></div>
          <button class="btn btn-primary btn-sm" id="varAddBtn" onclick="openVar(null)">+ New variable</button>
        </div>
        <div class="recwrap"><table class="grid" id="varTable"></table></div>
      </div>
    </div>

    <!-- INSIGHTS -->
    <div class="pane" id="pane-ins">
      <div class="inswrap"><div class="ins-grid" id="insArea"></div></div>
    </div>
  </div>
</div>

<!-- impact / deactivate drawer (governed) -->
<div class="drawer-bd" id="drawerBd" onclick="closeDrawer()"></div>
<div class="drawer" id="drawer">
  <div class="dwr-hd"><span class="t" id="dwrTitle">Impact</span><span class="dwr-x" onclick="closeDrawer()">&times;</span></div>
  <div class="dwr-bd" id="dwrBody"></div>
  <div class="dwr-ft" id="dwrFoot"></div>
</div>

<!-- T-016 (DDR-807): the private history drawer is GONE - the promoted RKF.history drawer is
     the one surface (same served reader, M-CUS/customization registry key). -->

<!-- bulk modal -->
<div class="modal-bd" id="bulkBd" data-rkf-dialog>
  <div class="modal">
    <div class="modal-hd">Bulk Rate Revise</div>
    <div class="modal-bd2">
      <div class="fr"><div class="fg gr"><label>Scope</label>
        <select class="in" id="bulkScope"><option value="all">All active types</option><option value="diagram">Diagram-required only</option></select></div>
        <div class="fg"><label>Change %</label><input class="in" id="bulkPct" type="number" value="5" style="width:90px"/></div>
        <div class="fg"><label>Direction</label><select class="in" id="bulkDir"><option value="up">Increase</option><option value="down">Decrease</option></select></div>
      </div>
      <div class="fr"><div class="fg gr"><label>Effective from</label><div id="bulkDateWrap"></div></div></div>
      <div class="hint"></div>
    </div>
    <div class="modal-ft"><button class="btn btn-g" onclick="closeBulk()">Cancel</button><button class="btn btn-primary" id="bulkApplyBtn" onclick="applyBulk()">Apply revise</button></div>
  </div>
</div>

<!-- variable modal -->
<div class="modal-bd" id="varBd">
  <div class="modal">
    <div class="modal-hd" id="varModalTitle">New variable</div>
    <div class="modal-bd2">
      <div class="fr"><div class="fg gr"><label>Variable name <span class="req-star">*</span></label><input class="in" id="vName" placeholder="e.g. Crimp length"/></div></div>
      <div class="fr"><div class="fg gr"><label>UOM (from M-RM master) <span class="req-star">*</span></label>
        <select class="in" id="vUom"></select>
        <div class="hint"></div></div>
        <div class="fg"><label>Default role</label>

  if(!c){ calcTxt='Add a dated rate to preview the charge.'; }
  else if(cb.driver_kind==='length'){ amt=c.rate*demo.length; calcTxt=demo.length+' m · '+rs(c.rate)+'/'+esc(cb.label||'')+' = '+rs(amt); }
  else if(cb.driver_kind==='area'){ var a=Math.round(demo.length*demo.width*100)/100; amt=c.rate*a; calcTxt=demo.length+' x '+demo.width+' = '+a+' Sqm · '+rs(c.rate)+' = '+rs(amt); }
  else if(cb.driver_kind==='count'){ amt=c.rate*demo.qty; calcTxt=demo.qty+' nos · '+rs(c.rate)+' = '+rs(amt); }
  else { amt=c.rate; calcTxt='flat · '+rs(amt); }
  var pc=$id('prevCalc'); if(pc) pc.textContent=(amt!=null?'e.g. ':'')+calcTxt;

  /* 1. negative / zero margin */
  var wn=$id('warnNeg');
  if(wn){ if(c && c.cost!=null && c.rate<=c.cost){ wn.innerHTML='<b>Negative / zero margin.</b> Rate '+rs(c.rate)+' ≤ cost '+rs(c.cost)+'. To fix this, raise the rate above cost, or add a new dated rate before quoting.'; wn.classList.add('show'); } else wn.classList.remove('show'); }
  /* 2. Sqm needs Length + Width drivers */
  var ws=$id('warnSqm');
  if(ws){ var hasL=false,hasW=false; draft.inputs.forEach(function(i){ var v=VMAP[i.variable_id]; if(!v||i.role!=='XR01') return; var f=(v.name||'').toLowerCase(); if(f.indexOf('len')>=0) hasL=true; if(f.indexOf('wid')>=0) hasW=true; });
    if(cb.driver_kind==='area' && !(hasL&&hasW)){ ws.innerHTML='<b>Sqm basis needs Length and Width as drivers.</b> Add Length and Width variables with the driver role.'; ws.classList.add('show'); } else ws.classList.remove('show'); }
  /* 3. exactly one driver (per charge_basis.driver_count) */
  var wd=$id('warnDrv');
  if(wd){ var dc=driverCount(draft.inputs); var need=(cb.driver_count==null?1:cb.driver_count);
    if(dc!==need){ wd.innerHTML='<b>Driver count is '+dc+'; '+esc(basisLabel(draft.charge_basis))+' expects '+need+'.</b> To fix this, set exactly '+need+' input(s) to the driver role.'; wd.classList.add('show'); } else wd.classList.remove('show'); }
}

      '<button class="btn btn-g btn-sm" onclick="gotoType(\''+t.id+'\')">Review</button></div>'; });
  html+='<div class="hint" style="margin-top:8px">Quote-usage feed (M06) is not yet wired to this master \u2014 uses are read as 0, so every type appears here. This is not yet a retirement recommendation.</div>';
  html+='</div></div>';
  }

  area.innerHTML=html;
}

/* FTF-01 - the universal Activity Log, record-local on the selected customization
   type. Five columns, newest first, controlled loading, served by the authorized
   reader; the private customization_status_audit read, its raw error text and its
   UUID fragment are gone. */
var ALOG_ACCESS=null, ALOG_BTN=null;
function syncActivityAccessPoint(){
  var b=$id('histBtn'); if(!b && !ALOG_BTN) return;
  var host=(b||ALOG_BTN).parentNode || (ALOG_BTN&&ALOG_BTN._host);
  if(ALOG_ACCESS!=='Read' && ALOG_ACCESS!=='Full'){
    if(b){ b._host=b.parentNode; ALOG_BTN=b; b.parentNode.removeChild(b); }
    return;
  }
  if(selId && selId!=='__new__'){ if(!b && ALOG_BTN && ALOG_BTN._host){ ALOG_BTN._host.appendChild(ALOG_BTN); ALOG_BTN=null; } }
  else if(b){ b._host=b.parentNode; ALOG_BTN=b; b.parentNode.removeChild(b); }
}
/* T-016 (DDR-807): the ONE promoted drawer - same registry key, same reader; the private
   backdrop/drawer pair and their Escape branch are deleted. */
function openHistory(){
  if(!selId || selId==='__new__') return;
  RKF.history.open({ client:SB, module_code:'M-CUS', record_entity:'customization',
                     record_key:selId, emptyMessage:'No changes recorded' });
}
function closeHistory(){ RKF.history.close(); }

/* ---------- render dispatch + actor ---------- */
function render(){ renderActor(); renderTypes(); renderCfg(); var t=activeTab(); if(t==='rec') renderRecords(); else if(t==='var') renderVariables(); else if(t==='ins') renderInsights(); }
function renderActor(){ var n=$id('actorNote'); if(n) n.textContent=actorEmp?('actor: '+esc(actorName||'uat-operator')+(actorMapped?'':' · auth-map M04-deferred')):'actor: none (read-only)'; }

/* ---------- toast (names outcome + next action) ---------- */
var toastT;




/* ---------- keyboard ---------- */
document.addEventListener('keydown',function(e){
  if(e.key==='Escape'){ /* T-016: the drawer's Escape is the foundation's surface now */ if($id('drawer').classList.contains('show')){ closeDrawer(); return; } if($id('varBd').classList.contains('show')){ closeVar(); return; } if($id('bulkBd').classList.contains('show')){ closeBulk(); return; } return; }
  if((e.ctrlKey||e.metaKey) && (e.key==='k'||e.key==='K')){ e.preventDefault(); var t=activeTab(); var id=t==='wb'?'typeSearch':(t==='rec'?'recSearch':(t==='var'?'varSearch':'typeSearch')); var el=$id(id); if(el) el.focus(); return; }
  if((e.ctrlKey||e.metaKey) && (e.key==='s'||e.key==='S')){ e.preventDefault();
    if($id('varBd').classList.contains('show')) saveVar();
    else if($id('bulkBd').classList.contains('show')) applyBulk();
    else if($id('drawer').classList.contains('show')) doDeactivate();
    else if(activeTab()==='wb' && draft) saveType();
    /* D-10: Ctrl+S was swallowed on Records / Variables / Insights with no feedback at all */
    else toast('Nothing to save on this tab — Ctrl+S saves a type on the Workbench.');
    return; }
  if(e.key==='Enter'){
    if($id('varBd').classList.contains('show') && e.target && e.target.id==='vName'){ e.preventDefault(); saveVar(); }
    else if($id('bulkBd').classList.contains('show') && e.target && (e.target.id==='bulkPct')){ e.preventDefault(); applyBulk(); }
  }
});

/* ---------- boot (tri-state) ---------- */
/* ERS-001 §3.3 (every table has designed loading/empty/error rows; "loading != empty != error, each with
   its own text") + §4.3 (blank waits banned) + §7.6 (exactly one implementation per concept).
   ONE state component paints EVERY data surface — previously only cfgArea + the history drawer were
   tri-state, so Records/Variables/Insights sat blank while loading and rendered error INDISTINGUISHABLY
   from empty. Surfaces declare their wrapper so a table gets a valid row, never a bare <div>. */
var STATE_SURFACES=[
  {id:'cfgArea',  wrap:'div',   what:'customization types'},
  {id:'typeList', wrap:'div',   what:'type list'},
  {id:'recTable', wrap:'table', cols:8, what:'records'},
  {id:'varTable', wrap:'table', cols:6, what:'variables'},
  {id:'insArea',  wrap:'div',   what:'insights'}
];
function stateBox(kind,msg){
  return kind==='load'
    ? '<div class="state-load" data-loading-state><div class="sk"></div><div class="sk"></div><div class="sk"></div><div class="state-msg">'+esc(msg)+'</div></div>'
    : '<div class="state-err" data-error-state><div class="state-ic">&#9888;</div><div>'+esc(msg)+' <button class="state-retry" onclick="boot()">Retry</button></div></div>';
}
function paintState(kind,msg){
  STATE_SURFACES.forEach(function(s){
    var el=$id(s.id); if(!el) return;
    var box=stateBox(kind,(kind==='load'?('Loading '+s.what+'…'):msg));
    el.innerHTML=(s.wrap==='table')?('<tbody><tr><td colspan="'+s.cols+'">'+box+'</td></tr></tbody>'):box;
  });
}
function bootLoading(){ paintState('load'); }
function bootError(msg){ paintState('err', msg||'Couldn\'t load customization data.'); }
async function boot(){
  bootLoading();
  try{
    await loadAll(); booted=true;
    /* the served module answer decides whether the Activity Log access point
       exists at all; None removes it, not disables it (GR-04A) */
    RKF.moduleAccess('M-CUS', { client: SB }).then(function (lvl) { ALOG_ACCESS = lvl; syncActivityAccessPoint(); });
    if(TYPES.length){ selId=TYPES[0].id; loadDraft(); } else { selId=null; draft=null; }
    var hash=(location.hash||'').replace('#',''); var t=['wb','rec','var','ins'].indexOf(hash)>=0?hash:'wb';
    showTab(t); render();
    toast('Loaded '+TYPES.length+' type(s), '+VARS.length+' variable(s) (live).','ok');
  }catch(e){ booted=false; bootError('This screen could not be loaded.'); }
}
if(SB) boot(); else bootError('Supabase client not available.');
</script>
<script>
/* F-116 (his word 2026-08-28, ESTATE-WIDE; found operating M06): masters re-read on every
   return of focus to this tab (RKF.liveMasters, one foundation implementation, 5s throttle)
   so a new search shows what was just created or changed in another tab. The registered
   loader is this screen's own, verified memory-only - no repaint, no edit-state touch. */
if(window.RKF&&RKF.liveMasters)RKF.liveMasters(loadAll);
</script>
