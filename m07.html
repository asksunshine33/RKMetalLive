      delegAuthNote(a)+'</div>';
    if(!escalateOffered(a)&&isOpen(a))bar.innerHTML+='<div class="box mut" style="flex-basis:100%;margin-top:8px"><b>Send up a level is not offered.</b> '+
      (String(a.tier||'').toUpperCase()==='DIRECTORS'?''
        :'Only a Pending approval can be sent up; this one is '+esc(a.status)+'.')+'</div>';
    if(!DIRROLES.length&&escalateOffered(a))bar.innerHTML+='<div class="box info" style="flex-basis:100%;margin-top:8px"><b>No Directors role could be read</b>, so there may be nowhere to send this up to.</div>';
  }
}

/* ---------- friendly errors: the DB's own code and words, never paraphrased away ----------
   Vocabulary quoted from the CONFIRMED 145a bodies. */
function friendlyErr(ex){
  var code=(ex&&ex.code)||'', m=(ex&&(ex.message||ex.details))||String(ex), d=(ex&&ex.detail)||'';
  var map={
    M07_SELF_APPROVAL:'You cannot decide your own request, and nobody standing in for you can decide it either.',
    M07_DELEGATE_IS_REQUESTER:'The person this is being decided for raised it themselves, so it cannot be decided this way.',
    M07_DELEGATION_SELF:'The decision names you as the person being stood in for — a delegated decision needs a different authority-holder.',
    M07_AUTHORITY_HOLDER_INVALID:'The person named as the authority-holder is not an active employee.',
    M07_DELEGATION_NOT_FOUND:'No active delegation names you as standing in for that person today, covering this document. It has to be raised in M04 first.',
    M07_DELEGATOR_NOT_PERMITTED:'The person you are standing in for does not hold the right to decide approvals, so their delegation cannot be exercised — nobody can delegate an authority they could not use themselves.',
    M07_AUTHORITY_NOT_HELD:'The person whose authority this decision exercises holds no active approval authority for this document.',
    M07_ONBEHALF_NOT_ACCEPTED:'The identity this screen sent was not accepted. Please report it.',
    M07_TIER_EXCEEDED:'Value or discount is above the limit here. Send it up a level.',
    M07_NOT_PENDING:'No longer waiting on a decision. Refresh to see where it stands.',
    M07_NOTE_REQUIRED:'This action needs a reason written down.',
    M07_NO_HIGHER_TIER:'There is nowhere to send this up to — Directors is the highest level, or no Directors authority exists yet for this document.',
    M07_NOT_OPEN:'This is not open any more, so it cannot be cancelled.',
    M07_STALE_APPROVAL:'The quote has changed — send it for approval again.',
    AUTH_ACTOR_INVALID:'Your sign-in is not linked to an active employee record, so nothing can be recorded against you.',
    AUTH_NO_ROLE:'You have not been given the authority to do this.',
    NOT_FOUND:'That approval no longer exists. Refresh the list.',
    STALE_WRITE:'Somebody changed this after the screen read it. Nothing was saved — refresh and try again.',
    VALIDATION:'Some of what was sent is not acceptable.',
    INTERNAL:'Something went wrong. Nothing may have been saved - refresh.'
  };
  var head=map[code]||plainRule(m)||plainRule(d)||'';
  if(!head&&/unknown capability/.test(m))head='This screen asked for a permission the system does not recognise. That is a fault in the screen, not something you did. Nothing was saved — please report it.';
  /* FTF R1 (P5-64): the finished business sentence alone. The code and detail are NOT
     discarded - they stay on the error object for a support call. */
  return (head?head+' ':'')+m;
}

/* ---------- one governed modal for every decision (ERS §2.4 + §3.2 · A14) ---------- */
var dlgCtx=null;
function openDlg(title,bodyHtml,confirmLabel,confirmClass,fn){
  dlgCtx=fn;
  document.getElementById('dlgTitle').textContent=title;
  document.getElementById('dlgBody').innerHTML=bodyHtml;
  document.getElementById('dlgFoot').innerHTML='<button class="btn btn-g" type="button" onclick="closeDlg()">Cancel</button>'+
    '<button class="btn '+confirmClass+'" type="button" id="dlgGo" onclick="dlgConfirm()">'+esc(confirmLabel)+'</button>';
  document.getElementById('dlgBd').classList.add('show');
  var f=document.getElementById('dlgNote'); if(f)f.focus();
}
function closeDlg(){
  var el=document.getElementById('dlgNote');
  if(el&&dlgAction)noteDraft[dlgAction]=el.value||'';
  document.getElementById('dlgBd').classList.remove('show'); dlgCtx=null; dlgAction=null;
}
function dlgConfirm(){ var fn=dlgCtx; if(fn)fn(); }
function dlgNoteVal(){ var el=document.getElementById('dlgNote'); return el?(el.value||'').trim():''; }
/* ★ A SEPARATE NOTE PER ACTION (DO-04). The required marker appears only where a reason is
   genuinely required; each action keeps its own draft. */
function noteField(action,label,mandatory,help){
  dlgAction=action;
  return '<div class="fg"><label for="dlgNote">'+esc(label)+(mandatory?' <span class="rq">*</span>':' <span class="hint">(optional)</span>')+'</label>'+
    '<textarea class="in" id="dlgNote" rows="3" placeholder="'+esc(mandatory?'this is required':'you may leave this empty')+'">'+esc(noteDraft[action]||'')+'</textarea>'+
    '<div class="hint">'+esc(help)+'</div></div>';
}
function summary(a){ var q=qOf(a), c=cOf(a);
  return '<div class="box mut" style="margin:0 0 12px"><b>'+esc(a.approval_no||'—')+'</b> &middot; '+
    (q?('quote '+esc(q.quote_no||'—')+' revision '+esc(q.rev_no)+' &middot; '+(q.grand_total!=null?esc(rs(q.grand_total)):'value not available')):'the quote cannot be read')+
    (c?(' &middot; '+esc(c.name)):'')+' &middot; '+esc(a.tier||'—')+' level</div>'; }
function standingBox(a){ var dg=delegationFor(a);
  return dg?('<div class="box info" style="margin:0 0 12px"><b>You are acting for '+esc(dg.holder.full_name)+'.</b> '+
    ''+
    delegAuthNote(a)+'</div>'):''; }

/* ---------- the Pattern-A write path ----------
   ONE app_key per (record, action), minted and KEPT until the call succeeds, so a retry after a
   dropped connection re-sends the same instruction. All four bodies read p_app_key into
   telemetry; none does a replay lookup (Owner Q6) — a replay:true can therefore not occur, and
   is still handled harmlessly if a later revision adds it.

   ★ CONFIRMED payload contract, from the four bodies in 145a (Payload Doctrine): a FLAT
   p_payload — {p_actor_emp, p_app_key, approval_id} plus ONE action key at the top level
   (note / rejection_note / reason / void_reason), plus approver_emp ONLY when acting under a
   delegation. Nothing is nested; an on_behalf_of key is never constructed — the database
   derives the delegate from the authenticated actor and REFUSES a supplied one. */
function keyFor(a,action){ var k=a.approval_id+'::'+action; if(!appKeys[k])appKeys[k]=newAppKey(); return appKeys[k]; }
function clearKey(a,action){ delete appKeys[a.approval_id+'::'+action]; }

async function writeDecision(action,rpcName,extra,btnId,okVerb){
  var a=selAppr; if(!a)return;
  var why=(action==='approve')?approveBlock(a):decideBlock(a);
  if(why){ toast('This is not open to you — '+why+'. Nothing was sent.','err'); return; }
  var payload={p_actor_emp:actorEmp,p_app_key:keyFor(a,action),approval_id:a.approval_id};
  Object.keys(extra).forEach(function(k){ payload[k]=extra[k]; });
  /* DELEGATION (DDR-284 A2): approver_emp = the AUTHORITY-HOLDER, from the row, never invented */
  var dg=delegationFor(a);
  if(dg)payload.approver_emp=holderOf(a);
  var btn=document.getElementById(btnId)||document.getElementById('dlgGo');
  await saveGuard(btn,'Working…',async function(){
    try{
      var r=await SB.rpc(rpcName,{p_payload:payload});
      if(r.error)throw r.error;                                  /* transport / grant / signature failure */
      var env=r.data||{};
      if(env.ok!==true){
        var e=env.error||{};
        var err=new Error(e.message||'The request was refused with no message.');
        err.code=e.code; err.detail=e.detail; throw err;
      }
      noteDraft[action]='';
      closeDlg();
      clearKey(a,action);
      var replay=(env.replay===true), envData=env.data||{};
      /* a message on screen is not proof — re-read the rows and report what the DATABASE says */
      await reload();
      var after=APPR.filter(function(x){return x.approval_id===a.approval_id;})[0];
      var qAfter=after?QUOTES[after.quote_id]:null;
      var proof=after?('The approval now reads "'+after.status+'"'+(after.decided_at?(', decided '+fmtDate(String(after.decided_at).slice(0,10))+' '+String(after.decided_at).slice(11,16)):'')+
                       (after.on_behalf_of?(' — recorded as '+(empName(after.on_behalf_of)||'their stand-in')+', acting for '+(empName(after.approver_emp)||'the approver')):'')+'.')
                    :'The approval is no longer in the list on screen — refresh to see where it went.';
      if(action==='approve'){
        if(qAfter&&qAfter.status)proof+=' The quote now reads "'+qAfter.status+'"'+'.';
        /* migration 149 read-back: the DDR-154 stamps the forward drive writes on the quote */
        if(qAfter&&(qAfter.approved_by_name||qAfter.approved_at))proof+=' The quote records: approved by '+(qAfter.approved_by_name||empName(qAfter.approved_by)||'(no name stamped)')+
          (qAfter.approved_at?(' on '+fmtDate(String(qAfter.approved_at).slice(0,10))+' '+String(qAfter.approved_at).slice(11,16)):'')+'.';
        if(qAfter&&qAfter.status&&qAfter.status!=='Approved'&&envData.next_step)proof+=' Next step: "'+envData.next_step+'".';
      }
      if(action==='reject'&&envData.quote_status)proof+=' The quote went back to "'+envData.quote_status+'".';
      /* migration 150 read-back: escalate recomputes tat_due into the DIRECTORS window */
      if(action==='escalate'&&after)proof+=' Level '+String(after.tier||'—')+
        (after.escalated_to?(', now with '+(empName(after.escalated_to)||'the Directors authority-holder')):'')+
        (after.tat_due?('. Its deadline now reads '+fmtDate(String(after.tat_due).slice(0,10))+' '+String(after.tat_due).slice(11,16)+' - recomputed and read back, not computed here.')
                      :'. It carries no deadline — none was stamped.');
          toast((replay?(okVerb+' — this had already gone through; the same instruction was re-delivered, so nothing was done twice. '):(okVerb+'. '))+proof,replay?'warn':'ok');
    }catch(ex){
      var msg=friendlyErr(ex);
      var body=document.getElementById('dlgBody');
      if(body&&document.getElementById('dlgBd').classList.contains('show'))
        body.innerHTML='<div class="box bad" style="margin:0 0 12px"><b>This was refused. Nothing was saved.</b><div style="margin-top:6px">'+esc(msg)+'</div></div>'+body.innerHTML;
      toast(msg,'err');
    }
  });
}

function doApprove(){
  var a=selAppr; if(!a)return;
  openDlg('Approve '+(a.approval_no||'this approval'),
    summary(a)+standingBox(a)+
    '<div class="box ok" style="margin:0 0 12px"><b>This moves the quote to Approved. There is no undo.</b></div>'+
    noteField('approve','Note',false,'Optional.'),
    'Approve','btn-p',function(){ writeDecision('approve','rpc_m07_approve',{note:dlgNoteVal()||null},'dlgGo','Approved'); });
}
function doReject(){
  var a=selAppr; if(!a)return;
  openDlg('Reject '+(a.approval_no||'this approval'),
    summary(a)+standingBox(a)+
    '<div class="box bad" style="margin:0 0 12px"><b>This sends the quote back to the salesperson as a draft.</b></div>'+
    noteField('reject','Why you are rejecting it',true,'Required.'),
    'Reject','btn-d',function(){
      var v=dlgNoteVal();
      if(!v){ toast('Say why you are rejecting it.','err'); var el=document.getElementById('dlgNote'); if(el)el.focus(); return; }
      writeDecision('reject','rpc_m07_reject',{rejection_note:v},'dlgGo','Rejected');
    });
}
function doEscalate(){
  var a=selAppr; if(!a)return;
  openDlg('Send '+(a.approval_no||'this approval')+' up a level',
    summary(a)+standingBox(a)+
    '<div class="box info" style="margin:0 0 12px"><b>This passes the same approval up to Directors and re-times its deadline.</b>'+
    ((function(){ var cv=coverFor(a), m=tatMs(a);
      if(cv&&m!==null&&m>0){ var de=EMPBYCODE[cv.delegate_code];
        return ' Stand-in: '+esc(de?de.full_name:cv.delegate_code)+'.'; }
      return ''; })())+'</div>'+
    noteField('escalate','Why it needs a higher level',true,'Required.'),
    'Send it up','btn-g',function(){
      var v=dlgNoteVal();
      if(!v){ toast('Say why it needs a higher level.','err'); var el=document.getElementById('dlgNote'); if(el)el.focus(); return; }
      writeDecision('escalate','rpc_m07_escalate',{reason:v},'dlgGo','Sent up a level');
    });
}
function doVoid(){
  var a=selAppr; if(!a)return;
  openDlg('Cancel '+(a.approval_no||'this approval'),
    summary(a)+standingBox(a)+
    '<div class="box warn" style="margin:0 0 12px"><b>An approval is cancelled, never deleted.</b></div>'+
    noteField('void','Why you are cancelling it',true,'Required.'),
    'Cancel this approval','btn-d',function(){
      var v=dlgNoteVal();
      if(!v){ toast('Say why you are cancelling it.','err'); var el=document.getElementById('dlgNote'); if(el)el.focus(); return; }
      writeDecision('void','rpc_m07_void',{void_reason:v},'dlgGo','Cancelled');
    });
}
</script>
<script>
/* ============================================================================================
   Y10 · RECORDS — decided approvals, with the revision pin and void reasons (INV_M07 A11;
   Auto-Approved is a filterable Decided outcome, DDR-263 R2.4). The Export action is a
   CLIENT-SIDE data export of already-fetched, policy-scoped rows — it is NOT the document
   layer, and rpc_m06_quote_document_emit is never called from this file (J10). The
   quote.export gate below is a screen-side rule, honestly labelled, asked of the live m06_can.
   ============================================================================================ */
function recordRows(){
  var s=(document.getElementById('qr')?document.getElementById('qr').value:'').trim().toLowerCase();
  qrSearch=s;
  return APPR.filter(function(a){
    if(RECORD_SET.indexOf(a.status)<0)return false;
    if(!s)return true;
    var q=qOf(a), c=cOf(a);
    var hay=[a.approval_no,q?q.quote_no:'',c?c.name:'',c?c.customer_code:'',a.decision,a.status,a.tier,
             a.void_reason,a.approve_note,a.reject_note,a.escalate_note,empName(a.approver_emp),empName(a.on_behalf_of),empName(a.requested_by)]
             .map(function(x){return String(x||'').toLowerCase();}).join(' | ');
    return hay.indexOf(s)>=0;
  }).sort(function(x,y){ return String(y.decided_at||y.updated_at||'').localeCompare(String(x.decided_at||x.updated_at||'')); });
}
/* ============================================================================================
   SEE-43 · REPORTS — counted LIVE from the policy-scoped rows this screen was allowed to read
   (never a second data path, never a baked figure). Distinct from Insights, which stays an
   Owner-deferred honest seam (SEE-42/DDR-194 C2): these are working reports on the read page,
   not the analytics tab. Every figure derives from APPR in view; the read window is stated.
   ============================================================================================ */
function renderReports(){
  var z=document.getElementById('repZone'); if(!z)return;
  if(!actorEmp){ z.innerHTML=notSignedIn(); return; }
  if(loadErr.queue){ surfError('repZone',loadErr.queue,'reload()'); return; }
  z.innerHTML=reportsZone();
}
function reportsZone(){
  if(!APPR.length)return '';
  function tbl(title,head,rows,note){
    return '<div class="zone" style="margin-top:12px"><div class="z-hd">'+title+'</div><div class="z-bd pad0">'+
      '<table class="grid"><thead><tr>'+head.map(function(x){return '<th'+(x[1]?' class="num"':'')+'>'+esc(x[0])+'</th>';}).join('')+'</tr></thead><tbody>'+
      (rows.length?rows.join(''):('<tr><td colspan="'+head.length+'"><div class="surf">nothing in the rows read</div></td></tr>'))+
      '</tbody></table>'+(note?('<div class="hint" style="padding:8px 12px">'+note+'</div>'):'')+'</div></div>';
  }
  /* 1 · by level and state */
  var byLS={};
  APPR.forEach(function(a){ var k=String(a.tier||'—')+'·'+String(a.status||'—'); byLS[k]=(byLS[k]||0)+1; });
  var r1=Object.keys(byLS).sort().map(function(k){ var p=k.split('·');
    return '<tr><td>'+esc(p[0])+'</td><td>'+statusTag(p[1])+'</td><td class="num">'+byLS[k]+'</td></tr>'; });
  /* 2 · answered against the deadline (decided rows carrying both stamps) */
  var inTime=0, late=0, unstamped=0;
  APPR.forEach(function(a){ if(DECIDED_SET.indexOf(a.status)<0)return;
    if(!a.tat_due||!a.decided_at){ unstamped++; return; }
    var d=Date.parse(a.decided_at), t=Date.parse(a.tat_due);
    if(isNaN(d)||isNaN(t)){ unstamped++; return; }
    if(d<=t)inTime++; else late++; });
  var r2=[
    '<tr><td>Answered within the deadline</td><td class="num">'+inTime+'</td></tr>',
    '<tr><td>Answered past the deadline</td><td class="num">'+late+'</td></tr>',
    '<tr><td>Carrying no deadline or no decision stamp</td><td class="num">'+unstamped+'</td></tr>'];
  /* 3 · by decider — "X, acting for Y" counted against the HOLDER whose authority decided */
  var byWho={};
  APPR.forEach(function(a){ if(DECIDED_SET.indexOf(a.status)<0)return;
    var k=(a.status===ST.auto)?'automatic — within norms':(empName(a.approver_emp)||'no approver recorded');
    byWho[k]=byWho[k]||{n:0,via:0}; byWho[k].n++; if(a.on_behalf_of)byWho[k].via++; });
  var r3=Object.keys(byWho).sort().map(function(k){
    return '<tr><td>'+esc(k)+'</td><td class="num">'+byWho[k].n+'</td><td class="num">'+(byWho[k].via||'&mdash;')+'</td></tr>'; });
  var esced=APPR.filter(function(a){return a.status===ST.escalated||a.escalate_note;}).length;
  var readNote='From the <b>'+APPR.length+'</b> approval(s) read in this date window'+
    (APPR.total>APPR.length?(' of '+APPR.total):'')+' · escalations seen: '+esced+'.';
  return '<div style="margin-top:4px">'+
    tbl('Report &middot; approvals by level and state',[['Level'],['State'],['Count',1]],r1,null)+
    tbl('Report &middot; answered against the deadline',[['Decided approvals'],['Count',1]],r2,null)+
    tbl('Report &middot; decisions by decider',[['Decided by (authority-holder)'],['Decisions',1],['of which via a stand-in',1]],r3,readNote)+
    '</div>';
}
function renderRecords(){
  if(LOCKED){ renderLockedOut(); return; }   /* REF-09/SOD-04 — the refusal survives re-renders */
  var z=document.getElementById('recZone'); if(!z)return;
  /* PM-07 · PM-15 (his register rulings): a role without the export right gets NO export control at
     all - "not even a visible-but-disabled one" - and no separate export-permission surface appears
     anywhere in the UI. PM-02/PR-04's law is the same shape: a thing a role may not have is ABSENT,
     never blanked and never shown greyed. This resolves spec conflict C-7 the way his row words it:
     BUILD_SPEC permitted 'absent/disabled', R5 forbids the disabled form, and his row forbids it too.
     The RPC/capability check is untouched - the control's absence is not the security boundary. */
  var btn=document.getElementById('recExport');
  if(btn){
    var ok=!!(actorEmp&&CAN[CAP.export]);
    btn.style.display=ok?'':'none';   /* ABSENT, not disabled */
    btn.disabled=!ok;                 /* belt and braces: never clickable while hidden */
    btn.title=ok?'Downloads the list below as a spreadsheet.':'';
  }
  var k=document.getElementById('recKpi');
  if(!actorEmp){ z.innerHTML=notSignedIn(); if(k)k.innerHTML=''; return; }
  if(loadErr.queue){ surfError('recZone',loadErr.queue,'reload()'); return; }
  var rows=recordRows();
  if(k)k.innerHTML='<span class="kt">decided <b>'+rows.length+'</b></span>'+
    '<span class="kt">auto-approved <b>'+APPR.filter(function(a){return a.status===ST.auto;}).length+'</b></span>'+
    '<span class="kt">voided <b>'+APPR.filter(function(a){return a.status===ST.voided;}).length+'</b></span>';
  /* ============================================================================================
     OF-49 · WS-8.3 — THE DECIDED COLUMN SET, every column the register names, in its order:
     Approval created · Approval no · Quote no · Rev no · Customer · Value · Referrer · Discount ·
     Commission · Status · TAT · Sales person · CCR · Approval status · Level · Decision · State ·
     Created by · Approved by · Last updated · Version decided · Decided on · Decided from · If cancelled why.
     Fitted to one page by density (table.grid.dense); a residual overflow scrolls sideways
     rather than a named column being dropped.
     TWO HONEST NOTES, said rather than papered over:
      · "Discount" is the governed DEAL DISCOUNT PERCENTAGE stored on the quote. A money figure
        would need every line of every decided quote, which this screen does not read; a derived
        money value is not offered rather than invented.
      · "Approval status" and "State" are ONE stored value (quote_approvals.status). No second
        governed column exists in the estate, so both render it and the header says so.
     ============================================================================================ */
  var h='<table class="grid dense"><thead><tr>'+
        '<th>Approval created</th><th>Approval no</th><th>Quote no</th><th class="num">Rev no</th><th>Customer</th>'+
        '<th class="num">Value</th><th>Referrer</th><th class="num">Discount</th><th class="num">Commission</th>'+
        '<th>Status <span class="hint">(quote)</span></th><th>TAT for approval</th><th>Sales person</th><th>CCR</th>'+
        '<th title="The same stored value as State — the estate holds no second column.">Approval status</th>'+
        '<th>Level</th><th>Decision</th><th>State</th><th>Created by</th><th>Approved by</th><th>Last updated</th>'+
        '<th class="num">Version decided</th><th>Decided on</th><th>Decided from</th>'+
        /* HIS WALK 2026-08-14: "Reason given , If cancelled, why are removed from records tab".
           They were the two longest free-text columns and the reason the rows could never be one
           height. They are NOT lost: both still leave in the export (`Approval note` /
           `Rejection reason` / `Reason sent up` / `Cancellation reason`), and both are on the
           decision workspace for the approval itself. Removing two display columns is one line
           to reverse if he meant the opposite. */
        '</tr></thead><tbody>';
  var RECCOLS=23;   /* SEE-39 added 'Decided from'; his 2026-08-14 walk removed 'Reason given' and
     'If cancelled, why'. 25 - 2 = 23, counted from the header row above, not carried forward. */
  if(!rows.length)h+='<tr><td colspan="'+RECCOLS+'">'+
    (APPR.length?emptyState('&#9744;','Nothing decided matches the search.','Clear the search','document.getElementById(\'qr\').value=\'\';renderRecords()')
                :emptyState('&#9744;','Nothing has been decided yet.','Back to what is waiting','showTab(\'queue\')'))+'</td></tr>';
  rows.forEach(function(a){
    var q=qOf(a), c=cOf(a);
    var note=a.approve_note||a.reject_note||a.escalate_note||null;
    /* delegation display is DERIVED from the approval row itself (DDR-272 R4) — never the log.
       Where on_behalf_of is present it renders "X, acting for Y" (DDR-284 A2). */
    var by=(a.status===ST.auto)?'<span class="hint">automatic — within norms</span>'
      :(a.on_behalf_of
          ?('<b>'+esc(empName(a.on_behalf_of)||'their stand-in')+'</b>, acting for '+(empName(a.approver_emp)?esc(empName(a.approver_emp)):na('no approver is recorded')))
          :(empName(a.approver_emp)?esc(empName(a.approver_emp)):na('no approver is recorded')));
    var ss=salesSrc(a);
    h+='<tr class="pick'+(a.status===ST.voided?' dim':'')+'" onclick="openAppr(\''+a.approval_id+'\')" tabindex="0">'+
      '<td>'+day(a.created_at)+'</td>'+
      '<td class="d-code">'+txt(a.approval_no)+'</td>'+
      '<td>'+(q?esc(q.quote_no||'—'):na('the quote cannot be read'))+'</td>'+
      '<td class="num">'+(q?txt(q.rev_no):na())+'</td>'+
      '<td class="wr" title="'+(c?esc(c.name+' ('+c.customer_code+')'):'')+'">'+(c?esc(c.name+' ('+c.customer_code+')'):na('the customer cannot be read'))+'</td>'+
      '<td class="num">'+(q?money(q.grand_total):na())+'</td>'+
      '<td class="wr" title="'+((q&&q.referrer_id)?esc(refrLabel(q.referrer_id)):'')+'">'+(q?(q.referrer_id?esc(refrLabel(q.referrer_id)):na('no referrer is recorded')):na())+'</td>'+
      /* N-52 / OF-34 — his RR-063: "discount value is monetary value in Rupees, not percentage",
         and his RR-070 B: "HTML must only display the stored value". This renders the GOVERNED
         column quotes.total_discount and computes nothing. NULL means the server never computed it
         while the quote was still repriceable — which is said, not filled in from a percentage. */
      '<td class="num">'+(q?((q.total_discount===null||q.total_discount===undefined)
            ?na('no discount value is recorded on this quote')
            :money(q.total_discount)):na())+'</td>'+
      '<td class="num">'+(q?money(q.total_commission):na())+'</td>'+
      '<td>'+(q?statusTag(q.status):na())+'</td>'+
      '<td>'+(a.tat_due?(dt(a.tat_due)+' &middot; '+tatText(a)):na('this carries no deadline'))+'</td>'+
      '<td>'+(ss.id?(esc(empName(ss.id)||ss.id)+(ss.src==='customer'?' <span class="hint">(customer&rsquo;s owner)</span>':'')):na('no salesperson is recorded'))+'</td>'+
      '<td>'+((c&&c.ccr_emp)?empLabel(c.ccr_emp):na('no CCR is recorded on the customer'))+'</td>'+
      '<td>'+txt(a.status)+'</td>'+
      '<td>'+txt(a.tier)+'</td><td>'+txt(a.decision)+'</td><td>'+statusTag(a.status)+'</td>'+
      '<td class="wr" title="'+esc(a.created_by_name||empName(a.created_by)||'')+'">'+(a.created_by_name?esc(a.created_by_name):empLabel(a.created_by))+'</td>'+
      /* the plain-text form of the same value carries into the hover, so a truncated
         "X, acting for Y" can still be read in full without wrapping the row. */
      '<td class="wr" title="'+esc((a.status===ST.auto)?'automatic - within norms'
        :(a.on_behalf_of?((empName(a.on_behalf_of)||'their stand-in')+', acting for '+(empName(a.approver_emp)||'no approver is recorded'))
                        :(empName(a.approver_emp)||'no approver is recorded')))+'">'+by+'</td>'+
      '<td>'+(a.updated_at?dt(a.updated_at):na())+'</td>'+
      '<td class="num">'+(a.quote_rev_no===null||a.quote_rev_no===undefined?na():esc(a.quote_rev_no))+
        (a.approved_revision_no!==null&&a.approved_revision_no!==undefined?(' <span class="hint">approved '+esc(a.approved_revision_no)+'</span>'):'')+'</td>'+
      '<td>'+(a.decided_at?dt(a.decided_at):na('no decision time is recorded'))+'</td>'+
      '<td>'+(DECIP[a.approval_id]?esc(DECIP[a.approval_id]):na('no address was stamped on the decision'))+'</td>'+
      '</tr>';
  });
  h+='</tbody></table>';
  /* reportsZone() MOVED OUT 2026-08-14, his words: "records will have 1000 of items to view by
     page 1 going live it cannot present here - either new tab or remove it". Two reports at
     the foot of a paged thousand-row list are unreachable. They now have their own tab. */

  /* honest seam — named rather than left as a silence (DDR-194 C2), one line each (DDR-288) */
  /* REMOVED 2026-08-14 on his word: "What is the requirement of this? who told to keep it
     like this - remove". The three-item "Not yet available on this screen" note was desk
     bookkeeping printed at a user, on a tab that will carry thousands of rows. What is
     absent is absent; a list is not the place to publish a roadmap. */
  z.innerHTML=h;
}
/* ================================================================================================
   N-51 — REBUILT AGAINST THE ROW'S OWN FIELD 2, not against a summary of it. His words:
     "Export currently placing line items separately from quote summary it needs be same row
      (if multiple line items are there in quote all quote header details that are in summary
      are repeated for each row)"
     "Some of the bringing Lable code only, it need to bring both code and descritpions"
   Two obligations, both structural:
   1 ONE ROW PER LINE ITEM, with every header column repeated on it. A quote with 3 lines emits 3
     rows; a quote whose lines cannot be read emits ONE row that SAYS SO in the line columns
     instead of silently looking like a single-line quote.
   2 EVERY CODED FIELD CARRIES CODE AND DESCRIPTION, through the one codeDesc() mechanism.
   The lines are NOT in memory for the decided list — LINES[] is filled by loadDetail() for the one
   quote a user opened — so this export now reads them, under the SAME column gating as the detail
   read: a column the actor may not see never enters the browser (DDR-258 R2).
   ============================================================================================= */
async function exportRecords(){
  if(!actorEmp||!CAN[CAP.export]){ toast('You cannot export from here.','err'); return; }   /* PM-07: the control is absent, so this is only ever reached programmatically */
  var rows=recordRows();
  if(!rows.length){ toast('There is nothing to export — the list in view is empty.','warn'); return; }
  /* ---- the line items for every quote in view, plus the item descriptions to label them ---- */
  var EXLINES={}, EXITEMS={}, lineErr=null;
  var exq=[]; rows.forEach(function(a){ if(a.quote_id&&exq.indexOf(a.quote_id)<0)exq.push(a.quote_id); });
  if(exq.length){
    try{
      var lcols=QL_COLS_BASE+(costOK?',cost':'')+(marginOK?',margin':'');
      var lr=await SB.from('quote_lines').select(lcols).in('quote_id',exq).order('line_no');
      if(lr.error)throw lr.error;
      (lr.data||[]).forEach(function(l){ (EXLINES[l.quote_id]=EXLINES[l.quote_id]||[]).push(l); });
      var xids=[]; (lr.data||[]).forEach(function(l){ if(l.item_id&&xids.indexOf(l.item_id)<0)xids.push(l.item_id); });
      if(xids.length){
        var xi=await SB.from('items').select('item_id,description,description_override').in('item_id',xids);
        if(xi.error)throw xi.error;
        (xi.data||[]).forEach(function(x){ EXITEMS[x.item_id]=x; });
      }
    }catch(e){ lineErr=(e&&e.message)?e.message:String(e); }
  }
  if(lineErr)toast('The line items could not be read — every row says so in its line columns. '+lineErr,'warn');
  /* exactly the columns this screen was allowed to read; net margin only when the role may see
     it (it is not even fetched otherwise); headings are the words on screen */
  /* OF-49 — the export carries the same named set the table does, plus what it already carried */
  var cols=['created_at','approval_no','quote_no','quote_rev_no','customer_code','customer_name','quote_value',
    'referrer','discount_value','discount_pct','commission_value','quote_status','tat_due','sales_person','ccr','approval_status',
    'tier','decision','status','created_by_name','approver_name','on_behalf_name','updated_at','decided_at',
    'quote_version_at_raise','approved_revision_no','decided_ip','why_routed','approve_note','reject_note','escalate_note',
    'void_reason','unit','fy','version'];
  /* N-51 · the LINE half — appended AFTER the header set so every header value above is repeated
     on each line's row. Appended (not spliced) so the marginOK index below stays the one it was. */
  var LINECOLS=['line_no','line_item','line_type','line_customer_length','line_customer_uom','line_customer_qty',
    'line_quoted_uom','line_quoted_total_qty','line_sw_basis','line_sw_value','line_rate','line_discount_pct',
    'line_commission_pct','line_amount','line_supply_type','line_hsn','line_gst_rate','line_priced_by',
    'line_price_source','line_pricing_stale','line_price_refusal']
    .concat(costOK?['line_cost']:[]).concat(marginOK?['line_margin']:[]);
  var HEAD={approval_no:'Approval no',quote_no:'Quote no',customer_code:'Customer code',customer_name:'Customer',
    quote_value:'Value',referrer:'Referrer',discount_value:'Discount value (Rs)',discount_pct:'Discount %',commission_value:'Commission',
    quote_status:'Status (quote)',sales_person:'Sales person',ccr:'CCR',approval_status:'Approval status',
    created_by_name:'Created by',updated_at:'Last updated',
    tier:'Level',status:'State',decision:'Decision',why_routed:'Sent for approval because',
    approver_name:'Decided by (authority-holder)',on_behalf_name:'Acted by (standing in)',tat_due:'Answer by',decided_at:'Decided on',decided_ip:'Decided from',
    quote_rev_no:'Quote revision',quote_version_at_raise:'Quote version when raised',approved_revision_no:'Revision approved',
    approve_note:'Approval note',reject_note:'Rejection reason',escalate_note:'Reason sent up',void_reason:'Cancellation reason',
    unit:'Unit',fy:'Year',created_at:'Raised on',version:'Version',net_margin:'Net margin',
    line_no:'Line no',line_item:'Product (code and description)',line_type:'Line type',
    line_customer_length:'Asked length',line_customer_uom:'Asked unit',line_customer_qty:'Asked quantity',
    line_quoted_uom:'Quoted unit',line_quoted_total_qty:'Quoted total quantity',
    line_sw_basis:'Section weight basis',line_sw_value:'Section weight',line_rate:'Rate',
    line_discount_pct:'Line discount %',line_commission_pct:'Line commission %',line_amount:'Line amount',
    line_supply_type:'Supply type',line_hsn:'HSN',line_gst_rate:'GST rate',line_priced_by:'Priced by (engine token)',
    line_price_source:'Price source',line_pricing_stale:'Price out of date',
    line_price_refusal:'Why the price was refused',line_cost:'Line cost',line_margin:'Line margin'};
  if(marginOK)cols.splice(6,0,'net_margin');
  cols=cols.concat(LINECOLS);
  var out=[cols.map(function(k){ return '"'+(HEAD[k]||k)+'"'; }).join(',')];
  var emitted=0;
  rows.forEach(function(a){
    var q=qOf(a), c=cOf(a);
    var v={approval_no:a.approval_no,quote_no:q?q.quote_no:'',customer_code:c?c.customer_code:'',customer_name:c?c.name:'',
      quote_value:q&&q.grand_total!=null?q.grand_total:'not available',
      referrer:q&&q.referrer_id?refrLabel(q.referrer_id):'not available',
      /* N-52: the GOVERNED money column, as stored. The percentage is kept beside it under
         its own name so neither figure stands in for the other (F-P3-36's law). */
      discount_value:(q&&q.total_discount!=null)?q.total_discount:'not available',
      discount_pct:q&&q.deal_discount_pct!=null?q.deal_discount_pct:'not available',
      commission_value:q&&q.total_commission!=null?q.total_commission:'not available',
      /* NOT put through codeDesc(): status / tier / decision are stored as WORDS, not codes.
         His sentence is about fields that arrive as an opaque code with no description beside it.
         Clubbing self-describing words into the same fix would add "(no description is recorded)"
         to a value that IS the description. */
      quote_status:q?q.status:'not available',
      sales_person:empCodeName(salesOf(a)),
      ccr:(c&&c.ccr_emp)?empCodeName(c.ccr_emp):'not available',
      approval_status:a.status, created_by_name:a.created_by_name||empCodeName(a.created_by)||'not available',
      updated_at:a.updated_at,
      tier:a.tier,status:a.status,decision:a.decision,why_routed:a.why_routed,net_margin:(a.net_margin===null||a.net_margin===undefined)?'not available':a.net_margin,
      approver_name:empCodeName(a.approver_emp),on_behalf_name:empCodeName(a.on_behalf_of),tat_due:a.tat_due,decided_at:a.decided_at,
      quote_rev_no:a.quote_rev_no,quote_version_at_raise:a.quote_version_at_raise,approved_revision_no:a.approved_revision_no,
      decided_ip:DECIP[a.approval_id]||'not available',
      approve_note:a.approve_note,reject_note:a.reject_note,escalate_note:a.escalate_note,void_reason:a.void_reason,
      unit:a.unit,fy:a.fy,created_at:a.created_at,version:a.version};
    /* --- his structural requirement: the header values in `v` are repeated on EVERY line row --- */
    function push(extra){
      var row={}; Object.keys(v).forEach(function(k){ row[k]=v[k]; });
      if(extra)Object.keys(extra).forEach(function(k){ row[k]=extra[k]; });
      out.push(cols.map(function(k){ var s=(row[k]===null||row[k]===undefined)?'':String(row[k]); return '"'+s.replace(/"/g,'""')+'"'; }).join(','));
      emitted++;
    }
    var ls=(a.quote_id&&EXLINES[a.quote_id])?EXLINES[a.quote_id]:null;
    if(!ls||!ls.length){
      /* the absence is STATED in the line columns; it never masquerades as a one-line quote */
      var why=lineErr?'the line items could not be read':(a.quote_id?'this quote has no line on it':'no quote is linked to this approval');
      push({line_no:why});
      return;
    }
    ls.forEach(function(l){
      var it=EXITEMS[l.item_id];
      push({
        line_no:l.line_no,
        line_item:codeDesc(l.item_id,it?(it.description_override||it.description):null),
        line_type:l.line_type,
        line_customer_length:l.customer_length,line_customer_uom:l.customer_uom,line_customer_qty:l.customer_qty,
        line_quoted_uom:l.quoted_uom,line_quoted_total_qty:l.quoted_total_qty,
        line_sw_basis:l.sw_basis,line_sw_value:l.sw_value,
        line_rate:l.rate,line_discount_pct:l.discount_pct,line_commission_pct:l.commission_pct,line_amount:l.amount,
        line_supply_type:l.supply_type,line_hsn:l.applied_hsn,line_gst_rate:l.applied_gst_rate,
        line_priced_by:l.pricing_resolution_method,line_price_source:l.price_source_type,
        line_pricing_stale:(l.pricing_stale===true?'yes':'no'),
        line_price_refusal:l.price_refusal_reason,
        line_cost:costOK?l.cost:undefined,
        line_margin:marginOK?l.margin:undefined
      });
    });
  });
  RKF.exportRows(out,'decided_approvals_'+fmtDate(new Date(NOWMS||Date.now()).toISOString().slice(0,10))+'.csv',null,{bom:true});
  toast(rows.length+' decided approval(s) downloaded as '+emitted+' row(s) — one per line item, the quote details repeated on each.','ok');
}

/* ---------- keyboard reach for sortable <th> and clickable <tr> (ERS §3.11/§9.5/§9.7) ---------- */
document.addEventListener('keydown',function(e){
  if(e.key!=='Enter'&&e.key!==' '&&e.key!=='Spacebar')return;
  var el=document.activeElement; if(!el||!el.tagName)return;
  if(el.tagName!=='TR'&&el.tagName!=='TH')return;
  if(!el.getAttribute('onclick'))return;
  e.preventDefault(); el.click();
});

/* ---------- governed reference data: this screen offers NO add path ----------
   CP / GD / GI / GT are M-CONFIG mini-masters; M07 reads them by code for labels only. A new
   value enters only through M-CONFIG's governed route (BRULE-024 / MBC-131/314). Numbering
   (RKA) surfaces ONLY in M-CONFIG — this screen never mints or accepts a document number. */

boot();
</script>
