.wsscroll{flex:1;overflow:auto;padding:8px 12px;background:var(--bg);max-width:1800px;width:100%;margin-inline:auto;padding-inline:clamp(12px,1.6vw,32px)}

   belief that the page-layout container had been "removed by misreads". IT HAD NOT. `.apgrid`
   (:177) is a twelve-column grid and always was; the zones are ITS children, not `.wsscroll`'s.

   twelve, about 8% of the width, and the whole decision became a narrow strip that scrolled far

.recwrap{flex:1;overflow:auto;background:var(--bg);padding:6px;min-height:0}

table.grid th{background:var(--surface2);text-align:left;padding:5px 9px;font-size:var(--fs-caption);font-weight:800;color:var(--ink2);text-transform:uppercase;letter-spacing:.3px;border-bottom:1px solid var(--line);white-space:nowrap;position:sticky;top:0;z-index:var(--z-sticky)}

table.grid.dense{font-size:var(--fs-caption)}

/* HIS WALK, 2026-08-14, VERBATIM: "Both list and texts are not wrapped an list cannot be like

   columns shows whole text instead of warapping and looking at like a junk data".

.btn{display:inline-flex;align-items:center;gap:5px;padding:8px 13px;border-radius:var(--radius-sm);font-size:var(--fs-body);font-weight:600;cursor:pointer;border:none;font-family:inherit;transition:background .15s;white-space:nowrap;min-height:36px}
.btn-p{background:var(--accent);color:#fff}.btn-p:hover{background:var(--navy)}
.btn-g{background:var(--surface);color:var(--ink2);border:1px solid var(--line2)}.btn-g:hover{background:var(--surface2)}
.btn-d{background:var(--accentbg);color:var(--accent);border:1px solid var(--accent)}.btn-d:hover{background:var(--redbg)}
.btn-ok{background:var(--greenbg);color:var(--green);border:1px solid var(--green)}.btn-ok:hover{background:var(--surface2)}
.btn-sm{padding:6px 11px;font-size:var(--fs-body)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn:focus-visible,.in:focus-visible,textarea:focus-visible,select:focus-visible,a:focus-visible{outline:2px solid var(--m07);outline-offset:1px}
.vh{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;border:0}
/* UI-15 + UI-06 — the identity/context strip of the open approval NEVER scrolls away: it is
   sticky inside the scrolling .apwrap and doubles as the ERS §5.2 context panel (identity ·
   record health · approval readiness · workflow owner · SLA · next action). */
/* WS-8.1 — the region banner sits above it, so the identity strip pins just below. */
.idbar{position:sticky;top:22px;z-index:var(--z-sticky);background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow-sm);padding:8px 14px;margin-bottom:12px;display:flex;gap:14px;align-items:center;flex-wrap:wrap;font-size:var(--fs-body)}
.idbar .idc{font-family:'Consolas',monospace;font-weight:800;color:var(--navy);font-size:var(--fs-body)}
.idbar .sep{width:1px;align-self:stretch;background:var(--line2)}
@media (prefers-reduced-motion:reduce){.btn,.ri .tt{transition:none}}
/* THE REASON SIDE-BY-SIDE NEVER APPEARED FOR HIM. This collapsed every `half` zone to full width
   below 1500px, and his window is 1366px - so on his actual screen the pairing was switched off
   and the page could only ever be one tall column. Lowered to 1150px, which is below any desktop
   he works on, so Y4|Y5 and Y7|Y8a now pair where he can see them. UI-22 scopes this screen to
   desktop and mouse, so 1150 is a floor, not a phone breakpoint. */
@media (max-width:1150px){.zone.half{grid-column:1/-1}}
/* HIS ROW-FIXTURE CORRECTION: "it has to properly aligned by a row fixture not free flow and zig
   zags". Applied to `.apgrid`, which is the grid that actually holds the zones. `stretch` makes
   both halves of a row start AND end together; the zone becomes a column so its BODY takes the
   slack rather than the border. */
.apgrid{align-items:stretch}
.apgrid>.zone{display:flex;flex-direction:column;min-width:0}
.apgrid>.zone>.z-bd{flex:1 1 auto;min-height:0}

var SB = (window.supabase && window.RKF && RKF.client) ? RKF.client('https://ntymdsbezetobrnjqqvl.supabase.co','sb_publishable_nev1rE7tHlu-bOWOm1JpXw_jd40773y')
        : (window.supabase ? window.supabase.createClient('https://ntymdsbezetobrnjqqvl.supabase.co','sb_publishable_nev1rE7tHlu-bOWOm1JpXw_jd40773y') : null);

/* ---------------------------------------------------------------------------------------------
   THE ONLY NAMED LITERALS ON THIS SCREEN, each one named by an authority (never invented):
   · CAP        = the two of the EXACTLY TEN valid m06_can capability strings this screen needs
                  (BLOCK C / 124_m06_m07_helpers.sql:48-88, CONFIRMED). Any other string RAISES,

var CAP = { decide:'approval.decide', export:'quote.export' };
var ADMIN_ROLE='R19', ACCT_ROLE='R07', DIRECTORS_ROLE_NAME='directors', TAT_MODULE='M07';

/* N-04 (his ruling family R-13 · N-46 · PR-01/PR-02): a machine token must never reach an approver.

   The label comes from CONFIG, never from a constant in this file, and when config has no row for a

var NORMLBL={};   /* token -> approval_norm_label row {label, explanation} */
/* PARKED 2026-08-14 ON HIS WORD: "park it now will check estate wide".

     - a GATEMSG map + gateMsg(key,subs) here, on N-04's shape, which read them.
   The DATABASE REFUSED the seed: chk_emm_kind CHECK (match_kind = ANY (ARRAY['CONSTRAINT',
   'SQLSTATE'])) - error_message_map is constrained BY DESIGN to map server errors only, so a
   screen-gate kind needs that constraint altered, which is an estate-wide decision he has taken

   read half is sound whenever the kind is allowed.
   The screen half is REVERTED rather than left in place, because with no rows every refusal would
   degrade to "no business wording is configured" on a live screen - a regression dressed as a
   feature. Half a change is not a parked change. Nothing here is dead code waiting to be found. */
function normLabel(token){
  var t=String(token||''); if(!t)return '(unnamed)';
  var r=NORMLBL[t];
  return r&&r.label ? esc(r.label) : (esc(t)+' <span class="hint">(no business wording is configured for this token)</span>');
}

/* ---------------------------------------------------------------------------------------------

   --------------------------------------------------------------------------------------------- */
var APPR=[];                     /* quote_approvals rows, as stored */
var QUOTES={}, CUSTS={}, EMPS={}, EMPBYCODE={};

var DECIP={};                    /* SEE-39 - approval_id -> the actor IP stamped on the DECISION log row.
   221 made the IP capturable and trg_qa_autolog already writes it into approval_log.ip on every
   INSERT/UPDATE of quote_approvals - the only writer of that table in the whole schema. The trail
   entry rendered it (:1442) but the Decided register never carried the column. Read for the LISTED

/* F-P3-38 — the evaluator verdict was printed TWICE, verbatim: once as STAMPED at raise (Y8) and
   once as the LIVE re-run. When the two say the same thing the approver reads the same paragraph
   twice. sameVerdict() decides identity on the three things that carry meaning; the live slot then

/* R-13 (his ruling: "Render as labelled fields - no raw JSON on screen") + UI-10 (progressive
   disclosure, not raw JSON dumps of the factor/lever snapshots). ONE renderer, used everywhere a
   snapshot was previously stringified. It LABELS what the database stored and renders values as
   values; it computes nothing (DDR-291) and it invents no vocabulary - an unknown key is shown as
   the key it actually is, spaced, so nothing is hidden and nothing is dressed up. Empty renders an
   honest sentence rather than "{}". */
function labelKey(k){
  return String(k||'').replace(/[_.]+/g,' ').replace(/\s+/g,' ').trim()
    .replace(/^./,function(c){ return c.toUpperCase(); });
}
function fieldRows(o,prefix){
  var h='', pre=prefix||'';
  if(o===null||o===undefined)return '';
  if(typeof o!=='object')return '<div class="lever"><span>'+esc(labelKey(pre||'value'))+'</span><span class="lv">'+esc(String(o))+'</span></div>';
  if(Array.isArray(o)){
    if(!o.length)return '<div class="lever"><span>'+esc(labelKey(pre))+'</span><span class="lv">'+esc('none recorded')+'</span></div>';
    o.forEach(function(v,i){ h+=fieldRows(v,(pre?pre+' ':'')+String(i+1)); });
    return h;
  }
  var keys=Object.keys(o);
  if(!keys.length)return '<div class="lever"><span>'+esc(labelKey(pre||'record'))+'</span><span class="lv">'+esc('nothing was stored')+'</span></div>';
  keys.forEach(function(k){
    var v=o[k];
    if(v&&typeof v==='object')h+=fieldRows(v,(pre?pre+' ':'')+k);
    else h+='<div class="lever"><span>'+esc(labelKey((pre?pre+' ':'')+k))+'</span><span class="lv">'+
            esc(v===null||v===undefined?'not recorded':String(v))+'</span></div>';
  });
  return h;
}
function snapshotFields(o,emptySentence){
  var h=fieldRows(o,'');
  return h||('<div class="hint">'+esc(emptySentence||'nothing was stored')+'</div>');
}
function sameVerdict(x,y){
  if(!x||!y)return false;
  function k(v){ try{ return JSON.stringify([String(v.verdict||''),String(v.why_routed||''),
    (v.breaches||v.breaches_business||v.br||null)]); }catch(e){ return null; } }
  var a=k(x), b=k(y); return !!a && a===b;
}

/* ---------------------------------------------------------------------------------------------

function rs(n){ return (n===null||n===undefined||n==='')?null:('₹'+Number(n).toLocaleString('en-IN')); }

function na(what){ return '<span class="na">not available</span>'+(what?'<span class="vh"> — '+esc(what)+'</span>':''); }
function money(n){ var v=rs(n); return v===null?na('nothing is recorded here'):esc(v); }

function pct(n){ return (n===null||n===undefined||n==='')?na():esc(Number(n).toFixed(2)+'%'); }
function txt(v){ return (v===null||v===undefined||v==='')?na():esc(v); }
function dt(v){ if(!v)return na(); var d=new Date(v); if(isNaN(d))return esc(v);
  return esc(fmtDate(v.slice?v.slice(0,10):v)+' '+String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0')); }
function day(v){ return v?esc(fmtDate(v)):na(); }
function empName(id){ if(!id)return null; var e=EMPS[id]; return e?(e.full_name+' ('+e.employee_code+')'):null; }
function empLabel(id){ var n=empName(id); return n?esc(n):(id?('<span class="na">not resolvable from employees</span>'):na()); }
function statusTag(s){ return '<span class="tg-s tg-'+esc(String(s||'').replace(/[^A-Za-z-]/g,''))+'">'+esc(s||'—')+'</span>'; }
function refLabel(code){ if(!code)return null; var r=RVAL[code]; return r?(code+' · '+r.label):code; }
/* N-51 — "it need to bring both code and descritpions". ONE mechanism for every coded field, on
   the screen and in the export alike: code, then the description that resolves it, and where the
   estate holds no description that ABSENCE is said rather than the code being passed off as one. */
function codeDesc(code,desc){
  var c=(code===null||code===undefined||code==='')?null:String(code);
  var d=(desc===null||desc===undefined||desc==='')?null:String(desc);
  if(!c&&!d)return '';
  if(!c)return d;
  return d?(c+' · '+d):(c+' · (no description is recorded)');
}
function refrLabel(code){ if(!code)return ''; var r=REFR[code]; return codeDesc(code,r?r.name:null); }
/* a person in the export is the employee CODE and the name — the export carried the name alone,
   which is the same complaint from the other side: one half of a coded field. */
function empCodeName(id){ if(!id)return ''; var e=EMPS[id]; return e?codeDesc(e.employee_code,e.full_name):String(id); }
function rvDesc(code){ if(!code)return ''; var r=RVAL[code]; return codeDesc(code,r?r.label:null); }
function newAppKey(){ try{ if(window.crypto&&crypto.randomUUID)return crypto.randomUUID(); }catch(e){}
  return 'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g,function(c){var r=Math.random()*16|0;return (c==='x'?r:(r&0x3|0x8)).toString(16);}); }
function railNote(){ toast('','warn'); }

/* ★ ERS §4.6 · ONE empty-state component — an icon, one honest sentence, and the next action. */
function emptyState(icon,sentence,ctaLabel,ctaJs){
  return '<div class="surf"><div style="font-size:26px;line-height:1;margin-bottom:9px" aria-hidden="true">'+icon+'</div>'+
    '<div style="max-width:560px;margin:0 auto">'+sentence+'</div>'+
    (ctaLabel?('<div style="margin-top:11px"><button class="btn btn-p btn-sm" type="button" onclick="'+ctaJs+'">'+esc(ctaLabel)+'</button></div>'):'')+
    '</div>';
}

/* ★ THE TRANSLATOR RUNS ONE WAY ROUND ONLY: a database rule name goes IN, a business sentence
   comes OUT, and it is used ONLY when the database has ACTUALLY refused something. The refusal
   is still shown in the server's own words alongside it (ERS §4.5). */
var RULEWORDS=[
  ['chk_qa_reqne',   'You cannot decide a request you raised yourself.'],
  ['chk_qa_deleg',   'The person being stood in for raised this themselves, so nobody may decide it for them.'],
  ['chk_qa_rejnote', 'This action needs a reason written down.'],
  ['chk_qa_tier',    'The only approval levels the company uses are Accounts and Directors.'],
  ['chk_qa_status',  'That is not a state an approval can be in.'],
  ['chk_aa_value_limit',   'Value is above what may be approved here.'],
  ['chk_aa_discount_pct',  'Discount is above what may be approved here.'],
  ['approval_authority',   'Nobody has been given the authority this action needs.'],
  ['tat_config',           'The response-time settings have not been set up yet.']
];
function plainRule(m){
  var s=String(m||''), out=[];
  RULEWORDS.forEach(function(p){ if(s.indexOf(p[0])>=0&&out.indexOf(p[1])<0)out.push(p[1]); });
  return out.join(' ');
}

/* tri-state surfaces, per surface, error never dressed as empty (ERS §4.3/§4.5/§4.6 · SWEEP B5) */
function surfSkeleton(id,msg){ var e=document.getElementById(id); if(!e)return;
  e.innerHTML='<div class="recwrap"><div class="zone"><div class="z-bd">'+
    '<div class="hint">'+esc(msg||'Loading…')+'</div>'+
    '<div class="skel" style="width:82%"></div><div class="skel" style="width:64%"></div><div class="skel" style="width:73%"></div><div class="skel" style="width:48%"></div></div></div></div>'; }
function surfError(id,msg,retry){ var e=document.getElementById(id); if(!e)return;
  var p=plainRule(msg);
  e.innerHTML='<div class="recwrap"><div class="box bad" style="margin:0">'+
    '<b>This could not be loaded.</b> '+(p?esc(p)+' ':'')+
    (retry?'<div style="margin-top:9px"><button class="btn btn-g btn-sm" type="button" onclick="'+retry+'">Try again</button></div>':'')+
    '</div></div>'; }
/* OF-43 — one-line state notice, not a paragraph (DDR-288). */
function notSignedIn(){ return '<div class="recwrap"><div class="box warn" style="margin:0"><b>You are not signed in.</b> Sign in and the list will load.</div></div>'; }
</script>
<script>
/* ============================================================================================
   BOOT LADDER (MBC-300) — actor, then roles, then capability, then catalogues, then data.
   The cost/margin column list is decided BEFORE the first SELECT is built, because a column
   the actor may not see is never fetched at all (DDR-258 R2).
   ============================================================================================ */

/* The approval statuses. NOT invented: the set is exactly the one chk_qa_status enforces
   (59_m07_quote_approvals.sql:77, CONFIRMED: Pending · Auto-Approved · Approved · Rejected ·
   Escalated · Voided). */
var ST={pending:'Pending',auto:'Auto-Approved',approved:'Approved',rejected:'Rejected',escalated:'Escalated',voided:'Voided'};
var OPEN_SET=[ST.pending,ST.escalated];                       /* still awaiting a human decision */
var DECIDED_SET=[ST.approved,ST.auto,ST.rejected];            /* Y2-05 */
var RECORD_SET=[ST.approved,ST.auto,ST.rejected,ST.voided];   /* Auto-Approved is a filterable Decided outcome (DDR-263 R2.4) */
/* volume: a named page, never "everything", always a way to the next page (m05/m06 mechanism) */
var LOAD_PAGE=500, loadCap=LOAD_PAGE;
var LIST_PAGE=200, listShown=LIST_PAGE;

async function boot(){
  var bs=document.getElementById('buildStamp'); if(bs)bs.textContent='build: '+BUILD_STAMP;
  surfSkeleton('queueCenter','Loading the approvals waiting on a decision…');
  mountListDates();
  if(!SB){ surfError('queueCenter','this screen could not start - it may be blocked, or this machine is offline.','boot()'); return; }
  NOWMS=Date.now();
  await resolveActor();
  await resolveRoles();
  await resolveCapabilities();
  paintActorChrome();
  await loadCatalogs();
  /* REF-09 / SOD-04 — the access gate on the SURFACE itself, not just on buttons. The matrix is
     enforced through the LIVE grants this screen can lawfully read: the m06_can capability
     facade (approval.decide / quote.export — the same answers the RPCs enforce) plus the
     delegation register. A Sales sign-in holds none of these (PM-07: Sales is deliberately
     excluded even from export) and never reaches the queue. No role name is hardcoded; a
     failed capability CHECK is shown as an error, never dressed as a refusal. */
  if(actorEmp&&!surfaceAllowed()){ LOCKED=true; renderLockedOut(); booted=true; return; }
  await loadQueue();
  applySmartDefaults();
  booted=true;
  renderAll();
  /* DEEP LINK (DO-22 counterpart / BC-19 contract): m06 arrives here as m07.html?approval=<id>.
     The record opens DIRECTLY on the full decision surface — not just the queue. */
  var seam=seamApprovalId();
  if(seam)await openDeepLink(seam);
}
var LOCKED=false;
function surfaceAllowed(){
  if(CAN[CAP.decide]||CAN[CAP.export])return true;
  if(delegators().length)return true;                    /* standing in confers the surface (Q28) */
  if(CANERR[CAP.decide]||CANERR[CAP.export])return true; /* a broken check is an ERROR state, not a lock-out */
  return false;
}
function renderLockedOut(){
  var msg='<div class="recwrap"><div class="box warn" style="margin:0"><b>This screen is not open to you.</b> '+
    'Your sign-in holds no approval, export or stand-in rights.</div></div>';
  ['queueCenter','recZone'].forEach(function(id){ var e=document.getElementById(id); if(e)e.innerHTML=msg; });
  ['tab-rec'].forEach(function(id){ var e=document.getElementById(id); if(e){ e.disabled=true; e.title='This screen is not open to you.'; } });
  var fb=document.getElementById('qFbar'); if(fb)fb.style.display='none';
  var sb=document.getElementById('qSubbar'); if(sb)sb.style.display='none';
}
/* the inbound deep-link id — search first, hash accepted too (mirrors m06's seamQuoteId) */
function seamApprovalId(){
  var qs=new URLSearchParams(location.search);
  var id=qs.get('approval')||qs.get('approval_id')||'';
  if(!id&&location.hash){
    var h=location.hash.replace(/^#/,''); var hp=new URLSearchParams(h.indexOf('=')>=0?h:'');
    id=hp.get('approval')||hp.get('approval_id')||'';
  }
  return (id&&/^[0-9a-fA-F-]{36}$/.test(id))?id:null;
}
async function openDeepLink(id){
  var a=APPR.filter(function(x){return x.approval_id===id;})[0];
  if(!a){
    /* outside the loaded page/date window — fetch that one row by id, same columns, same policies */
    try{
      var r=await SB.from('quote_approvals').select(qaCols()).eq('approval_id',id).eq('is_deleted',false).maybeSingle();
      if(r.error)throw r.error;
      if(r.data){ APPR.push(r.data); await hydrate(); a=r.data; }
    }catch(ex){ toast('The linked approval could not be read.','err'); return; }
  }
  if(!a){ toast('That approval does not exist — the list is shown instead.','warn'); return; }
  await openAppr(a.approval_id);
}
/* ERS §6.2 — "Mine to decide" boots ON (UI-11 smart default) and is switched OFF only when the
   actor owns nothing open. Deadline order is the default sort (DO-16), falling back honestly. */
function applySmartDefaults(){
  var mine=APPR.filter(function(a){ return routedToActor(a)&&isOpen(a); }).length;
  if(!mine)flt.pend=false;
  if(sortAuto&&!APPR.some(function(a){ return a.tat_due; }))sortState={k:'raised',dir:-1};
}

/* ---------- actor: the authenticated user mapped to an ACTIVE employee (m05 mechanism) ---------- */
async function resolveActor(){
  try{
    var u=await SB.auth.getUser(); var em=u&&u.data&&u.data.user?u.data.user.email:null;
    if(!em)return;
    var e=await SB.from('employees').select('id,full_name,employee_code,posting_unit,reports_to,active,email').eq('email',em).eq('active',true).maybeSingle();
    if(e.error)throw e.error;
    if(e.data){ actorEmp=e.data.id; actorName=e.data.full_name; actorCode=e.data.employee_code; actorUnit=e.data.posting_unit; }
  }catch(ex){ roleErr=(ex&&ex.message)||String(ex); }
}

/* ---------- roles + the Directors resolution (DDR-262 R1, mirrors m06_can's own lookup) ---------- */
async function resolveRoles(){
  if(!actorEmp)return;
  try{
    var rm=await SB.from('employee_role_map').select('role_code,active').eq('employee_code',actorCode).eq('active',true);
    if(rm.error)throw rm.error;
    actorRoles=(rm.data||[]).map(function(x){return x.role_code;});
  }catch(ex){ roleErr=(ex&&ex.message)||String(ex); }
  try{
    var r=await SB.from('roles').select('role_code,role_name,role_group,active').eq('active',true);
    if(r.error)throw r.error;
    ROLES=r.data||[];
    DIRROLES=ROLES.filter(function(x){return String(x.role_name||'').trim().toLowerCase()===DIRECTORS_ROLE_NAME;}).map(function(x){return x.role_code;});
  }catch(ex){ roleErr=(roleErr?roleErr+' · ':'')+((ex&&ex.message)||String(ex)); }
  var isAdmin=actorRoles.indexOf(ADMIN_ROLE)>=0;
  var isDir=DIRROLES.some(function(rc){return actorRoles.indexOf(rc)>=0;});
  var isAcct=actorRoles.indexOf(ACCT_ROLE)>=0;   /* F-P3-M07-04: no longer a money gate. Retained
     because DDR-235's role-CONFIGURED half is real work still owed — when a cost capability exists,
     this is where Accounts' configured share is read. Unused today, and said so rather than left
     looking like an oversight. void() marks that deliberately. */
  void isAcct;
  /* F-P3-M07-04 — CORRECTED 2026-08-14. This line cited **D02-027 / R-14**, which the Owner had
     already REFINED AWAY at DDR-235: *"Note cost and Margin is only for Admin & Directors -
     Accounts see a % if decided in roles and responsibilities else they also see very limited only"*.
     Re-stated by him 2026-08-14: *"Cost Margin Net Margin only Admin / Director rest are viewable
     to as per Roles"* (RR-069). M06 already implements the ruled shape — `m06.html:984`
     `canCost(){return isAdmin()||isDirector();}` — and M07 alone was left on the superseded ladder,
     so the two screens disagreed about who may read cost.
     The role-CONFIGURED half of DDR-235 ("a % if decided in roles and responsibilities") has no
     capability to read: this screen resolves only `approval.decide` and `quote.export`, and the
     estate defines no cost capability. Until one exists the ruled floor applies, and Accounts is
     not silently granted cost on the strength of a decision the Owner replaced. Booked as WORK,
     not as a question — DDR-235 already ruled the shape. */
  costOK=!!(isAdmin||isDir);
  marginOK=!!(isAdmin||isDir);
}

/* ---------- capability: the SAME facade the RPCs enforce, asked LIVE (BLOCK C · DDR-262 R1;
   the R5 spec ratifies this call-the-function pattern as the estate standard — a client-side
   mirror can drift from a future BLOCK C change, a live call cannot). ---------- */
async function resolveCapabilities(){
  if(!actorEmp){ CAN[CAP.decide]=false; CAN[CAP.export]=false; return; }
  await Promise.all([CAP.decide,CAP.export].map(async function(c){
    try{ var r=await SB.rpc('m06_can',{p_by_emp:actorEmp,p_capability:c});
      if(r.error)throw r.error; CAN[c]=(r.data===true);
    }catch(ex){ CAN[c]=false; CANERR[c]=(ex&&ex.message)||String(ex); }
  }));
}
function paintActorChrome(){
  var an=document.getElementById('actorNote');
  if(an)an.textContent=actorEmp?(actorName+' ('+actorCode+')'+(actorRoles.length?'':' · no role set — only a delegation can let you decide'))
                               :'your sign-in is not linked to an employee — decisions are off';
  var av=document.getElementById('avatar');
  if(av)av.textContent=actorEmp?(String(actorName||'?').split(' ').map(function(w){return w[0];}).join('').slice(0,2).toUpperCase()):'–';
  var sc=document.getElementById('scopeChip');
  if(sc)sc.textContent=actorEmp?((CAN[CAP.decide]?'Can decide':(delegators().length?'Can decide as a stand-in':'Cannot decide'))+
                                 ' · cost '+(costOK?'shown':'hidden')+' · margin '+(marginOK?'shown':'hidden'))
                               :'Not signed in';
}

/* ---------- catalogues: governed lists + TAT + authority limits + the delegation register ----------
   ONE MASTER, ONE READ, ONE ERROR STATE — a failure of one read never empties another.
   THE NORMS THEMSELVES ARE NOT READ HERE: the eight governed norms reach this screen only as
   fn_m07_evaluate_norms stamped them (CA-19 — the screen re-derives NONE of them). */
async function readMaster(fn,onErr){
  try{ await fn(); }catch(ex){ onErr((ex&&(ex.message||ex.details))||String(ex)); }
}
async function loadCatalogs(){
  await readMaster(async function(){
    var rv=await SB.from('reference_values').select('code,list_id,label,metadata,active,sort_order').in('list_id',['CP','GD','GI','GT','GA']).eq('active',true).order('sort_order');
    if(rv.error)throw rv.error;
    (rv.data||[]).forEach(function(v){ var lid=String(v.list_id||'').trim(); RVAL[v.code]=v; (RLIST[lid]=RLIST[lid]||[]).push(v); });

  },function(m){ loadErr.cat=m; });
  await readMaster(async function(){
    var t=await SB.from('tat_config').select('tat_id,module_code,stage_code,workflow_id,tat_minutes,active,description').eq('module_code',TAT_MODULE);
    if(t.error)throw t.error; TATCFG=t.data||[];
  },function(m){ TATERR=m; });
  /* N-04 - the approver's own vocabulary, from config (approval_norm_label). A failure here must not
     take the screen down: the tokens then render as tokens and say so. */
  await readMaster(async function(){
    var nl=await SB.from('approval_norm_label').select('token,kind,label,explanation,active').eq('active',true);
    if(nl.error)throw nl.error; NORMLBL={}; (nl.data||[]).forEach(function(r){ NORMLBL[r.token]=r; });
  },function(m){ NORMLBL={}; loadErr.normlbl=m; });
  /* the approver-limit gate (REF-14/SOD-03): value_limit + discount_limit_pct per holder */
  await readMaster(async function(){
    var a=await SB.from('approval_authority').select('authority_id,employee_code,module_code,value_limit,discount_limit_pct,active');
    if(a.error)throw a.error; AUTH=a.data||[];
  },function(m){ AUTHERR=m; });
  /* the delegation register — the actor as DELEGATE. Columns per 23_employee_delegations.sql +
     the exact predicate rpc_m07_* applies (145a: delegator_code/delegate_code/active/is_deleted/
     start_date..end_date/module = ANY(modules)). */
  if(actorCode){
    await readMaster(async function(){
      var d=await SB.from('employee_delegations').select('delegation_id,delegator_code,delegate_code,start_date,end_date,modules,active,is_deleted').eq('delegate_code',actorCode).eq('active',true);
      if(d.error)throw d.error; DELEG=(d.data||[]).filter(function(x){ return x.is_deleted!==true; });
    },function(m){ DELEGERR=m; });
  }
  /* the governed thresholds owned by quotation approval (migration 141, Owner Q23/Q24):
     net_margin_floor_pct lives HERE and nowhere else — SEE-20/21 read it, never retype it */
  await readMaster(async function(){
    var qc=await SB.from('quote_approval_config').select('config_key,label,num_value,unit,description,active').eq('active',true);
    if(qc.error)throw qc.error;
    (qc.data||[]).forEach(function(x){ QACFG[x.config_key]=x; });
  },function(m){ QACFGERR=m; });
  /* the governed M02d price grid — the discount CEILING and commission NORM as NUMBERS
     (SEE-22/23), resolved per item type exactly as m06 resolves them (highest priority wins).
     commission_pct is a restricted column (DDR-011/012) — a refused read degrades honestly. */
  await readMaster(async function(){
    var pl=await SB.from('price_list').select('id,type_code,basis,max_disc_pct,commission_pct,priority,active').eq('active',true);
    if(pl.error)throw pl.error;
    (pl.data||[]).forEach(function(p){ if(!PRICEBY[p.type_code]||Number(p.priority||0)>Number(PRICEBY[p.type_code].priority||0))PRICEBY[p.type_code]=p; });
  },function(m){ PRICEERR=m; });
}
/* the governed net-margin floor, as a NUMBER or honestly null (never assumed, never retyped) */
function marginFloor(){
  var r=QACFG['net_margin_floor_pct'];
  return (r&&r.unit==='PCT'&&r.num_value!==null&&r.num_value!==undefined)?Number(r.num_value):null;
}
/* an active delegation window, evaluated against the session date, for a given module code —
   the module is ALWAYS the approval row's own module_code, never this page's name (Q28 FLAG-4) */
function activeWindows(moduleCode){
  var today=new Date(NOWMS||Date.now()); today.setHours(0,0,0,0);
  return DELEG.filter(function(d){
    var s=new Date(d.start_date), e=new Date(d.end_date);
    var modOK=Array.isArray(d.modules)&&moduleCode?d.modules.indexOf(moduleCode)>=0:false;
    return modOK && !isNaN(s) && !isNaN(e) && s<=today && today<=e;
  });
}
function delegators(){ /* every holder the actor covers for on ANY module — chrome/tooltips only */
  var today=new Date(NOWMS||Date.now()); today.setHours(0,0,0,0);
  return DELEG.filter(function(d){
    var s=new Date(d.start_date), e=new Date(d.end_date);
    return !isNaN(s)&&!isNaN(e)&&s<=today&&today<=e;
  });
}

/* ============================================================================================
   READS — direct SELECTs, uat_p1_sel P1 policies. No read RPC is called (none exists).
   ============================================================================================ */
var QA_COLS_BASE='approval_id,approval_no,quote_id,module_code,requested_by,approver_emp,tier,why_routed,'+
  'factor_snapshot,levers_snapshot,decision,approve_note,reject_note,escalate_note,tat_due,on_behalf_of,'+
  'escalated_to,status,decided_at,unit,fy,created_by,created_by_name,created_at,updated_at,version,app_key,'+
  'is_deleted,void_reason,quote_rev_no,quote_version_at_raise,approved_revision_no,route_source,route_workflow_id';
/* net_margin is a margin-class value: SELECTED only for Directors/Admin (D02-027/R-14). */
function qaCols(){ return QA_COLS_BASE+(marginOK?',net_margin':''); }

function winFrom(){ return (typeof readDMY==='function')?readDMY('fFrom'):''; }
function winTo(){ return (typeof readDMY==='function')?readDMY('fTo'):''; }

async function loadQueue(){
  loadErr.queue=null; NOWMS=Date.now();
  if(!actorEmp){ APPR=[]; APPR.total=0; return; }
  try{
    var qy=SB.from('quote_approvals').select(qaCols(),{count:'exact'}).eq('is_deleted',false);
    var wf=winFrom(), wt=winTo();
    if(wf)qy=qy.gte('created_at',wf);
    if(wt)qy=qy.lte('created_at',wt+'T23:59:59.999Z');
    var r=await qy.order('created_at',{ascending:false}).limit(loadCap);
    if(r.error)throw r.error;
    APPR=r.data||[]; APPR.total=(r.count===null||r.count===undefined)?APPR.length:r.count;
  }catch(ex){ APPR=[]; APPR.total=0; loadErr.queue=(ex&&ex.message)||String(ex); return; }
  /* SEE-39 - the decision log rows for exactly the approvals in hand, so the Decided register can
     show WHERE the decision came from. A failure here must NEVER take the queue down with it. */
  DECIP={};
  try{
    var aids=APPR.map(function(a){ return a.approval_id; }).filter(Boolean);
    if(aids.length){
      var lg=await SB.from('approval_log').select('approval_id,action,at,ip')
        .in('approval_id',aids).in('action',['APPROVE','REJECT','ESCALATE','VOID','AUTO_APPROVE'])
        .order('at',{ascending:true});
      if(!lg.error)(lg.data||[]).forEach(function(r){ if(r.ip)DECIP[r.approval_id]=r.ip; });
    }
  }catch(exIp){ DECIP={}; }
  await hydrate();
}
async function loadOlder(){
  loadCap+=LOAD_PAGE; listShown=LIST_PAGE;
  surfSkeleton('queueCenter','Reading further back…');
  await loadQueue(); renderAll();
}

/* hydrate only what the loaded page needs — never an unbounded child select */
async function hydrate(){
  var qids=[], eids=[];
  APPR.forEach(function(a){ if(a.quote_id&&qids.indexOf(a.quote_id)<0)qids.push(a.quote_id);
    [a.requested_by,a.approver_emp,a.escalated_to,a.on_behalf_of,a.created_by].forEach(function(e){ if(e&&eids.indexOf(e)<0)eids.push(e); }); });
  try{
    if(qids.length){
      var q=await SB.from('quotes').select('id,quote_no,rev_no,base_quote_id,customer_id,status,prior_status,grand_total,sub_total,cgst,sgst,igst,round_off,total_weight_mt,blended_rate_per_kg,total_commission,validity_date,validity_days,quote_date,pt_code,delivery_terms,delivery_scope,insurance_scope,supply_type,lead_time_product,lead_time_production,lead_time_delivery,deal_discount_pct,deal_commission_pct,freight_amount,insurance_amount,other_charges_amount,total_discount,pricing_status,has_unpriced_lines,unpriced_line_count,totals_dirty,from_lead_id,bill_to_address_id,ship_to_address_id,created_by,created_by_name,created_at,updated_at,version,unit,fy,approved_by,approved_by_name,approved_at,referrer_id,salesperson_emp,mode_of_delivery').in('id',qids);
      if(q.error)throw q.error;
      (q.data||[]).forEach(function(x){ QUOTES[x.id]=x; });
    }
    /* N-51, his words: "Some of the bringing Lable code only, it need to bring both code and
       descritpions". `quotes.referrer_id` is a CODE — referrers.id is character varying(20), FK
       fk_q_referrer — and both the register cell and the export were emitting the bare code with
       no name anywhere on the screen to resolve it from. */
    var rids=[]; Object.keys(QUOTES).forEach(function(k){ var r=QUOTES[k].referrer_id; if(r&&rids.indexOf(r)<0)rids.push(r); });
    if(rids.length){
      var rf=await SB.from('referrers').select('id,name').in('id',rids);
      if(rf.error)throw rf.error;
      (rf.data||[]).forEach(function(x){ REFR[x.id]=x; });
    }
    var cids=[]; Object.keys(QUOTES).forEach(function(k){ var c=QUOTES[k].customer_id; if(c&&cids.indexOf(c)<0)cids.push(c); });
    if(cids.length){
      /* customers has been extended since the schema files in this repo; a named column list
         would risk failing the whole select on one stale name, so this read is select('*') —
         the m01/m07-S4 precedent — and every field renders defensively. */
      var cu=await SB.from('customers').select('*').in('id',cids);
      if(cu.error)throw cu.error;
      /* OF-49 (WS-8.3) — the CCR named on the customer must resolve to a person, so it is
         collected here before the employees read below. */
      (cu.data||[]).forEach(function(x){ CUSTS[x.id]=x;
        if(x.sales_emp&&eids.indexOf(x.sales_emp)<0)eids.push(x.sales_emp);
        if(x.ccr_emp&&eids.indexOf(x.ccr_emp)<0)eids.push(x.ccr_emp); });
    }
    Object.keys(QUOTES).forEach(function(k){ var cb=QUOTES[k].created_by; if(cb&&eids.indexOf(cb)<0)eids.push(cb);
      var sp=QUOTES[k].salesperson_emp; if(sp&&eids.indexOf(sp)<0)eids.push(sp);
      var ab=QUOTES[k].approved_by; if(ab&&eids.indexOf(ab)<0)eids.push(ab); });
    if(eids.length){
      var em=await SB.from('employees').select('id,employee_code,full_name,active,posting_unit,reports_to').in('id',eids);
      if(em.error)throw em.error;
      (em.data||[]).forEach(function(x){ EMPS[x.id]=x; EMPBYCODE[x.employee_code]=x; });
    }
    var dcodes=delegators().map(function(d){return d.delegator_code;}).filter(function(c){return c&&!EMPBYCODE[c];});
    if(dcodes.length){
      var dm=await SB.from('employees').select('id,employee_code,full_name,active,posting_unit,reports_to').in('employee_code',dcodes);
      if(dm.error)throw dm.error;
      (dm.data||[]).forEach(function(x){ EMPS[x.id]=x; EMPBYCODE[x.employee_code]=x; });
    }
    /* TAT-05 · delegation precedes escalation: read who is standing in for the HOLDERS of the
       open approvals, so a breach can name its delegate-first route (D03-010). Register-read
       only — this screen never infers a stand-in. */
    var hcodes=[];
    APPR.forEach(function(a){ if(!isOpen(a))return; var e=EMPS[holderOf(a)];
      if(e&&e.employee_code&&hcodes.indexOf(e.employee_code)<0)hcodes.push(e.employee_code); });
    COVER={}; COVERERR=null;
    if(hcodes.length){
      try{
        var cv=await SB.from('employee_delegations').select('delegation_id,delegator_code,delegate_code,start_date,end_date,modules,active,is_deleted').in('delegator_code',hcodes).eq('active',true);
        if(cv.error)throw cv.error;
        (cv.data||[]).forEach(function(x){ if(x.is_deleted===true)return; (COVER[x.delegator_code]=COVER[x.delegator_code]||[]).push(x); });
        var dgc=[]; Object.keys(COVER).forEach(function(k){ COVER[k].forEach(function(x){ if(x.delegate_code&&!EMPBYCODE[x.delegate_code]&&dgc.indexOf(x.delegate_code)<0)dgc.push(x.delegate_code); }); });
        if(dgc.length){
          var de=await SB.from('employees').select('id,employee_code,full_name,active,posting_unit,reports_to').in('employee_code',dgc);
          if(de.error)throw de.error;
          (de.data||[]).forEach(function(x){ EMPS[x.id]=x; EMPBYCODE[x.employee_code]=x; });
        }
      }catch(cex){ COVERERR=(cex&&cex.message)||String(cex); }
    }
  }catch(ex){ loadErr.queue=(ex&&ex.message)||String(ex); }
}
/* the live stand-in window covering a row's HOLDER (module-matched to the row's own
   module_code), whoever the actor is — TAT-05's delegate-first route, read from the register */
function coverFor(a){
  var e=EMPS[holderOf(a)]; if(!e||!e.employee_code)return null;
  var rows=COVER[e.employee_code]||[];
  var today=new Date(NOWMS||Date.now()); today.setHours(0,0,0,0);
  var live=rows.filter(function(d){
    var s=new Date(d.start_date), en=new Date(d.end_date);
    var modOK=Array.isArray(d.modules)&&a.module_code?d.modules.indexOf(a.module_code)>=0:false;
    return modOK&&!isNaN(s)&&!isNaN(en)&&s<=today&&today<=en;
  });
  return live.length?live[0]:null;
}
</script>
<script>
/* ============================================================================================
   Y1 TABS · Y2 FILTERS · Y3 QUEUE — LIST + DETAIL-OFF surface (CP4 §3; ERS §11.2 layout 1).
   Filter state survives tab switches (ERS §3.9), and so does the opened record.
   ============================================================================================ */
/* WS-8.1 · PK-07 · DDR-295 (Q48) — ONE transactional workspace. 'appr' is no longer a tab and no
   longer a surface the operator moves TO: the decision region opens inside this page, beneath the
   queue, and an approval is completed end to end without a single page transition. */
function showTab(t){
  if(t==='appr')t='ws';                           /* the decision renders in the workspace */
  if(t==='ws'&&!selAppr)t='queue';                /* the workspace never opens empty */
  curTab=t;
  ['queue','ws','rec','rep'].forEach(function(x){ var el=document.getElementById('tab-'+x); if(el){ el.classList.toggle('act',x===t); el.setAttribute('aria-selected',x===t?'true':'false'); } });
  var queue=(t==='queue'), ws=(t==='ws'), rec=(t==='rec'), rep=(t==='rep');
  document.getElementById('qFbar').style.display=queue?'flex':'none';
  document.getElementById('qSubbar').style.display=queue?'flex':'none';
  document.getElementById('queueZone').style.display=queue?'flex':'none';
  document.getElementById('wsZone').style.display=ws?'flex':'none';
  document.getElementById('recSubbar').style.display=rec?'flex':'none';
  document.getElementById('recZone').style.display=rec?'block':'none';
  document.getElementById('repZone').style.display=rep?'block':'none';
  syncWorkspace();
  if(queue)renderQueue();
  else if(ws){ if(selAppr&&!detBusy)renderApproval(); }
  else if(rep)renderReports();
  else renderRecords();
}
/* G-02 / RR-071 — the workspace TAB is reachable exactly while a document is open, and the
   decision bar lives inside that workspace so an approval is completed without leaving it (PK-07).
   The queue zone is never split and never hidden: it is a whole surface of its own. */
function syncWorkspace(){
  var open=!!selAppr;
  var tw=document.getElementById('tab-ws');
  if(tw){ tw.disabled=!open;
    tw.title=open?'The approval you opened from the queue.':'Open an approval from the queue to work on it here.'; }
  var bar=document.getElementById('decisionBar');
  if(bar)bar.style.display=(open&&curTab==='ws')?'flex':'none';
}
var lastSelId=null;   /* G-02 DONE test: after closing, the row that was open is STILL the selected row */
/* N-58 · F-OWNER-M06-05 · R-10 — m07's half, built 2026-08-14. R-10 put
   registerSurface/unregisterSurface and ONE capture-phase Escape listener in rk-foundation.js last
   session, and MEASURED TODAY not one screen in the estate called it: the mechanism was inert,
   which is a verdict (NOT EXERCISED), not a pass. m07 also had ZERO Escape handling of its own -
   `grep Escape m07.html` returned nothing - so a dialog could only be closed by the mouse.
   Registered here rather than a private listener, which is the whole point of R-10: the foundation
   asks the DEEPEST open surface first, one per press. Depth 20 = the modal, depth 10 = the
   workspace, so Escape closes the dialog before it leaves the document - never both at once. */
(function registerM07Surfaces(){
  if(!(window.RKF&&RKF.registerSurface))return;   /* the foundation is a hard dependency, not a guess */
  RKF.registerSurface('m07-dialog',{
    depth:20,
    isOpen:function(){ var b=document.getElementById('dlgBd'); return !!(b&&b.classList.contains('show')); },
    close:function(){ closeDlg(); }
  });
  RKF.registerSurface('m07-decision-workspace',{
    depth:10,
    isOpen:function(){ return curTab==='ws'&&!!selAppr; },
    close:function(){ closeDecision(); }
  });
})();
function closeDecision(){ lastSelId=selAppr?selAppr.approval_id:lastSelId; selAppr=null; showTab('queue'); }
function renderAll(){ syncWorkspace(); paintRailBadge(); renderQueue(); renderRecords(); if(selAppr&&!detBusy)renderApproval(); }
/* SEE-45 · the pending-count badge, on EVERY navigation path: this file's own rail badge when
   standalone, the Queue tab label always (the rail is hidden under embed=1), and a message to
   the embedding shell so ITS rail entry can carry the count too. The count itself is one
   derivation, painted three ways — never three counts. */
function paintRailBadge(){
  var mine=APPR.filter(function(a){ return routedToActor(a)&&isOpen(a); }).length;
  var b=document.getElementById('railBadge');
  if(b){
    b.style.display=mine?'inline-flex':'none';
    b.textContent=mine?String(mine):'';
    b.setAttribute('title',mine+' approval(s) waiting on your decision');
  }
  var tq=document.getElementById('tab-queue');
  if(tq)tq.textContent='Waiting on a decision'+(mine?(' ('+mine+')'):'');
  try{ if(window.parent&&window.parent!==window)window.parent.postMessage({type:'m07_pending_count',count:mine},'*'); }catch(e){}
}
/* UI-07 · predictive suggestions — fed only from rows the policies already let this actor read */
function paintSuggestions(){
  var d=document.getElementById('qSugg'); if(!d)return;
  var seen={}, out=[];
  function add(v){ v=String(v||'').trim(); if(!v||seen[v.toLowerCase()])return; seen[v.toLowerCase()]=1; out.push('<option value="'+esc(v)+'"></option>'); }
  APPR.forEach(function(a){ if(out.length>=60)return; var q=qOf(a), c=cOf(a);
    add(a.approval_no); if(q)add(q.quote_no); if(c)add(c.name); add(empName(salesOf(a))); });
  d.innerHTML=out.join('');
}

/* ---------- filters + dismissible pills + search + the date window ---------- */
var FILTER_LABEL={pend:'Mine to decide',tat:'Past the deadline',esc:'Escalated to me',del:'I am standing in',dec:'Already decided'};
function tglFilter(k){ flt[k]=!flt[k]; listShown=LIST_PAGE; renderQueue(); }
function salesFilterChanged(){ flt.sales=document.getElementById('fSales').value; listShown=LIST_PAGE; renderQueue(); }
function clearFilter(k){ if(k==='sales'){ flt.sales=''; var s=document.getElementById('fSales'); if(s)s.value=''; } else flt[k]=false; listShown=LIST_PAGE; renderQueue(); }
function searchChanged(){ qSearch=document.getElementById('q').value||''; listShown=LIST_PAGE; renderQueue(); }
function sortBy(k){ sortAuto=false; if(sortState.k===k)sortState.dir*=-1; else { sortState.k=k; sortState.dir=1; } renderQueue(); }
function showEverything(){ flt.pend=false; flt.tat=false; flt.esc=false; flt.del=false; flt.dec=false; flt.sales=''; listShown=LIST_PAGE; renderQueue(); }

/* the date window: the shared estate date control, DD-MM-YYYY end to end */
function mountListDates(){
  if(typeof dateFieldHTML!=='function')return;
  [['fFromSlot','fFrom'],['fToSlot','fTo']].forEach(function(p){
    var slot=document.getElementById(p[0]); if(!slot||slot.getAttribute('data-mounted'))return;
    slot.innerHTML=dateFieldHTML(p[1]); slot.setAttribute('data-mounted','1');
    var el=document.getElementById(p[1]); if(el)el.addEventListener('input',onDateWindow);
    var cal=document.getElementById(p[1]+'-cal'); if(cal)cal.addEventListener('click',function(){ setTimeout(onDateWindow,0); });
  });
}
var _dwTimer=null, windowBusy=false;
function onDateWindow(){
  var s=document.getElementById('fPeriod'); if(s&&s.value){ s.value=''; flt.period=''; }
  listShown=LIST_PAGE; renderQueue();
  if(_dwTimer)clearTimeout(_dwTimer);
  _dwTimer=setTimeout(reloadWindow,400);
}
async function reloadWindow(){
  if(windowBusy)return; windowBusy=true;
  loadCap=LOAD_PAGE; listShown=LIST_PAGE;
  surfSkeleton('queueCenter','Reading the chosen dates…');
  await loadQueue(); renderAll();
  windowBusy=false;
}
/* Period is a shortcut that WRITES the two date fields — one date window, not two */
function periodChanged(){
  var v=(document.getElementById('fPeriod')||{}).value||'';
  flt.period=v;
  var d=new Date(NOWMS||Date.now());
  function iso(x){ function z(n){return (n<10?'0':'')+n;} return x.getFullYear()+'-'+z(x.getMonth()+1)+'-'+z(x.getDate()); }
  var from='', to=iso(d);
  /* R-14c (RR-062, his ruling 2026-08-13): exactly six entries — This Week · Last 7 Days ·
     This Month · Last 30 Days · This Financial Year · Any Date (From/To). "This Quarter" was
     offered and NOT selected, so it is excluded BY RULING, and "Today" was never in his six.
     The financial year follows the shell's FY chip, not the calendar year. */
  if(v==='Week'){ var mon=new Date(d); mon.setDate(d.getDate()-((d.getDay()+6)%7)); from=iso(mon); }
  else if(v==='D7'){ var s7=new Date(d); s7.setDate(d.getDate()-6); from=iso(s7); }
  else if(v==='Month')from=iso(new Date(d.getFullYear(),d.getMonth(),1));
  else if(v==='D30'){ var s30=new Date(d); s30.setDate(d.getDate()-29); from=iso(s30); }
  else if(v==='FY'){ var y=(d.getMonth()>=3)?d.getFullYear():d.getFullYear()-1; from=y+'-04-01'; to=(y+1)+'-03-31'; }
  else { from=''; to=''; }
  var f=document.getElementById('fFrom'), t=document.getElementById('fTo');
  if(f)f.value=from?((typeof isoToDMY==='function')?isoToDMY(from):from):'';
  if(t)t.value=to?((typeof isoToDMY==='function')?isoToDMY(to):to):'';
  reloadWindow();
}
function clearDateWindow(){ ['fFrom','fTo'].forEach(function(id){ var e=document.getElementById(id); if(e)e.value=''; });
  var s=document.getElementById('fPeriod'); if(s)s.value=''; flt.period=''; reloadWindow(); }
function clearAllFilters(){
  flt={pend:false,tat:false,esc:false,del:false,dec:false,sales:'',period:''};
  var s=document.getElementById('fSales'); if(s)s.value='';
  var q=document.getElementById('q'); if(q)q.value=''; qSearch='';
  clearDateWindow();
}

/* ---------- derived row values (each one traceable to a stored column) ---------- */
function qOf(a){ return QUOTES[a.quote_id]||null; }
function cOf(a){ var q=qOf(a); return q&&CUSTS[q.customer_id]?CUSTS[q.customer_id]:null; }
/* DO-14 / DB-07 — the quote DOES carry a salesperson of its own since migration 137
   (quotes.salesperson_emp, "for permissions, filtering and approvals"). That governed column is
   what "By salesperson" answers with. Where a quote predates the column and carries none, the
   M01 customer-ownership mapping (customers.sales_emp) answers instead — and the fallback is
   SAID, never silent. */
function salesSrc(a){
  var q=qOf(a);
  if(q&&q.salesperson_emp)return {id:q.salesperson_emp,src:'quote'};
  var c=cOf(a);
  if(c&&c.sales_emp)return {id:c.sales_emp,src:'customer'};
  return {id:null,src:null};
}
function salesOf(a){ return salesSrc(a).id; }
function tatMs(a){ if(!a.tat_due)return null; var t=Date.parse(a.tat_due); return isNaN(t)?null:((NOWMS||Date.now())-t); }
function tatText(a){
  var m=tatMs(a);
  if(m===null)return na('this carries no deadline');
  var past=m>0, mins=Math.floor(Math.abs(m)/60000), d=Math.floor(mins/1440), h=Math.floor((mins%1440)/60), mm=mins%60;
  var span=(d?d+'d ':'')+(h?h+'h ':'')+((!d&&!h)?mm+'m':'');
  return past?('<b style="color:var(--accent)">'+esc(span.trim())+' past</b>'):('<span style="color:var(--ink2)">'+esc(span.trim())+' left</span>');
}
function isOpen(a){ return OPEN_SET.indexOf(a.status)>=0; }

/* ★ THE AUTHORITY-HOLDER OF A ROW (DDR-284 A2): the person whose authority a decision on this
   row exercises — the escalation target while Escalated, otherwise the routed approver. This id
   is what a delegated payload sends as approver_emp; it comes from the ROW, never invented. */
function holderOf(a){ return (a.status===ST.escalated&&a.escalated_to)?a.escalated_to:a.approver_emp; }
/* the actor's live delegation window from THIS row's holder, module-matched to the row's OWN
   module_code (145a predicate mirrored exactly; quote approvals carry module_code='M06', R-15) */
function delegationFor(a){
  var h=holderOf(a); if(!h||h===actorEmp)return null;
  var e=EMPS[h]; if(!e)return null;
  var wins=activeWindows(a.module_code).filter(function(d){ return d.delegator_code===e.employee_code; });
  return wins.length?{win:wins[0],holder:e}:null;
}
function heldByDelegation(a){ return !!delegationFor(a); }
/* the decision is offered to: the routed/escalated person, or someone standing in for them
   under a live window (REF-13; the register confers the delegate's standing, Q28/145a) */
function routedToActor(a){
  if(!actorEmp)return false;
  if(a.approver_emp===actorEmp)return true;
  if(a.status===ST.escalated&&a.escalated_to===actorEmp)return true;
  return heldByDelegation(a);
}
/* D03-011 — requester ≠ approver is ABSOLUTE (spec: "the screen REFUSES decision controls on a
   quote the actor raised; server enforces; screen mirrors honestly"). */
function isOwnSubmission(a){
  if(!actorEmp)return false;
  var q=qOf(a);
  return a.requested_by===actorEmp || a.created_by===actorEmp || !!(q&&q.created_by===actorEmp);
}

/* ---------- search AND filters INTERSECT, never OR (DDR-192 / SWEEP B4) ---------- */
var viaTag={};
function matches(a){
  var q=qOf(a), c=cOf(a);
  if(flt.pend && !(routedToActor(a) && isOpen(a)))return false;
  if(flt.tat){ var m=tatMs(a); if(m===null||m<=0)return false; }
  if(flt.esc && !(a.status===ST.escalated && a.escalated_to===actorEmp))return false;
  if(flt.del && !heldByDelegation(a))return false;
  if(flt.dec && DECIDED_SET.indexOf(a.status)<0)return false;
  if(flt.sales && String(salesOf(a)||'')!==flt.sales)return false;
  var s=qSearch.trim().toLowerCase();
  if(!s)return true;
  var shown={'RKA':a.approval_no,'quote':q?q.quote_no:'','customer':c?c.name:'','salesperson':empName(salesOf(a)),
             'why routed':a.why_routed,'tier':a.tier,'status':a.status};
  var hidden={'customer code':c?c.customer_code:'','unit':a.unit,'FY':a.fy,'quote status':q?q.status:'',
              'void reason':a.void_reason,'decision note':a.approve_note||a.reject_note||a.escalate_note,'approver':empName(a.approver_emp)};
  var hit=null;
  Object.keys(shown).forEach(function(k){ if(hit)return; if(String(shown[k]||'').toLowerCase().indexOf(s)>=0)hit={k:k,direct:true}; });
  if(!hit)Object.keys(hidden).forEach(function(k){ if(hit)return; if(String(hidden[k]||'').toLowerCase().indexOf(s)>=0)hit={k:k,direct:false}; });
  if(!hit)return false;
  if(!hit.direct)viaTag[a.approval_id]=hit.k;
  return true;
}
function sortKey(a,k){
  var q=qOf(a), c=cOf(a);
  if(k==='rka')return String(a.approval_no||'');
  if(k==='quote')return String(q?q.quote_no:'');
  if(k==='cust')return String(c?c.name:'').toLowerCase();
  if(k==='sales')return String(empName(salesOf(a))||'').toLowerCase();
  if(k==='why')return String(a.why_routed||'').toLowerCase();
  if(k==='val')return Number(q&&q.grand_total!=null?q.grand_total:-1);
  if(k==='nm')return (a.net_margin===null||a.net_margin===undefined)?-Infinity:Number(a.net_margin);
  if(k==='raised')return String(a.created_at||'');
  var m=tatMs(a); return m===null?-Infinity:m;
}
function queueRows(){
  viaTag={};
  var rows=APPR.filter(matches);
  rows.sort(function(x,y){ var vx=sortKey(x,sortState.k), vy=sortKey(y,sortState.k);
    if(vx<vy)return -1*sortState.dir; if(vx>vy)return 1*sortState.dir;
    return String(x.approval_no||'').localeCompare(String(y.approval_no||'')); });
  return rows;
}
function sortNote(){
  if(sortState.k!=='tat')return '';
  return APPR.some(function(a){ return a.tat_due; })?''
    : ' &middot; <b>no deadlines are set</b>; ordered by when they were raised';
}

/* ---------- the Queue render ---------- */
function renderQueue(){
  if(LOCKED){ renderLockedOut(); return; }   /* REF-09/SOD-04 — the refusal survives re-renders */
  paintPills(); paintSalesOptions(); paintChips(); paintKpi(); paintSuggestions();
  var c=document.getElementById('queueCenter'); if(!c)return;
  if(!actorEmp){ c.innerHTML=notSignedIn(); return; }
  if(loadErr.queue){ surfError('queueCenter',loadErr.queue,'reload()'); return; }
  var rows=queueRows(), banners=blockerBanners();
  var shown=rows.slice(0,listShown);
  function th(k,lbl,cls,tip){ return '<th id="hSort-'+k+'" class="srt'+(cls?' '+cls:'')+'"'+(tip?' title="'+esc(tip)+'"':'')+
    ' onclick="sortBy(\''+k+'\')" tabindex="0" aria-sort="'+(sortState.k===k?(sortState.dir>0?'ascending':'descending'):'none')+'">'+
    esc(lbl)+(sortState.k===k?(sortState.dir>0?' &#9650;':' &#9660;'):'')+'</th>'; }
  var h=banners+'<div class="recwrap"><table class="grid"><thead><tr>'+
    th('rka','Approval')+th('quote','Quote')+th('cust','Customer')+
    th('sales','Salesperson',null,'From the quote; otherwise the customer owner, marked.')+
    th('why','Sent for approval because')+th('val','Value','num')+
    (marginOK?th('nm','Net margin','num',''):'')+
    '<th>Level</th><th>State</th>'+th('raised','Raised')+th('tat','Against the deadline')+'</tr></thead><tbody>';
  var cols=marginOK?11:10;
  if(!rows.length){
    var msg, cta='', ctaJs='';
    if(APPR.length===0){
      msg='Nothing is waiting on a decision.';
      cta='Check again'; ctaJs='reload()';
    }else if(flt.pend&&APPR.filter(isOpen).length){

<script>

async function loadDetail(a){

      if(ask.error)throw ask.error;

      var z=await SB.from('quote_line_customization').select(ccols).in('quote_line_id',lids);
      if(z.error)throw z.error;

      var tids=[]; (z.data||[]).forEach(function(x){ if(x.customization_type_id&&tids.indexOf(x.customization_type_id)<0)tids.push(x.customization_type_id); });
      if(tids.length){

    if(iids.length){
      var it=await SB.from('items').select('item_id,description,description_override,type_code,customization_eligible,sw_standard,hsn_code,lifecycle_status').in('item_id',iids);

/* ---------- the norms evaluator, LIVE re-run (J9) ----------
   fn_m07_evaluate_norms(p_quote_id) — CONFIRMED return shape (144a:377-385):
   {verdict:'AUTO_APPROVE'|'ROUTE', why_routed, reason (ALWAYS non-null, both paths — NEW-12),
    breaches[{norm,line_no?,detail}], warnings[] (NEW-14, NON-BLOCKING), net_margin,
    not_implemented[] (truthful stubs, DDR-240 R3), evaluated_at}. */
async function evaluateNorms(qid){
  if(!qid)return;
  NORMS[qid]={state:'loading'};
  paintNorms(qid);
  try{
    var r=await SB.rpc('fn_m07_evaluate_norms',{p_quote_id:qid});
    if(r.error)throw r.error;
    NORMS[qid]={state:'done',out:r.data};
  }catch(ex){ NORMS[qid]={state:'error',err:(ex&&ex.message)||String(ex)}; }
  paintNorms(qid);
}
function paintNorms(qid){

  var stampedNow=selAppr?stampedVerdict(selAppr):null;   /* selAppr IS the approval row (:1186), not an id */
  if(slot)slot.innerHTML=(liveOut&&sameVerdict(stampedNow,liveOut))
    ?''
    :verdictBlock(liveOut,NORMS[qid],'as it stands right now');
  else if(curTab==='appr')renderApproval();
}

/* ---------- ONE renderer for a verdict object (stamped OR live) — CA-19: everything below is
   READ from what the evaluator returned/stamped; the screen re-derives none of the 8 norms. */
function verdictBlock(v,st,whenLabel){
  if(st&&st.state==='loading')return '<div class="hint">Running the automatic check&hellip;</div><div class="skel" style="width:60%"></div>';
  if(st&&st.state==='error')return '<div class="box bad" style="margin:0"><b>The automatic check could not be run.</b> '+
    (plainRule(st.err)?esc(plainRule(st.err))+' ':'')+
    '<div style="margin-top:8px"><button class="btn btn-g btn-sm" type="button" onclick="evaluateNorms(\''+esc(selAppr?selAppr.quote_id:'')+'\')">Try again</button></div></div>';
  if(v===null||v===undefined)return '<div class="box mut" style="margin:0">No verdict is recorded &mdash; neither a pass nor a fail.</div>';
  var br=Array.isArray(v.breaches)?v.breaches:[], wn=Array.isArray(v.warnings)?v.warnings:[], ni=Array.isArray(v.not_implemented)?v.not_implemented:[];
  var isAuto=(v.verdict==='AUTO_APPROVE');
  var h='<div class="gate-line"><div class="gate-word '+(isAuto?'pass':'route')+'">'+esc(v.verdict||'—')+'</div>'+
    '<div class="gate-sub">'+(isAuto?'Why this quote auto-approved':'Why this quote was routed')+' ('+esc(whenLabel)+')</div></div>';
  /* the evaluator's reason is a complete business-language sentence on BOTH paths (NEW-12) —
     rendered UNCONDITIONALLY. Its absence would itself be a finding, and is said out loud. */
  h+=(v.reason?('<div class="box '+(isAuto?'ok':'bad')+'" style="margin-top:9px">'+esc(v.reason)+'</div>')
             :'<div class="box warn" style="margin-top:9px"><b>No reason was returned &mdash; not a clean pass.</b></div>');
  if(v.why_routed)h+='<div class="lever" style="margin-top:7px"><span>Routed because</span><span class="lv" style="white-space:normal;text-align:right">'+esc(v.why_routed)+'</span></div>';
  if(br.length){
    h+='<div style="margin-top:9px"><div class="hint">Breaches</div>';
    sortByCanon(br).forEach(function(b){
      h+='<div class="brow"><span class="bn" style="color:var(--accent)">'+(b&&b.norm?normLabel(b.norm):'(unnamed)')+
         (b&&b.line_no!==undefined&&b.line_no!==null?(' <span class="hint">line '+esc(b.line_no)+'</span>'):'')+'</span>'+
         '<span class="bd">'+(b&&b.detail?esc(b.detail):snapshotFields(b,'no detail was recorded'))+'</span></div>';
    });
    h+='</div>';
  }
  if(wn.length){
    h+='<div style="margin-top:9px"><div class="hint">Warnings &mdash; these do not block</div>';
    wn.forEach(function(w){
      var isObj=(w&&typeof w==='object');
      h+='<div class="brow"><span class="bn" style="color:var(--warn)">'+esc(isObj&&w.norm?w.norm:'warning')+'</span>'+
         '<span class="bd">'+(isObj?(w.detail?esc(w.detail):snapshotFields(w,'no detail was recorded')):esc(String(w)))+'</span></div>';
    });
    h+='</div>';
  }
  if(ni.length)h+='<div class="box info" style="margin-top:9px">Not sized by the check: <b>'+
    ni.map(function(x){return esc(String(x));}).join(', ')+'</b> &mdash; neither a pass nor a fail.</div>';
  if(marginOK){
    var mv=marginVsFloor(v.net_margin);
    h+='<div class="lever" style="margin-top:7px"><span>Net margin (evaluator)</span><span>'+
       (mv?mv.html:'<span class="na">not available</span>')+'</span></div>';
    if(!mv)
      h+='<div class="hint">No cost is recorded against the lines.</div>';
    h+=negativeMarginWarn(v.net_margin);
  }
  if(v.evaluated_at)h+='<div class="hint" style="margin-top:6px">Evaluated '+dt(String(v.evaluated_at))+'</div>';
  h+='<details style="margin-top:8px"><summary class="hint" style="cursor:pointer">Everything it returned, as labelled fields</summary>'+
     '<div style="margin-top:6px">'+snapshotFields(v,'the evaluator returned nothing')+'</div></details>';
  return h;
}
function sortByCanon(br){
  return br.slice().sort(function(x,y){
    var ix=CANON_NORMS.indexOf(x&&x.norm), iy=CANON_NORMS.indexOf(y&&y.norm);
    return (ix<0?99:ix)-(iy<0?99:iy);
  });
}
/* the verdict STAMPED at raise — factor_snapshot->norms_verdict (144:749-756, CONFIRMED):
   the whole evaluator return persisted on the approval row. This is what actually routed it. */
function stampedVerdict(a){
  var f=a&&a.factor_snapshot;
  return (f&&typeof f==='object'&&f.norms_verdict&&typeof f.norms_verdict==='object')?f.norms_verdict:null;
}
/* does the STAMPED verdict carry a breach of the given norm name? (used to tag terms rows) */
function stampedBreach(a,normName){
  var v=stampedVerdict(a); if(!v||!Array.isArray(v.breaches))return false;
  return v.breaches.some(function(b){ return b&&b.norm===normName; });
}

function itemLabel(code){ var i=ITEMS[code]; if(!i)return esc(code||'—');
  return '<b>'+esc(code)+'</b><div class="hint" style="white-space:normal;max-width:260px">'+esc(i.description_override||i.description||'')+'</div>'; }
function revStale(a,q){ if(!q)return null;
  var revMoved=(a.quote_rev_no!==null&&a.quote_rev_no!==undefined&&Number(a.quote_rev_no)!==Number(q.rev_no));
  var verMoved=(a.quote_version_at_raise!==null&&a.quote_version_at_raise!==undefined&&Number(a.quote_version_at_raise)!==Number(q.version));

/* DO-22 · the quote behind the approval opens WITHOUT searching: the quote id travels on the

function openQuote(){
