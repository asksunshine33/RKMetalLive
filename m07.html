/* ---------- the deadline, told truthfully about WHICH level it belongs to ----------
   MIGRATION 150 (2026-08-01, DDR-284 A1 defect 3): rpc_m07_escalate now RECOMPUTES tat_due
   into the DIRECTORS response window when it moves the tier (NULL-safe: if no DIRECTORS
   tat_config row exists, the stored deadline is left untouched). The SLA shown here is
   therefore ALWAYS the live tat_due column, read back — this screen never computes its own
   deadline and never relabels one. */
function tatMinutesFor(stage){
  var rows=TATCFG.filter(function(t){ return String(t.stage_code||'').toUpperCase()===String(stage||'').toUpperCase()&&t.active!==false; });
  return rows.length?Number(rows[0].tat_minutes):null;
}
/* TAT-05 · delegation precedes escalation (D03-010): a breach's first route is the HOLDER's
   live stand-in from the register; only then does it go up the tree. Nothing moves an approval
   by itself today (the honest seam stands) — this names the ordering a person should follow. */
function delegateFirstNote(a){
  if(!isOpen(a))return '';
  var m=tatMs(a); if(m===null||m<=0)return '';
  var cv=coverFor(a), hn=empName(holderOf(a))||'the approver';
  var h='<div style="margin-top:6px"><b>Past its deadline.</b> ';
  if(cv){
    var de=EMPBYCODE[cv.delegate_code];
    h+='Stand-in for '+esc(hn)+': <b>'+esc(de?de.full_name:cv.delegate_code)+'</b> ('+esc(fmtDate(cv.start_date))+' to '+esc(fmtDate(cv.end_date))+') &mdash; it falls to them first.';
  }else if(COVERERR){
    h+='The stand-in register could not be read.';
  }else{
    h+='No stand-in covers '+esc(hn)+'; the way up is Send up a level.';
  }
  return h+'</div>';
}
function deadlineBlock(a){
  var mine=tatMinutesFor(a.tier);
  var h='<div class="box '+(a.tat_due?'mut':'warn')+'">';
  if(!a.tat_due){
    h+='<b>No deadline.</b> '+(TATCFG.length?'None was stamped when it was raised.':'No response time is set up.');
    return h+delegateFirstNote(a)+'</div>';
  }
  h+='<b>Answer by '+dt(a.tat_due)+'</b> &mdash; '+tatText(a)+'.';
  if(a.status===ST.escalated&&mine!==null)
    h+='<div style="margin-top:6px">Re-timed to the Directors window on escalation ('+esc(String(mine))+' minutes).</div>';
  else if(mine===null&&TATCFG.length)
    h+='<div style="margin-top:6px">No response time is published for the '+esc(String(a.tier||'current'))+' level; treat this as indicative.</div>';
  return h+delegateFirstNote(a)+'</div>';
}

/* ---------- the HOLDER's limits, shown BEFORE the click (REF-14/SOD-03) ----------
   The limits that bind a decision are the AUTHORITY-HOLDER's — for a delegated decision that is
   the person being stood in for, whose authority is exercised (trg_qa_guard tests exactly them). */
function authorityFor(code,moduleCode){
  if(!code)return null;
  var rows=AUTH.filter(function(x){ return x.employee_code===code&&x.active!==false; });
  var exact=rows.filter(function(x){ return String(x.module_code||'')===String(moduleCode||''); });
  return (exact[0]||rows[0]||null);
}
function limitHolder(a){
  var dgn=delegationFor(a);
  if(dgn)return {code:dgn.holder.employee_code,name:dgn.holder.full_name,standing:true};
  return {code:actorCode,name:actorName,standing:false};
}
function dealDiscountPct(q,lines){
  if(q&&q.deal_discount_pct!==null&&q.deal_discount_pct!==undefined)return Number(q.deal_discount_pct);
  var m=null; lines.forEach(function(l){ if(l.discount_pct!==null&&l.discount_pct!==undefined)m=(m===null?Number(l.discount_pct):Math.max(m,Number(l.discount_pct))); });
  return m;
}
function limitCheck(a,q,lines){
  var who=limitHolder(a);
  var row=authorityFor(who.code,a.module_code);
  if(!row)return {row:null,who:who};
  var val=(q&&q.grand_total!==null&&q.grand_total!==undefined)?Number(q.grand_total):null;
  var disc=dealDiscountPct(q,lines);
  var vl=(row.value_limit===null||row.value_limit===undefined)?null:Number(row.value_limit);
  var dl=(row.discount_limit_pct===null||row.discount_limit_pct===undefined)?null:Number(row.discount_limit_pct);
  return {row:row,who:who,value:val,disc:disc,vLimit:vl,dLimit:dl,
    overValue:(vl!==null&&val!==null&&val>vl),
    overDisc:(dl!==null&&disc!==null&&disc>dl)};
}
/* ============================================================================================
   WS-8.4 · DDR-292 R26 — GATE 3 (COMMERCIAL LIMITS) IS TRI-STATE: PASS / FAIL / NOT_EVALUATED.
   NOT_EVALUATED is an ABSTENTION, never a pass and never a waiver: it means the check could not
   be carried out on this approval. Only FAIL blocks.
   WHY IT IS DERIVED HERE RATHER THAN ASKED OF THE DATABASE: fn_m07_validate_decision,
   fn_m07_commercial_exposure and fn_m07_governed_line_base are granted to service_role ONLY
   (pg_proc.proacl read live 2026-08-06 — anon false, authenticated false), so this screen cannot
   call them. The three branches below are those function bodies' OWN branches, in their own
   order, from columns this screen may read. Nothing is invented and nothing is softened.
   ============================================================================================ */
function governedLineBase(l){
  if(l.amount===null||l.amount===undefined||l.quoted_total_qty===null||l.quoted_total_qty===undefined||l.rate===null||l.rate===undefined)
    return {available:false,why:'the line is not priced, so no pricing decision exists for it'};
  /* F-P3-M07-05 — found on LIVE data 2026-08-14 while reading back migration 253.
     RO-2026-27-000031 line 1 carries rate 0.00 and amount 0.00 but a FROZEN
     governed_base_amount of 142,500.00 — a decision frozen before the line was zeroed. The
     branch below took that base and never re-tested the rate, so commercialExposure() reported
     a concession of the entire 142,500 on a line where nothing was sold. A NULL rate was
     already refused above; a ZERO rate was not, and zero is the case that actually occurs.
     This is `fn_quote_compute_totals`'s own definition of an unpriced line, so the screen and
     the server now abstain on exactly the same rows. */
  if(Number(l.rate)===0||Number(l.amount)===0)
    return {available:false,why:'the line carries no price, so nothing was given away on it'};
  var g=l.governed_pricing_decision;
  if(g&&typeof g==='object'&&g.governed_base_amount!==null&&g.governed_base_amount!==undefined){
    var b=Number(g.governed_base_amount);
    if(!(b>0))return {available:false,why:'the frozen base resolves to zero'};
    return {available:true,base:b};
  }
  if(String(l.price_source_type||'')==='MANUAL_OVERRIDE')
    return {available:false,why:'the frozen pricing decision is not available for this line'};
  if(!(Number(l.rate)*Number(l.quoted_total_qty)>0))return {available:false,why:'the frozen base resolves to zero'};
  return {available:true,base:Math.round(Number(l.rate)*Number(l.quoted_total_qty)*100)/100};
}
/* ---------------------------------------------------------------------------------------------
   F-P3-37 — "PRICING METHOD CONTRADICTS ITSELF on one screen."
   Measured, not assumed: in fn_quote_price_line the two tokens are NOT two facts. The function
   builds them in ONE jsonb_build_object and DERIVES the second from the first
   (FUNCS_FULL.md:1956-1960):
       'pricing_resolution_method', v_method,
       'price_source_type', CASE WHEN v_method='SPECIAL_PRICE' THEN 'CUSTOMER_SPECIAL_PRICE'
                                 WHEN v_method IN ('CUSTOMER_TYPE_PRICE','DIRECT_UOM_PRICE',
                                                   'CONVERTED_FROM_BASIS') THEN 'PRICE_LIST'
                                 ELSE 'SYSTEM_CALCULATED' END
   So the line table's "priced from PRICE_LIST" and Y5's "priced by CONVERTED_FROM_BASIS" were the
   SAME fact printed in a coarse vocabulary and a fine one, side by side, on one surface — which is
   exactly the contradiction the row books. ONE renderer now serves both sites: the method is the
   authority and is stated once; the family is shown only as what it is, a derivation of it.
   Per N-04 and R-11 no English label is invented here — there is no governed label list for these
   tokens in the live estate, so the engine's own token is shown AS a token and said to be one. */
function pricedBy(l){
  var m=l.pricing_resolution_method, f=l.price_source_type;
  if(!m&&!f)return '';
  if(!m)return ' &middot; price source '+esc(String(f))+' <span class="hint">(the engine recorded no resolution method)</span>';
  var h=' &middot; priced by '+esc(String(m))+' <span class="hint">(the engine\'s own token; no business wording is configured for it)</span>';
  /* the family adds nothing when it is merely this method's own CASE arm; it is shown when it
     carries something the method does not — a manual override, or a disagreement worth seeing. */
  var derived=(m==='SPECIAL_PRICE')?'CUSTOMER_SPECIAL_PRICE'
             :(m==='CUSTOMER_TYPE_PRICE'||m==='DIRECT_UOM_PRICE'||m==='CONVERTED_FROM_BASIS')?'PRICE_LIST'
             :'SYSTEM_CALCULATED';
  if(f&&String(f)!==derived)h+=' <span class="vtag warn">source recorded as '+esc(String(f))+', not the '+esc(derived)+' this method resolves to</span>';
  return h;
}
function commercialExposure(qid){
  var q=QUOTES[qid], lines=LINES[qid]||[];
  if(!q)return {ok:false};
  var pretax=Number(q.sub_total||0)+Number(q.freight_amount||0)+Number(q.insurance_amount||0)+Number(q.other_charges_amount||0);
  var frozen=true, unfrozen=0, sumBase=0, sumReal=0, maxConc=0, stale=[];
  lines.forEach(function(l){
    /* R-04, his words: "Retain the last valid values for audit and user reference, but treat them
       as stale business data. They must never contribute to live commercial calculations until the
       line is successfully repriced." The value stays on the screen (flowedTable renders it, marked);
       it is EXCLUDED here, which is the only place it would contribute to a live calculation. */
    if(l.pricing_stale===true){ stale.push(l); return; }
    var cus=0; (((CUSTZ[qid]||{})[l.id])||[]).forEach(function(z){ if(z.computed_charge!==null&&z.computed_charge!==undefined)cus+=Number(z.computed_charge); });
    var gb=governedLineBase(l);
    if(!gb.available){ frozen=false; unfrozen++; return; }
    var realised=Math.round((Number(l.amount)-cus)*100)/100;
    var conc=(1-(realised/gb.base))*100;
    if(conc>maxConc)maxConc=conc;
    sumBase+=gb.base; sumReal+=realised;
  });
  return {ok:true,pretax:pretax,basis_frozen:frozen,unfrozen:unfrozen,totals_current:!(q.totals_dirty===true),
    stale_lines:stale.length,stale_nos:stale.map(function(l){return l.line_no;}),
    max_conc:(sumBase>0?maxConc:null),overall_conc:(sumBase>0?((1-(sumReal/sumBase))*100):null)};
}
/* the limits that bind are the AUTHORITY-HOLDER's — the routed approver, or the escalation target
   while Escalated: exactly whom the database resolves, never the person looking at the screen. */
function gate3(a){
  var e=EMPS[holderOf(a)];
  var row=e?authorityFor(e.employee_code,a.module_code):null;
  var vl=(row&&row.value_limit!==null&&row.value_limit!==undefined)?Number(row.value_limit):null;
  var dl=(row&&row.discount_limit_pct!==null&&row.discount_limit_pct!==undefined)?Number(row.discount_limit_pct):null;
  var x=commercialExposure(a.quote_id);
  var g={vl:vl,dl:dl,x:x};
  if(vl===null){ g.status='NOT_EVALUATED'; g.why='no value limit is recorded for the person this is with'; return g; }
  if(!x.ok){ g.status='NOT_EVALUATED'; g.why='what this deal is worth could not be measured'; return g; }
  /* F-P3-06 / R-04 — named BEFORE the derived causes below. A stale line usually also fails
     governedLineBase, so leaving this last would report "cannot be read back" for a line whose
     real condition is that the server refused to price it: a true sentence hiding the true cause. */
  if(x.stale_lines>0){ g.status='NOT_EVALUATED'; g.why='line(s) '+x.stale_nos.join(', ')+' carry money the pricing engine has flagged as out of date, and the total above includes them'; return g; }
  if(!x.basis_frozen){ g.status='NOT_EVALUATED'; g.why='the priced decision behind '+x.unfrozen+' line(s) cannot be read back'; return g; }
  if(!x.totals_current){ g.status='NOT_EVALUATED'; g.why='the quote totals are out of date'; return g; }
  if(x.pretax>vl){ g.status='FAIL'; g.why='value before tax '+rs(x.pretax)+' is above the limit '+rs(vl); return g; }
  if(dl!==null&&x.max_conc!==null&&x.max_conc>dl){ g.status='FAIL'; g.why='the largest line concession '+x.max_conc.toFixed(2)+'% is above the limit '+dl.toFixed(2)+'%'; return g; }
  if(dl!==null&&x.overall_conc!==null&&x.overall_conc>dl){ g.status='FAIL'; g.why='the overall concession '+x.overall_conc.toFixed(2)+'% is above the limit '+dl.toFixed(2)+'%'; return g; }
  g.status='PASS'; g.why='value and both concession measures are within the limits'; return g;
}
/* an abstention is shown as an abstention. It is never dressed as "within the limit". */
function gate3Tag(g){
  if(g.status==='PASS')return '<span class="vtag ok">within the limits</span>';
  if(g.status==='FAIL')return '<span class="vtag bad">above the limits</span>';
  return '<span class="vtag nimp">NOT_EVALUATED &mdash; not checked, not a pass</span>';
}
function authorityBlock(a,q,lines){
  if(!isOpen(a))return '';
  if(AUTHERR)return '';
  var g=gate3(a), he=EMPS[holderOf(a)];
  var whose=he?esc(he.full_name):'the person this is with';
  var cls=(g.status==='FAIL')?'bad':((g.status==='NOT_EVALUATED')?'warn':'mut');
  var h='<div class="box '+cls+'"><b>Commercial limits &mdash; '+whose+'</b> '+gate3Tag(g)+
    '<div class="norm-hd" style="margin-top:7px"><span>&nbsp;</span><span>this deal</span><span>the limit</span><span>&nbsp;</span></div>'+
    '<div class="norm"><span class="nl">Value before tax</span><span class="nv">'+(g.x.ok?esc(rs(g.x.pretax)):na())+
      '</span><span class="nn">'+(g.vl===null?na('no limit is recorded'):esc(rs(g.vl)))+'</span><span>'+gate3Tag(g)+'</span></div>'+
    '<div class="norm"><span class="nl">Largest line concession</span><span class="nv">'+((g.x.ok&&g.x.max_conc!==null)?esc(g.x.max_conc.toFixed(2)+'%'):na())+
      '</span><span class="nn">'+(g.dl===null?na('no limit is recorded'):esc(g.dl.toFixed(2)+'%'))+'</span><span></span></div>'+
    '<div class="norm"><span class="nl">Overall concession</span><span class="nv">'+((g.x.ok&&g.x.overall_conc!==null)?esc(g.x.overall_conc.toFixed(2)+'%'):na())+
      '</span><span class="nn">'+(g.dl===null?na('no limit is recorded'):esc(g.dl.toFixed(2)+'%'))+'</span><span></span></div>'+
    '<div style="margin-top:6px">'+esc(g.why)+'.</div>';
  if(g.status==='NOT_EVALUATED')
    h+='<div style="margin-top:4px"><b>Not evaluated &mdash; not a pass, not a waiver.</b></div>';
  return h+'</div>';
}
/* ★ DEAD SINCE WS-8.4 — kept in place, unreferenced, never deleted (deletion is manual only).
   limitHolder() · limitCheck() · limitCheckDead() are the OLD limit surface: they measured
   grand_total against value_limit and the deal discount against discount_limit_pct. That is NOT
   the measure gate 3 applies (pre-tax commercial value, and concession against the FROZEN
   governed base), and it reported "within the limit" — a pass — where gate 3 in fact abstains.
   Superseded by gate3()/authorityBlock() above. LISTED FOR V AT THE GATE. Nothing calls them. */
function limitCheckDead(a,q,lines){
  var k=limitCheck(a,q,lines);
  var whose=k.who.standing?(esc(k.who.name||k.who.code)):'You';
  if(!k.row){
    if(AUTHERR)return '';
    return '<div class="box warn"><b>'+whose+' ha'+(k.who.standing?'s':'ve')+' no approval limits on record.</b> Nothing says how much may be approved here, '+
      'so an approval cannot be given here. To fix this, grant approval authority, with the value and discount limits that go with it.</div>';
  }
  var cls=(k.overValue||k.overDisc)?'bad':'mut';
  var h='<div class="box '+cls+'"><b>What '+(k.who.standing?(esc(k.who.name||k.who.code)+' (whose authority you are exercising) is'):'you are')+' allowed to approve</b>'+
    '<div class="norm-hd" style="margin-top:7px"><span>&nbsp;</span><span>this deal</span><span>the limit</span><span>&nbsp;</span></div>'+
    '<div class="norm"><span class="nl">Value</span><span class="nv">'+(k.value===null?na('the quote value could not be read'):esc(rs(k.value)))+
      '</span><span class="nn">'+(k.vLimit===null?'no limit set':esc(rs(k.vLimit)))+'</span><span>'+
      (k.vLimit===null?'<span class="vtag judge">no limit set</span>':(k.overValue?'<span class="vtag bad">above the limit</span>':'<span class="vtag ok">within the limit</span>'))+'</span></div>'+
    '<div class="norm"><span class="nl">Discount</span><span class="nv">'+(k.disc===null?na('no discount is recorded'):esc(Number(k.disc).toFixed(2)+'%'))+
      '</span><span class="nn">'+(k.dLimit===null?'no limit set':esc(Number(k.dLimit).toFixed(2)+'%'))+'</span><span>'+
      (k.dLimit===null?'<span class="vtag judge">no limit set</span>':(k.overDisc?'<span class="vtag bad">above the limit</span>':'<span class="vtag ok">within the limit</span>'))+'</span></div>';
  if(k.overValue||k.overDisc)h+='<div style="margin-top:7px">This deal is beyond that limit, so Approve is not offered (REF-14). '+
    'The way out: escalate it, or reject it &mdash; both are still open.</div>';
  return h+'</div>';
}

/* ---------- DEL-01 / BRULE-054 · the stand-in's OWN authority beside the holder's ----------
   The rule expects a delegate of equal-or-higher authority than the person they stand in for.
   The decision still exercises the HOLDER's limits (that is what the database tests); this
   comparison is shown so a lower-authority stand-in is a stated fact, not a silence. */
function delegAuthNote(a){
  var dg=delegationFor(a); if(!dg||!actorCode)return '';
  if(AUTHERR)return '';
  var mine=authorityFor(actorCode,a.module_code), theirs=authorityFor(dg.holder.employee_code,a.module_code);
  function lim(r,k){ return (r&&r[k]!==null&&r[k]!==undefined)?Number(r[k]):null; } /* null = no limit set (unbounded) */
  var mv=lim(mine,'value_limit'), tv=lim(theirs,'value_limit');
  var md=lim(mine,'discount_limit_pct'), td=lim(theirs,'discount_limit_pct');
  function lower(m,t){ if(t===null)return m!==null;      /* holder unbounded, mine bounded → lower */
    return m!==null&&m<t; }                              /* both bounded → numeric */
  var below=(!mine)||lower(mv,tv)||lower(md,td);
  if(!below)return '<div class="hint" style="margin-top:6px">Your authority is equal to or higher than '+esc(dg.holder.full_name)+'&rsquo;s.</div>';
  return '<div class="box warn" style="margin-top:8px"><b>Your authority is lower than '+esc(dg.holder.full_name)+'&rsquo;s.</b> '+
    'You'+(mine?(': value '+(mv===null?'no limit':rs(mv))+' / discount '+(md===null?'no limit':md.toFixed(2)+'%')):' hold none')+
    '; they: value '+(tv===null?'no limit':rs(tv))+' / discount '+(td===null?'no limit':td.toFixed(2)+'%')+'. Their limits are what is exercised.</div>';
}

/* ---------- SEE-20/21/37 · net margin measured against the GOVERNED floor (migration 141) ----
   The floor is read live from quote_approval_config; the margin value is coloured AND worded at
   the flip (colour is never the only signal, ERS §2.3). A negative margin WARNS, never blocks. */
function marginVsFloor(nm){
  if(nm===null||nm===undefined||nm==='')return null;
  var n=Number(nm); if(isNaN(n))return null;
  var fl=marginFloor();
  if(fl===null)return {n:n,fl:null,html:'<span class="lv">'+esc(String(nm))+'</span>'};
  var ok=(n>=fl);
  return {n:n,fl:fl,ok:ok,html:'<span class="lv" style="color:var(--'+(ok?'green':'accent')+');font-weight:800">'+esc(String(nm))+'</span> '+
    '<span class="vtag '+(ok?'ok':'bad')+'">'+(ok?'at or above':'below')+' the '+esc(fl.toFixed(2))+'% floor</span>'};
}
function negativeMarginWarn(nm){
  if(nm===null||nm===undefined||nm==='')return '';
  var n=Number(nm); if(isNaN(n)||n>=0)return '';
  return '<div class="box warn" style="margin-top:8px"><b>&#9888; The margin is negative &mdash; this deal loses money.</b> A warning, not a block.</div>';
}

<script>
/* ============================================================================================
   Y6 · the quote exactly as the customer sees it, with cost/margin added for those who may.
   Cost and margin are ABSENT — not blanked, not zeroed — for any role that may not see them;
   those columns are not even asked of the database. Customisation is NOT in this table
   (DDR-038/DDR-055: its charges keep their own section). The over-ceiling mark is the STORED

   ============================================================================================ */
function flowedTable(qid,lines){

    var stale=(l.pricing_stale===true);

        (l.price_refusal_reason?(' <span class="hint">'+esc(l.price_refusal_reason)+'</span>'):' <span class="hint">the engine recorded no reason</span>')+'</div>'):'')+'</td>'+
      '<td class="num">'+num(l.customer_length,3)+'</td><td>'+txt(l.customer_uom)+'</td><td class="num">'+num(l.customer_qty,3)+'</td>'+
      '<td>'+txt(l.quoted_uom)+'</td><td class="num">'+num(l.quoted_total_qty,3)+'</td>'+
      '<td>'+txt(l.sw_basis)+(l.sw_value!==null&&l.sw_value!==undefined?(' '+esc(Number(l.sw_value).toFixed(4))):'')+
        (l.sw_needs_approval===true?' <span class="vtag bad">outside tolerance</span>':'')+'</td>'+

        (over?' <span class="vtag bad" title="Stamped by the pricing engine when the quote was priced — not recomputed here.">over ceiling</span>':'')+'</td>'+
      '<td class="num">'+pct(l.commission_pct)+'</td>'+

  });

    var staleNos=lines.filter(function(l){return l.pricing_stale===true;}).map(function(l){return l.line_no;});
    h+='<tr><td colspan="'+span+'" style="white-space:normal;background:var(--surface2)">'+
       '<div class="ap-row">'+
       '<div class="kv"><span>Sub-total</span><b>'+money(q.sub_total)+'</b></div>'+
       '<div class="kv"><span>CGST</span><b>'+money(q.cgst)+'</b></div>'+
       '<div class="kv"><span>SGST</span><b>'+money(q.sgst)+'</b></div>'+
       '<div class="kv"><span>IGST</span><b>'+money(q.igst)+'</b></div>'+
       '<div class="kv"><span>Rounding</span><b>'+money(q.round_off)+'</b></div>'+
       '<div class="kv"><span>Grand total</span><b>'+money(q.grand_total)+'</b></div>'+
       '<div class="kv"><span>Total weight (MT)</span><b>'+num(q.total_weight_mt,3)+'</b></div>'+

/* ---------- customisation, in its OWN charges section, with its OWN cost (DDR-038/DDR-055) ---- */

     (marginOK?('<td class="num" style="background:var(--surface2)"><b>'+((sumChg===null||sumCost===null)?na('one of the two figures is missing'):esc(rs(sumChg-sumCost)))+'</b></td>'):'')+

/* ============================================================================================
   Y7 · TERMS & CONTEXT — every value is the stored column; the governed lists supply labels.
   Whether a term breached its norm is read from the verdict the evaluator STAMPED at raise
   (factor_snapshot.norms_verdict) — never re-derived here (CA-19).
   ============================================================================================ */
function addrText(id){ var a=ADDR[id]; if(!a)return null;
  var out=[]; ['line1','line2','address_line1','address_line2','address1','address2','area','city','district','state','pincode']
    .forEach(function(k){ if(a[k]&&out.indexOf(a[k])<0)out.push(a[k]); });
  return out.length?out.join(', '):null; }
function lever(l,v,hint){ return '<div class="lever"><span>'+esc(l)+(hint?' <span class="hint">'+esc(hint)+'</span>':'')+'</span><span class="lv">'+v+'</span></div>'; }
function normMark(a,normName){
  if(stampedBreach(a,normName))return ' <span class="vtag bad" title="Named as a breach in the verdict stamped when this was raised.">'+esc(normName)+'</span>';

  return v?' <span class="vtag ok" title="Not named as a breach in the stamped verdict.">clear at raise</span>'
          :' <span class="vtag judge" title="No verdict was stamped on this approval, so nothing says whether this term breached its norm.">no stamp</span>';

function termsBand(a,q,c){
  if(!q)return '<div class="box bad" style="margin:0">The quote behind this approval cannot be read, so its terms cannot be shown.</div>';
  var h='';
  h+=lever('Payment terms',q.pt_code?esc(refLabel(q.pt_code)):na('no payment terms are set on this quote'));
  /* SEE-24 · the NORM the PT is measured against — the M01 customer default (customers.terms_code,

  h+='<div class="hint" style="margin:-2px 0 4px">Norm:'+normMark(a,'PT≠default')+
     ' &middot; customer&rsquo;s usual: '+(c?(c.terms_code?('<b>'+esc(refLabel(c.terms_code)||c.terms_code)+'</b>'):'<span class="na">none set</span>'):'<span class="na">customer unreadable</span>')+'</div>';
  h+=lever('Delivery scope',q.delivery_scope?esc(refLabel(q.delivery_scope)):'<span class="vtag warn">not stated</span>');
  h+='<div class="hint" style="margin:-2px 0 4px">Norm:'+normMark(a,'delivery≠Customer')+'</div>';
  h+=lever('Insurance scope',q.insurance_scope?esc(refLabel(q.insurance_scope)):'<span class="vtag warn">not stated</span>');
  h+='<div class="hint" style="margin:-2px 0 4px">Norm:'+normMark(a,'insurance≠Customer')+'</div>';
  h+=lever('Delivery terms',q.delivery_terms?esc(refLabel(q.delivery_terms)):na('no delivery terms are set on this quote'));
  /* SEE-12 / DB-05 · transport — the governed Mode of Delivery column (mig 136/140, list GA) */
  h+=lever('Mode of delivery (transport)',q.mode_of_delivery?esc(refLabel(q.mode_of_delivery)||q.mode_of_delivery):na('no mode of delivery is set on this quote'));
  h+=lever('Supply type',txt(q.supply_type));
  h+=lever('Lead times (product / production / delivery)',esc(q.lead_time_product+' / '+q.lead_time_production+' / '+q.lead_time_delivery)+' <span class="hint">days</span>');
  h+=lever('Quote date',day(q.quote_date));
  h+=lever('Valid until',day(q.validity_date)+' <span class="hint">('+esc(q.validity_days)+' days)</span>');
  var vc=validityChanges(a.quote_id);
  if(vc.length)h+='<div class="box warn"><b>&#9888; The validity was extended.</b> '+vc.map(function(r){
    return esc(r.field)+': '+esc(r.old_value===null?'—':r.old_value)+' &rarr; '+esc(r.new_value===null?'—':r.new_value)+' by '+esc(r.by_name||'—')+' on '+esc(fmtDate(String(r.at).slice(0,10)));
  }).join('<br>')+'</div>';
  if(c){
    var head=(c.credit_limit===null||c.credit_limit===undefined||c.credit_used===null||c.credit_used===undefined)?null:(Number(c.credit_limit)-Number(c.credit_used));
    h+=lever('Customer',esc(c.name+' ('+c.customer_code+')')+' <span class="hint">'+esc(c.status||'')+(c.customer_type?(' &middot; type '+esc(refLabel(c.customer_type)||c.customer_type)):'')+'</span>');
    h+=lever('Credit limit / used',money(c.credit_limit)+' / '+money(c.credit_used));
    h+=lever('Left to use',head===null?na('one of the two credit figures is missing'):(head<0?('<span style="color:var(--accent)">'+esc(rs(head))+'</span>'):esc(rs(head))));
    /* SEE-13 / D01-008 · exposure = outstanding + open orders + pending quotes — counted where
       a governed source exists, and the missing leg NAMED rather than folded in as zero. */
    h+=(function(){
      var ex=EXPO[c.id];
      var used=(c.credit_used===null||c.credit_used===undefined)?null:Number(c.credit_used);
      if(ex&&ex.err)return '<div class="box bad" style="font-size:var(--fs-caption)"><b>The exposure figure could not be counted.</b></div>';
      var rows=(ex&&ex.rows)?ex.rows:null;
      if(rows===null)return '<div class="box mut" style="font-size:var(--fs-caption)">The customer&rsquo;s other in-flight quotes were not read.</div>';
      var pend=null, n=0; rows.forEach(function(r){ if(r.grand_total!==null&&r.grand_total!==undefined){ pend=(pend||0)+Number(r.grand_total); n++; } });
      var total=(used!==null?used:0)+(pend!==null?pend:0);
      var have=(used!==null||pend!==null);
      return '<div class="box '+(have?'info':'mut')+'" style="font-size:var(--fs-caption)"><b>Exposure: '+
        (have?esc(rs(total)):'<span class="na">cannot be counted</span>')+'</b> &mdash; owed '+
        (used!==null?esc(rs(used)):'<span class="na">not recorded</span>')+
        ' + in-flight quotes '+(pend!==null?(esc(rs(pend))+' across '+n):'<span class="na">none</span>')+
        '. Open sales orders are not counted, so this is a floor.</div>';
    })();
    h+=lever('Credit hold',c.credit_hold===true?'<span class="vtag bad">on hold</span>':'<span class="vtag ok">not on hold</span>');
  } else h+='<div class="box mut">The customer could not be read.</div>';
  var site=addrText(q.ship_to_address_id), bill=addrText(q.bill_to_address_id);
  h+=lever('Delivery site',site?esc(site):(q.ship_to_address_id?na('the address could not be read'):na('no delivery address is set on this quote')));
  h+=lever('Bill to',bill?esc(bill):(q.bill_to_address_id?na('the address could not be read'):na('no billing address is set on this quote')));
  h+=lever('Site notes',na('site notes are not stored on a quote'));
  h+=lever('Extra charges',esc('freight ')+money(q.freight_amount)+esc(' · insurance ')+money(q.insurance_amount)+esc(' · other ')+money(q.other_charges_amount));
  h+=lever('Quote state',statusTag(q.status)+' <span class="hint">revision '+esc(q.rev_no)+'</span>'+
    (q.prior_status?(' <span class="hint">was '+esc(q.prior_status)+'</span>'):''));
  /* migration 149 (DDR-284 A1) · the DDR-154 approval stamps on the quote itself, read back */
  if(q.approved_at||q.approved_by_name||q.approved_by)
    h+=lever('Quote approved by',(q.approved_by_name?esc(q.approved_by_name):(empName(q.approved_by)?esc(empName(q.approved_by)):'<span class="na">no name was stamped</span>'))+
      (q.approved_at?(' <span class="hint">on '+dt(q.approved_at)+'</span>'):''));
  h+=lever('Raised by',(q.created_by_name?esc(q.created_by_name):empLabel(q.created_by))+
    esc(' · unit ')+txt(q.unit)+esc(' · year ')+txt(q.fy)+
    (q.from_lead_id?' <span class="hint">started life as a lead</span>':'')+
    (q.referrer_id?(' <span class="hint">referred by '+esc(q.referrer_id)+'</span>'):''),
    'last changed '+(q.updated_at?(fmtDate(String(q.updated_at).slice(0,10))+' '+String(q.updated_at).slice(11,16)):'not recorded'));
  h+=priceAgeBlock(a.quote_id);
  return h;
}

/* ---------- were these prices current when the quote was made? (stored provenance, D02-023) ---- */
function priceAgeBlock(qid){
  var lines=LINES[qid]||[], seen={}, oldest=null, fallback=0;
  lines.forEach(function(l){
    /* F-P3-37 — this was the THIRD rendering of the method on one surface, and the only one that
       grouped by the DERIVED family (price_source_type) while the line table and Y5 named the
       resolution method. It now groups by the same authority the other two state. */
    var k=l.pricing_resolution_method||l.price_source_type;
    if(k){ seen[k]=(seen[k]||0)+1;
      if(/last|fallback|known/i.test(String(l.price_source_type)))fallback++; }
    var s=l.price_source_snapshot;
    var d=s&&s.as_of?String(s.as_of):(s&&s.valid_from?String(s.valid_from):null);
    if(d&&(!oldest||d<oldest))oldest=d;
  });
  var kinds=Object.keys(seen);
  if(!kinds.length)return lever('How the prices were found',na('nothing was recorded about where these prices came from'));
  var h=lever('How the prices were found',esc(kinds.map(function(k){return k+' ('+seen[k]+' line(s))';}).join(' · ')));
  /* SEE-26 / D02-023 · staleness measured in DAYS against the window. A configured window in
     quote_approval_config (price_staleness_days) governs if one exists; otherwise the ruled
     default of 90 days applies, and WHICH of the two is in force is said on screen. */
  var wrow=QACFG['price_staleness_days'];
  var windowDays=(wrow&&wrow.num_value!==null&&wrow.num_value!==undefined)?Number(wrow.num_value):90;
  var windowSrc=wrow?'the configured window':'the ruled default (D02-023); no configured window is stored';
  var ageDays=null;
  if(oldest){ var om=Date.parse(oldest); if(!isNaN(om))ageDays=Math.floor(((NOWMS||Date.now())-om)/86400000); }
  if(fallback){
    var stale=(ageDays!==null&&ageDays>windowDays);
    h+='<div class="box warn"><b>&#9888; '+fallback+' line(s) priced from the last price known.</b>'+
      (oldest?(' Oldest '+esc(fmtDate(oldest))+(ageDays!==null?(' &mdash; '+ageDays+' day(s), '+(stale?'outside':'within')+' the '+windowDays+'-day window'):'')+'.'):'')+'</div>';
  }else if(ageDays!==null&&ageDays>windowDays){
    h+='<div class="box warn"><b>&#9888; The oldest price is '+ageDays+' day(s) old</b> &mdash; outside the '+windowDays+'-day window.</div>';
  }
  return h;
}

/* ============================================================================================
   Y8 · WHAT WAS GIVEN AWAY — judged TOGETHER, never one lever at a time (D03-018). The money
   given away is added up from STORED columns with the arithmetic stated; whether a lever
   breached its norm comes only from the stamped verdict (CA-19).
   ============================================================================================ */
function discountGiven(q,lines){
  var sum=null, missing=0, dealD=(q&&q.deal_discount_pct!==null&&q.deal_discount_pct!==undefined)?Number(q.deal_discount_pct):null;
  lines.forEach(function(l){
    var r=(l.rate===null||l.rate===undefined)?null:Number(l.rate);
    var qt=(l.quoted_total_qty===null||l.quoted_total_qty===undefined)?null:Number(l.quoted_total_qty);
    var d=(dealD!==null)?dealD:((l.discount_pct===null||l.discount_pct===undefined)?null:Number(l.discount_pct));
    if(r===null||qt===null||d===null){ missing++; return; }
    sum=(sum||0)+(r*qt*d/100);
  });
  return {sum:sum,missing:missing};
}
function totalCost(lines){
  var sum=null, missing=0;
  lines.forEach(function(l){ if(l.cost===null||l.cost===undefined)missing++; else sum=(sum||0)+Number(l.cost); });
  return {sum:sum,missing:missing};
}
function commissionGiven(q,lines){
  var sum=null; lines.forEach(function(l){ if(l.commission_amount!==null&&l.commission_amount!==undefined)sum=(sum||0)+Number(l.commission_amount); });
  var hdr=(q&&q.total_commission!==null&&q.total_commission!==undefined)?Number(q.total_commission):null;
  return {lines:sum,header:hdr};
}
function customizationTotal(a,lines){
  var sum=null; lines.forEach(function(l){ (((CUSTZ[a.quote_id]||{})[l.id])||[]).forEach(function(z){
    if(z.computed_charge!==null&&z.computed_charge!==undefined)sum=(sum||0)+Number(z.computed_charge); }); });
  return sum;
}
/* SEE-22/23 · the governed CEILING and NORM as NUMBERS, per item type on this quote (M02d
   price_list, highest-priority active row — the same resolution m06 applies). A refused or
   failed read is said; nothing is guessed. */
function typeNorms(lines,key){
  var seen={}, out=[], missing=0;
  lines.forEach(function(l){ var t=l.item_type_code; if(!t||seen[t])return; seen[t]=1;
    var p=PRICEBY[t];
    if(p&&p[key]!==null&&p[key]!==undefined)out.push(esc(Number(p[key]).toFixed(2))+'% <span class="hint">('+esc(t)+')</span>');
    else missing++; });
  if(PRICEERR)return '<span class="na">the price grid could not be read</span>';
  if(!out.length)return '<span class="na">no active price-grid row carries it for these item types</span>';
  return out.join(' &middot; ')+(missing?(' <span class="hint">&middot; '+missing+' type(s) carry none</span>'):'');
}
/* F-P3-36 — the defect, and ONLY the defect. `lever('Discount', pct(dealDiscountPct(q,lines)))`
   put ONE label over TWO bases: dealDiscountPct() returns the DEAL discount when one exists and
   otherwise the HIGHEST LINE discount - the evaluator's own retired COALESCE defect, reproduced in
   the browser - and a second lever below repeated the same deal discount under another name.
   His exit test (field 8.5): "Every discount figure the surface shows is labelled with its own
   basis - line, deal, effective, ceiling". So: each figure is named by its basis, and the one that
   is NOT stored anywhere (the compounded effective, which is what the ceiling is tested against)
   says so instead of being derived here - DDR-291, the browser computes no governed value.
   The SERVER half of this row is already live: fn_m07_evaluate_norms no longer prints the abandoned
   precedence. Nothing is added to this surface that was not already on it. */
function discountBases(a,q,lines){
  var lineMax=null, lineNo=null;
  lines.forEach(function(l){
    if(l.discount_pct===null||l.discount_pct===undefined)return;
    var v=Number(l.discount_pct);
    if(lineMax===null||v>lineMax){ lineMax=v; lineNo=l.line_no; }
  });
  var deal=(q&&q.deal_discount_pct!==null&&q.deal_discount_pct!==undefined)?Number(q.deal_discount_pct):null;
  var h='';
  h+=lever('Discount on the line'+(lineNo!==null&&lineNo!==undefined?(' (highest, line '+esc(lineNo)+')'):''),
           lineMax===null?na('no line records a discount'):pct(lineMax));
  h+=lever('Deal-wide discount',deal===null?na('none is recorded on the quote'):pct(deal));
  h+=lever('Effective discount (the two compounded)',
           '<span class="na">not stored on the quote</span>'+normMark(a,'discount>ceiling'));
  h+=lever('Ceiling',typeNorms(lines,'max_disc_pct'));
  return h;
}
function giveAway(a,q,lines,c){
  var h='';
  var cg=commissionGiven(q,lines);
  h+=discountBases(a,q,lines);
  h+=lever('Rate below list','<span class="hint">per line, in the table above</span>'+normMark(a,'rate<listed'));
  h+=lever('Commission',pct(q?q.deal_commission_pct:null)+normMark(a,'commission>norm'));
  h+='<div class="hint" style="margin:-2px 0 4px">Norm: '+typeNorms(lines,'commission_pct')+'</div>';
  h+=lever('Customisation cover',((function(){var s=customizationTotal(a,lines);return s===null?'<span class="na">none charged</span>':money(s);})())+normMark(a,'customization-uncovered'));
  h+=lever('Section weight',(lines.filter(function(l){return l.sw_needs_approval===true;}).length?('<span class="vtag bad">'+lines.filter(function(l){return l.sw_needs_approval===true;}).length+' line(s) flagged</span>'):'<span class="vtag ok">within tolerance</span>')+normMark(a,'SW-beyond-tol'));
  var vch=validityChanges(a.quote_id).length;
  h+=lever('Validity extended',vch?('<span class="vtag warn">'+vch+' time(s)</span>'):'<span class="vtag ok">not extended</span>');
  h+='<div style="height:9px"></div>';
  if(q){
    /* F-P3-36: the second, differently-worded rendering of the SAME deal discount is gone.
       It now appears exactly once, inside discountBases(), labelled with its basis. */
    h+=lever('Deal-wide commission',pct(q.deal_commission_pct));
  }
  h+=lever('Commission in money',cg.header!==null?money(cg.header):(cg.lines!==null?money(cg.lines):na('no commission is recorded on this quote')),
    cg.header!==null?'as recorded on the quote':(cg.lines!==null?'added up from the lines':''));
  if(cg.header!==null&&cg.lines!==null&&Math.abs(cg.header-cg.lines)>0.005)
    h+='<div class="box warn">Commission on the quote ('+esc(rs(cg.header))+') and added up from its lines ('+esc(rs(cg.lines))+') do not agree. The quote figure governs.</div>';
  h+=lever('Sent for approval because',a.why_routed?('<span style="white-space:normal">'+esc(a.why_routed)+'</span>'):na('no reason was recorded'));
  h+='<details style="margin-top:9px"><summary class="hint" style="cursor:pointer">Deal profile and levers, as recorded when raised</summary>'+
     '<div style="margin-top:6px">'+snapshotFields({deal_profile:a.factor_snapshot,levers:a.levers_snapshot},'nothing was stamped when this was raised')+'</div></details>';
  return h;
}

/* ============================================================================================
   THE SUMMARY, AT THE END (DDR-038) — then the gate, then the decision.
   ============================================================================================ */
function summaryZone(a,q,lines){
  var dg=discountGiven(q,lines), tc=totalCost(lines), cg=commissionGiven(q,lines);
  var cust=customizationTotal(a,lines);
  var comm=(cg.header!==null)?cg.header:cg.lines;
  var away=null, awayParts=[], awayMissing=[];
  if(dg.sum!==null){ away=(away||0)+dg.sum; awayParts.push('discount'); } else awayMissing.push('discount');
  if(comm!==null){ away=(away||0)+comm; awayParts.push('commission'); } else awayMissing.push('commission');
  var h='<div class="zone"><div class="z-hd"><span class="zn">Y8b</span>The summary</div><div class="z-bd">';
  h+='<div class="sumgrid">'+
     '<div class="kv"><span>Items</span><b>'+money(q?q.sub_total:null)+'</b></div>'+
     '<div class="kv"><span>Customisation</span><b>'+(cust===null?na('none is charged'):money(cust))+'</b></div>'+
     '<div class="kv"><span>Total discount given</span><b>'+(dg.sum===null?na('too little is recorded to work this out'):money(dg.sum))+'</b></div>'+
     '<div class="kv"><span>Total commission</span><b>'+(comm===null?na('none is recorded'):money(comm))+'</b></div>'+
     (costOK?('<div class="kv"><span>Total cost</span><b>'+(tc.sum===null?na('no cost is recorded against these lines'):money(tc.sum))+'</b></div>'):'')+
     '<div class="kv big"><span>Grand total</span><b>'+money(q?q.grand_total:null)+'</b></div>'+
     '</div>';
  h+='<div class="box '+(away===null?'mut':(awayMissing.length?'warn':'info'))+'" style="margin-top:11px">'+
     '<b>Given away altogether: '+(away===null?'<span class="na">cannot be worked out</span>':esc(rs(away)))+'</b>'+
     (q&&q.sub_total&&away!==null?(' &mdash; '+esc((away/Number(q.sub_total)*100).toFixed(2))+'% of the item value'):'')+
     '<div style="margin-top:5px">'+(awayParts.length?esc(awayParts.join(' + ')):'nothing measurable')+
     (dg.missing?(' &middot; &#9888; '+dg.missing+' line(s) left out, a rate, quantity or discount is missing'):'')+
     (awayMissing.length?(' &middot; <b>'+esc(awayMissing.join(' and '))+'</b> not included &mdash; this is a floor'):'')+
     '</div></div>';
  if(costOK&&tc.missing)h+='<div class="box warn"><b>Cost is incomplete</b> &mdash; '+tc.missing+' of '+lines.length+' line(s) carry no cost.</div>';
  return h+'</div></div>';
}

/* ============================================================================================
   Y8 · THE GATE — the headline, immediately before the decision. The verdict is the evaluator's,
   twice over: the one STAMPED when this was raised (what actually routed it), and a LIVE re-run
   for how the quote stands right now. The screen judges nothing itself (CA-19).
   ============================================================================================ */
function gateZone(a){
  var stamped=stampedVerdict(a);
  var h='<div class="zone gatezone"><div class="z-hd"><span class="zn">Y8c</span>The verdict &mdash; as the evaluator stamped it</div><div class="z-bd">';
  if(stamped)h+=verdictBlock(stamped,null,'stamped when this was raised');
  else h+='<div class="box warn" style="margin:0"><b>No verdict was stamped on this approval.</b> Read why it was routed from the line above.</div>';
  if(marginOK){
    var smv=marginVsFloor(a.net_margin);
    h+='<div style="margin-top:11px">'+lever('Net margin on this deal (as stamped on the approval)',smv?smv.html:money(a.net_margin))+'</div>';
    if(a.net_margin===null||a.net_margin===undefined)
      h+='<div class="box info">No cost is recorded against quote lines, so no net margin can be worked out. It reads <b>not available</b>, never zero.</div>';
    h+=negativeMarginWarn(a.net_margin);
    /* SEE-21 · the governed floor itself, as a number — read live from quote_approval_config
       (migration 141, Owner Q23/Q24), never asserted from memory */
    var fl=marginFloor();
    if(fl!==null)h+='<div class="box mut"><b>Minimum net margin: '+esc(fl.toFixed(2))+'%</b> ('+esc((QACFG['net_margin_floor_pct']||{}).label||'net margin floor')+').</div>';
    else if(QACFGERR)h+='<div class="box bad">The approval configuration could not be read.</div>';
    else h+='<div class="box mut">No minimum margin is set, so there is no floor to measure against.</div>';
  }else if(costOK){
    h+='<div class="box mut" style="margin-top:11px">Net margin is shown to Directors and Admin only.</div>';
  }else{
    h+='<div class="box mut" style="margin-top:11px">Cost and margin are not shown to your role.</div>';
  }
  h+='<div class="z-hd" style="border-top:1px solid var(--line);border-bottom:none;padding-left:0;margin-top:11px">The same check, run again now</div>'+
     '<div id="normsLiveSlot">'+((NORMS[a.quote_id]&&NORMS[a.quote_id].state==='done')
        ?(sameVerdict(stampedVerdict(a),NORMS[a.quote_id].out)
            ?''
            :verdictBlock(NORMS[a.quote_id].out,NORMS[a.quote_id],'as it stands right now'))
        :verdictBlock(null,NORMS[a.quote_id]||{state:'loading'},'as it stands right now'))+'</div>'+
     '<div class="hint" style="margin-top:6px"><button class="link-btn" type="button" onclick="evaluateNorms(\''+esc(a.quote_id)+'\')">Run the check again</button></div>';
  return h+'</div></div>';
}
</script>
<script>
/* ============================================================================================
   Y9 · DECISION BAR — the four governed writes (Approve · Reject · Escalate · Void, DDR-263
   R2.1: Void is M07's 27th control). Every one is a Pattern-A RPC call; there is no direct
   table write anywhere in this file (SWEEP C3 census = 0).

   ★ WHO IS OFFERED THE DECISION (REF-13, mirrored from the CONFIRMED 145a gating):
     · the person it was routed to (or escalated to), holding approval.decide — the
       NON-delegated path, exactly the RPCs' own actor gate; or
     · a person standing in for them under a live delegation window — the DELEGATED path.
       The register CONFERS the delegate's standing (Owner Q28/145a): the delegate is NOT
       required to hold approval.decide personally, and this screen does not demand it of
       them. The HOLDER's capability and authority are the server's checks, surfaced verbatim
       if they fail. A capability check on the delegate before the register would make
       delegation inexpressible — that defect is not repeated here.
   ============================================================================================ */
function decideBlock(a){
  /* F-P3-53 · RR-065, his ruling 2026-08-13: "union of both sets, ordered state first: 'already
     settled' outranks every authority reason, then authority, then staleness". STATE is asked
     FIRST because telling somebody they are not the routed approver, about a document that was
     decided last week, is a FALSE reason — which is the defect this row exists for. */
  if(!actorEmp)return 'your sign-in is not linked to an employee record, so nothing can be recorded against you';
  /* 1 · STATE */
  if(!isOpen(a))return 'this has already been settled — it is '+a.status+', and only one that is still open can be decided';
  /* 2 · AUTHORITY */
  if(isOwnSubmission(a))return 'you raised this yourself, and nobody may decide their own request';
  var direct=(a.approver_emp===actorEmp)||(a.status===ST.escalated&&a.escalated_to===actorEmp);
  var dg=delegationFor(a);
  if(!direct&&!dg)return 'this was routed to '+(empName(holderOf(a))||'somebody else')+', not to you, and no active delegation names you as their stand-in';
  if(direct&&!CAN[CAP.decide])return 'you have not been given the right to decide approvals'+(CANERR[CAP.decide]?(' — the check itself failed: '+CANERR[CAP.decide]):'');
  /* 3 · STALENESS — last, per the ruling */
  var q=qOf(a); var st=revStale(a,q);
  if(st)return 'the quote has changed since this was raised, so deciding it would approve something nobody read';
  return null;
}
/* Approve alone is additionally bounded by the HOLDER's granted limits (REF-14/SOD-03). Reject
   and Escalate stay open, because escalating is exactly the way out of being over the limit. */
/* WS-8.4 · DDR-292 R26 — ONLY a FAIL blocks. An abstention neither passes nor blocks, so Approve
   stays open on it and the abstention is stated on the record instead of being read as a pass. */
function approveBlock(a){
  var why=decideBlock(a); if(why)return why;
  var he=EMPS[holderOf(a)];
  var row=he?authorityFor(he.employee_code,a.module_code):null;
  if(!row)return (he?(he.full_name+' holds'):'the person this is with holds')+
    ' no approval authority on record, so there is nothing to check this against';
  var g=gate3(a);
  if(g.status==='FAIL')return g.why+' — send it up a level instead';
  return null;
}
/* J6: only a Pending approval can be escalated, and DIRECTORS is the top — at the top tier the
   screen offers NO further Escalate control (an attempt would refuse M07_NO_HIGHER_TIER). */
function escalateOffered(a){ return a.status===ST.pending && String(a.tier||'').toUpperCase()!=='DIRECTORS'; }

  h+='<div style="flex:1"></div>';

  h+='<button class="btn btn-p" type="button" id="cApprove" onclick="doApprove()"'+aDis+'>&#10003; Approve</button>';
  h+='<span class="abar-gap"></span>';

  else{
