<style>

*{box-sizing:border-box;margin:0;padding:0}

table.cov{width:100%;border-collapse:separate;border-spacing:0;background:var(--surface);border:1px solid var(--line);border-radius:10px;overflow:hidden;font-size:var(--fs-body)}

.addrow{display:flex;gap:9px;align-items:flex-end;flex-wrap:wrap;margin-top:8px}
.addrow .fld{margin:0}
.ov{position:fixed;inset:0;background:rgba(15,30,45,.55);display:none;align-items:center;justify-content:center;z-index:var(--z-modal);padding:24px;backdrop-filter:blur(2px)}.ov.show{display:flex}

.ov-hd{padding:15px 20px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:11px}.ov-hd .badge{font-size:var(--fs-caption);font-weight:800;color:var(--surface);background:var(--teal);padding:3px 9px;border-radius:5px}.ov-hd h3{font-size:var(--fs-emphasis);font-weight:800;color:var(--navy);flex:1}.ov-x{cursor:pointer;color:var(--muted);font-size:22px}.ov-x:hover{color:var(--ink)}
.ov-body{padding:18px 22px;overflow-y:auto}
.trace-step{display:flex;gap:11px;padding:10px 0;border-bottom:1px solid var(--line)}.trace-step:last-child{border-bottom:none}
.ts-num{width:22px;height:22px;border-radius:50%;background:var(--bg);color:var(--muted);font-size:var(--fs-caption);font-weight:800;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.ts-win .ts-num{background:var(--teal);color:var(--surface)}.ts-body{flex:1}.ts-t{font-size:var(--fs-body);font-weight:700;color:var(--ink)}.ts-d{font-size:var(--fs-caption);color:var(--muted);margin-top:2px}
.ts-win .ts-t{color:var(--teal)}.ts-skip{opacity:.5}
.fld{margin-bottom:13px}.fld label{display:block;font-size:var(--fs-caption);font-weight:700;color:var(--ink2);margin-bottom:6px;text-transform:uppercase;letter-spacing:.3px}
.fld select,.fld input{width:100%;border:1.5px solid var(--line2);border-radius:8px;padding:9px 11px;font-size:var(--fs-body);outline:none;font-family:inherit}.fld select:focus,.fld input:focus{border-color:var(--teal)}
.fld select:focus-visible,.fld input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.fldgrid{display:grid;grid-template-columns:1fr 1fr;gap:11px}
.ov-ft{padding:13px 22px;border-top:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;gap:10px}.ov-ft .note{font-size:var(--fs-caption);color:var(--muted);max-width:320px;line-height:1.5}
.hint{font-size:var(--fs-caption);color:var(--muted);line-height:1.55}.hint b{color:var(--ink2)}
.legend{display:flex;gap:14px;padding:7px 18px;background:var(--surface);border-bottom:1px solid var(--line);font-size:var(--fs-caption);color:var(--muted);flex-wrap:wrap}
.legend span{display:inline-flex;align-items:center;gap:5px}.lg-sw{width:11px;height:11px;border-radius:3px}

.state-load{padding:22px}.state-load .sk{height:13px;border-radius:6px;background:linear-gradient(90deg,var(--bg),var(--line),var(--bg));background-size:200% 100%;animation:skmv 1.1s infinite;margin:9px 0}.state-load .sk:nth-child(2){width:78%}.state-load .sk:nth-child(3){width:58%}@keyframes skmv{0%{background-position:200% 0}100%{background-position:-200% 0}}.state-msg{color:var(--muted);font-size:var(--fs-body);margin-top:10px}
.state-err{padding:38px 20px;text-align:center;color:var(--warn)}.state-err .state-ic{font-size:24px;margin-bottom:8px}.state-retry{margin-left:8px;border:1px solid var(--line2);background:var(--surface);border-radius:7px;padding:4px 12px;font-size:var(--fs-body);font-weight:600;cursor:pointer;color:var(--ink)}
.state-empty{padding:34px 20px;text-align:center;color:var(--muted)}.state-empty .state-ic{font-size:26px;margin-bottom:8px;opacity:.7}
</style>

<body>
<div class="shell">
  <div class="main">
    <div class="mod-hdr rkf-halfbar"><span class="mod-badge">M02d</span><span class="mod-title">Price List</span>
      <span class="mod-crumb">Product &rsaquo; Price List</span>

      <span id="alog-access-point" style="margin-left:auto"></span>
      <span class="mod-role" id="rolepill">Pricing (live)</span></div>
    <div class="tabs">
      <div class="tab act" id="tab-grid" onclick="showTab('grid')">Price Grid</div>
      <div class="tab" id="tab-cov" onclick="showTab('cov')">Coverage</div>
      <div class="tab" id="tab-cust" onclick="showTab('cust')">Customer Pricing</div>

    </div>
    <div class="subbar">
      <div class="ctrl"><label>Product Type</label><select class="in" id="typeSel" onchange="setType(this.value)"></select></div>
      <div class="si"><span class="mag">&#128269;</span><input class="in" id="search" placeholder="Search prices" oninput="renderGrid()"/></div>
      <div style="flex:1"></div>
      <div class="revbox" id="revbox"><span style="font-size:var(--fs-caption);font-weight:700;color:var(--warn)">Revise ticked scope</span><input class="in" id="revPct" style="width:64px" placeholder="+/- %"/><span class="dpf" style="position:relative;display:inline-flex;align-items:center;width:132px"><input class="in" id="revDate" maxlength="10" placeholder="DD-MM-YYYY" oninput="dmyMask(this);reviseScopeNote()" autocomplete="off" style="width:100%" title="new effective from (blank=today)"/><button type="button" onclick="dpOpen(event,'revDate')" title="Pick date" style="position:absolute;right:4px;border:none;background:none;cursor:pointer;font-size:var(--fs-emphasis)">&#128197;</button><div id="revDate-cal" class="dp-cal" style="display:none"></div></span><label for="revReason" style="font-size:var(--fs-caption);font-weight:700;color:var(--warn)">Reason <span class="rkf-req">*</span></label><input class="in" id="revReason" style="width:130px" placeholder="why this revision"/><span id="revScope" style="font-size:var(--fs-caption);color:var(--warn);max-width:230px"></span><button class="btn btn-sm btn-g" onclick="applyRevise()">Apply</button></div>
      <button class="btn btn-g btn-sm" id="revBtn" onclick="toggleRev()">Bulk revise &plusmn;%</button>
      <button class="btn btn-g btn-sm" onclick="openImport()">&#8681; Import prices</button>
      <button class="btn btn-g btn-sm" onclick="exportDetails()">&#8682; Details</button> <button class="btn btn-g btn-sm" onclick="exportSummary()">&#8682; Summary</button>
      <button class="btn btn-p btn-sm" id="addBtn" onclick="openAdd()">+ Price row</button>
      <span class="actor-note" id="actorNote">actor: &mdash;</span>
    </div>
    <div class="tickbar" id="tickbar"></div>
    <div class="legend" id="legend"></div>
    <div class="pane act" id="pane-grid"><div class="gridwrap" id="gridwrap"></div></div>
    <div class="pane" id="pane-cov"><div class="covwrap" id="covwrap"></div></div>
    <div class="pane" id="pane-cust"><div class="custwrap" id="custwrap"></div></div>
  </div>
</div>

<div class="ov" id="whyov"><div class="ov-card">
  <div class="ov-hd"><span class="badge">TRACE</span><h3 id="why-title">Why this price</h3><span class="ov-x" onclick="closeOv('whyov')">&times;</span></div>
  <div class="ov-body" id="why-body"></div>
</div></div>

<div class="ov" id="impov" data-rkf-dialog><div class="ov-card" style="width:720px">
  <div class="ov-hd"><span class="badge">IMPORT</span><h3>Import Price Rows</h3><span class="ov-x" onclick="closeOv('impov')">&times;</span></div>
  <div class="ov-body">
    <div style="display:flex;gap:9px;margin-bottom:12px;flex-wrap:wrap">
      <button class="btn btn-g btn-sm" onclick="dlPriceTemplate()">&#8682; Download template (CSV)</button>
      <button class="btn btn-g btn-sm" onclick="loadPriceSample()">Load sample row</button></div>
    <div class="fld"><textarea id="imp-text" style="width:100%;min-height:120px;font-family:Consolas,monospace;font-size:var(--fs-body);border:1.5px solid var(--line2);border-radius:8px;padding:9px 11px;outline:none" placeholder="type_code,basis,base_price,..."></textarea></div>

<script>

var SB = (window.supabase && window.RKF && RKF.client) ? RKF.client('https://ntymdsbezetobrnjqqvl.supabase.co','sb_publishable_nev1rE7tHlu-bOWOm1JpXw_jd40773y')
        : (window.supabase ? window.supabase.createClient('https://ntymdsbezetobrnjqqvl.supabase.co','sb_publishable_nev1rE7tHlu-bOWOm1JpXw_jd40773y') : null);

(function(){ if(new URLSearchParams(location.search).get('embed')!=='1')return; var st=document.createElement('style'); st.textContent='.topbar{display:none!important}.rail{display:none!important}.mod-role{display:none!important}'; document.head.appendChild(st); })();

var DIMNAME={}, DIMVALS={}, VBYID={}, TYPES={}, TYPENAME={}, UOMLBL={}, CT=[], PRICES=[], SPECIAL=[], ITEMS=[], CUSTOMERS=[];
var actorEmp=null, actorName=null; 
var REQ=(window.RKF&&RKF.req)||' <span class="rkf-req">*</span>';   
var curType="", ticks={}, curTab="grid", curBasis="";

function todayIST(){ var p=(window.RKF&&RKF.fmtIST)?RKF.fmtIST(new Date()).split('-'):null;
  return p?(p[2]+'-'+p[1]+'-'+p[0]):new Date().toISOString().slice(0,10); }

function vlabel(listId,code){ var a=DIMVALS[listId]||[]; for(var i=0;i<a.length;i++){ if(a[i].code===code) return a[i].label; } return code; }

function DV(listId){ var r=DIMVALS[listId]||[]; return (window.RKF&&RKF.sortedValues)?RKF.sortedValues(r):r; }
function canWrite(){ return ACCESS_LVL==='Full' && !!actorEmp; }   
var revOpen=false;
function reviseScope(){ 
  var td=tickedDims(); var ed=readDMY("revDate")||todayIST();
  return PRICES.filter(function(p){ if(p.type!==curType||p.basis!==curBasis) return false; if(p.vf&&p.vf>ed) return false; if(p.vt&&p.vt<ed) return false; return Object.keys(p.dims).every(function(d){ return td.indexOf(d)>=0; }); }); }
function reviseScopeNote(){ var el=document.getElementById("revScope"); if(!el) return; var n=reviseScope().length; var td=tickedDims(); var ed=readDMY("revDate")||todayIST(); el.textContent="scope: "+n+" current row(s) of "+curType+" /"+(curBasis||"?")+(td.length?"":" (undimensioned rows only)")+" on "+ed.split('-').reverse().join('-'); }
function toggleRev(){ if(needActor())return; revOpen=!revOpen; document.getElementById("revbox").classList.toggle("show",revOpen); if(revOpen) reviseScopeNote(); }
function $id(x){ return document.getElementById(x); }
async function applyRevise(){
  if(needActor())return;
  var pct=parseFloat(document.getElementById("revPct").value);
  var date=readDMY("revDate")||null;
  var reason=(document.getElementById("revReason").value||"").trim();
  if(isNaN(pct)){ toast("Enter a +/- %.","err"); return; }
  if(date&&date<todayIST()){ toast("Effective date must be today or later.","err"); return; } 
  if(!reason){ toast("A reason is required.","err"); return; }
  var ids=reviseScope().map(function(p){return p.id;}); 
  if(!ids.length){ toast("No rows to revise.","err"); return; }
  await guarded(document.querySelector('#revbox .btn'), async function(){          
    try{ var n=await rpc('price_revise',{p_row_ids:ids,p_pct:pct,p_new_valid_from:date,p_reason:reason,p_by_emp:actorEmp});
         revOpen=false; document.getElementById("revbox").classList.remove("show");
         document.getElementById("revPct").value=""; document.getElementById("revDate").value=""; document.getElementById("revReason").value="";
         await afterWrite(n+" row(s) revised "+(pct>0?"+":"")+pct+"%."); }
    catch(e){ toast(svrMsg(e,"The price revision could not be saved."),"err"); }
  });
}

/* LOAD */
async function loadAll(){
  if(!SB) throw new Error("Supabase client unavailable");
  var dl = (await SB.from('dimension_lists').select('list_id,name')).data||[];
  DIMNAME={}; dl.forEach(function(r){ DIMNAME[r.list_id]=r.name; });
  var dv = (await SB.from('dimension_values').select('value_id,list_id,code,label,numeric_value,sort_order').eq('active',true).order('sort_order')).data||[];
  DIMVALS={}; VBYID={}; TYPENAME={}; dv.forEach(function(r){ (DIMVALS[r.list_id]=DIMVALS[r.list_id]||[]).push({value_id:r.value_id,code:r.code,label:r.label,numeric_value:r.numeric_value}); VBYID[r.value_id]={list_id:r.list_id,code:r.code,label:r.label}; if(r.list_id==='PTYPE') TYPENAME[r.code]=r.label; });
  var pc  = (await SB.from('product_config').select('type_code,ptno').eq('active',true).order('type_code')).data||[];
  var pcs = (await SB.from('product_config_specs').select('type_code,spec_id,required')).data||[];
  var plu = (await SB.from('product_config_pluoms').select('type_code,uom')).data||[];
  TYPES={}; pc.forEach(function(r){ TYPES[r.type_code]={code:r.type_code,ptno:r.ptno,dims:[],pluoms:[]}; });
  pcs.forEach(function(r){ if(TYPES[r.type_code]) TYPES[r.type_code].dims.push(r.spec_id); });
  plu.forEach(function(r){ if(TYPES[r.type_code]) TYPES[r.type_code].pluoms.push(r.uom); });
  var um = (await SB.from('uom').select('uom_code,label')).data||[];
  UOMLBL={}; um.forEach(function(r){ UOMLBL[r.uom_code]=r.label; });
  var rv  = (await SB.from('reference_values').select('code,list_id,label,sort_order,active').order('sort_order')).data||[];
  var ctp = (await SB.from('customer_type_pricing').select('customer_type,factor,default_disc_pct,default_comm_pct,active').eq('active',true)).data||[];
  var ctpById={}; ctp.forEach(function(r){ ctpById[(r.customer_type||'').trim()]=r; });
  CT=[]; rv.filter(function(r){ return (r.code||'').trim().slice(0,2)==='CT' && r.active; }).forEach(function(r){
    var code=(r.code||'').trim(); var p=ctpById[code];
    CT.push({c:code,l:r.label,f:p?Number(p.factor):null,disc:p?Number(p.default_disc_pct):null,comm:p?Number(p.default_comm_pct):null,priced:!!p});
  });

  var pl  = (await SB.from('price_list').select('id,type_code,basis,base_price,max_disc_pct,commission_pct,valid_from,valid_to,priority,active').eq('active',true).eq('is_deleted',false)).data||[];
  var pld = (await SB.from('price_list_dims').select('price_list_id,spec_id,value_id')).data||[];
  var po  = (await SB.from('price_override').select('price_list_id,customer_type,price')).data||[];
  var dimsByPl={}, ovrByPl={};
  pld.forEach(function(r){ (dimsByPl[r.price_list_id]=dimsByPl[r.price_list_id]||{})[r.spec_id]=r.value_id; });
  po.forEach(function(r){ (ovrByPl[r.price_list_id]=ovrByPl[r.price_list_id]||{})[(r.customer_type||'').trim()]=Number(r.price); });
  PRICES = pl.map(function(r){
    var dims={}; var dm=dimsByPl[r.id]||{}; Object.keys(dm).forEach(function(sp){ var v=VBYID[dm[sp]]; if(v) dims[sp]=v.code; });
    return {id:r.id,type:r.type_code,basis:r.basis,base:Number(r.base_price),
            disc:Number(r.max_disc_pct),comm:Number(r.commission_pct),vf:r.valid_from,vt:r.valid_to,prio:r.priority,dims:dims,ovr:ovrByPl[r.id]||{}};
  });
  CUSTOMERS = ((await SB.from('customers').select('id,name,customer_code,partner_side').eq('is_deleted',false)).data||[])
    .filter(function(c){return c.partner_side!=='Creditor';});
  var custById={}; CUSTOMERS.forEach(function(r){ custById[r.id]=r.name||r.customer_code; });
  var csp = (await SB.from('customer_special_price').select('id,customer_id,item_id,basis,price,valid_from,valid_to,active').eq('active',true)).data||[];
  SPECIAL = csp.filter(function(r){ var t=todayIST(); return (r.valid_to==null || r.valid_to>=t) && (!r.valid_from || r.valid_from<=t); }) .map(function(r){ return {id:r.id,cust:custById[r.customer_id]||('cust '+String(r.customer_id).slice(0,8)),item:r.item_id,basis:r.basis,price:Number(r.price),vf:r.valid_from}; });   
  var it  = (await SB.from('items').select('item_id,type_code,description,lifecycle_status').eq('is_deleted',false)).data||[];
  var isp = (await SB.from('item_specs').select('item_id,spec_id,value_id')).data||[];
  var spByItem={}; isp.forEach(function(r){ var v=VBYID[r.value_id]; if(v) (spByItem[r.item_id]=spByItem[r.item_id]||{})[r.spec_id]=v.code; });
  ITEMS = it.map(function(r){ return {code:r.item_id,type:r.type_code,status:r.lifecycle_status,desc:r.description,specs:spByItem[r.item_id]||{}}; });   

  actorEmp = null; actorName = null;
  var _a = await RKF.actor(SB);
  if(_a){ actorEmp = _a.id; actorName = _a.name; }
}

/* write helpers */
async function rpc(fn,args){ var res=await SB.rpc(fn,args); if(res.error) throw res.error; return res.data; }
async function afterWrite(msg){ await loadAll(); render(); toast(msg,"ok"); }
function needActor(){ if(!canWrite()){ toast("Your login is not mapped to an employee. Saving is disabled.","err"); return true; } return false; }

function svrMsg(e,fallback){ return RKF.errText(e,{fallback:fallback||''}); }

function guarded(btn, fn){ return RKF.saveGuard(btn, 'Saving...', fn); }

/* resolution */
function matchRow(item){ var c=PRICES.filter(function(p){ if(!isCurrent(p)) return false;  if(p.type!==item.type) return false; return Object.keys(p.dims).every(function(sp){ return item.specs[sp]===p.dims[sp]; }); }); if(!c.length) return null; c.sort(function(a,b){ var d=Object.keys(b.dims).length-Object.keys(a.dims).length; return d!==0?d:((a.prio||100)-(b.prio||100)); }); return c[0]; }
function ctype(cc){ for(var i=0;i<CT.length;i++){ if(CT[i].c===cc) return CT[i]; } return CT[0]||{c:cc,l:cc,f:1}; }
function specialsFor(item){ return SPECIAL.filter(function(s){ return s.item===item.code; }); } 
function r2(x){ return Math.round(x*100)/100; } 
function isCurrent(p){ var t=todayIST(); return (!p.vf||p.vf<=t) && (!p.vt||p.vt>t); } 

/* ---------- render ---------- */

var ALOG_ACCESS=null;

function syncActivityAccessPoint(){
  var ap=document.getElementById('alog-access-point'); if(!ap) return;
  if(ALOG_ACCESS!=='Read' && ALOG_ACCESS!=='Full'){ ap.innerHTML=''; return; }   
  ap.innerHTML='<button class="btn btn-g btn-sm rkf-kbd-activatable" id="history-btn"'
             + ' title="Change history" onclick="openHistory()"'
             + (curType?'':' disabled')+'>&#128340; History</button>';
}
function openHistory(){
  if(!curType) return;
  RKF.history.open({client:SB, module_code:'M02d', record_entity:'price', record_key:curType,
                    title:curType, focus:'history-btn'});
}
function closeHistory(){ RKF.history.close(); }
function gateHistoryTab(){
  try{ RKF.moduleAccess('M02d',{client:SB}).then(function(lvl){ ALOG_ACCESS=lvl; syncActivityAccessPoint(); }); }
  catch(e){ ALOG_ACCESS=null; syncActivityAccessPoint(); }
}
function render(){ renderTypeSel(); renderActor(); if(typeof syncActivityAccessPoint==='function') syncActivityAccessPoint(); renderTickbar(); renderLegend(); if(curTab==="grid") renderGrid(); else if(curTab==="cov") renderCoverage(); else renderCust(); }
function renderActor(){ var n=document.getElementById("actorNote"); if(n) n.textContent = actorEmp? ("actor: "+String(actorEmp).slice(0,8)) : "actor: none (read-only)"; document.getElementById("addBtn").disabled=!canWrite(); }
function renderTypeSel(){ 
  var s=document.getElementById("typeSel"); var ks=Object.keys(TYPES); s.innerHTML=ks.map(function(t){ var nm=TYPENAME[t]; return '<option value="'+t+'"'+(t===curType?' selected':'')+'>'+t+(nm?(' - '+nm):'')+(TYPES[t].ptno?(' ('+TYPES[t].ptno+')'):'')+'</option>'; }).join(''); }
function setType(t){ curType=t; ticks={}; (TYPES[t].dims||[]).forEach(function(d,i){ ticks[d]=i<3; }); curBasis=(TYPES[t].pluoms||[])[0]||""; render(); }
function setBasis(u){ curBasis=u; render(); }
function toggleTick(d){ ticks[d]=!ticks[d]; renderGrid(); if(revOpen) reviseScopeNote(); }
function showTab(t){ curTab=t; ["grid","cov","cust"].forEach(function(x){
   var tb=document.getElementById("tab-"+x), pn=document.getElementById("pane-"+x);
   if(tb) tb.classList.toggle("act",x===t); if(pn) pn.classList.toggle("act",x===t); });
 render(); }

function renderTickbar(){
  var t=TYPES[curType]; if(!t){ document.getElementById("tickbar").innerHTML=""; return; }
  var h='<span class="tlbl">Group by</span>';
  if(t.dims.length){ t.dims.forEach(function(d){ h+='<span class="dimtok'+(ticks[d]?' on':'')+'" onclick="toggleTick(\''+d+'\')">'+(DIMNAME[d]||d)+'</span>'; }); }
  else { h+='<span class="axis-note">Traded type &mdash; one price row</span>'; }
  h+='<span class="axis-sep"></span><span class="tlbl" style="color:var(--purple)">Price-list UOM</span>';
  (t.pluoms||[]).forEach(function(u){ h+='<span class="uomtok'+(u===curBasis?' on':'')+'" onclick="setBasis(\''+u+'\')" title="'+(UOMLBL[u]||u)+'">'+u+'</span>'; });
  document.getElementById("tickbar").innerHTML=h;
}
function renderLegend(){
  if(curTab!=="grid"){ document.getElementById("legend").innerHTML=""; return; }
  document.getElementById("legend").innerHTML='<span><span class="lg-sw" style="background:var(--tealbg)"></span>Group dims</span><span><span class="lg-sw" style="background:var(--bluebg)"></span>Base price</span><span><span class="lg-sw" style="background:var(--greenbg)"></span>Per customer type: Price &middot; D% &middot; C%</span>';
}
function tickedDims(){ return (TYPES[curType].dims||[]).filter(function(d){return ticks[d];}); }
function rowsForType(){ 
  var t=todayIST(); var q=(document.getElementById("search").value||"").toLowerCase(); return PRICES.filter(function(p){ return p.type===curType && p.basis===curBasis && (p.vt==null || p.vt>t); }).filter(function(p){ if(!q) return true; 
   var s=Object.keys(p.dims).map(function(d){return vlabel(d,p.dims[d])+" "+p.dims[d];}).join(" ")
        +" "+p.base+" "+(p.prio||100)+" "+(p.vf||"")+" "+(p.vt||"open")
        +" "+CT.map(function(c){ var ov=p.ovr&&p.ovr[c.c]!=null; return c.c+" "+(ov?p.ovr[c.c]:(c.f!=null?r2(p.base*c.f):"")); }).join(" ");
   return s.toLowerCase().indexOf(q)>=0; }); }

function renderGrid(){
  renderLegend();
  var t=TYPES[curType]; if(!t){ document.getElementById("gridwrap").innerHTML=emptyState("Pick a product type."); return; }
  var dims=tickedDims(); var rows=rowsForType(); var w=canWrite();
  var h='<table class="grid"><thead><tr>';
  if(dims.length){ dims.forEach(function(d,i){ h+='<th class="blk-dim'+(i===0?'':' sep-l')+'">'+(DIMNAME[d]||d)+'</th>'; }); } else h+='<th class="blk-dim">Scope</th>';
  h+='<th class="blk-base sep-l">Base /'+(curBasis||'?')+'</th>';
  CT.forEach(function(c,i){ h+='<th class="blk-cust'+(i===0?' sep-l':'')+'">'+esc(c.l)+' price</th><th class="blk-cust">'+esc(c.l)+' D%</th><th class="blk-cust">'+esc(c.l)+' C%</th>'; });
  h+='<th class="sep-l">Priority</th><th>Valid from</th><th>Valid to</th><th></th></tr></thead><tbody>';
  rows.forEach(function(p){
    h+='<tr>';
    if(dims.length){ dims.forEach(function(d,i){ var v=p.dims[d]; h+='<td class="dimcell'+(i===0?'':' sep-l')+'">'+(v?vlabel(d,v):'<span style="color:var(--muted)">any</span>')+'</td>'; }); }
    else h+='<td class="dimcell">all '+curType+'</td>';
    h+='<td class="num sep-l roval">'+p.base+'</td>';
    CT.forEach(function(c,i){
      var pov=p.ovr&&p.ovr[c.c]!=null; var cp=pov?p.ovr[c.c]:(c.f!=null?r2(p.base*c.f):null); 
      var cell = w ? '<input class="cellin'+(pov?' ovr':'')+'" value="'+(cp==null?'':cp)+'" title="set override for '+esc(c.l)+'" onchange="setOverride(\''+p.id+'\',\''+c.c+'\',this.value)">' : (cp==null?'&mdash;':cp)+(pov?' *':'');
      h+='<td class="num'+(i===0?' sep-l':'')+'">'+cell+'</td>';
      h+='<td class="num roval">'+(c.disc==null?'&mdash;':c.disc)+'</td>';
      h+='<td class="num roval">'+(c.comm==null?'&mdash;':c.comm)+'</td>';
    });
    h+='<td class="num sep-l roval">'+(p.prio||100)+'</td><td style="font-size:var(--fs-caption);color:var(--muted)">'+fmtDate(p.vf)+'</td><td style="font-size:var(--fs-caption)">'+(p.vt?('<span style="color:var(--muted)">'+fmtDate(p.vt)+'</span>'):'<span style="color:var(--green);font-weight:700">open</span>')+'</td><td><span class="why-btn" onclick="whyRow(\''+p.id+'\')">why</span>'+
      (w?' <span class="why-btn" style="color:var(--accent)" title="Retire this price row" onclick="askRetire(\''+p.id+'\')">retire</span>':'')+'</td></tr>';
  });
  if(!rows.length) h+='<tr><td colspan="30" style="text-align:center;color:var(--muted);padding:24px">No active price rows for '+curType+' in '+(curBasis||'?')+'.</td></tr>';
  document.getElementById("gridwrap").innerHTML=h+'</tbody></table>';
}
async function setOverride(id,cc,val){
  if(needActor()) { renderGrid(); return; }
  var price=parseFloat(val); if(isNaN(price)||price<=0){ toast("Enter a price > 0.","err"); renderGrid(); return; }
  await guarded(document.activeElement, async function(){                          
    try{ await rpc('price_override_set',{p_price_list_id:id,p_customer_type:cc,p_price:price,p_by_emp:actorEmp}); await afterWrite("Override set for "+cc+" = "+price); }
    catch(e){ toast(svrMsg(e,"The override could not be saved."),"err"); renderGrid(); }
  });
}

function renderCoverage(){

  if(!curType){ RKF.triState(document.getElementById("covwrap"),'empty','Pick a product type.'); return; }
  var items=ITEMS.filter(function(i){return i.type===curType && (i.status==="Active"||i.status==="Pending");});
  var priced=0,gap=0,rows="";
  items.forEach(function(it){ var r=matchRow(it); var ok=!!r; if(ok)priced++; else gap++;
    rows+='<tr><td style="font-family:Consolas,monospace;font-weight:600;color:var(--blue)">'+it.code+'</td><td><span class="pill '+it.status+'">'+it.status+'</span></td><td>'+(ok?'<span class="cov-yes">'+r.base+' /'+r.basis+'</span>':'<span class="cov-no">no price</span>')+'</td><td>'+(ok?ruleDesc(r):'&mdash;')+'</td><td>'+(ok?'<span class="why-btn" onclick="whyItem(\''+it.code+'\')">why</span>':'')+'</td></tr>'; });
  var allAP=ITEMS.filter(function(i){return (i.status==="Active"||i.status==="Pending");});
  var totGap=allAP.filter(function(i){return !matchRow(i);}).length;
  document.getElementById("covwrap").innerHTML=
   '<div class="cov-sum"><div class="cov-kpi"><div class="n">'+items.length+'</div><div class="l">'+curType+' active/pending</div></div><div class="cov-kpi ok"><div class="n">'+priced+'</div><div class="l">Priced</div></div><div class="cov-kpi gap"><div class="n">'+gap+'</div><div class="l">No price ('+curType+')</div></div><div class="cov-kpi gap"><div class="n">'+totGap+'</div><div class="l">No price (all types)</div></div></div>'+
   '<table class="cov"><thead><tr><th>Item</th><th>Status</th><th>Resolved base</th><th>Winning rule</th><th></th></tr></thead><tbody>'+(rows||'<tr><td colspan="5" style="text-align:center;color:var(--muted);padding:20px">No active items for '+curType+'.</td></tr>')+'</tbody></table>';
}
function ruleDesc(r){ var k=Object.keys(r.dims); return k.length? k.map(function(d){return (DIMNAME[d]||d)+"="+vlabel(d,r.dims[d]);}).join(", ") : "all "+r.type+" (any)"; }

function renderCust(){

    RKF.triState(document.getElementById("custwrap"),'empty','No customer types or customers on record yet.'); return; }
  var w=canWrite();

  if(CT.length){ CT.forEach(function(c){
    if(w){ h+='<tr><td>'+esc(c.l)+'</td><td style="font-family:Consolas,monospace">'+esc(c.c)+'</td>'+
      '<td style="text-align:right"><input class="fctin" id="f-fac-'+c.c+'" value="'+(c.f==null?'':c.f)+'" placeholder="1.00"></td>'+

      '<td><button class="btn btn-g btn-sm" onclick="saveFactor(\''+c.c+'\')">Save</button></td></tr>';
    } else {
      h+='<tr><td>'+esc(c.l)+'</td><td style="font-family:Consolas,monospace">'+esc(c.c)+'</td><td class="roval" style="text-align:right">'+(c.f==null?'<span style="color:var(--muted)">unpriced</span>':c.f.toFixed(2))+'</td><td class="roval" style="text-align:right">'+(c.disc==null?'&mdash;':c.disc)+'</td><td class="roval" style="text-align:right">'+(c.comm==null?'&mdash;':c.comm)+'</td></tr>';
    }
  }); } else h+='<tr><td colspan="6">'+emptyState("No customer types configured.")+'</td></tr>';
  h+='</tbody></table></div>';

  h+='<div class="cust-card"><h4>Customer special prices</h4><div class="sub">Per-(customer,item) explicit price = top of precedence (special_set, effective-dated).</div><table class="fct"><thead><tr><th>Customer</th><th>Item</th><th>Basis</th><th style="text-align:right">Special price</th><th>From</th>'+(w?'<th></th>':'')+'</tr></thead><tbody>';
  if(SPECIAL.length){ SPECIAL.forEach(function(s){ h+='<tr><td>'+esc(s.cust)+'</td><td style="font-family:Consolas,monospace">'+esc(s.item)+'</td><td>'+(s.basis||'&mdash;')+'</td><td class="roval" style="text-align:right;color:var(--teal);font-weight:700">'+s.price+'</td><td style="font-size:var(--fs-caption);color:var(--muted)">'+fmtDate(s.vf)+'</td>'+(w?('<td><span class="why-btn" style="color:var(--accent)" title="Retire this special price (reason required)" onclick="askRetireSpecial(\''+s.id+'\')">retire</span></td>'):'')+'</tr>'; }); }
  else h+='<tr><td colspan="'+(w?6:5)+'" style="text-align:center;color:var(--muted);padding:14px">No current special prices.</td></tr>';
  h+='</tbody></table>';
  if(w){
    if(CUSTOMERS.length){

      var custOpts=CUSTOMERS.map(function(c){return '<option value="'+esc(c.id)+'">'+esc(c.customer_code?(c.customer_code+' - '+(c.name||'')):(c.name||''))+'</option>';}).join('');
      var itemOpts=ITEMS.filter(function(i){return i.status==='Active'||i.status==='Pending';}).map(function(i){return '<option value="'+esc(i.code)+'">'+esc(i.desc?(i.code+' - '+i.desc):i.code)+'</option>';}).join(''); 

      h+='<div class="addrow"><div class="fld"><label>Customer'+REQ+'</label><select class="in" id="sp-cust">'+custOpts+'</select></div>'+
         '<div class="fld"><label>Item'+REQ+'</label><select class="in" id="sp-item" onchange="renderSpBasis()">'+itemOpts+'</select></div>'+

    } else {
      h+='<div class="hint" style="margin-top:8px">No customers on record yet &mdash; special prices become usable once M01 customers exist (special_set is live and ready).</div>';
    }
  }
  h+='</div>';
  document.getElementById("custwrap").innerHTML=h;
  if(document.getElementById("sp-item")){
    renderSpBasis();

    }

}

function spItemType(code){ var it=ITEMS.filter(function(i){return i.code===code;})[0]; return it?it.type:null; }
function sp_basis(code){ var el=document.getElementById("sp-basis"); if(el&&el.value) return el.value;
  var t=spItemType(code); var pl=(t&&TYPES[t]?TYPES[t].pluoms:[])||[]; return pl.length===1?pl[0]:null; }
function renderSpBasis(){
  var host=document.getElementById("sp-basis-host"); if(!host) return;
  var code=(document.getElementById("sp-item")||{}).value;
  var t=spItemType(code); var pl=(t&&TYPES[t]?TYPES[t].pluoms:[])||[];
  host.innerHTML = pl.length
    ? '<select class="in" id="sp-basis">'+pl.map(function(u){ return '<option value="'+esc(u)+'">'+esc(u)+(UOMLBL[u]?(' - '+esc(UOMLBL[u])):'')+'</option>'; }).join('')+'</select>'
    : '<span class="hint">'+(t?('type '+esc(t)+' declares no price-list UOM at M02b'):'pick an item')+'</span>';
}
async function saveFactor(cc){ 
  if(needActor()) return;
  var cur=ctype(cc);
  var fRaw=document.getElementById("f-fac-"+cc).value.trim();
  var dRaw=document.getElementById("f-dis-"+cc).value.trim();
  var mRaw=document.getElementById("f-com-"+cc).value.trim();
  var f=parseFloat(fRaw);
  if(fRaw===''||isNaN(f)||f<=0){ toast("Factor must be above 0.","err"); return; }
  var d=dRaw===''?(cur.disc!=null?cur.disc:0):parseFloat(dRaw);
  var m=mRaw===''?(cur.comm!=null?cur.comm:0):parseFloat(mRaw);
  if(isNaN(d)||d<0||d>100){ toast("Disc% must be 0..100.","err"); return; }
  if(isNaN(m)||m<0||m>100){ toast("Comm% must be 0..100.","err"); return; }
  await guarded(document.querySelector('#custwrap button[onclick*="saveFactor"]'), async function(){   
    try{ await rpc('factor_set',{p_customer_type:cc,p_factor:f,p_default_disc_pct:d,p_default_comm_pct:m,p_by_emp:actorEmp}); await afterWrite("Factor set for "+cc); }
    catch(e){ toast(svrMsg(e,"The factor could not be saved."),"err"); }
  });
}
async function saveSpecial(){
  if(needActor()) return;
  var cust=document.getElementById("sp-cust").value, item=document.getElementById("sp-item").value;
  var price=parseFloat(document.getElementById("sp-price").value);
  if(!cust){ toast("Pick a customer.","err"); return; } if(!item){ toast("Pick an item.","err"); return; }
  if(isNaN(price)||price<=0){ toast("Special price must be > 0.","err"); return; }
  await guarded(document.querySelector('#custwrap button[onclick*="saveSpecial"]'), async function(){

    catch(e){ toast(svrMsg(e,"The special price could not be saved."),"err"); }
  });
}

/* Add Price Row */
async function refreshDims(){ 
  try{
    var dv=(await SB.from('dimension_values').select('value_id,list_id,code,label,numeric_value,sort_order').eq('active',true).order('sort_order')).data||[];
    DIMVALS={}; VBYID={}; TYPENAME={}; dv.forEach(function(r){ (DIMVALS[r.list_id]=DIMVALS[r.list_id]||[]).push({value_id:r.value_id,code:r.code,label:r.label,numeric_value:r.numeric_value}); VBYID[r.value_id]={list_id:r.list_id,code:r.code,label:r.label}; if(r.list_id==='PTYPE') TYPENAME[r.code]=r.label; });
  }catch(e){}
}
async function openAdd(){
  if(needActor()) return;

  var t=TYPES[curType]; if(!t){ toast("Pick a product type first.","err"); return; }
  var h='<div class="hint" style="margin-bottom:13px">Type <b>'+curType+'</b> &mdash; basis <b>'+(curBasis||'?')+'</b>. Set the dimensions to key this rule by (leave blank = any).</div>';
  if((t.dims||[]).length){ h+='<div class="fldgrid">'; t.dims.forEach(function(d){

    h+='<div class="fld"><label>'+(DIMNAME[d]||d)+'</label><select id="ad-'+d+'">'+opts+'</select></div>';
  }); h+='</div>'; }
  h+='<div class="fldgrid"><div class="fld"><label>Base /'+(curBasis||'?')+REQ+'</label><input id="ad-base" type="number" placeholder="0"></div></div>'+
     '<div class="fldgrid"><div class="fld"><label>Max Disc %</label><input id="ad-disc" type="number" value="0"></div><div class="fld"><label>Comm %</label><input id="ad-comm" type="number" value="0"></div></div>'+
     '<div class="fldgrid"><div class="fld"><label>Priority (lower wins)</label><input id="ad-prio" type="number" value="100"></div><div class="fld"><label>Valid from (blank=today)</label>'+dateFieldHTML('ad-vf')+'</div></div>'+
     '<div class="fld" style="max-width:50%"><label>Valid to (optional, blank=open)</label>'+dateFieldHTML('ad-vt')+'</div>';

}
async function saveAdd(){
  if(needActor()) return;
  var t=TYPES[curType]; var dims={}; (t.dims||[]).forEach(function(d){ var el=document.getElementById("ad-"+d); var v=el?el.value:""; if(v) dims[d]=v; });

  await guarded(document.getElementById("addSave"), async function(){

    catch(e){ toast(svrMsg(e,"The price could not be saved."),"err"); }

var PIMP_COLS="type_code,basis,base_price,max_disc_pct,commission_pct,priority,valid_from,valid_to,dims";
var pimpRows=null;
function openImport(){ if(needActor()) return;
  document.getElementById("imp-text").value=""; document.getElementById("imp-result").innerHTML="";
  document.getElementById("impCommit").disabled=true; pimpRows=null;
  document.getElementById("impov").classList.add("show"); }
function priceTemplateCSV(){ var t=TYPES[curType]||{}; var d=(t.dims||[])[0];
  return PIMP_COLS+"\n"+(curType||"RS")+","+((t.pluoms||[])[0]||"KG")+",100,0,0,100,,,"+(d?(d+"=CODE"):""); }
function dlPriceTemplate(){ try{ RKF.exportRows(priceTemplateCSV().split("\n"),"m02d_price_import_template.csv"); toast("Template downloaded.","ok"); }catch(e){ toast("The template could not be created.","err"); } }
function loadPriceSample(){ document.getElementById("imp-text").value=priceTemplateCSV().split("\n").slice(1).join("\n"); }
function parsePriceCSV(text){ var hdr=PIMP_COLS.split(","); var out=[];
  text.split(/\r?\n/).filter(function(l){return l.trim();}).forEach(function(l){
    if(l.toLowerCase().indexOf("type_code,basis")===0) return;
    var c=l.split(","); var o={}; hdr.forEach(function(h,i){ o[h]=(c[i]||"").trim(); }); out.push(o); });
  return out; }
function dmyToIsoOrNull(v){ if(!v) return null; var m=/^(\d{2})-(\d{2})-(\d{4})$/.exec(v); return m? (m[3]+"-"+m[2]+"-"+m[1]) : undefined; }
function validatePriceImport(){
  var rows=parsePriceCSV(document.getElementById("imp-text").value); var out=[];
  rows.forEach(function(r){
    var res={raw:r,status:"ok",reason:"ready",dims:null,vf:null,vt:null};
    var t=TYPES[r.type_code];
    if(!t){ res.status="err"; res.reason="unknown product type"; out.push(res); return; }
    if(!r.basis || (t.pluoms||[]).indexOf(r.basis)<0){ res.status="err"; res.reason="basis is not a price-list UOM of "+r.type_code; out.push(res); return; }
    var bp=parseFloat(r.base_price); if(isNaN(bp)||bp<=0){ res.status="err"; res.reason="base_price must be > 0"; out.push(res); return; }
    var vf=dmyToIsoOrNull(r.valid_from), vt=dmyToIsoOrNull(r.valid_to);
    if(vf===undefined||vt===undefined){ res.status="err"; res.reason="dates must be DD-MM-YYYY"; out.push(res); return; }
    res.vf=vf; res.vt=vt;
    var dims={};
    if(r.dims){ var bad=null;
      r.dims.split(";").forEach(function(pair){
        if(!pair.trim()||bad) return;
        var kv=pair.split("="); var sp=(kv[0]||"").trim(); var vc=(kv[1]||"").trim();
        if((t.dims||[]).indexOf(sp)<0){ bad="'"+sp+"' is not a spec of "+r.type_code; return; }
        var hit=(DIMVALS[sp]||[]).filter(function(v){ return v.code===vc; })[0];
        if(!hit){ bad="no value '"+vc+"' in "+(DIMNAME[sp]||sp); return; }
        dims[sp]=hit.value_id; });
      if(bad){ res.status="err"; res.reason=bad; out.push(res); return; } }
    res.dims=Object.keys(dims).length?dims:null;
    out.push(res); });
  pimpRows=out; renderPriceImpResult(out); }
function renderPriceImpResult(out){
  var ok=out.filter(function(r){return r.status==="ok";}).length, err=out.length-ok;
  var h='<div style="display:flex;gap:10px;margin:10px 0"><span style="color:var(--green);font-weight:700">'+ok+' ready</span><span style="color:var(--warn);font-weight:700">'+err+' error</span></div>';
  h+='<div style="border:1px solid var(--line);border-radius:9px;overflow:auto;max-height:240px"><table class="fct" style="width:100%"><thead><tr><th>#</th><th>Type</th><th>Basis</th><th style="text-align:right">Base</th><th>Status</th><th>Note</th></tr></thead><tbody>';
  out.forEach(function(r,i){ h+='<tr><td>'+(i+1)+'</td><td>'+esc(r.raw.type_code)+'</td><td>'+esc(r.raw.basis)+'</td><td style="text-align:right">'+esc(r.raw.base_price)+'</td><td><span class="pill '+(r.status==="ok"?"Active":"Pending")+'">'+r.status.toUpperCase()+'</span></td><td>'+esc(r.reason)+'</td></tr>'; });
  document.getElementById("imp-result").innerHTML=h+'</tbody></table></div>';
  document.getElementById("impCommit").disabled=(ok===0); }
async function commitPriceImport(){
  if(!pimpRows||needActor()) return;
  var rows=pimpRows.filter(function(r){return r.status==="ok";}); if(!rows.length) return;
  await guarded(document.getElementById("impCommit"), async function(){
    var done=0, failed=0, firstErr="";
    for(var i=0;i<rows.length;i++){ var r=rows[i];
      try{ await rpc('price_upsert',{p_type_code:r.raw.type_code,p_basis:r.raw.basis,
             p_base_price:parseFloat(r.raw.base_price),p_std_cost:null,
             p_max_disc_pct:parseFloat(r.raw.max_disc_pct)||0,p_commission_pct:parseFloat(r.raw.commission_pct)||0,
             p_priority:parseInt(r.raw.priority)||100,p_dims:r.dims,
             p_valid_from:r.vf,p_valid_to:r.vt,p_by_emp:actorEmp});
           done++;
      }catch(e){ failed++; if(!firstErr) firstErr=svrMsg(e,""); } }
    closeOv("impov");
    await afterWrite(done+" price row(s) imported"+(failed?(", "+failed+" refused"+(firstErr?(" - "+firstErr):"")):"")); });
}

var pendingRetire=null, pendingRetireKind='price';
function askRetire(id){
  if(needActor()) return;
  pendingRetireKind='price';
  document.getElementById("ret-title").textContent='Retire this price row';
  var p=null; for(var i=0;i<PRICES.length;i++){ if(String(PRICES[i].id)===String(id)){p=PRICES[i];break;} }
  if(!p) return;
  pendingRetire=id;
  document.getElementById("ret-what").innerHTML='<b>'+esc(p.type)+' /'+esc(p.basis)+'</b> &middot; base '+p.base+' &middot; '+(Object.keys(p.dims).length?ruleDesc(p):('all '+esc(p.type)));
  document.getElementById("ret-reason").value='';
  document.getElementById("retov").classList.add("show");
}

function askRetireSpecial(id){
  if(needActor()) return;
  var sp=null; for(var i=0;i<SPECIAL.length;i++){ if(String(SPECIAL[i].id)===String(id)){sp=SPECIAL[i];break;} }
  if(!sp) return;
  pendingRetire=id; pendingRetireKind='special';
  document.getElementById("ret-title").textContent='Retire this special price';
  document.getElementById("ret-what").innerHTML='<b>'+esc(sp.cust)+'</b> &middot; '+esc(sp.item)+' &middot; '+sp.price+(sp.basis?(' /'+esc(sp.basis)):'')+' &middot; from '+fmtDate(sp.vf);
  document.getElementById("ret-reason").value='';
  document.getElementById("retov").classList.add("show");
}
async function confirmRetire(){
  if(!pendingRetire||needActor()) return;
  var reason=(document.getElementById("ret-reason").value||"").trim();
  if(!reason){ toast("A reason is required to retire a "+(pendingRetireKind==='special'?"special price":"price row")+".","err"); return; }
  var id=pendingRetire, kind=pendingRetireKind;
  await guarded(document.getElementById("retGo"), async function(){
    try{ if(kind==='special'){ await rpc('special_set_active',{p_special_id:id,p_active:false,p_reason:reason,p_by_emp:actorEmp}); }
         else { await rpc('price_set_active',{p_price_list_id:id,p_active:false,p_reason:reason,p_by_emp:actorEmp}); }
         pendingRetire=null; closeOv("retov");
         await afterWrite(kind==='special'
           ? "Special price retired - the customer prices from the price list again; issued documents keep their prices."
           : "Price row retired - reason recorded; issued documents keep their prices."); }
    catch(e){ toast(svrMsg(e,"The row could not be retired."),"err"); }
  });
}

function whyRow(id){ var p=null; for(var i=0;i<PRICES.length;i++){ if(String(PRICES[i].id)===String(id)){p=PRICES[i];break;} } if(!p)return; openWhy({type:p.type,specs:JSON.parse(JSON.stringify(p.dims)),code:'(this row)'},"this price row"); }
function whyItem(code){ var it=ITEMS.filter(function(i){return i.code===code;})[0]; if(it) openWhy(it,it.code); }
function openWhy(item,label){ 
  var row=matchRow(item); var base=row?row.base:null;
  var sps=specialsFor(item);
  var steps='';
  steps+=traceStep("1","Customer special price",sps.length?(sps.length+" on record: "+sps.map(function(x){return esc(x.cust)+" = "+x.price;}).join("; ")):"none on record",false,sps.length>0);
  steps+=traceStep("2","Base",row?(base+" /"+row.basis+" via "+ruleDesc(row)):"No matching group rule",!!row,!!row);
  var tbl='<table class="fct" style="margin-top:10px"><thead><tr><th>Customer type</th><th>Winning layer</th><th style="text-align:right">Price</th></tr></thead><tbody>';
  CT.forEach(function(c){
    var ov=row&&row.ovr&&row.ovr[c.c]!=null;
    var pv=row?(ov?row.ovr[c.c]:(c.f!=null?r2(base*c.f):null)):null;
    tbl+='<tr><td>'+esc(c.l)+' ('+c.c+')</td><td>'+(row?(ov?'cell override':(c.f!=null?('base x factor '+c.f):'unpriced type')):'&mdash;')+'</td><td style="text-align:right;font-weight:700">'+(pv!=null?pv:'&mdash;')+'</td></tr>';
  });
  tbl+='</tbody></table>';
  document.getElementById("why-title").textContent="Why this price - "+label;
  document.getElementById("why-body").innerHTML=''+steps+tbl;
  document.getElementById("whyov").classList.add("show");
}
function traceStep(n,t,d,win,applies){ return '<div class="trace-step '+(win?'ts-win':'')+(applies?'':' ts-skip')+'"><div class="ts-num">'+(win?'&#10003;':n)+'</div><div class="ts-body"><div class="ts-t">'+t+(win?' &mdash; WINS':'')+'</div><div class="ts-d">'+d+'</div></div></div>'; }

function buildDetailsCSV(){
  var cols=["item_code","type","status","resolved_base","basis","winning_rule"];
  CT.forEach(function(c){ cols.push(c.c+"_price"); cols.push(c.c+"_disc"); cols.push(c.c+"_comm"); }); cols.push("customer_specials");
  var lines=[cols.join(",")];
  ITEMS.filter(function(i){return i.status==="Active"||i.status==="Pending";}).forEach(function(it){ var r=matchRow(it);
    var row=[it.code,it.type,it.status,r?r.base:"",r?r.basis:"",r?ruleDesc(r):"no price"];
    CT.forEach(function(c){ var pr=r; var cp=(pr&&c.f!=null)?(pr.ovr&&pr.ovr[c.c]!=null?pr.ovr[c.c]:r2(pr.base*c.f)):""; row.push(cp==null?"":cp); row.push(pr&&c.disc!=null?c.disc:""); row.push(pr&&c.comm!=null?c.comm:""); }); 
    var sps=specialsFor(it); row.push(sps.length?sps.map(function(x){return x.cust+":"+x.price;}).join("; "):"");
    lines.push(row.map(function(x){ x=(x==null?"":""+x); return /[",]/.test(x)?('"'+x.replace(/"/g,'""')+'"'):x; }).join(",")); });
  return lines;
}
function buildSummaryCSV(){ 
  var td=tickedDims(); var cols=[]; td.forEach(function(d){ cols.push((DIMNAME[d]||d)); });
  cols=cols.concat(["base_per_"+(curBasis||"?")]);
  CT.forEach(function(c){ cols.push(c.c+"_price"); });
  cols=cols.concat(["priority","valid_from","valid_to"]);
  var lines=[cols.join(",")];
  PRICES.filter(function(p){ return p.type===curType&&p.basis===curBasis; }).forEach(function(p){
    var row=[]; td.forEach(function(d){ row.push(p.dims[d]?vlabel(d,p.dims[d]):"any"); });
    row.push(p.base);
    CT.forEach(function(c){ var ov=p.ovr&&p.ovr[c.c]!=null; row.push(ov?p.ovr[c.c]:(c.f!=null?r2(p.base*c.f):"")); });
    row.push(p.prio||100); row.push(p.vf||""); row.push(p.vt||"open");
    lines.push(row.map(function(x){ x=(x==null?"":""+x); return /[",]/.test(x)?('"'+x.replace(/"/g,'""')+'"'):x; }).join(","));
  });
  return lines;
}
function exportSummary(){ try{ RKF.exportRows(buildSummaryCSV(),"m02d_price_summary_"+curType+"_"+(curBasis||"x")+".csv"); toast("Summary exported.","ok"); }catch(e){ toast("The export could not be created.","err"); } }
function exportDetails(){ try{ RKF.exportRows(buildDetailsCSV(),"m02d_price_details.csv"); toast("Details exported.","ok"); }catch(e){ toast("The export could not be created.","err"); } }

function closeOv(id){ document.getElementById(id).classList.remove("show"); }
function emptyState(msg){ return '<div class="state-empty"><div class="state-ic">&#128230;</div><div>'+msg+'</div></div>'; }

if(window.RKF&&RKF.keys&&RKF.keys.register){
  RKF.keys.register({ ctrlS:{}, escCloses:'any', ctrlSFallback:function(){
    var ov=document.getElementById('addov');
    if(ov&&ov.classList.contains('show')){ saveAdd(); return; }
    var b=document.getElementById('addBtn'); if(b&&!b.disabled) openAdd(); } });
}
if(window.RKF&&RKF.registerSurface){
 ['whyov','addov','impov','retov'].forEach(function(id,i){ RKF.registerSurface('m02d.'+id,{depth:10+i,
   isOpen:function(){var el=document.getElementById(id);return !!el&&el.classList.contains('show');},
   close:function(){closeOv(id);}}); });
}

function stLoading(){ var h=document.getElementById("gridwrap"); if(!h) return;
  if(window.RKF&&RKF.triState){ RKF.triState(h,'loading','Loading prices'); return; }
  h.innerHTML='<div class="state-load"><div class="sk"></div><div class="sk"></div><div class="sk"></div><div class="state-msg">Loading&hellip;</div></div>'; }
function stError(msg){ var h=document.getElementById("gridwrap"); if(!h) return;
  if(window.RKF&&RKF.triState){ RKF.triState(h,'error',msg||"This screen could not be loaded."); return; }
  h.innerHTML='<div class="state-err"><div class="state-ic">&#9888;</div><div>'+(msg||"Couldn't load price data.")+' <button class="state-retry" onclick="boot()">Retry</button></div></div>'; }
var ACCESS_LVL=null;
async function boot(){

  ACCESS_LVL = await RKF.accessGate('M02d',{client:SB});
  if(ACCESS_LVL==='None') return;
  stLoading();
  try{
    await loadAll();
    var ks=Object.keys(TYPES); if(!ks.length){ stError("No product types found."); return; }
    if(!curType || !TYPES[curType]){ curType=ks[0]; ticks={}; (TYPES[curType].dims||[]).forEach(function(d,i){ ticks[d]=i<3; }); curBasis=(TYPES[curType].pluoms||[])[0]||""; }
    render();
    gateHistoryTab();   
    toast("Loaded "+PRICES.length+" price rows, "+ITEMS.length+" items.","ok");
  }catch(e){ stError("This screen could not be loaded."); }
}
if(SB) boot(); else stError("Connection unavailable.");
